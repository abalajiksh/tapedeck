[package]
name = "tapedeck"
version = "0.5.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = "0.7"
tower = "0.4"

# HTTP client
reqwest = { version = "0.12.28", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
quick-xml = { version = "0.31", features = ["serialize"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Auth & crypto
sha2 = "0.10"
rand = "0.9"
md5 = "0.8"
hex = "0.4"

# Utilities
dotenv = "0.15"
urlencoding = "2.1"
chrono = "0.4"
