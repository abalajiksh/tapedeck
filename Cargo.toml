[package]
name = "tapedeck"
version = "0.3.5"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.11"
quick-xml = { version = "0.31", features = ["serialize"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenv = "0.15"
md5 = "0.8"
hex = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
