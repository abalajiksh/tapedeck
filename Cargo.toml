[package]
name = "tapedeck"
version = "0.119.0"
edition = "2021"
# Builds the SvelteKit UI into static/ before rustc runs, so `cargo build` is
# the whole build and a fresh clone compiles. See build.rs.
build = "build.rs"

[features]
# Selects the `db::Db` type alias and nothing else. Both sqlx drivers are
# compiled either way — the optional MusicBrainz mirror needs the Postgres
# one regardless — which is what lets a Postgres build read an old SQLite
# file to migrate out of it.
postgres = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"

# HTTP client
# rustls, not the default native-tls: it drops the OpenSSL dependency entirely
# (sqlx already pulls rustls, so this is one TLS stack instead of two) and makes
# cross-compiling for ARM boards a matter of a C toolchain, nothing more.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
quick-xml = { version = "0.31", features = ["serialize"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Auth & crypto
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
md5 = "0.8"
hex = "0.4"

# Utilities
dotenv = "0.15"
urlencoding = "2.1"
chrono = "0.4"
chrono-tz = "0.9"

# Frontend
rust-embed = "8"
mime_guess = "2"
chacha20poly1305 = "0.11.0"
base64 = "0.23.0"

# Liner notes. Markdown is rendered server-side so sanitisation happens once,
# in one place, rather than in every client that ever shows a note.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ammonia = "4.1.4"

# ListenBrainz hands out its export as a zip of JSONL files, which is the form
# people actually have. Deflate only — that's what the export uses, and the other
# codecs pull in C libraries that would spoil cross-compiling for ARM boards.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1.25"
roon-api = "0.5.3"
rsa = { version = "0.9", features = ["sha2"] }
resvg = "0.48"
usvg = "0.48"
fontdb = "0.24"
tiny-skia = "0.12"
skrifa = "0.44"

# The OpenAPI document is derived from the handlers and their body types rather
# than written beside them. `preserve_order` keeps a schema's properties in the
# order its struct declares them; `preserve_path_order` keeps operations grouped
# by module, in the order `build_app` merges the routers. `yaml` renders
# /api/openapi.yaml.
utoipa = { version = "5.5", features = ["yaml", "preserve_order", "preserve_path_order"] }

[dev-dependencies]
yaml-rust2 = "0.13.0"
