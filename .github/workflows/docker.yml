# The container image, published to ghcr.io/abalajiksh/tapedeck.
#
# This runs on the GitHub mirror only (Actions are off on Codeberg). Codeberg
# push-mirrors every ref here, so a v* tag pushed to Codeberg arrives on its
# own and starts this; nothing waits on the result. The Jenkins pipelines —
# tests, staging, the demo, OBS — are untouched by it and know nothing of it.
#
# Two images per release, one per backend: SQLite (the default) and Postgres.
# The backend is fixed when the binary is compiled (`--features postgres`), so
# they are two builds of the same Dockerfile, told apart by a tag suffix.
#
# Each architecture builds natively, in parallel (no QEMU: an emulated release
# build of this tree takes hours), and pushes by digest. The last job, once per
# backend, joins its two digests into one multi-arch image and names it.
#
#   tag v0.135.0       →  :0.135.0  :0.135  :latest
#                         :0.135.0-postgres  :0.135-postgres  :postgres
#   tag v0.136.0-rc1   →  :0.136.0-rc1  :0.136.0-rc1-postgres
#                                             (latest and postgres do not move)
#   run by hand        →  :test  :test-postgres   (a trial; nothing else moves)
#   run by hand on a tag →  as the tag push    (no :test — the way to publish a
#                                              tag that arrived without a run)
#
# Actions are pinned to commit SHAs, since this workflow holds packages: write.

name: Publish container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR wants it lowercase; abalajiksh/tapedeck already is.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  guard:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag that disagrees with Cargo.toml would publish an image labelled
      # with a version the binary does not report (design note 0003).
      - name: Compare the tag with Cargo.toml
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "Cargo.toml says $ver"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$ver" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.backend }} ${{ matrix.arch }}
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        backend: [sqlite, postgres]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - backend: sqlite
            features: ''
          - backend: postgres
            features: postgres
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; the names are given in the merge job.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # No layer cache: every release changes the source, so the one expensive
      # layer (cargo build) could never be reused.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAPEDECK_UI_VERSION_NAME=${{ github.sha }}
            CARGO_FEATURES=${{ matrix.features }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.backend }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the ${{ matrix.backend }} image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # One image per backend. `suffix` lands on every tag but the moving one,
    # which is named outright: :latest for SQLite, :postgres for Postgres
    # (not :latest-postgres).
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            suffix: ''
            moving: latest
          - backend: postgres
            suffix: -postgres
            moving: postgres
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.backend }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=false in the flavor, and the moving tag given by hand, so that
      # only a real release moves it: never a prerelease, never a trial run.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.moving }},suffix=,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}

      - name: Join the two digests under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          while IFS= read -r a; do [ -n "$a" ] && args+=(--annotation "$a"); done <<< "$ANNOTATIONS"
          [ ${#args[@]} -gt 0 ] || { echo "::error::no tags to publish"; exit 1; }
          digests=()
          for d in *; do digests+=("$IMAGE@sha256:$d"); done
          [ ${#digests[@]} -eq 2 ] || { echo "::error::expected 2 digests, got ${#digests[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${digests[@]}"

      # The first tag rather than the `version` output, which is not obliged to
      # carry the flavor's suffix.
      - name: Show what was published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n1 <<< "$TAGS")"
