openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Tapedeck HTTP API
#
# Hand-written, deliberately. utoipa derives schemas from typed response
# structs, and this codebase has five of them against 278 hand-built
# `serde_json::json!` bodies — deriving would degenerate into writing the same
# YAML inside a macro DSL, scattered across 126 handlers. Revisit if typed
# response structs ever land.
#
# Schema depth is tiered on purpose, because a *wrong* schema is worse than a
# missing one — a client author trusts it and gets a runtime crash.
#
#   Tier 1 (client-facing): auth, listens, stats, loves, notes, now-playing,
#     chains. Properties derived by reading the handler. Trust these.
#   Tier 2 (admin, maintenance, settings): path, method, auth and a described
#     but loose body. `additionalProperties: true` means "not fully mapped",
#     not "anything goes".
#
# `tests::the_spec_and_the_router_describe_the_same_api` walks `.route("…")`
# literals in both
# directions: every route must appear here, and every path here must exist in
# the router. Add an endpoint, add it here, or the build fails.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Tapedeck
  version: 0.52.0
  summary: Self-hosted scrobbler and listening journal.
  description: |
    Tapedeck ingests listens, enriches them with MusicBrainz metadata, stores
    them in SQLite and forwards them to Last.fm / ListenBrainz / Libre.fm. It
    also records *how* you listened — signal chains, gear, audio quality — which
    is the part no other scrobbler models.

    ## Three auth mechanisms, and they are not interchangeable

    | | How | Reaches |
    |---|---|---|
    | **Session cookie** | `td_session`, set by `POST /api/v1/auth/login` | everything |
    | **API token** | `Authorization: Token <t>` | `/1/*`, plus whatever its scopes allow |
    | **Metrics bearer** | `Authorization: Bearer <t>` | `GET /metrics` only |

    ### Token scopes

    `tokens.scopes` is a space- or comma-separated set. Three grants matter, and
    **none of them implies another**:

    * `submit` — post listens (`POST /1/submit-listens`). Every scrobble client
      has this; it must not carry the power to delete the history it appends to.
    * `read` *(since v0.37)* — read your own data on the endpoints marked
      `read` below.
    * `write` *(since v0.39)* — change your own data on the endpoints marked
      `write`.

    `all` grants both `read` and `write`. Matching is exact — a scope of
    `rewrite` does not grant `write`.

    A valid token that lacks the required scope gets **403, not 401**. It
    authenticated fine and re-authenticating will not help; a 401 would send a
    client into a token-refresh loop it cannot win.

    ### What a token can never reach

    Everything under `/admin/`, plus your sources, your forwarding connections,
    Discogs credentials, data export/backup, the sanitiser and the enrichment
    jobs. Those are **session-only, permanently**. A leaked token is a bad
    afternoon; a leaked token that can mint more tokens, read another household
    member's data, or repoint where your listens are forwarded is a different
    category. Requests to them with a token get 401.

    ## Getting a token

    Two ways, and neither asks anyone to type a token by hand:

    * **Device-code pairing** — `POST /1/pair/start`, poll `/1/pair/poll` while
      the user approves the short code in Settings. For clients with no browser.
    * **Password → token** — post credentials to `POST /api/v1/auth/login`,
      then mint a named token. This is the phone's flow. A named token appears
      in Settings and can be revoked when the device is lost; a session cookie
      expires hard at 7 days with no sliding renewal and cannot be told apart
      from any other browser.

    ## Conventions

    * Timestamps are **Unix seconds, UTC**, and always the *start* of play.
    * Errors are `{ "code": <int>, "error": "<message>" }` with a matching HTTP
      status.
    * Every user-scoped query is filtered by the caller's own `user_id`. Scopes
      widen *who may ask*, never *whose data is returned*.
    * Counting endpoints exclude skipped listens (`skipped = FALSE`).

    ## Instance-specific

    `GET /api/openapi.yaml` serves this document from the running binary, so a
    client can ask *its own server* what that version supports rather than
    guessing from a hosted copy.

  license:
    name: AGPL-3.0-or-later
  contact:
    name: Tapedeck
    url: https://codeberg.org/abksh/tapedeck

servers:
  - url: /
    description: The Tapedeck instance serving this document.

tags:
  - name: Auth
    description: Login, first-run setup, session state.
  - name: ListenBrainz
    description: |
      ListenBrainz-compatible surface under `/1/`. Shapes follow the LB Core
      API because clients branch on those exact fields. Two deliberate
      divergences: these require auth and are scoped to the caller (LB serves
      them publicly; a self-hosted instance must not), and an invalid token on
      `validate-token` is `200 {valid:false}`, never 401, because clients read
      the field.
  - name: Pairing
    description: Device-code pairing for clients with no browser.
  - name: Account
    description: |
      Your own account — password, display name, bio, profile picture. Scoped to
      the caller and never takes an id, unlike the admin routes under
      `/admin/users`. Session-only: a scrobble client has no business changing
      the credential it authenticates with.
  - name: Listens
    description: The scrobble history — read, edit, delete, search.
  - name: Statistics
    description: Aggregations, charts, personality.
  - name: Library
    description: Album, artist and entity pages.
  - name: Loves
    description: Loved recordings, releases and artists.
  - name: Notes
    description: Liner notes — your own writing about records.
  - name: Sessions
    description: Contiguous listening, grouped.
  - name: Chains
    description: Signal chains, gear, devices and bindings.
  - name: Shelf
    description: Records, tapes and discs — a shelf you catalogue and sides you play.
  - name: Genre map
    description: Every Noise at Once — coverage, colour, trajectory, neighbours.
  - name: Rediscovery
    description: Five lists, all built from your own history.
  - name: Sources
    description: Where listens are polled from. Session-only — holds credentials.
  - name: Connections
    description: Where listens are forwarded. Session-only — holds credentials.
  - name: Import & export
    description: Bulk in and out. Session-only.
  - name: Maintenance
    description: Enrichment backfills and the metadata sanitiser. Session-only.
  - name: Settings
    description: Preferences and artwork.
  - name: Admin
    description: Users, tokens, genre-map scrape. Session-only, admin role.
  - name: Ops
    description: Health, metrics, log level.

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: td_session
      description: |
        Set by `POST /api/v1/auth/login`. `HttpOnly`, `SameSite=Lax`, and
        `Secure` when the instance can tell the browser used HTTPS (derived
        from `X-Forwarded-Proto`, and only trusted when `trust_proxy` is set —
        behind a tunnel the origin sees plain HTTP while the client is on TLS).
        Expires hard at 7 days with no sliding renewal.
    apiToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Authorization: Token <token>`. What the token reaches depends on its
        scopes — see the description at the top of this document. Lowercase
        `token ` is also accepted.
    metricsBearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer $TAPEDECK_METRICS_TOKEN`, for `GET /metrics`
        only. An admin session also works. Never open.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 50 }
      description: Page size.
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Rows to skip.
    StatsRange:
      name: range
      in: query
      description: Time window. Bucketed in the user's own timezone, not UTC.
      schema:
        type: string
        enum: [d7, month, year, all]
        default: all

  responses:
    Unauthorized:
      description: |
        No valid session cookie or token. Also returned when a *token* is
        presented to a session-only endpoint — the endpoint does not accept
        tokens at all, so the scope is irrelevant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 401, error: "Authentication required. Log in to access this endpoint." }
    Forbidden:
      description: |
        Authenticated, but not permitted. Either the token lacks the required
        scope, or the endpoint needs the admin role. Deliberately not a 401 —
        re-authenticating will not help.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, error: "This token does not have the 'write' scope" }
    NotFound:
      description: No such resource, or it belongs to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed or rejected input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Every error body in the API has this shape.
      required: [code, error]
      properties:
        code:
          type: integer
          description: Mirrors the HTTP status.
        error:
          type: string
          description: Human-readable. Not a stable identifier — do not branch on it.

    Ok:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    AudioQuality:
      type: object
      description: |
        How the audio actually sounded. Every field is optional because most
        sources report none of it — a plugin or a Jellyfin session reports the
        most, a bare scrobble client none.
      properties:
        format: { type: string, description: 'Container/codec, e.g. FLAC, MP3, DSD.' }
        bitrate: { type: integer, description: kbps. }
        sample_rate: { type: integer, description: Hz. }
        bit_depth: { type: integer }
        channels: { type: integer }
        lossless: { type: boolean }
        dsd_rate: { type: integer }
        dsd_multiplier: { type: string }
        dsd_to_pcm_converted:
          type: boolean
          description: |
            Derived from the signal chain, not from telemetry. SACD's DSD layer
            cannot leave a player over coax or optical, so nothing will ever
            report this directly.
        delivery_codec:
          type: string
          description: |
            Set **only** when the audio was genuinely transcoded. `DirectStream`
            remuxes the container without touching the audio and is not a
            transcode; nor is a video transcode that left the audio alone.
            Scoring docks points whenever this is set, so filling it on a direct
            play quietly penalises the best listens on the system.
        delivery_bitrate: { type: integer, description: kbps. }
        transcode_reason: { type: string }

    Listen:
      type: object
      description: |
        A stored listen. Tier 1 — these properties are derived from the
        handler. Extra keys may appear; ignore what you do not know.
      properties:
        id: { type: integer }
        title: { type: string }
        artist: { type: string }
        album: { type: [string, 'null'] }
        artist_credit:
          type: [string, 'null']
          description: |
            The full credit as submitted, kept when the primary artist was
            folded out of an `Artist feat. X` string. Nothing is lost by that
            rewrite.
        timestamp:
          type: integer
          description: Unix seconds, UTC, **start** of play.
        duration: { type: [integer, 'null'], description: Seconds. }
        track_number: { type: [integer, 'null'] }
        source_name: { type: string, description: 'Plex, Jellyfin, Navidrome, an app name, Import…' }
        source_id: { type: string, description: Dedup key. Unique per user per play. }
        status:
          type: string
          enum: [pending, sent, failed, imported]
          description: |
            `pending` is queued for forwarding; `imported` is stored only and
            will never be forwarded. Both an import and a skip land as
            `imported` — forwarding either would put a wrong scrobble on a
            permanent public record.
        skipped:
          type: boolean
          description: |
            Stored, never counted. Every counting query filters these out.
            Still occupies its `source_id` so it continues to dedup.
        mbid_recording: { type: [string, 'null'] }
        mbid_release: { type: [string, 'null'] }
        mbid_release_group: { type: [string, 'null'] }
        mbid_artist: { type: [array, 'null'], items: { type: string } }
        caa_id:
          type: [integer, 'null']
          description: |
            Cover Art Archive id. **`-1` is a tombstone** meaning "asked, no
            artwork exists" — treat any non-positive value as no artwork.
        caa_release_mbid: { type: [string, 'null'] }
        artwork_url:
          type: [string, 'null']
          description: |
            Empty string is a tombstone, same idea as `caa_id: -1`. This column
            alone is the artwork backfill's queue.
        release_year: { type: [integer, 'null'] }
        language: { type: [string, 'null'] }
        genres: { type: [array, 'null'], items: { type: string } }
        chain_id: { type: [integer, 'null'], description: Resolved signal chain. }
        device_id: { type: [integer, 'null'] }
        session_id: { type: [integer, 'null'] }
        quality: { $ref: '#/components/schemas/AudioQuality' }

    SubmitListen:
      type: object
      description: One listen in a ListenBrainz-shaped submission.
      required: [track_metadata]
      properties:
        listened_at:
          type: integer
          description: |
            Unix seconds, UTC. Required for `single`/`import`, and must be
            absent for `playing_now`.
        track_metadata:
          type: object
          required: [artist_name, track_name]
          properties:
            artist_name: { type: string }
            track_name: { type: string }
            release_name: { type: string }
            additional_info:
              type: object
              description: |
                LB's free-form bag. Tapedeck reads the standard MBID fields,
                `duration_ms`/`duration`, `tracknumber`, `submission_client`,
                and its own `tapedeck_*` extensions.
              additionalProperties: true
              properties:
                recording_mbid: { type: string }
                release_mbid: { type: string }
                release_group_mbid: { type: string }
                artist_mbids: { type: array, items: { type: string } }
                duration_ms: { type: integer }
                tracknumber:
                  type: [integer, string]
                  description: |
                    A number, or the string a tag reader hands over — `"7"` and
                    `"7/12"` both work. Anything that is neither (a vinyl `"A1"`,
                    a bool, an object) costs the track number only; the listen is
                    still stored.
                submission_client: { type: string }
                tapedeck_chain:
                  type: string
                  description: |
                    Signal chain **by name**. Rung 1 of the four-rung ladder:
                    explicit name → output-device binding → the submitting
                    token's `default_chain_id` → the source device's default.
                tapedeck_quality:
                  $ref: '#/components/schemas/AudioQuality'
                tapedeck_skipped:
                  type: boolean
                  description: Stored, never counted, never forwarded.

    Chain:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        icon:
          type: [string, 'null']
          description: |
            A name from the UI's `CHAIN_ICONS` set. Unvalidated on purpose — an
            unknown value falls back to a generic mark rather than erroring, and
            rejecting a save because the front end learned a new icon first
            would be the worse failure.
        is_default: { type: boolean }
        total_hours: { type: number }
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Always written, so deleting the gear leaves the chain readable.
              type: { type: string, description: 'source, dac, amp, headphones, …' }
              equipment_id:
                type: [integer, 'null']
                description: Set when picked from your gear, absent for free text.

    Equipment:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        brand: { type: [string, 'null'] }
        total_hours:
          type: number
          description: |
            Derived — summed from every chain referencing this gear, never
            accumulated. Free-text chain steps report zero, which is honest.

    NowPlaying:
      type: object
      description: |
        Never persisted. Held in memory only, so a restart correctly shows an
        empty deck until a source reports again.
      properties:
        playing: { type: boolean }
        position: { type: [integer, 'null'], description: Seconds into the track. }
        track:
          oneOf:
            - $ref: '#/components/schemas/Listen'
            - type: 'null'

    Note:
      type: object
      description: |
        A liner note. Hangs off **either** an entity **or** a listen, never
        both — a CHECK constraint enforces it.
      properties:
        id: { type: integer }
        entity_id: { type: [integer, 'null'] }
        scrobble_id: { type: [integer, 'null'] }
        body: { type: string, description: Markdown, as stored. }
        body_html:
          type: string
          description: |
            Rendered and sanitised server-side, with shortcodes resolved. Safe
            to inject. An unresolved shortcode renders as dotted-underline text
            (`.td-unresolved`), never an error.
        visibility:
          type: string
          enum: [private, patched, public]
          description: |
            Stored, but **every read path is still self-only**. `public` becomes
            meaningful when the social phase lands, not now.
        created_at: { type: integer }
        updated_at: { type: integer }

    Entity:
      type: object
      description: |
        An artist, release or recording you have annotated or loved. MBIDs are
        an alias, never the key — most of a library is un-enriched and those are
        exactly the records worth annotating.
      properties:
        id: { type: integer }
        kind: { type: string, enum: [artist, release, recording] }
        name: { type: string }
        artist_name: { type: [string, 'null'] }
        mbid: { type: [string, 'null'] }

    NeighbourGenre:
      type: object
      description: |
        A genre bordering your listening. **`your_artists` and
        `exemplar_artists` are never both populated** — that separation is the
        vision rule made structural, so nothing can present an Every Noise
        exemplar as something the listener owns.
      properties:
        name: { type: string }
        x: { type: number }
        y: { type: number }
        color: { type: string }
        borders: { type: integer, description: How many of your top genres border it. }
        affinity:
          type: number
          description: '`plays / sqrt(rank + 1)`, summed. Weights by your play counts and discounts by Every Noise''s own neighbour rank.'
        your_plays: { type: integer }
        your_artists:
          type: array
          description: From **your own history**. Empty is what puts a genre in `unexplored`.
          items:
            type: object
            properties:
              artist: { type: string }
              plays: { type: integer }
        exemplar_artists:
          type: array
          description: |
            **Every Noise's exemplars — not your music.** Set only where
            `your_artists` is empty. Requires a tier-2 scrape; empty otherwise.
          items: { type: string }

    Love:
      type: object
      properties:
        entity_id: { type: integer }
        entity_key:
          type: string
          description: |
            `kind|artist|name`, trimmed and lowercased; an artist's `artist`
            half is empty. The client derives this to fill hearts without one
            request per row. Must stay in step with the server's `entity_key`.
        kind: { type: string, enum: [artist, release, recording] }
        name: { type: string }
        artist: { type: [string, 'null'] }
        loved_at: { type: integer, description: Unix seconds. }
        plays: { type: integer, description: 'Your plays of this thing. 0 when the entity exists only because it was annotated.' }
        last_played: { type: [integer, 'null'] }
        album: { type: [string, 'null'], description: 'For a recording, the record it sits on. Null for an artist.' }
        artwork_url: { type: [string, 'null'], description: 'From the most recent listen of it; an artist gets their portrait instead.' }
        caa_id: { type: [integer, 'null'] }
        caa_release_mbid: { type: [string, 'null'] }
        note_id: { type: [integer, 'null'], description: 'The liner note on this entity, if there is one.' }
        note_excerpt: { type: [string, 'null'], description: 'First ~90 characters of that note.' }
        loved_at: { type: integer }

paths:

  # ── Ops ────────────────────────────────────────────────────────────────────
  /api/openapi.yaml:
    get:
      tags: [Ops]
      summary: This document.
      description: |
        Unauthenticated by design — it describes the shape of the API, not any
        data, and a client needs to read it *before* it has a credential.

        Served from the binary because it is the one thing a separately hosted
        docs site cannot do: describe **this** instance at **this** version. For
        a self-hosted app that beats any version dropdown — ask your own server
        what it supports rather than guessing.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml: { schema: { type: string } }

  /health:
    get:
      tags: [Ops]
      summary: Liveness and database reachability.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  database: { type: string }
                  version: { type: string }
              example: { status: ok, service: tapedeck, database: ok, version: 0.38.0 }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics.
      description: |
        Never open — an **admin** session, or `Authorization: Bearer
        $TAPEDECK_METRICS_TOKEN`. The metrics that matter are the per-job import
        gauges and `process_resident_memory_bytes` (Linux only), which is what
        distinguishes a stall from a slowdown from an OOM on a small host.
      security:
        - sessionCookie: []
        - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /log-level:
    get:
      tags: [Ops]
      summary: Current tracing filter.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { level: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ops]
      summary: Change the tracing filter at runtime.
      description: Swaps the live `EnvFilter`. No restart, no config edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string, example: 'tapedeck=debug,info' }
      responses:
        '200': { description: Applied., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Auth ───────────────────────────────────────────────────────────────────
  /api/v1/auth/status:
    get:
      tags: [Auth]
      summary: Whether anyone is signed in, and whether this instance needs setup.
      description: The SPA's gate. The only unauthenticated read in the API.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  is_admin: { type: boolean }
                  needs_setup:
                    type: boolean
                    description: True until the first admin exists. There is no self-registration.

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      summary: Create the first admin account.
      description: |
        First run only — refused once any user exists. Returns a session cookie
        **and** an API token, the latter shown exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
      responses:
        '200':
          description: Created. Sets `td_session`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  token: { type: string, description: Shown once, never again. }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Already set up. }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in.
      description: |
        Sets the `td_session` cookie. Rate limited on repeated failure.

        **This is the mobile flow.** Post credentials once, then mint a named
        token and store that — the cookie expires hard at 7 days with no sliding
        renewal, and cannot be revoked per device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in. Sets `td_session`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  is_admin: { type: boolean }
        '401': { description: Bad credentials, or the account is disabled. }
        '429': { description: Too many attempts. }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out.
      description: |
        Clears the session. The clear cookie carries identical attributes to the
        one that was set — mismatched attributes make logout silently fail.
      responses:
        '200': { description: Signed out., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  display_name: { type: [string, 'null'] }
                  is_admin: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── ListenBrainz-compatible ────────────────────────────────────────────────
  /1/submit-listens:
    post:
      tags: [ListenBrainz]
      summary: Submit listens.
      description: |
        Accepts a session cookie or any valid token — this is the one endpoint a
        `submit`-scoped token reaches.

        **`listen_type` decides forwarding**, and getting it wrong rewrites
        someone's permanent public history. `single` and `playing_now` are live
        and will be forwarded; `import` is stored only and never forwarded
        *(since v0.26 — before that, an import was forwarded like a live
        listen)*.

        Dedup is on `(user_id, source_id, source_name)` plus a fuzzy window, so
        re-sending the same listen is safe. Max 1000 listens per request.
      security:
        - apiToken: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listen_type, payload]
              properties:
                listen_type:
                  type: string
                  enum: [single, playing_now, import]
                payload:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/SubmitListen' }
      responses:
        '200':
          description: |
            Accepted. Per-listen results are reported rather than the whole
            batch failing — one bad row must not lose the other 999.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /1/validate-token:
    get:
      tags: [ListenBrainz]
      summary: Check a token.
      description: |
        An invalid token is **`200 {valid:false}`, never 401** — LB clients read
        the field, and a 401 sends them into a refresh loop.
      security:
        - apiToken: []
      responses:
        '200':
          description: Always 200, valid or not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  valid: { type: boolean }
                  user_name: { type: [string, 'null'] }

  /1/user/{user}/listens:
    get:
      tags: [ListenBrainz]
      summary: A user's listens, LB-shaped.
      description: |
        **Scoped to the caller.** LB serves this publicly; a self-hosted
        instance must not, so asking for another user's listens is refused.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
        - { name: count, in: query, schema: { type: integer, default: 25 } }
        - { name: min_ts, in: query, schema: { type: integer } }
        - { name: max_ts, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      count: { type: integer }
                      user_id: { type: string }
                      listens: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/playing-now:
    get:
      tags: [ListenBrainz]
      summary: What is on the deck, LB-shaped.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK. `count` is 0 when nothing is playing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      count: { type: integer }
                      playing_now: { type: boolean }
                      listens: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/listen-count:
    get:
      tags: [ListenBrainz]
      summary: Total listens. Excludes skips.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload: { type: object, properties: { count: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/services:
    get:
      tags: [ListenBrainz]
      summary: Connected forwarding services.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  services: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/playing-now/delete:
    post:
      tags: [ListenBrainz]
      summary: Clear the caller's now-playing entry.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /1/latest-import:
    get:
      tags: [ListenBrainz]
      summary: Timestamp of the caller's most recent import.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user_name, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  musicbrainz_id: { type: string }
                  latest_import: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ListenBrainz]
      summary: Record an import high-water mark.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ts]
              properties: { ts: { type: integer } }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Pairing ────────────────────────────────────────────────────────────────
  /1/pair/start:
    post:
      tags: [Pairing]
      summary: Begin device-code pairing.
      description: |
        Unauthenticated by design — the client has no credential yet. Returns a
        `device_code` to poll with and a short `user_code` for the human to type
        into Settings.

        Vocabulary echoes RFC 8628 because client authors have met that shape,
        but this is **not OAuth**: no client registration, no `client_id`, and
        the result is an ordinary Tapedeck token.

        The user code is eight characters and therefore guessable, so its safety
        is structural: a five-minute window, single use in both directions, rate
        limiting, and approval requiring a signed-in session.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name: { type: string, description: Shown to the user when approving. Name it per device. }
                scopes: { type: string, description: 'Space-separated, e.g. "submit read".' }
      responses:
        '200':
          description: Pairing started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  expires_in: { type: integer, description: Seconds. Five minutes. }
                  interval: { type: integer, description: Minimum seconds between polls. }
        '429': { description: Rate limited. }

  /1/pair/poll:
    post:
      tags: [Pairing]
      summary: Poll for approval.
      description: |
        Returns `authorization_pending` until approved, then the token **once** —
        it is deleted from the request the moment it is collected. Expired and
        unknown device codes are reported identically, so polling cannot be used
        to learn whether a code was ever real.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties: { device_code: { type: string } }
      responses:
        '200':
          description: Approved. The token is in this body and nowhere else.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user_name: { type: string }
        '400':
          description: '`authorization_pending`, `expired_token`, or an unknown code.'
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string, enum: [authorization_pending, expired_token] } }
        '429': { description: Polling too fast. }

  /api/v1/pair/{user_code}:
    get:
      tags: [Pairing]
      summary: Describe a pending pairing, for the approval screen.
      description: Requires a signed-in session — this is the browser half.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_name: { type: string }
                  scopes: { type: string }
                  can_read: { type: boolean }
                  approved: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pair/{user_code}/approve:
    post:
      tags: [Pairing]
      summary: Approve a pairing request.
      description: |
        Session-only, and single use — approving twice mints nothing the second
        time. **The token is never in this response**; it goes to the polling
        client. A live credential in a second place is how it ends up in a
        screenshot.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_chain_id: { type: [integer, 'null'] }
      responses:
        '200': { description: Approved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ── Listens ────────────────────────────────────────────────────────────────
  /api/v1/scrobbles:
    get:
      tags: [Listens]
      summary: The listen history.
      description: 'Scope: `read` *(since v0.39)*. Newest first. Filterable.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: artist, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: track, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scrobbles: { type: array, items: { $ref: '#/components/schemas/Listen' } }
                  count: { type: integer, description: Total matching, not the page size. }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Listens]
      summary: Delete the caller's entire history.
      description: |
        **Session-only and irreversible.** Deliberately not reachable with a
        `write` token — this is the one listen operation where a lost phone
        would be unrecoverable. Clears listen-attached notes first, since
        foreign keys are enforced.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/scrobbles/{id}:
    patch:
      tags: [Listens]
      summary: Edit a listen.
      description: 'Scope: `write` *(since v0.39)*. Only the caller''s own rows.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Omitted fields are left alone.
              properties:
                title: { type: string }
                artist: { type: string }
                album: { type: string }
                timestamp: { type: integer }
                chain_id: { type: [integer, 'null'] }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Listens]
      summary: Delete one listen.
      description: 'Scope: `write` *(since v0.39)*. Clears attached notes first.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scrobbles/{id}/annotations:
    get:
      tags: [Listens, Notes]
      summary: Notes and loves attached to one listen.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { oneOf: [{ $ref: '#/components/schemas/Note' }, { type: 'null' }] }
                  loves: { type: array, items: { $ref: '#/components/schemas/Love' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/scrobbles/bulk-chain:
    post:
      tags: [Listens, Chains]
      summary: Attribute many listens to one signal chain.
      description: |
        Session-only. Retro-attribution after adding gear — and since v0.46.0
        the chain's *hours* follow the listens, so doing this moves the usage
        numbers for listening you already have rather than only for future
        plays.

        **The field is `signal_chain_id`, and it is required.** This entry
        documented it as `chain_id` for several releases, alongside three
        parameters (`from`, `to`, `source_name`) the handler has never accepted
        — and the mismatch was silently destructive rather than an error: the
        body deserialised cleanly with the field missing, which meant "clear the
        chain", so a client following the spec wiped the attribution on every
        listen in `ids` and got `200 {"updated": N}` back. An absent field is a
        `400` now.

        Send an explicit `null` to clear. That case is real — it is how the
        History bulk edit removes a chain — which is why absent and null cannot
        be collapsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, signal_chain_id]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: The listens to reassign. Scoped to the caller; ids belonging to anyone else match nothing.
                signal_chain_id:
                  type: [integer, 'null']
                  description: The chain to attribute them to. Explicit `null` clears it; omitting the field is an error, not a clear.
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/search:
    get:
      tags: [Listens]
      summary: Search your listens.
      description: |
        Session-only. Searches `scrobbles`, not `entities` — searching entities
        would only find records you had already been to.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: { type: array, items: { type: object, additionalProperties: true } }
                  albums: { type: array, items: { type: object, additionalProperties: true } }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/now-playing:
    get:
      tags: [Listens]
      summary: What is on the deck.
      description: |
        Scope: `read`. In-memory only. Entries expire on read — past `duration`
        + 10s, or after 10 minutes when the source reported no duration.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NowPlaying' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Statistics ─────────────────────────────────────────────────────────────
  /api/v1/stats/dashboard:
    get:
      tags: [Statistics]
      summary: Dashboard counters.
      description: |
        Scope: `read` *(since v0.39)*. "Today" and "this week" are bucketed in
        the user's own timezone and honour their week-start preference.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: integer }
                  this_week: { type: integer }
                  total: { type: integer }
                  lossless_pct: { type: number, description: 'Share of listens **whose format is known**, not of `total`. Most of an imported history has no format at all, so dividing by every play measured the import ratio instead.' }
                  fidelity_known: { type: integer, description: 'The denominator of `lossless_pct`. Clients should report this coverage rather than presenting the share as a fact about the whole history.' }
                  top_artist: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/stats:
    get:
      tags: [Statistics]
      summary: Ranged statistics.
      description: |
        Scope: `read` *(since v0.39)*. Totals, top lists (50 rows each), fidelity
        mix, decades, a 7×24 listening heatmap, breadth, genres and languages.

        The genre breakdown is a share of **tag mentions, not listens** — one
        track carries several tags. Never present it as a percentage of plays.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - $ref: '#/components/parameters/StatsRange'
        - name: metric
          in: query
          description: |
            How the three top lists are **ranked**, not merely what number is
            shown. They are cut to 50 rows server-side, so re-sorting in the
            client would only reorder the top 50 *by plays* and would miss a
            long record played a handful of times — which is exactly the row
            switching to `hours` exists to surface. Listens whose source
            reported no duration count as zero and sort last.
          schema: { type: string, enum: [plays, hours], default: plays }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      plays: { type: integer }
                      artists: { type: integer }
                      albums: { type: integer }
                      tracks: { type: integer }
                      hours: { type: number }
                      avg_quality: { type: number }
                      lossless_pct: { type: number, description: 'Share of `fidelity_known`, not of `plays`.' }
                      dsd_pct: { type: number, description: 'Share of `fidelity_known`, not of `plays`.' }
                      fidelity_known: { type: integer, description: 'Listens in this window whose format is known — the denominator of the two shares above. The `fidelity` array below is a share of `plays` instead, because it carries an `Unknown` bucket of its own.' }
                      quality_known: { type: integer, description: 'Listens `avg_quality` is averaged over. Only a live source ever writes a quality score, so an imported history has none and the average is over the same narrow population the fidelity shares are. Present it with its coverage or not at all; at zero there is no score to show, not a score of zero.' }
                      duration_known: { type: integer, description: 'Listens `hours` is summed over. A listen whose source reported no length contributes nothing, so `hours` is a floor rather than a total.' }
                      skips: { type: integer, description: 'Skipped plays in this window. Every other count in this object excludes them; this one is about them. Not every source reports skips, so zero means "nothing told us", not "nothing skipped".' }
                      per_day: { type: number, description: 'Plays per **calendar** day of the window, including days with no listening. Dividing by active days instead reports a busy afternoon''s rate as the year''s.' }
                      first_listen: { type: ['integer', 'null'], description: 'Earliest non-skipped listen, unix seconds. A fact about the whole history and therefore **not** ranged — asking it of a one-week window would only restate the window.' }
                      loves: { type: integer, description: 'Loved entities: tracks, records and artists together. All time, not ranged.' }
                  top_artists: { type: array, items: { type: object, additionalProperties: true } }
                  top_albums: { type: array, items: { type: object, additionalProperties: true } }
                  top_tracks: { type: array, items: { type: object, additionalProperties: true } }
                  fidelity: { type: array, items: { type: object, additionalProperties: true } }
                  decades: { type: array, items: { type: object, additionalProperties: true } }
                  heatmap:
                    type: array
                    description: Seven rows of 24. Row 0 is Monday.
                    items: { type: array, items: { type: integer } }
                  genres: { type: array, items: { type: object, additionalProperties: true } }
                  languages: { type: array, items: { type: object, additionalProperties: true } }
                  breadth:
                    type: object
                    description: |
                      Absent until the genre map is fetched and genres backfilled —
                      "you play 0 genres" would be a lie about the listening
                      rather than a statement about the data.
                    properties:
                      genres_played: { type: integer }
                      genres_placed: { type: integer }
                      effective_genres:
                        type: number
                        description: '`exp(H)` — as varied as playing N genres equally.'
                      reach:
                        type: [number, 'null']
                        description: Your spread over the map's own spread, 0–1.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports:
    get:
      tags: [Statistics]
      summary: Period reports — a feed of week / month / year cards, newest first.
      description: |
        Scope: `read` *(since v0.41)*.

        Reads the history **once** and folds it in Rust. A card carries a dozen
        aggregates and every one is bucketed in the caller's own timezone, which
        SQL here cannot do — a year of monthly cards would otherwise be hundreds
        of round trips.

        Weeks are ISO (Monday-start), deliberately **not** the caller's
        week-start preference: that setting shapes the dashboard counter and the
        heatmap rows, whereas a report is a named object and its boundary has to
        stay put, or last month's report changes shape when the preference does.

        `avg_daily` divides by **calendar** days — a finished period by its full
        length, one still running by the days it has actually had. Dividing by
        days-with-listens would report the rate of your busiest fortnight as the
        month's average.

        Two things deliberately absent. There is **no percentile against other
        users** ("you out-listened 88% of listeners"): that needs other people's
        listening, and on a private instance it would leak how much the rest of
        the household plays. And `crush` is omitted for the oldest period, where
        every artist is new by construction and it would just be the top artist
        relabelled.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: unit, in: query, schema: { type: string, enum: [week, month, year], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: |
            Periods to skip, counting back from the newest. The stepper on the
            Reports page walks this one period at a time. Costs nothing extra —
            the whole history is folded on every call regardless.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { type: string, enum: [week, month, year] }
                  timezone: { type: string, description: The IANA zone the buckets were cut in. }
                  offset: { type: integer, description: Where this page sits, counting back from the newest. }
                  total_periods: { type: integer, description: 'How many periods exist at this bucket size — what tells a stepper where the ends are.' }
                  capped:
                    type: boolean
                    description: |
                      The scan hit the analytics row cap, so the oldest periods
                      are partial and must not be presented as final.
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: '2026-08' }
                        label: { type: string, example: August 2026 }
                        rank: { type: integer, description: 'Where this period sits among *the caller''s own* periods by plays, 1 being the busiest. This is what fills the slot the design gave to a cross-user percentile — see the description above for why there is no such thing here.' }
                        rank_of: { type: integer }
                        genre_bands:
                          type: object
                          description: |
                            The period's three biggest genres **by name**, fixed
                            across every sub-bucket, plus `other` as the
                            remainder. Drawn as stacked bands by the year
                            chapter. A sub-bucket with no tags at all is all
                            zeroes rather than 100% `other` — an empty month is
                            an absence, not a genre.

                            Shares of tag *mentions*, like `genres`.
                          properties:
                            names: { type: array, items: { type: string }, maxItems: 3 }
                            shares:
                              type: array
                              description: One row per sub-bucket; each row is the three named shares then `other`.
                              items: { type: array, items: { type: number } }
                        start: { type: integer }
                        end: { type: integer }
                        plays: { type: integer }
                        hours: { type: number }
                        avg_daily: { type: integer }
                        artists: { type: integer }
                        albums: { type: integer }
                        tracks: { type: integer }
                        new_artists: { type: integer, description: Artists with no earlier listen anywhere in the history. }
                        top_artist: { type: [object, 'null'], additionalProperties: true }
                        top_album: { type: [object, 'null'], additionalProperties: true }
                        top_track: { type: [object, 'null'], additionalProperties: true }
                        clock: { type: array, items: { type: integer }, description: 24 counts, local hours. }
                        sub:
                          type: array
                          items: { type: integer }
                          description: One level finer than the period — days across a week, weeks across a month, months across a year.
                        sub_labels: { type: array, items: { type: string } }
                        genres:
                          type: array
                          description: Shares of **tag mentions**, not of listens.
                          items: { type: object, additionalProperties: true }
                        colour: { type: [string, 'null'], description: Play-weighted blend of the period's genre colours, in linear light. Null until the genre map is fetched. }
                        on_repeat: { type: array, items: { type: object, additionalProperties: true } }
                        crush: { type: [object, 'null'], description: Most-played artist never played before. Absent for the oldest period. }
                        shelf: { type: object, additionalProperties: true }
                        top_chain: { type: [string, 'null'] }
                        milestones: { type: array, items: { type: string } }
                        prev: { type: [object, 'null'], additionalProperties: true, description: The period before, for deltas. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/personality:
    get:
      tags: [Statistics]
      summary: Musical personality — a verdict, traits and loyalty.
      description: Session-only.
      parameters: [{ $ref: '#/components/parameters/StatsRange' }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string }
                  traits:
                    type: array
                    items:
                      type: object
                      properties:
                        low: { type: string }
                        high: { type: string }
                        score: { type: number, description: 0–100. }
                        evidence: { type: string }
                  loyalty: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/charts:
    get:
      tags: [Statistics]
      summary: Top charts.
      description: |
        Session-only. Note this offers a **different range set** from
        `/api/v1/stats` — it has `today`. The two answering the same question
        over different windows is known, and is why the Insights redesign wants
        one shared range control.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [artists, albums, tracks], default: artists } }
        - { name: range, in: query, schema: { type: string, enum: [today, d7, month, year, all], default: all } }
        - name: metric
          in: query
          description: |
            Ranks the chart, not just the number shown — it is cut to `limit`
            rows, so the sort happens in SQL. Statistics' "See more" hands off
            here carrying its metric, and the two ranking differently would
            defeat the point of that handoff.
          schema: { type: string, enum: [plays, hours], default: plays }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        sub: { type: [string, 'null'], description: Artist, for an album or track row. }
                        album: { type: [string, 'null'], description: Present on track rows so a track opens the record it is on. }
                        plays: { type: integer }
                        seconds: { type: integer }
                        artwork_url: { type: [string, 'null'] }
                        caa_id: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Library ────────────────────────────────────────────────────────────────
  /api/v1/resolve:
    get:
      tags: [Library]
      summary: Resolve names to an entity id.
      description: |
        Session-only. **Creates the entity on first visit** — a write on a read
        path, on purpose. The browser knows names, not ids, so without this
        every link out of the history would be dead until you happened to
        annotate the thing it points at.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [artist, release, recording] } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/albums/{id}:
    get:
      tags: [Library]
      summary: An album page.
      description: |
        Session-only. Aggregated over `scrobbles` by name. Track rows carry the
        **raw quality columns**, not a formatted label — the client formats
        them, so a server-side copy of that logic cannot drift.

        An entity with **zero plays still renders** rather than 404ing:
        something annotated once and since deleted from the history is still a
        real record.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity: { $ref: '#/components/schemas/Entity' }
                  plays: { type: integer }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
                  bio: { type: [object, 'null'], additionalProperties: true, description: 'Provider description. Carries `attribution` — Last.fm text is CC BY-SA and the credit must travel with it. Render as text, never as HTML.' }
                  artwork_url: { type: [string, 'null'], description: 'The hand-set cover when there is one, otherwise the artwork the newest listen of this album carries.' }
                  cover_override: { type: boolean, description: 'True when the cover was set by hand. `caa_id` and `caa_release_mbid` are null in that case — the override replaces the derived artwork rather than sitting in front of it.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/albums/{id}/cover:
    put:
      tags: [Library]
      summary: Override an album cover.
      description: |
        Session-only. The counterpart of the artist portrait override: an album
        otherwise wears whatever artwork the newest listen of it happens to
        carry, which is unfixable when it is the wrong edition's.

        400s when the id is not a **release** entity — an artist's picture has
        its own endpoint, and two places to set one would leave no rule about
        which wins. Like every entity write, this is not scoped per user:
        `entities` is shared.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: |
                    An `http(s)://` URL, or a path on this server — `/api/v1/art/{scrobble_id}`
                    proxies the cover out of the user's own media library. Empty
                    clears the override and the derived artwork comes back.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artwork_url: { type: [string, 'null'] }
        '400': { description: Not a URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such album, or that entity is not a release. }

  /api/v1/artists/{id}:
    get:
      tags: [Library]
      summary: An artist page.
      description: Session-only. Same shape and same rules as the album page.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity: { $ref: '#/components/schemas/Entity' }
                  plays: { type: integer }
                  albums: { type: array, items: { type: object, additionalProperties: true } }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
                  bio: { type: [object, 'null'], additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/entities/{id}:
    get:
      tags: [Library]
      summary: One entity.
      description: 'Scope: `read` *(since v0.39)*. Needed to render a note''s target.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/art/{id}:
    get:
      tags: [Library]
      summary: Cover art for a listen, proxied.
      description: |
        Session-only. Proxies the user's own library server, which the browser
        usually cannot reach and must not hold credentials for. Redirects to a
        public URL where there is one.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Image bytes., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '302': { description: Redirect to a public artwork URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No artwork. The client falls back to a lettered tile. }

  /api/v1/artists/img/{id}:
    get:
      tags: [Library]
      summary: An artist portrait, proxied.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Image bytes., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '302': { description: Redirect to a public URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No portrait yet. Retried later — the answer changes when the artist is added to a library. }
    put:
      tags: [Library]
      summary: Override an artist portrait.
      description: |
        Session-only. A manual override beats every provider — this is a
        journal, and whoever keeps it gets the last word.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'An `http(s)://` URL or a path on this server. Empty clears the override.' }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Loves ──────────────────────────────────────────────────────────────────
  /api/v1/loves:
    get:
      tags: [Loves]
      summary: Loved entities.
      description: |
        Scope: `read` *(since v0.39)*.

        Since v0.43 each row carries what the Loved page needs to render it —
        plays, last played, artwork and the liner note — rather than the bare
        entity. Four queries regardless of how many loves there are.
      
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [artist, release, recording] } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loves: { type: array, items: { $ref: '#/components/schemas/Love' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Loves]
      summary: Love or un-love.
      description: |
        Scope: `write` *(since v0.39)*.

        Loves attach to **entities, never to a listen** — loving one *playing*
        of a track is a category error and is rejected.

        A love of a **recording** is mirrored outward (Last.fm `track.love`,
        ListenBrainz `recording-feedback`); albums and artists stay local
        because neither service has the concept. ListenBrainz needs a recording
        MBID, so an un-enriched track is skipped rather than guessed at. The
        forward is spawned, not awaited — the love is already stored and the UI
        should not wait on Last.fm.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, loved]
              properties:
                kind: { type: string, enum: [artist, release, recording] }
                name: { type: string }
                artist: { type: string, description: Required for release and recording. }
                loved: { type: boolean }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { type: object, properties: { entity_id: { type: integer }, loved: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/loves/keys:
    get:
      tags: [Loves]
      summary: Every loved entity key, as a flat set.
      description: |
        Scope: `read` *(since v0.39)*. One request instead of one per history
        row. Derive a row's key client-side as `kind|artist|name`, trimmed and
        lowercased, with an artist's `artist` half empty. **If your derivation
        drifts from the server's, hearts silently stop filling — nothing
        errors.**
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: string }, example: ['recording|aphex twin|xtal', 'artist||burial'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/loves/pull:
    post:
      tags: [Loves]
      summary: Pull loves from Last.fm / ListenBrainz.
      description: |
        Session-only — it uses stored service credentials. Not one code path:
        ListenBrainz returns only a recording MBID so an un-enriched track
        cannot be matched, while Last.fm returns names and can fall back to a
        name match. A love whose track is not in your history is **skipped,
        never invented** — loves point at entities, and entities are things you
        actually played.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { service: { type: string, enum: [lastfm, listenbrainz] } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: integer }
                  skipped: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Notes ──────────────────────────────────────────────────────────────────
  /api/v1/notes:
    get:
      tags: [Notes]
      summary: Your liner notes.
      description: |
        Scope: `read` *(since v0.39)*. Self-only, whatever `visibility` says.

        `q` matches the note's **body and its subject both** — someone looking
        for what they wrote about Burial means either, and asking which is a
        worse answer than searching both. Case-insensitivity is SQLite's `LIKE`,
        which folds ASCII only: `BURIAL` finds `Burial`, `CŒUR` does not find
        `Cœur`.

        `total` is the count **before** filtering, so a search that finds nothing
        reads as a search rather than as an empty account.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free text over the body and the subject. }
        - name: kind
          in: query
          schema: { type: string, enum: [recording, release, artist, listen] }
          description: Anything unrecognised means no filter — a stale bookmark should show everything, not nothing.
        - { name: sort, in: query, schema: { type: string, enum: [updated, created, title], default: updated } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
                  total: { type: integer, description: Unfiltered count. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Notes]
      summary: Create or update a note.
      description: |
        Scope: `write` *(since v0.39)*.

        A note hangs off **either** `entity_id` **or** `scrobble_id`, never both.
        Editing archives the previous body into revisions — but only when the
        body actually changed, so flipping visibility is not a rewrite.

        The body is Markdown. `[[track:…]]`, `[[album:…]]`, `[[artist:…]]`,
        `[[track:3]]` and `[[gear:…]]` shortcodes resolve server-side; an
        unresolved one is never an error.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                entity_id: { type: integer }
                scrobble_id: { type: integer }
                body: { type: string }
                visibility: { type: string, enum: [private, patched, public], default: private }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '400': { description: Neither or both of `entity_id` and `scrobble_id`. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notes/{id}:
    get:
      tags: [Notes]
      summary: One note.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notes]
      summary: Delete a note.
      description: 'Scope: `write` *(since v0.39)*. Revisions go with it.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notes/{id}/revisions:
    get:
      tags: [Notes]
      summary: A note's history.
      description: |
        Scope: `read` *(since v0.39)*. Opt-in — the read path serves only the
        current body. Notes are meant to be kept, and a rewrite five years on
        should not erase what you thought at the time.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        body: { type: string }
                        archived_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notes/export:
    get:
      tags: [Notes]
      summary: Every note as Markdown, for Obsidian / Logseq / a folder of files.
      description: |
        **Session-only**, unlike the rest of `/notes`. This is the whole of the
        user's own writing in one request; `read` on a token is meant for an app
        showing a note, not for draining the lot.

        `format=zip` (default) gives one file per note with YAML frontmatter —
        `title`, `kind`, `name`, `artist`, `mbid`, `loved`, `visibility`,
        `created`, `updated`, `tags` — plus a `README.md`. `format=md` gives one
        document with a section per note.

        **Shortcodes become wikilinks, and only where they resolve.** `[[…]]` is
        Tapedeck's reference syntax *and* the wikilink syntax of every tool this
        is aimed at, so `[[track:Xtal]]` left as-is would point at a page called
        `track:Xtal` that will never exist. A resolved reference becomes
        `[[Xtal — Aphex Twin]]`, matching that note's own filename by
        construction. An **unresolved** one is left exactly as written: it is
        what the writer typed, and the same judgement the HTML renderer makes.

        Filenames are de-duplicated (`Untitled (2)`), so a wikilink can never
        land on whichever of two files the vault happened to see first.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [zip, md], default: zip } }
      responses:
        '200':
          description: The export.
          content:
            application/zip: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notes/for:
    get:
      tags: [Notes]
      summary: The note for a given target, if any.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: entity_id, in: query, schema: { type: integer } }
        - { name: scrobble_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK. `note` is null when nothing is written yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { oneOf: [{ $ref: '#/components/schemas/Note' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notes/preview:
    post:
      tags: [Notes]
      summary: Render Markdown and resolve shortcodes, without saving.
      description: |
        Scope: `write` *(since v0.39)*. A POST that does not save, but **not** a
        pure read: resolving a shortcode can create the entity it points at, the
        same write-on-read trade `/api/v1/resolve` makes.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                entity_id: { type: integer, description: 'Context for positional `[[track:3]]`.' }
      responses:
        '200':
          description: Rendered.
          content:
            application/json:
              schema: { type: object, properties: { body_html: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BadRequest' }

  # ── Sessions ───────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: Listening sessions.
      description: |
        Session-only. Contiguous listening with gaps under 30 minutes. A change
        of submitting token also breaks a session — one token per app is how
        people organise these, so "fooyin stopped, Pano started" is a different
        setup even a minute later.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        uuid: { type: string, description: Stable across merges and splits. }
                        started_at: { type: integer }
                        ended_at: { type: integer }
                        track_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: One session and its listens.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: object, additionalProperties: true }
                  scrobbles: { type: array, items: { $ref: '#/components/schemas/Listen' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sessions]
      summary: Rename or annotate a session.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'] }
                note: { type: [string, 'null'] }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{id}/split:
    post:
      tags: [Sessions]
      summary: Split a session at a listen.
      description: |
        Splitting at the *first* listen is a no-op, not an error — it would
        leave one empty half, which is the session you already had. Aggregates
        are recomputed from the listens rather than adjusted arithmetically.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scrobble_id]
              properties:
                scrobble_id: { type: integer, description: Becomes the first listen of the new session. }
      responses:
        '200': { description: Split., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/merge:
    post:
      tags: [Sessions]
      summary: Merge sessions.
      description: |
        Keeps the **earliest** session's identity — its id and uuid are what
        anything else already refers to. Ownership is checked for every id
        before anything moves, so a merge naming someone else's session changes
        nothing rather than half-completing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 2, items: { type: integer } }
      responses:
        '200': { description: Merged., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/rebuild:
    post:
      tags: [Sessions]
      summary: Regroup every listen into sessions.
      description: |
        **Destructive** — it rewrites the column that manual merges and splits
        live in, discarding them. Exists for histories that predate session
        linking, and for imports, which bypass the ingest path entirely.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gap_minutes: { type: integer, default: 30 }
      responses:
        '200':
          description: Rebuilt.
          content:
            application/json:
              schema: { type: object, properties: { sessions: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Chains, gear, devices, bindings ────────────────────────────────────────
  /api/v1/chains:
    get:
      tags: [Chains]
      summary: Signal chains.
      description: |
        Scope: `read` *(since v0.37)*. This is what lets a client offer a chain
        **picker** instead of taking unvalidatable free text for a field that
        has to match a name exactly.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chains: { type: array, items: { $ref: '#/components/schemas/Chain' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chains]
      summary: Create a chain.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                icon: { type: string }
                is_default: { type: boolean }
                components: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Chain' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chains/{id}:
    get:
      tags: [Chains]
      summary: One chain.
      description: 'Scope: `read` *(since v0.37)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Chain' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chains]
      summary: Update a chain.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chains]
      summary: Delete a chain.
      description: Session-only. Clears referencing rows first — foreign keys are on.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/equipment:
    get:
      tags: [Chains]
      summary: Your gear.
      description: 'Scope: `read` *(since v0.37)*. Hours are derived from the chains that use each piece.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chains]
      summary: Add gear.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string }
                brand: { type: string }
      responses:
        '200': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/equipment/{id}:
    patch:
      tags: [Chains]
      summary: Update gear.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chains]
      summary: Delete gear.
      description: |
        Session-only. Chains referencing it stay readable — every component
        keeps a name snapshot alongside its optional `equipment_id`.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices:
    get:
      tags: [Chains]
      summary: Devices that have reported listens.
      description: 'Scope: `read` *(since v0.37)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/devices/{id}:
    patch:
      tags: [Chains]
      summary: Set a device's default chain.
      description: Session-only. Rung 4 of the chain ladder — the coarsest fallback.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { chain_id: { type: [integer, 'null'] } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/bindings:
    get:
      tags: [Chains]
      summary: Output-device bindings.
      description: 'Scope: `read` *(since v0.37)*. Rung 2 of the chain ladder.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Chains]
      summary: Bind an output device name to a chain.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_name, chain_id]
              properties:
                output_name: { type: string }
                chain_id: { type: integer }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/bindings/{id}:
    delete:
      tags: [Chains]
      summary: Remove a binding.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Shelf (records, tapes, discs) ──────────────────────────────────────────
  /api/v1/physical:
    get:
      tags: [Shelf]
      summary: Your shelf.
      description: Session-only.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [vinyl, cassette, cd, sacd] }
          description: Narrows to one format. Anything else is ignored rather than rejected.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shelf]
      summary: Add a release to the shelf.
      description: Session-only. Seed from a barcode lookup, or supply the tracklist yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist, title, kind]
              properties:
                artist: { type: string }
                title: { type: string }
                kind:
                  type: string
                  enum: [vinyl, cassette, cd, sacd]
                  description: |
                    The medium. Enforced by a CHECK on the column, so an
                    unrecognised value is a 400 rather than a stored oddity.
                    A **disc has no sides**: its tracklist is one numbered unit
                    per disc, and the UI says "Disc 1" rather than "Side A".
                barcode: { type: string }
                catalog_number: { type: string }
                year: { type: integer }
                mbid_release: { type: string }
                discogs_id: { type: string }
                artwork_url: { type: string }
                notes: { type: string }
                purchased_at:
                  type: integer
                  description: |
                    When you bought it, unix seconds. Optional — most of a shelf
                    is catalogued long after the fact, and a guessed date is
                    worse than a blank one.
                fetch_images:
                  type: boolean
                  default: true
                  description: |
                    Pull the sleeve, labels and booklet from the Cover Art
                    Archive as part of adding it. One request, awaited rather
                    than spawned — the next thing the user does is open the
                    record, and a gallery that fills in thirty seconds later
                    reads as broken. A failure here does **not** fail the add: a
                    record you own is on the shelf whether or not an archive has
                    scans of it. Does nothing without `mbid_release`.
                tracks: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  images: { type: integer, description: How many scans came back from the archive. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/{id}:
    get:
      tags: [Shelf]
      summary: One shelf item, with its sides.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Shelf]
      summary: Edit the shelf-keeping fields.
      description: |
        Session-only. When it was bought, what it is normally played through,
        and the note beside it.

        Every field distinguishes **absent from null**: omitting one leaves the
        column alone, and an explicit `null` clears it. That is not decoration —
        a bare optional reads a *misspelled* key as an explicit null, so a typo
        would clear the chain it was trying to set and answer 200. Same shape and
        the same reason as `default_chain_id` on `PATCH /admin/tokens/{id}`.

        `chain_id` and `equipment_id` are checked against the caller's own rows
        before they are stored.

        `kind` is the exception to the absent/null rule — a format has no
        "cleared" state, so a plain optional is correct. Changing it **rewrites
        the tracklist's sides**, because what a side is depends on the medium: a
        record has a break `assign_sides` has to place by playing time, and a
        disc has none at all. The response reports `sides_rewritten` so a client
        knows the tracklist it is holding is stale.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchased_at: { type: integer, nullable: true }
                chain_id: { type: integer, nullable: true }
                equipment_id: { type: integer, nullable: true }
                notes: { type: string, nullable: true }
                kind: { type: string, enum: [vinyl, cassette, cd, sacd] }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  sides_rewritten: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Shelf]
      summary: Remove a shelf item.
      description: |
        Session-only. Its plays and its images go with it, and any scan files
        the user uploaded are removed from disk — nothing else knows those files
        exist, so leaving them would orphan them permanently.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/tracks:
    put:
      tags: [Shelf]
      summary: Replace the tracklist and side split.
      description: |
        Session-only. Sides are **not reliably available from any provider** —
        MusicBrainz records a vinyl track number as "A1" only when an editor
        entered one. When there is no explicit side letter the split is guessed
        by **playing time**, not track count, because a mastering engineer
        balances sides and a nine-minute closer would otherwise land on the
        wrong one. It is still a guess, which is why this endpoint exists.

        None of that applies to a **disc**. A CD or SACD plays start to finish,
        so its tracks are numbered one unit per disc with no guessing at all —
        splitting a CD by playing time would invent a break that is not there.
        The medium's own format string decides which rule applies, not what was
        searched for.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracks]
              properties:
                tracks:
                  type: array
                  items:
                    type: object
                    properties:
                      position: { type: string, example: A1 }
                      title: { type: string }
                      duration: { type: integer, description: Seconds. }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/play:
    post:
      tags: [Shelf]
      summary: Record a side as played.
      description: |
        Session-only. **Writes one listen per track, not one per side** — every
        counting query in Tapedeck is over listens, so a side-shaped row would
        be invisible to all of them.

        Timestamps are the one inferred thing here: you observed when the side
        *started*, so tracks are spaced by their running times. A track of
        unknown length gets three minutes — wrong but bounded, where stacking
        them on one instant would break session grouping and the hour-of-day
        heatmap outright.

        Per-track outcomes from the browser deck are taken as authoritative: a
        side laid out from a start time can only describe an uninterrupted play.
        A skipped track is stored, excluded from every count, and never
        forwarded — and does not accrue gear hours.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side: { type: string, example: A }
                started_at: { type: integer, description: Unix seconds. Defaults to now minus the side's running time. }
                chain_id: { type: [integer, 'null'] }
                outcomes:
                  type: array
                  description: Per-track results from the deck, when it drove the play.
                  items:
                    type: object
                    properties:
                      position: { type: string }
                      started_at: { type: integer }
                      skipped: { type: boolean }
      responses:
        '200':
          description: Logged.
          content:
            application/json:
              schema: { type: object, properties: { listens: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/lookup:
    get:
      tags: [Shelf]
      summary: Resolve a barcode to a pressing.
      description: |
        Session-only. Discogs first when configured — it catalogues *pressings*,
        so a barcode usually resolves to the exact edition, often with real side
        letters that MusicBrainz lacks. Falls back to MusicBrainz.

        Barcodes may be sent with or without the printed spacing; the unspaced
        form a scanner produces matches slightly **more** often.
      parameters:
        - { name: barcode, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, description: Free text, when there is no barcode. } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/{id}/images:
    get:
      tags: [Shelf]
      summary: Every scan held for a pressing.
      description: |
        Session-only. Sleeves, labels, obi strips and booklet pages — the parts
        of a record you actually hold, which is why they are rows rather than
        one more `artwork_url` column. The Cover Art Archive carries 29 for a
        typical CD, 19 of them booklet pages.

        Each entry carries a single `src` and `thumb` whichever provenance it
        came from: a provider's image is its own URL, an uploaded scan is a
        Tapedeck URL that checks who is asking. The server's own file layout is
        never in the response.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind:
                          type: string
                          description: |
                            `front`, `back`, `booklet`, `medium`, `spine`, … Free
                            text rather than an enum: the archive's vocabulary
                            grows (`Panel` appears in none of its documentation
                            and is on real releases), and a scan of something it
                            has no word for is still a scan.
                        provider: { type: string, enum: [caa, discogs, upload] }
                        src: { type: string }
                        thumb: { type: string }
                        caption: { type: string, nullable: true }
                        position: { type: integer }
                        bytes: { type: integer, nullable: true }
                        mime: { type: string, nullable: true }
                        added_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shelf]
      summary: Upload scans of your own copy.
      description: |
        Session-only. `multipart/form-data`: any number of file fields, plus
        optional `kind` and `caption` text fields that apply to all of them —
        which is what makes uploading a booklet in one go work, since the files
        land in the order they are sent.

        The declared content type decides the stored extension; a filename from
        the client never reaches the path. Max 24 MB per image.

        Uploads are files on the server rather than blobs in the database, so
        `GET /api/v1/backup` does **not** carry them — `GET /api/v1/physical/export`
        is what does.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                kind: { type: string }
                caption: { type: string }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids: { type: array, items: { type: integer } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Larger than 24 MB. }
        '415': { description: Not an image type this server stores. }

  /api/v1/physical/{id}/images/fetch:
    post:
      tags: [Shelf]
      summary: Pull the sleeve from the Cover Art Archive.
      description: |
        Session-only. Runs when the user asks rather than on a clock: the
        archive is not going to change under a record that has been on a shelf
        for thirty years, and the one case that does — an editor uploading the
        booklet you were missing — is exactly the case where the user knows and
        Tapedeck cannot.

        **Idempotent** on the provider's own image id, so re-running this adds
        what is new and leaves the rest alone rather than stacking a second copy
        of all nineteen booklet pages on top of the first.

        Discogs runs second and only when a credential is configured; it says
        only "primary" or "secondary" about an image, so everything but the
        cover lands in `other` for the user to file. A pressing with no
        MusicBrainz id is **not** an error — it comes back with a note saying
        there is nothing to look it up by.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: integer }
                  total: { type: integer }
                  notes: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/images/{id}:
    patch:
      tags: [Shelf]
      summary: Re-file, caption or reorder a scan.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                caption: { type: string, nullable: true }
                position: { type: integer }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Shelf]
      summary: Remove a scan.
      description: |
        Session-only. An uploaded file is deleted from disk with the row and
        cannot be recovered; a provider's image is only unlinked and can be
        fetched again.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/images/{id}/file:
    get:
      tags: [Shelf]
      summary: An uploaded scan's bytes.
      description: |
        Session-only, and scoped to the caller by `(id, user_id)` — these are
        photographs of someone's own possessions and ids must not be walkable,
        the same rule the artwork proxy keeps.

        Cached hard, because a scan never changes once uploaded, but `private`:
        it is per-user, and a shared cache holding it would serve it to the next
        person through the proxy. A provider-hosted image 404s here — it has a
        URL of its own and this server is not in front of it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The image., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/now-playing:
    post:
      tags: [Shelf, Now Playing]
      summary: A side is on the deck.
      description: |
        Session-only. The shelf is the one source where the **browser** is the
        player: the clock runs in front of the turntable, in localStorage, and
        nothing server-side can derive a playhead from a stack of rows. So the
        deck pushes here, where Plex, Jellyfin and Navidrome are polled.

        Call it on every track change, on pause and resume, and on a heartbeat
        of about ten seconds. The heartbeat is **not optional**: the registry
        expires an entry by running past the end of the track it knows about, so
        a paused record would drop off the dashboard one track length after it
        was paused.

        Now-playing is forwarded to the user's Last.fm and ListenBrainz only
        when the track actually **changed**, and never while paused — their
        now-playing is a one-shot that expires on its own, so re-sending it on
        every heartbeat is noise aimed at someone else's servers. The listens
        themselves are written by `/play` when the side comes off; this endpoint
        stores nothing.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, position]
              properties:
                side: { type: string, example: A }
                position: { type: integer, description: The track's position on that side. }
                elapsed: { type: integer, description: Seconds into that track. }
                paused: { type: boolean }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: boolean, description: Whether this was a different track from the last report. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/now-playing:
    delete:
      tags: [Shelf, Now Playing]
      summary: Nothing is on the deck.
      description: |
        Session-only. Its own route rather than a field on the push, because it
        is also what *cancelling* a side means and that has no track to name.
        Clears only entries this shelf reported — an idle turntable must not
        wipe a now-playing the user's phone is currently sending over ingest.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/spin:
    get:
      tags: [Shelf]
      summary: The side currently on the deck.
      description: |
        Session-only. Returns `{ "spin": null }` when nothing is on.

        The shelf is the one source where the *browser* is the player, so the
        countdown runs in the page — but what is on and when it started live
        here. That is what lets a second device see the record, and what makes a
        side survive a browser crash.

        A spin whose release has since been deleted is cleared and reported as
        nothing on, rather than returned as a dangling id.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spin:
                    nullable: true
                    type: object
                    properties:
                      release_id: { type: integer }
                      kind: { type: string, enum: [vinyl, cassette, cd, sacd] }
                      artist: { type: string }
                      title: { type: string }
                      artwork_url: { type: string, nullable: true }
                      mbid_release: { type: string, nullable: true }
                      side: { type: string }
                      started_at: { type: integer }
                      paused_at: { type: integer, nullable: true, description: Null while running. }
                      paused_total: { type: integer, description: Seconds spent stopped. }
                      outcomes: { type: array, items: { type: object, additionalProperties: true } }
                      chain_id: { type: integer, nullable: true }
                      equipment_id: { type: integer, nullable: true }
                      updated_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Shelf]
      summary: Put a side on the deck, or update the one that is on.
      description: |
        Session-only. One deck per user — the table's primary key is the user,
        because nobody listens to two records at once, so starting a second side
        replaces the first rather than erroring.

        The whole state is sent every time rather than a patch per field: it is
        half a dozen small numbers, it changes only on real events (start,
        pause, skip, next track), and a partial update would let two devices
        interleave into a state neither of them meant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id, side, started_at]
              properties:
                release_id: { type: integer }
                side: { type: string }
                started_at: { type: integer }
                paused_at: { type: integer, nullable: true }
                paused_total: { type: integer, default: 0 }
                outcomes: { type: array, items: { type: object, additionalProperties: true } }
                chain_id: { type: integer, nullable: true }
                equipment_id: { type: integer, nullable: true }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such record., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Shelf]
      summary: Take the side off the deck.
      description: |
        Session-only. Clears the now-playing entry as well, so the two cannot
        disagree. Recording a side (`POST /api/v1/physical/{id}/play`) clears it
        too — otherwise reopening the page would offer to resume a side that has
        already been logged, which is how one gets logged twice.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/export:
    get:
      tags: [Shelf, Export]
      summary: The whole shelf as a zip.
      description: |
        Session-only. `shelf.json` (pressings, purchase dates, tracklists and an
        image manifest), `plays.csv` (every side played, oldest first, gear
        named), `gear.json` (equipment and chains with purchase dates) and
        `scans/` — the images the **user uploaded**, one directory per pressing.

        Images that live at the Cover Art Archive or Discogs are listed with
        their URLs rather than copied in: they are not the user's to
        redistribute and they are still there to fetch. Their own scans exist
        nowhere else, which is why those are the ones in the file.

        This exists separately from `GET /api/v1/backup` for a concrete reason:
        a backup is a `VACUUM INTO` snapshot of the database, and uploaded scans
        are files beside it rather than rows inside it. A backup and this export
        together are the whole shelf.
      responses:
        '200': { description: A zip archive., content: { application/zip: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/discogs/{id}:
    get:
      tags: [Shelf]
      summary: A Discogs release, with its tracklist positions.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/equipment/{id}/wear:
    get:
      tags: [Shelf]
      summary: Stylus hours or head wear for a piece of gear.
      description: Derived from `physical_plays`. A duplicate submission is not counted as wear.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/settings/discogs:
    get:
      tags: [Shelf, Settings]
      summary: Whether Discogs is configured.
      description: Session-only. Never returns the credential itself.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  shape: { type: [string, 'null'], enum: [token, key_secret, null] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Shelf, Settings]
      summary: Store a Discogs credential.
      description: |
        Session-only. Accepts **either** a personal access token **or** a
        consumer key/secret pair — either is enough, since Tapedeck only reads
        the public database. The three-legged OAuth flow is deliberately not
        implemented: it exists so an app can act *as a user*, and registering an
        app hands you a key and secret that work directly. Stored encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                key: { type: string }
                secret: { type: string }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/settings/discogs/test:
    post:
      tags: [Shelf, Settings]
      summary: Verify the stored Discogs credential.
      description: |
        Session-only, and **necessary rather than a nicety**: Discogs does not
        reject a bad credential. With a bogus key and secret, `/releases/1` and
        `/database/search` both return a normal 200 with real data, and the
        rate-limit header reads the *authenticated* 60 — the limit is raised for
        the presence of an `Authorization` header without checking its contents.
        `/users/{username}` is the one endpoint that actually verifies, and is
        what this calls. Without it, a typo is indistinguishable from a working
        credential.
      responses:
        '200':
          description: Result of the check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Genre map ──────────────────────────────────────────────────────────────
  /api/v1/genre-map:
    get:
      tags: [Genre map]
      summary: The map, your genres on it, and your average colour.
      description: |
        Session-only. The canvas is 1500 × 22,648 — fifteen times taller than
        wide — so a client must compress the y axis **in the coordinates**, not
        with `preserveAspectRatio`, which would squash the circles into ellipses
        too.

        `colour` is blended in **linear light**, not sRGB; mixing gamma-encoded
        values drags every user toward the same brown-grey.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    type: object
                    properties:
                      width: { type: number }
                      height: { type: number }
                      points:
                        type: array
                        description: '`[name, x, y, colour]` per genre — positional to keep ~6,300 rows small.'
                        items: { type: array }
                  mine:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        x: { type: number }
                        y: { type: number }
                        color: { type: string }
                        plays: { type: integer }
                  colour: { type: [string, 'null'], example: '#a18430' }
                  placed_tags: { type: integer }
                  unplaced_plays: { type: integer, description: 'Plays on tags with no place on the map — instruments, nationalities, roles.' }
                  listens_total: { type: integer }
                  listens_with_genres: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: The map has not been fetched yet. Run the scrape in Settings. }

  /api/v1/genre-map/trajectory:
    get:
      tags: [Genre map]
      summary: Where your listening sat, period by period.
      description: |
        Session-only. The play-weighted centroid of each period.

        Three honesty constraints, all load-bearing. It is an **artist-mix**
        trajectory, not a track-level one — every track by an artist carries
        that artist's genres and sits at the same point. A period under 25
        placed plays is **omitted, not drawn**, because a centroid from four
        listens reads as a real movement inside a path. And each period reports
        its own enrichment coverage, to be drawn faintly below 90% — the genre
        backfill runs newest-first, so a time-sliced view is the one most
        distorted by a half-done pass.

        The server picks month or year by how much history there is and says
        which it used. Buckets are in the user's own timezone.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { type: string, enum: [year, month] }
                  min_plays: { type: integer }
                  years:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: string }
                        x: { type: number }
                        y: { type: number }
                        plays: { type: integer }
                        colour: { type: [string, 'null'] }
                        listens: { type: integer }
                        enriched: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/genre-map/neighbours:
    get:
      tags: [Genre map]
      summary: What sits next to your listening.
      description: |
        Session-only. Walks Every Noise's precomputed adjacency, seeded from
        your top 25 genres.

        **This does not recommend music**, and the response shape is what
        enforces that. Two artist fields that are never both populated on the
        same card:

        * `your_artists` — from **your own history**. Only ever set on
          `next_door`.
        * `exemplar_artists` — **Every Noise's own exemplars**, for a genre you
          own nothing in. These name music you do not have. Any client showing
          them owes the reader that provenance, in words and in styling.

        `exemplar_artists` is empty until a tier-2 scrape has run — a
        tier-1-only instance has adjacency but no exemplars. Say so rather than
        rendering bare cards that look like a bug.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded_from: { type: integer }
                  next_door:
                    type: array
                    description: Bordering genres you already own music in and underplay. This half leads.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
                  unexplored:
                    type: array
                    description: Bordering genres you own nothing in.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
                  opposite:
                    type: array
                    description: Furthest from your listening. Suggests nothing by construction.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: None of your genres are on the map yet. }

  # ── Rediscovery ────────────────────────────────────────────────────────────
  /api/v1/rediscovery:
    get:
      tags: [Rediscovery]
      summary: Five lists, all built from your own history.
      description: |
        Session-only. Nothing here points at music you do not own — that is the
        design, not an implementation detail.

        "Not lately" is a **parameter, not a constant**: six months is a long
        gap for a daily listener and no gap at all otherwise. The seasonal list
        excludes the current year, or it would just be "recently played".
      parameters:
        - { name: months, in: query, schema: { type: integer, default: 6 }, description: How long counts as "not lately". }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/rediscovery/gear/{id}:
    get:
      tags: [Rediscovery]
      summary: Favourites never heard on a piece of gear.
      description: |
        Session-only. Answered by joining `chain_id` to the chains whose
        components reference the gear — no per-listen equipment field needed.
        Restricted to tracks played more than once: the interesting question is
        how your *favourites* sound on it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Playlists ──────────────────────────────────────────────────────────────
  /api/v1/playlist-lab:
    get:
      tags: [Playlists]
      summary: The vector space the Playlist Lab generates from.
      description: |
        Session-only. Returns the candidate pool with a position for each track,
        plus what every axis means.

        **Read `granularity` and `note` before using this.** The space is ten
        real dimensions, and they come from two different places:

        * **Six are about the music** (`group: sound`), from the Every Noise
          genre map — `x` (dense/atmospheric ↔ spiky/bouncy), `y` (organic ↔
          mechanical/electric), the colour's three channels, and how far apart a
          track's own genres sit.
        * **Four are about the listener** (`group: habit`) — era, familiarity,
          hour of day, recency — from their own history.

        These are **not** per-recording audio features. Genres attach to
        artists, so `granularity` is `artist` and every track by one artist
        shares its six `sound` coordinates exactly; the `habit` axes are the
        only thing separating them. Anything describing this as track-level
        audio similarity is wrong. A client mixing the two groups without
        weighting will find "similar" quietly means "played at the same hour".

        Values are normalised 0–1 against **the pool's own extremes**, so
        "newer" means newer than the rest of this collection. A track whose
        genres have no place on the map is **dropped, not centred** — placing it
        in the middle would invent a similarity it does not have — and the count
        comes back as `unplaced`.

        `tracks` is compact — `[title, artist, album, plays, [v0…v9]]` — because
        on a 3,000-track pool the repeated key names would be most of the
        payload. Answers `409` when the genre map has not been fetched, when
        there is no history, or when nothing has been placed yet.
      parameters:
        - { name: min_plays, in: query, schema: { type: integer, default: 2, minimum: 1, maximum: 50 }, description: 'Loved tracks bypass this entirely.' }
        - { name: cap, in: query, schema: { type: integer, default: 3000, minimum: 50, maximum: 10000 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dims:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        low: { type: string, description: What the low end of the axis means. }
                        high: { type: string }
                        group: { type: string, enum: [sound, habit] }
                  tracks:
                    type: array
                    description: '`[title, artist, album, plays, vector]` per track.'
                    items: { type: array }
                  loved: { type: array, items: { type: integer }, description: Indices into `tracks`. }
                  pool: { type: integer }
                  considered: { type: integer, description: Distinct tracks before the pool rules. }
                  unplaced: { type: integer, description: Dropped for having no placeable genre. }
                  min_plays: { type: integer }
                  granularity: { type: string, enum: [artist] }
                  note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: No genre map, no history, or nothing placed yet. }

  /api/v1/playlist-targets:
    get:
      tags: [Playlists]
      summary: Servers a generated list can be sent to.
      description: |
        Session-only, and permanently so: pushing spends the credential of a
        configured source, which puts it on the same side of the line as
        `/api/v1/sources` — the line API tokens do not cross.

        The targets are the caller's **enabled** sources, filtered to the kinds
        that can receive a playlist. `protocol` names the wire protocol rather
        than the product, so a Navidrome source reads as `Subsonic`: the calls
        are `search3` and `createPlaylist`, which any OpenSubsonic server
        answers. A kind missing from the list is a source that polls and cannot
        be written to, not a bug.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        source_id: { type: integer }
                        kind: { type: string, enum: [plex, jellyfin, navidrome] }
                        protocol: { type: string, enum: [Plex, Jellyfin, Subsonic] }
                        label: { type: string, description: Falls back to the protocol name when the source has none. }
                        account: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/playlists:
    post:
      tags: [Playlists]
      summary: Create a playlist on one of your servers from a list of tracks.
      description: |
        Session-only — see `/api/v1/playlist-targets`.

        Tapedeck stores **names, not the server's item ids**, for a generated
        list, so every track is resolved by searching the target and every one of
        those searches is fuzzy. A hit is checked on artist *and* title before it
        is used; an exact title beats a `(Remastered)` one, and a hit for a
        different artist is discarded rather than taken.

        **A partial push is a success, not an error.** A listening history is not
        the same set as any one library, so `matched` below `requested` is the
        normal case and `missing` names every track that did not land. The push
        only fails outright when nothing matched (`404`) or the server refused or
        could not be reached (`502`) — the two need completely different things
        from the user, so they are not collapsed.

        Order is preserved; misses drop out. At most 100 tracks, which is a
        wall-clock bound as much as a politeness one — the searches run in turn
        against what is often a Raspberry Pi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, name, tracks]
              properties:
                source_id: { type: integer, description: From `/api/v1/playlist-targets`. }
                name: { type: string, description: Trimmed, truncated to 120 characters. }
                tracks:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [title, artist]
                    properties:
                      title: { type: string }
                      artist: { type: string }
                      album: { type: string, nullable: true, description: A tiebreaker between pressings, never a requirement. }
      responses:
        '200':
          description: Created — possibly with fewer tracks than asked for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist_id: { type: string, description: 'The server''s own id. Empty when a Subsonic server answered `ok` without one.' }
                  name: { type: string }
                  protocol: { type: string }
                  target: { type: object, additionalProperties: true }
                  requested: { type: integer }
                  matched: { type: integer }
                  missing:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        artist: { type: string }
                        album: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such source, or none of those tracks are on it. }
        '502': { description: The server refused the playlist or could not be reached. }

  # ── Settings ───────────────────────────────────────────────────────────────
  /api/v1/preferences:
    get:
      tags: [Settings]
      summary: User preferences.
      description: Session-only.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  theme: { type: string, enum: [light, dark, system] }
                  timezone: { type: string, description: 'IANA region, e.g. `Europe/Berlin`.' }
                  week_start: { type: integer, description: '0 = Sunday.' }
                  show_artwork: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      summary: Update preferences.
      description: |
        Session-only. Omitted keys are left alone.

        `timezone` must be an **IANA region**, not a fixed abbreviation. The
        region carries the DST rules — `Europe/Berlin` *is* CET in winter and
        CEST in summer, switching on the right dates by itself, and a region
        with no summer time never shifts. Storing `CET` would freeze the offset
        and put half a European year an hour out, silently: listens would still
        store correctly and only "today", the hour-of-day heatmap and the
        trajectory buckets would be wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Sources ────────────────────────────────────────────────────────────────
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: Your configured sources.
      description: |
        **Session-only, permanently** — these rows hold credentials. The stored
        token or password is never returned; `has_token` says whether one is
        set.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [plex, jellyfin, navidrome] }
                        url: { type: string }
                        enabled: { type: boolean }
                        has_token: { type: boolean }
                        poll_interval: { type: integer, description: Seconds. }
                        options: { type: object, additionalProperties: true, description: Per-kind knobs, so a new kind needs no migration. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Sources]
      summary: Add a source.
      description: |
        Session-only. Sources are per user, keyed `(user_id, kind)`. For Plex
        the token is resolved to a Plex account via plex.tv and the source is
        filtered to that account, so there is no name-matching — which means
        saving needs outbound internet even for a LAN Plex.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [plex, jellyfin, navidrome] }
                url: { type: string }
                token: { type: string }
                username: { type: string }
                password: { type: string }
                enabled: { type: boolean, default: true }
                options: { type: object, additionalProperties: true }
      responses:
        '200': { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sources/{id}:
    put:
      tags: [Sources]
      summary: Update a source.
      description: Session-only. **An omitted token keeps the stored one** — it is not cleared.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sources]
      summary: Delete a source.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sources/test:
    post:
      tags: [Sources]
      summary: Test a source's credentials without saving.
      description: Session-only.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  accounts: { type: array, items: { type: object, additionalProperties: true }, description: Account picker options, where the source has them. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Connections (forwarding) ───────────────────────────────────────────────
  /api/v1/connections:
    get:
      tags: [Connections]
      summary: Where your listens are forwarded.
      description: |
        **Session-only, permanently** — holds credentials.

        Forwarding is strictly per user. A user with no connections keeps their
        listens local; there is deliberately **no server-wide fallback**, which
        previously sent every unconnected user's listens to the operator's own
        account.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        service: { type: string, enum: [lastfm, librefm, listenbrainz] }
                        username: { type: [string, 'null'] }
                        connected: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/{service}:
    delete:
      tags: [Connections]
      summary: Disconnect a service.
      description: Session-only.
      parameters: [{ name: service, in: path, required: true, schema: { type: string, enum: [lastfm, librefm, listenbrainz] } }]
      responses:
        '200': { description: Disconnected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/lastfm/start:
    post:
      tags: [Connections]
      summary: Begin the Last.fm connect flow.
      description: Session-only. Returns a URL to send the browser to.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { auth_url: { type: string }, token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/lastfm/complete:
    post:
      tags: [Connections]
      summary: Finish the Last.fm connect flow.
      description: Session-only. Exchanges the approved request token for a session key, stored encrypted.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/librefm/start:
    post:
      tags: [Connections]
      summary: Begin the Libre.fm connect flow.
      description: Session-only. GNU FM implements the same AudioScrobbler auth, so this reuses the Last.fm app credentials.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { auth_url: { type: string }, token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/librefm/complete:
    post:
      tags: [Connections]
      summary: Finish the Libre.fm connect flow.
      description: Session-only.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/listenbrainz:
    put:
      tags: [Connections]
      summary: Store a ListenBrainz token.
      description: |
        Session-only. Stored encrypted. The endpoint is configurable for
        self-hosted ListenBrainz instances — that is the one scrobble setting
        still in the config file rather than the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Import & export ────────────────────────────────────────────────────────
  /api/v1/export:
    get:
      tags: [Import & export]
      summary: Export your listens as CSV.
      description: Session-only.
      responses:
        '200': { description: CSV., content: { 'text/csv': { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup:
    get:
      tags: [Import & export]
      summary: Download a database snapshot.
      description: |
        **Session-only.** A `VACUUM INTO` snapshot of the whole database — every
        user's listens, and the encrypted credentials.

        The encryption key deliberately lives **outside** the database, so it
        does not ride along in this file. That is what the encryption protects
        against: a leaked backup, not host compromise. Do not describe it as
        more than that.
      responses:
        '200': { description: SQLite file., content: { 'application/octet-stream': { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/file:
    post:
      tags: [Import & export]
      summary: Import a file.
      description: |
        Session-only. Sniffs the **content**, not the filename — people rename
        downloads. Accepts a ListenBrainz export zip (JSONL, and its
        `feedback.jsonl` becomes loves), a Spotify Extended Streaming History
        zip, a CSV, or a Rockbox `.scrobbler.log`. The two zip formats are told
        apart by their entry names, since both are plain zips.

        A ListenBrainz export carries a full `mbid_mapping`, so those listens
        skip MusicBrainz enrichment *and* the artwork chain — for a 20k history
        that is the difference between free and a week of rate-limited lookups.
        A Spotify export carries no MusicBrainz identifiers at all, so the
        opposite is true and every distinct track needs a lookup afterwards.

        **A Spotify export's `ts` is when the track stopped**, not when it
        started, so it is corrected on the way in; each play is filed as a
        listen or a skip on the same half-the-track threshold the live sources
        use, rather than on Spotify's own `skipped` field, which records
        something else. Podcast episodes and audiobook chapters are dropped.
        Those listens keep `spotify_track_id` and land with `source_name`
        `spotify`.

        **Rockbox `#TZ/UNKNOWN` is refused, not guessed.** DAPs often have no
        time sync, so their timestamps are local wall-clock seconds; assuming
        the server's zone would shift a whole device's history by the offset,
        unrecoverably. Supply `timezone` in that case.

        Imports land as `imported` and are **never forwarded**.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                timezone: { type: string, description: IANA region. Required for a Rockbox log with an unknown zone. }
      responses:
        '200':
          description: Job started.
          content:
            application/json:
              schema: { type: object, properties: { job_id: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/listenbrainz:
    post:
      tags: [Import & export]
      summary: Import from a ListenBrainz account.
      description: |
        Session-only. Paced deliberately: a 30s timeout, exponential backoff on
        network errors and 5xx, `429` honoured via `X-RateLimit-Reset-In`, and
        400ms between pages. **Do not remove the inter-page sleep to speed this
        up** — hammering is what broke it at ~80k listens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                token: { type: string }
      responses:
        '200': { description: Job started., content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/lastfm:
    post:
      tags: [Import & export]
      summary: Import from a Last.fm account.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties: { username: { type: string } }
      responses:
        '200': { description: Job started., content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/jobs:
    get:
      tags: [Import & export]
      summary: Jobs running right now.
      description: |
        Session-only. Live progress is an **in-memory** registry, so in-flight
        jobs are lost on restart (the import aborts with them). Finished jobs
        are persisted — see `/api/v1/import/history`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/jobs/{job_id}:
    get:
      tags: [Import & export]
      summary: One job's progress.
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  state: { type: string, enum: [running, done, failed] }
                  processed: { type: integer }
                  total: { type: [integer, 'null'] }
                  imported: { type: integer }
                  duplicates: { type: integer }
                  error: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/import/history:
    get:
      tags: [Import & export]
      summary: Finished import jobs.
      description: Session-only. Persisted, so this survives restarts.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Maintenance ────────────────────────────────────────────────────────────
  /api/v1/artwork/status:
    get:
      tags: [Maintenance]
      summary: Artwork coverage.
      description: |
        Session-only. **Numerator and denominator share a population** — both
        exclude skips. They did not once, so the two were fractions of different
        wholes.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  with_artwork: { type: integer }
                  total: { type: integer }
                  pending: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/artwork/backfill:
    post:
      tags: [Maintenance]
      summary: Run the artwork backfill now.
      description: |
        Session-only. Providers return **URLs, never bytes** — Deezer's terms
        discourage persisting artwork. The queue keys on `artwork_url` **only**;
        `caa_id` is written by three other paths, so keying on it silently marks
        rows done that have no URL.
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/languages/status:
    get:
      tags: [Maintenance]
      summary: Language classification coverage.
      description: |
        Session-only. The denominator counts only rows the backfill will
        actually process — it did not once, so the bar could never reach 100%
        on any history containing a skip.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  classified: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/languages/backfill:
    post:
      tags: [Maintenance]
      summary: Run the language backfill now.
      description: Session-only.
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sanitize:
    get:
      tags: [Maintenance]
      summary: Preview metadata fixes.
      description: |
        Session-only. **Preview-then-apply, never automatic** — and the preview
        deliberately exposes how weak each guess is, because the operator has to
        judge it.

        Three passes. *Mixed releases*: one listen out of twelve routinely
        arrives carrying a compilation's release MBID. The whole ballot is
        returned, most-claimed first, so "15 releases, plurality of 4" is
        visible as the guess it is. *Featured credits*: `Artist feat. X` is a
        different artist to every query in the app; only the explicit
        `feat.`/`ft.`/`featuring`/`with` forms match, because "Simon &
        Garfunkel" is a name, not a credit. *Spelling variants*: grouped on the
        exact string, with `case_only` flagged — a two-stage filter whose second
        stage was coarser than the first once made every case-only variant
        invisible.
      responses:
        '200':
          description: The proposed changes, each individually selectable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  album_edits: { type: array, items: { type: object, additionalProperties: true } }
                  credit_edits: { type: array, items: { type: object, additionalProperties: true } }
                  variant_edits: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Maintenance]
      summary: Apply selected metadata fixes.
      description: |
        Session-only. Explicit lists select individual edits; the booleans mean
        "everything in this category". **A non-empty list wins over its
        boolean** — asking for three edits and getting four hundred would be the
        worst reading of an ambiguous request.

        The featured-credit target is **derived, never taken from the request**,
        or this would become "rename any artist to anything". A variant merge is
        refused unless both spellings normalise to the same key, so merging
        "Burial" into "Aphex Twin" cannot happen.

        **A spelling merge is not reversible.** The `feat.` fold keeps the
        original in `artist_credit`; a rename keeps nothing, because both
        strings name the same artist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                albums: { type: boolean }
                credits: { type: boolean }
                variants: { type: boolean }
                album_edits: { type: array, items: { type: object, additionalProperties: true } }
                credit_edits: { type: array, items: { type: object, additionalProperties: true } }
                variant_edits: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Admin ──────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: List users.
      description: Session-only, admin role. Never reachable with a token.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a user.
      description: |
        Session-only, admin role. There is **no self-registration** — this
        instance is invite-only by design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                role: { type: string, enum: [user, admin], default: user }
      responses:
        '200': { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/profile:
    get:
      tags: [Account]
      summary: The caller's own account.
      description: |
        Session-only. Takes no id — it is always the caller's own account, which
        is the point: an account created for someone else was previously only
        changeable by the admin who created it.

        `avatar` is a URL the browser can load. It is either the external URL the
        user set or `/api/v1/profile/avatar` when a file was uploaded; the path
        on disk is never returned.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  username: { type: string }
                  display_name: { type: string, nullable: true }
                  role: { type: string, enum: [admin, user] }
                  created_at: { type: integer, description: Unix seconds. }
                  bio: { type: string, nullable: true }
                  avatar: { type: string, nullable: true }
                  disabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      summary: Change your display name, bio or avatar URL.
      description: |
        Session-only. Each field distinguishes absent ("leave alone") from an
        explicit `null` ("clear"), so a misspelled key cannot silently blank a
        field it failed to name.

        `avatar_url` must be an `http(s)` URL. A relative value is refused with
        400 — only the upload endpoint may write a path this server serves.
        Role, disabled state, username and password are deliberately not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, nullable: true, maxLength: 80 }
                bio: { type: string, nullable: true, maxLength: 500 }
                avatar_url: { type: string, nullable: true }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/profile/password:
    post:
      tags: [Account]
      summary: Change your own password.
      description: |
        Session-only. `current_password` is required — the caller already holds
        a session, so without it an unlocked browser would be enough to lock the
        real owner out. This is what separates it from the admin reset on
        `PATCH /admin/users/{id}`.

        On success every existing session for the user is dropped and a new
        cookie is issued to the caller, so other browsers are logged out but the
        tab making the request is not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Updated; a fresh session cookie is set., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The current password is wrong., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/profile/avatar:
    get:
      tags: [Account]
      summary: The caller's uploaded profile picture.
      description: |
        Session-only and scoped to the caller, like the artwork proxy. Cached
        `private` — a shared cache holding one would serve it to the next person
        through the proxy. 404 when the avatar is an external URL rather than an
        uploaded file.
      responses:
        '200': { description: The image bytes., content: { image/*: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Account]
      summary: Upload a profile picture.
      description: |
        Session-only, `multipart/form-data`, 4 MB maximum. The extension comes
        from the declared content type, never from the client's filename. The
        picture it replaces is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { type: object, properties: { avatar: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Larger than 4 MB., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not an image type we store., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Account]
      summary: Remove your profile picture.
      description: Session-only. Falls back to the lettered tile.
      responses:
        '200': { description: Removed., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Update a user.
      description: Session-only, admin role.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Delete a user and everything they own.
      description: |
        Session-only, admin role. Foreign keys are enforced, so this clears note
        revisions, then notes, then listens, in that order.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tokens:
    get:
      tags: [Admin]
      summary: The caller's API tokens.
      description: Session-only. Token secrets are never returned after issue.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        scopes: { type: string }
                        created_at: { type: integer }
                        last_used_at: { type: [integer, 'null'] }
                        default_chain_id: { type: [integer, 'null'] }
                        default_chain_name: { type: [string, 'null'] }
                        imports_are_live: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Mint a token.
      description: |
        Session-only. **The secret is in this response and nowhere else.**

        Name it per device — that is what makes revocation meaningful when a
        phone is lost. `default_chain_id` is rung 3 of the chain ladder: one
        token per app makes attribution zero-configuration on the client side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes:
                  type: string
                  default: submit
                  description: 'Space-separated. `submit`, `read`, `write`, or `all`. None implies another.'
                default_chain_id: { type: [integer, 'null'] }
                imports_are_live:
                  type: boolean
                  default: false
                  description: |
                    Whether this client's `listen_type: "import"` submissions are
                    live listens rather than a backfill. Some players (fooyin)
                    label every scrobble `import`; without this their listens are
                    stored but never forwarded to Last.fm / ListenBrainz. Even
                    when set, only listens from the last 24h are forwarded, so a
                    genuine history import from the same client stays local.
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  token: { type: string, description: Shown once. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/tokens/{id}:
    patch:
      tags: [Admin]
      summary: Repoint a token's default chain, without re-issuing it.
      description: |
        Session-only. Fixing the chain never means re-pasting a token into a
        client. `default_chain_id` is nullable-and-optional: present-and-null
        clears it, absent leaves it alone. Any chain id is checked against the
        owner's own chains.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                default_chain_id: { type: [integer, 'null'] }
                imports_are_live:
                  type: boolean
                  description: Absent leaves it alone. See POST for what it does.
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Revoke a token.
      description: Session-only. This is the mitigation for a lost device.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Revoked., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tokens/{id}/rotate:
    post:
      tags: [Admin]
      summary: Re-issue a token in place.
      description: Session-only. Same id, name, scopes and chain; new secret, returned once.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/everynoise:
    get:
      tags: [Admin, Genre map]
      summary: Genre-map scrape status.
      description: Session-only, admin role.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  genres: { type: integer }
                  artists: { type: integer }
                  edges: { type: integer }
                  running: { type: boolean }
                  contact: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Admin, Genre map]
      summary: Drop the scraped genre map.
      description: |
        Session-only, admin role. The genre map lives in its **own database**
        (`EVERYNOISE_DB_PATH`), kept out of `VACUUM INTO` backups — those should
        hold the user's listening, not 6,300 rows of someone else's reference
        data.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/everynoise/contact:
    put:
      tags: [Admin, Genre map]
      summary: Set the admin contact email for the scraper's User-Agent.
      description: |
        Session-only, admin role. The scrape **refuses to start without one** —
        a made-up address is worse than none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties: { contact: { type: string, format: email } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: Not a plausible address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/everynoise/scrape:
    post:
      tags: [Admin, Genre map]
      summary: Start a scrape.
      description: |
        Session-only, admin role. Runs when an admin asks and **never on a
        schedule** — Every Noise has been frozen since December 2023, so there
        is nothing to sync.

        **Tier 1 is one HTTP request** and returns every genre with coordinates
        and colour; genre-level features cost that alone. **Tier 2 walks ~6,300
        genre pages at 1 req/s** — about two hours — for exemplar artists and
        the adjacency graph. Build on tier 1 first.

        A fetch that parses to **zero** genres is treated as a failure rather
        than written, or a changed page would silently empty the table. Resume
        is per page, written in the same transaction as the page's contents, so
        a crash can never mark a page done with nothing in it. A second
        concurrent start is refused.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { type: integer, enum: [1, 2], default: 1 }
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: No admin contact set. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A scrape is already running. }

  /admin/everynoise/cancel:
    post:
      tags: [Admin, Genre map]
      summary: Cancel a running scrape.
      description: Session-only, admin role. Progress already written is kept — resume is per page.
      responses:
        '200': { description: Cancelled., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
