          type: boolean
    AmaiCoverage:
      type: object
      description: |-
        How much of this history AudioMuse-AI can answer for. Every share is a
        percentage, and null when its population is empty.
      required:
      - total_plays
      - distinct_tracks
      - joinable_tracks
      - joinable_plays
      - asked
      - analysed
      - sample_requested
      - deadline_hit
      - examples_not_analysed
      properties:
        total_plays:
          type: integer
          format: int64
        distinct_tracks:
          type: integer
          minimum: 0
        joinable_tracks:
          type: integer
          description: Tracks that came off a media server, so could join at all.
          minimum: 0
        joinable_plays:
          type: integer
          format: int64
        joinable_share_of_listening:
          type:
          - number
          - 'null'
          format: double
          description: The structural ceiling, over the whole history.
        asked:
          type: integer
          description: Joinable tracks actually asked about, most-played first.
          minimum: 0
        analysed:
          type: integer
          minimum: 0
        analysed_share_of_asked:
          type:
          - number
          - 'null'
          format: double
        analysed_share_of_sampled_listening:
          type:
          - number
          - 'null'
          format: double
          description: Weighted by plays — the figure the decision rests on.
        sample_share_of_listening:
          type:
          - number
          - 'null'
          format: double
          description: What share of all listening the sample is.
        sample_requested:
          type: integer
          minimum: 0
        deadline_hit:
          type: boolean
          description: The probe stopped at its deadline before asking about the whole sample.
        error:
          type:
          - string
          - 'null'
          description: The first failed ask. A failed ask is never counted as a miss.
        server_asked:
          type:
          - string
          - 'null'
        examples_not_analysed:
          type: array
