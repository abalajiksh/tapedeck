openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Tapedeck HTTP API
#
# Hand-written, deliberately. utoipa derives schemas from typed response
# structs, and this codebase has five of them against 278 hand-built
# `serde_json::json!` bodies — deriving would degenerate into writing the same
# YAML inside a macro DSL, scattered across 126 handlers. Revisit if typed
# response structs ever land.
#
# Schema depth is tiered on purpose, because a *wrong* schema is worse than a
# missing one — a client author trusts it and gets a runtime crash.
#
#   Tier 1 (client-facing): auth, listens, stats, loves, notes, now-playing,
#     chains. Properties derived by reading the handler. Trust these.
#   Tier 2 (admin, maintenance, settings): path, method, auth and a described
#     but loose body. `additionalProperties: true` means "not fully mapped",
#     not "anything goes".
#
# `tests::the_spec_and_the_router_describe_the_same_api` walks `.route("…")`
# literals in both
# directions: every route must appear here, and every path here must exist in
# the router. Add an endpoint, add it here, or the build fails.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Tapedeck
  version: 0.117.0
  summary: Self-hosted scrobbler and listening journal.
  description: |
    Tapedeck ingests listens, enriches them with MusicBrainz metadata, stores
    them in SQLite and forwards them to Last.fm / ListenBrainz / Libre.fm. It
    also records *how* you listened — signal chains, gear, audio quality — which
    is the part no other scrobbler models.

    ## Three auth mechanisms, and they are not interchangeable

    | | How | Reaches |
    |---|---|---|
    | **Session cookie** | `td_session`, set by `POST /api/v1/auth/login` | everything |
    | **API token** | `Authorization: Token <t>` | `/1/*`, plus whatever its scopes allow |
    | **Metrics bearer** | `Authorization: Bearer <t>` | `GET /metrics` only |

    ### Token scopes

    `tokens.scopes` is a space- or comma-separated set. Three grants matter, and
    **none of them implies another**:

    * `submit` — post listens (`POST /1/submit-listens`). Every scrobble client
      has this; it must not carry the power to delete the history it appends to.
    * `read` *(since v0.37)* — read your own data on the endpoints marked
      `read` below.
    * `write` *(since v0.39)* — change your own data on the endpoints marked
      `write`.

    `all` grants both `read` and `write`. Matching is exact — a scope of
    `rewrite` does not grant `write`.

    A valid token that lacks the required scope gets **403, not 401**. It
    authenticated fine and re-authenticating will not help; a 401 would send a
    client into a token-refresh loop it cannot win.

    ### What a token can never reach

    Everything under `/admin/`, plus your sources, your forwarding connections,
    Discogs credentials, data export/backup, the sanitiser and the enrichment
    jobs. Those are **session-only, permanently**. A leaked token is a bad
    afternoon; a leaked token that can mint more tokens, read another household
    member's data, or repoint where your listens are forwarded is a different
    category. Requests to them with a token get 401.

    ## Getting a token

    Two ways, and neither asks anyone to type a token by hand:

    * **Device-code pairing** — `POST /1/pair/start`, poll `/1/pair/poll` while
      the user approves the short code in Settings. For clients with no browser.
    * **Password → token** — post credentials to `POST /api/v1/auth/login`,
      then mint a named token. This is the phone's flow. A named token appears
      in Settings and can be revoked when the device is lost; a session cookie
      expires hard at 7 days with no sliding renewal and cannot be told apart
      from any other browser.

    ## Conventions

    * Timestamps are **Unix seconds, UTC**, and always the *start* of play.
    * Errors are `{ "code": <int>, "error": "<message>" }` with a matching HTTP
      status.
    * Every user-scoped query is filtered by the caller's own `user_id`. Scopes
      widen *who may ask*, never *whose data is returned*.
    * Counting endpoints exclude skipped listens (`skipped = FALSE`).

    ## Instance-specific

    `GET /api/openapi.yaml` serves this document from the running binary, so a
    client can ask *its own server* what that version supports rather than
    guessing from a hosted copy.

  license:
    name: AGPL-3.0-or-later
  contact:
    name: Tapedeck
    url: https://codeberg.org/abksh/tapedeck

servers:
  - url: /
    description: The Tapedeck instance serving this document.

tags:
  - name: Auth
    description: Login, first-run setup, session state.
  - name: ListenBrainz
    description: |
      ListenBrainz-compatible surface under `/1/`. Shapes follow the LB Core
      API because clients branch on those exact fields. Two deliberate
      divergences: these require auth and are scoped to the caller (LB serves
      them publicly; a self-hosted instance must not), and an invalid token on
      `validate-token` is `200 {valid:false}`, never 401, because clients read
      the field.
  - name: Pairing
    description: Device-code pairing for clients with no browser.
  - name: Patch
    description: |
      ActivityPub, as far as it goes. Four unauthenticated endpoints that let
      another server find out who somebody here is and say something to them.

      **Nothing is delivered outbound yet.** This is the local half of Phase 6,
      shipped first on purpose: the identity these endpoints publish is the one
      thing other people's databases end up holding copies of, and a copy cannot
      be corrected later.

      Every one of these is off until a user switches federation on, and an
      account that has not is indistinguishable from one that does not exist —
      the same rule the public now-playing widget and device pairing follow.
  - name: Account
    description: |
      Your own account — password, display name, bio, profile picture. Scoped to
      the caller and never takes an id, unlike the admin routes under
      `/admin/users`. Session-only: a scrobble client has no business changing
      the credential it authenticates with.
  - name: Listens
    description: The scrobble history — read, edit, delete, search.
  - name: Statistics
    description: Aggregations, charts, personality.
  - name: Library
    description: Album, artist and entity pages.
  - name: Loves
    description: Loved recordings, releases and artists.
  - name: Notes
    description: Liner notes — your own writing about records.
  - name: Sessions
    description: Contiguous listening, grouped.
  - name: Chains
    description: Signal chains, gear, devices and bindings.
  - name: Shelf
    description: Records, tapes and discs — a shelf you catalogue and sides you play.
  - name: Genre map
    description: Every Noise at Once — coverage, colour, trajectory, neighbours.
  - name: Rediscovery
    description: Five lists, all built from your own history.
  - name: Sources
    description: Where listens are polled from. Session-only — holds credentials.
  - name: Connections
    description: Where listens are forwarded. Session-only — holds credentials.
  - name: Import & export
    description: Bulk in and out. Session-only.
  - name: Maintenance
    description: Enrichment backfills and the metadata sanitiser. Session-only.
  - name: Settings
    description: Preferences and artwork.
  - name: Admin
    description: Users, tokens, genre-map scrape. Session-only, admin role.
  - name: MCP
    description: |
      The Model Context Protocol surface — one endpoint that lets an AI
      assistant read this user's listening and hand playlists back. Runs for
      every user, reaches nobody's data until they authorise a connection.

      **Dual-era.** Revision `2026-07-28` is stateless with per-request `_meta`
      and mirrored headers; `2025-11-25` and earlier open with an `initialize`
      handshake. Both are served on the same endpoint.

      Credentials live in `mcp_connections`, **not** in `tokens` — an MCP grant
      is a standing permission given to somebody else's service, `tokens.scopes`
      treats `all` as a wildcard, and an OAuth credential expires and refreshes.
  - name: OAuth
    description: |
      An OAuth 2.1 authorization server, scoped to one job: letting a hosted
      assistant obtain an MCP credential. PKCE `S256` only, public clients only,
      exact `redirect_uri` matching, single-use codes.
  - name: Playlists
    description: |
      Playlists that live in Tapedeck, reviewed before they reach a media
      server, plus the direct push that has always existed.
  - name: Crate
    description: |
      Records and artists somebody suggested that you do not own — the one place
      in Tapedeck that names music outside the collection.

      **Tapedeck does not recommend; it records recommendations made to you.**
      The vision rule governs what Tapedeck *generates* (Rediscovery is built
      entirely from your own history and stays that way); this stores what an
      assistant said, the way notes store what you wrote. It is its own table,
      its own endpoints and its own page, and never appears in a history or
      statistics readout.
  - name: Ops
    description: Health, metrics, log level.

security:
  - sessionCookie: []

components:
  securitySchemes:
    mcpBearer:
      type: http
      scheme: bearer
      description: |
        An MCP connection credential, from Settings → AI Connections or from the
        OAuth flow. Checked against `mcp_connections` — **not** against
        `tokens`, which is a separate credential store for scrobble clients.

        Used by `POST /mcp` and nothing else. A 401 from that endpoint carries
        `WWW-Authenticate` with a `resource_metadata` pointer, which is how a
        client discovers the authorization server.

    sessionCookie:
      type: apiKey
      in: cookie
      name: td_session
      description: |
        Set by `POST /api/v1/auth/login`. `HttpOnly`, `SameSite=Lax`, and
        `Secure` when the instance can tell the browser used HTTPS (derived
        from `X-Forwarded-Proto`, and only trusted when `trust_proxy` is set —
        behind a tunnel the origin sees plain HTTP while the client is on TLS).
        Expires hard at 7 days with no sliding renewal.
    apiToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Authorization: Token <token>`. What the token reaches depends on its
        scopes — see the description at the top of this document. Lowercase
        `token ` is also accepted.
    metricsBearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer $TAPEDECK_METRICS_TOKEN`, for `GET /metrics`
        only. An admin session also works. Never open.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 50 }
      description: Page size.
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Rows to skip.
    StatsRange:
      name: range
      in: query
      description: Time window. Bucketed in the user's own timezone, not UTC.
      schema:
        type: string
        enum: [d7, month, year, all]
        default: all

  responses:
    Unauthorized:
      description: |
        No valid session cookie or token. Also returned when a *token* is
        presented to a session-only endpoint — the endpoint does not accept
        tokens at all, so the scope is irrelevant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 401, error: "Authentication required. Log in to access this endpoint." }
    Forbidden:
      description: |
        Authenticated, but not permitted. Either the token lacks the required
        scope, or the endpoint needs the admin role. Deliberately not a 401 —
        re-authenticating will not help.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, error: "This token does not have the 'write' scope" }
    NotFound:
      description: No such resource, or it belongs to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed or rejected input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Every error body in the API has this shape.
      required: [code, error]
      properties:
        code:
          type: integer
          description: Mirrors the HTTP status.
        error:
          type: string
          description: Human-readable. Not a stable identifier — do not branch on it.

    Ok:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    TapedeckAudio:
      type: object
      description: |
        How the audio actually sounded, as a **submitting client** reports it in
        `additional_info.tapedeck_audio`. Every field is optional; a plugin that
        can see its decoder reports most, a bare scrobble client none.

        This is the write-side shape. A stored listen carries the same
        information **flat** on the `Listen` object rather than nested — see
        there.
      properties:
        format_type:
          type: string
          description: '`pcm`, `dsd`, or `mqa`. Not the codec.'
        codec:
          type: string
          description: |
            The codec as your decoder names it — `flac`, `mp3`, `dsd_lsbf_planar`.
            Tapedeck matches DSD and PCM by **prefix**, so ffmpeg's per-ordering
            and per-sample-format spellings all classify correctly.
        bitrate: { type: integer, description: kbps. }
        sample_rate: { type: integer, description: Hz. }
        bit_depth: { type: integer }
        channels: { type: integer }
        container: { type: string, description: 'The file container, e.g. `ogg`, `m4a`.' }
        is_lossless: { type: boolean }
        source_quality:
          type: string
          description: What the source claims to be, where that differs from what was measured.
        dsd_rate: { type: integer, description: Hz. }
        dsd_multiplier:
          type: integer
          description: |
            64, 128, 256… Derived from `dsd_rate` when absent, and left unset
            rather than guessed when the rate is not a real DSD multiple.
        dsd_to_pcm_converted:
          type: boolean
          description: |
            Usually derived from the signal chain rather than reported. SACD's
            DSD layer cannot leave a player over coax or optical, so nothing
            downstream will ever tell you this directly.
        is_transcoded: { type: boolean }
        delivery_codec:
          type: string
          description: |
            Set **only** when the audio was genuinely transcoded. Remuxing a
            container without touching the audio is not a transcode, nor is a
            video transcode that left the audio alone. Scoring docks points
            whenever this is set, so filling it on a direct play quietly
            penalises the best listens on the system.
        delivery_bitrate: { type: integer, description: kbps. }
        delivery_sample_rate: { type: integer, description: Hz. }
        delivery_bit_depth: { type: integer }
        transcode_reason: { type: string }

    Listen:
      type: object
      description: |
        A stored listen, exactly as `ScrobbleRecord` serialises it. The quality
        columns are **flat**, not nested under a `quality` object — the frontend
        reads them raw so its own `qualityLabel()` produces the same tag
        everywhere, and a server-side copy of that logic would drift.

        Extra keys may appear; ignore what you do not know.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        title: { type: string }
        artist:
          type: string
          description: |
            The primary artist. Everyone credited lives in `scrobble_artists`
            and is what the artist pages and charts aggregate over, so a listen
            crediting a soloist appears under both names there while this field
            still names the one the record is filed under.
        album: { type: [string, 'null'] }
        company:
          type: [string, 'null']
          description: |
            Who this was heard with, as names. Filled automatically for a
            listen that happened inside a Shared Spool, and by hand via
            `POST /api/v1/scrobbles/bulk-company` otherwise.

            **`null` means unmarked, not alone.** Nobody recorded who was
            there — which is true of every listen predating the field. Counting
            marked listens is exact; reporting a *share* of listening that was
            solitary is not, and would be a fact about how much has been marked.
        joint_session_id:
          type: [string, 'null']
          description: |
            The Shared Spool this listen belonged to, as the spool's uuid. A
            joint listen is N rows across N decks sharing this — never one row
            with several owners. Only a sitting ever sets it; a hand edit
            cannot, because only a sitting can know it.
        timestamp:
          type: integer
          description: Unix seconds, UTC, **start** of play.
        duration: { type: [integer, 'null'], description: Seconds. }
        track_number: { type: [integer, 'null'] }
        source_name: { type: string, description: 'Plex, Jellyfin, Navidrome, `ingest:<client>`, Import…' }
        source_id: { type: string, description: Dedup key. Unique per user per play. }
        source_ref: { type: [integer, 'null'], description: The `user_sources` row this was polled from. }
        status:
          type: string
          enum: [pending, synced, imported]
          description: |
            `pending` is queued for forwarding, `synced` has been forwarded, and
            `imported` is stored only and will never be forwarded. Both an
            import and a skip land as `imported` — forwarding either would put a
            wrong scrobble on a permanent public record.

            There is no `sent` and no `failed`; those were documented and never
            written. A delivery that fails stays `pending` and is retried, and
            which sinks it has already reached is in `delivered_sinks` — that is
            what stops a partial failure double-scrobbling.
        delivered_sinks:
          type: [string, 'null']
          description: |
            JSON array of the sinks this has already reached, so a retry only
            hits the ones that have not. A string, not an array.
        submission_client: { type: [string, 'null'] }
        listening_context: { type: [string, 'null'], description: From the resolved chain. }
        mbid_recording: { type: [string, 'null'] }
        mbid_release: { type: [string, 'null'] }
        mbid_artist:
          type: [string, 'null']
          description: |
            A **JSON-encoded array**, not an array — the column stores what was
            written to it. Parse it before use.
        mbid_release_group:
          type: [string, 'null']
          description: |
            The release group, which is what relates a reissue, a remaster and a
            regional edition to one another. Filled from a submitting client's
            `additional_info`, a ListenBrainz export's `mbid_mapping`, or a
            Jellyfin/Emby session — never by a lookup.
        mbid_release_track:
          type: [string, 'null']
          description: |
            The track *on a particular release*, as distinct from the recording:
            the same recording is a different release-track on an album, a
            single and a compilation. Only a tagging client ever knows it.
        mbid_work:
          type: [string, 'null']
          description: |
            The composition rather than a performance of it — the identifier
            that relates every recording of one piece. Only a tagging client
            ever knows it.
        mbid_album_artist:
          type: [string, 'null']
          description: |
            A **JSON-encoded array**, like `mbid_artist`. Whoever the *record*
            is credited to, which on a compilation or a soundtrack is not the
            performer of the track.
        caa_id:
          type: [integer, 'null']
          description: |
            Cover Art Archive id. **`-1` is a tombstone** meaning "asked, no
            artwork exists" — treat any non-positive value as no artwork.
        caa_release_mbid: { type: [string, 'null'] }
        artwork_url:
          type: [string, 'null']
          description: |
            Empty string is a tombstone, same idea as `caa_id: -1`. This column
            alone is the artwork backfill's queue.
        device_id: { type: [integer, 'null'] }
        chain_id: { type: [integer, 'null'], description: Resolved signal chain. }
        session_id: { type: [integer, 'null'] }

        # ── How it sounded. Flat, and null for most of any real history:
        # these are only ever written by ingest and the session-shaped sources,
        # so an imported listen carries none of them. Any share computed over
        # them is a share of *that* population, not of the listening.
        format_type: { type: [string, 'null'], description: '`pcm`, `dsd`, `mqa`.' }
        codec: { type: [string, 'null'] }
        bitrate: { type: [integer, 'null'], description: kbps. }
        sample_rate: { type: [integer, 'null'], description: Hz. }
        bit_depth: { type: [integer, 'null'] }
        channels: { type: [integer, 'null'] }
        container: { type: [string, 'null'] }
        source_quality: { type: [string, 'null'] }
        is_lossless: { type: [boolean, 'null'] }
        dsd_rate: { type: [integer, 'null'], description: Hz. }
        dsd_multiplier: { type: [integer, 'null'] }
        dsd_to_pcm_converted: { type: [boolean, 'null'] }
        delivery_codec: { type: [string, 'null'], description: Set only on a genuine transcode. }
        delivery_bitrate: { type: [integer, 'null'], description: kbps. }
        delivery_sample_rate: { type: [integer, 'null'], description: Hz. }
        delivery_bit_depth: { type: [integer, 'null'] }
        is_transcoded: { type: [boolean, 'null'] }
        transcode_reason: { type: [string, 'null'] }
        quality_score:
          type: [number, 'null']
          description: |
            0–100, computed once at ingest and never recomputed. Null for
            anything imported, so an average over it has the same narrow
            population as the fields above.

        # ── What a pushing client saw of the playing itself. Null everywhere
        # else: a poll can report a playhead but not how much was heard.
        listened_ms:
          type: [integer, 'null']
          description: |
            Milliseconds actually heard, paused time excluded. What `skipped`
            cannot express — "cut short three seconds in" and "cut short with
            thirty seconds left" are opposite behaviours.
        is_shuffle: { type: [boolean, 'null'], description: Shuffle chose this, not the listener. }
        queue_source: { type: [string, 'null'], description: "What it played from, in the client's own words." }

    NowPlayingTrack:
      type: object
      description: |
        What is on the deck. **Not a `Listen`** — nothing here is persisted, so
        there is no id, no timestamp, no status and no `source_id`. It carries
        the quality fields a source could report plus the playhead.
      properties:
        title: { type: string }
        artist: { type: string }
        album: { type: [string, 'null'] }
        duration: { type: [integer, 'null'], description: Seconds. }
        progress:
          type: integer
          description: |
            Seconds in **as of `updated_at`**. Extrapolate from there rather
            than expecting a tick per second — but see `position_known` first,
            and stop extrapolating when `paused`.
        position_known:
          type: boolean
          description: |
            **False when `progress` is the server's own wall-clock arithmetic
            rather than a reported playhead.** A ListenBrainz `playing_now` has
            no position field in the format and Subsonic answers `minutesAgo`,
            so for those there is nothing to report and the number is a guess.
            Draw it as one. Plex, Jellyfin, Emby, Roon and the shelf report a
            real playhead, and so does any client sending `tapedeck_playback`.
        paused:
          type: boolean
          description: |
            Only a pushing client can know this — a poll that stops arriving is
            indistinguishable from a client that crashed — so it is false for
            every polled source. A paused entry holds its position rather than
            counting forward, and expires after ten minutes of silence.
        updated_at: { type: integer, description: Unix seconds when this was last reported. }
        source: { type: string, description: 'Plex, Roon, `ingest`, `physical`…' }
        listening_context: { type: [string, 'null'] }
        format_type: { type: [string, 'null'] }
        codec: { type: [string, 'null'] }
        bit_depth: { type: [integer, 'null'] }
        sample_rate: { type: [integer, 'null'] }
        dsd_multiplier: { type: [integer, 'null'] }
        dsd_to_pcm_converted: { type: [boolean, 'null'] }
        delivery_codec: { type: [string, 'null'] }
        is_lossless: { type: [boolean, 'null'] }

    SubmitListensResponse:
      type: object
      description: |
        Everything past `status` is a Tapedeck extension and purely additive —
        ListenBrainz clients branch on `status` alone, so the extra keys cannot
        break them. They exist because a batch submit was otherwise
        all-or-nothing from the client's side: "ok" said nothing about which
        listens were stored, which were already held, and which were malformed.
      properties:
        status: { type: string, example: ok }
        accepted: { type: integer, description: Newly stored. }
        duplicate:
          type: integer
          description: |
            **Singular.** Recognised as already held, by `source_id` or by the
            fuzzy window. Not an error — a client resending after a dropped
            connection is the normal way this happens. But a client whose every
            listen comes back here has a bug, which is why it is counted apart
            from `accepted` rather than folded in.
        rejected:
          type: array
          description: |
            Could not be stored and **must not be retried** — malformed client
            data, so resending changes nothing. Always present, empty when
            nothing was rejected; an absent key would be ambiguous.
          items: { $ref: '#/components/schemas/RejectedListen' }

    RejectedListen:
      type: object
      properties:
        index: { type: integer, description: Index into the submitted `payload`. }
        reason: { type: string }

    DryRunResponse:
      type: object
      description: The reply to `?dry_run` — what *would* have happened.
      properties:
        status: { type: string, example: ok }
        dry_run: { type: boolean, enum: [true] }
        listens:
          type: array
          items: { $ref: '#/components/schemas/DryRunListen' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/RejectedListen' }

    DryRunListen:
      type: object
      description: One listen's resolved state, computed and thrown away.
      properties:
        index: { type: integer, description: Index into the submitted `payload`. }
        artist: { type: string }
        title: { type: string }
        album: { type: [string, 'null'] }
        timestamp: { type: integer }
        quality_score:
          type: [number, 'null']
          description: |
            What your `tapedeck_audio` fields scored, 0–100 — the main thing
            worth getting right and otherwise invisible.
        chain_id: { type: [integer, 'null'] }
        chain_name: { type: [string, 'null'] }
        chain_source:
          type: string
          enum: [explicit, output_binding, token_default, device_default, none]
          description: |
            **Which rung of the ladder won.** The single most useful field here:
            a chain arriving from the wrong rung looks identical to one arriving
            from the right one, so without this a misconfiguration is invisible
            until someone reads their history months later.
        device_id: { type: [integer, 'null'] }
        listening_context: { type: [string, 'null'] }
        status_if_stored:
          type: string
          enum: [pending, imported]
          description: |
            `pending` will be forwarded onward; `imported` is stored only. The
            distinction a backfill has to get right, answered before it is too
            late to change.
        skipped: { type: boolean }
        duplicate:
          type: boolean
          description: Whether dedup would have swallowed it, checked read-only against the real rules.

    TapedeckPlayback:
      type: object
      description: |
        Where the playhead is, from a client that can actually see it.

        The ListenBrainz submission format carries no position, so a
        `playing_now` without this is wall-clock arithmetic from the moment you
        spoke — right until the listener pauses or seeks, wrong from then on,
        and reported as an estimate (`position_known: false`) rather than dressed
        up as a measurement. Send this and the deck shows a real position.

        A playhead sent here is believed **outright**, including a step
        backwards: a polled source's report may lag its player by a few seconds
        and is smoothed for it, but a client measuring at the instant it sends
        has no such lag, so a backward step is the listener seeking and you are
        the authority on that.
      properties:
        position_ms:
          type: [integer, string]
          description: Exact playhead at the moment of submission.
        state:
          type: string
          enum: [playing, paused]
          description: |
            Anything other than `paused` is read as playing, which is the safe
            way to fall: a wrongly-paused deck freezes and reads as broken.

            **Send `paused` when the listener pauses.** Without it the position
            counts forward through the pause while `position_known` asserts it
            is a measurement — a confident and completely wrong readout. A
            paused entry holds still and expires after ten minutes of silence,
            so a heartbeat keeps it alive and stopping altogether clears it.

    TapedeckDevice:
      type: object
      description: |
        What was playing it. Resolves to a `devices` row, which is rung 4 of the
        chain ladder — without it a listen from a client with no token default
        and no output binding gets no signal chain at all.
      properties:
        machine_id:
          type: string
          description: |
            **The key.** Stable per installation and never the display name,
            which the user edits — keying on a name re-registers the device as a
            new one the moment it is renamed. Nothing is recorded without this.
        player_name: { type: string }
        player_version: { type: string }
        platform: { type: string }
        output_device:
          type: string
          description: |
            What the audio came out of. Recorded whether or not it is mapped, so
            the UI can offer unmapped ones for one-tap assignment, and it drives
            rung 2 of the chain ladder.
        output_type: { type: string }
        interface: { type: string, description: 'USB, Bluetooth, analog… Preferred over `output_type`.' }

    TapedeckChain:
      type: object
      description: |
        Signal chain, rung 1 of the four-rung ladder: explicit name →
        output-device binding → the submitting token's `default_chain_id` → the
        source device's default. An unknown name resolves to no chain rather
        than erroring.

        Note this is an **object**. It was documented as a bare string until
        v0.66.0 and never was one.
      properties:
        chain_id:
          type: string
          description: |
            The chain's **name**, despite the field being called `chain_id` —
            a client knows what the user called it, not its row id. Use
            `?dry_run=1` to check it resolves.
        components:
          type: array
          items: { type: string }
          description: Accepted and not yet stored.

    TapedeckSession:
      type: object
      description: |
        What the client was doing when the track came up — specifically, whether
        the listener chose it.

        Two fields, where five were once accepted. The other three were
        deserialised and read by nothing, which is worse than absent: it costs a
        client author real work and returns silence. `volume_level` describes a
        slider rather than a listen, `skip_count` is derived from the listens
        themselves and does not reset when a client restarts, and a repeat that
        actually happened is already visible as two listens.
      properties:
        is_shuffle: { type: boolean, description: Shuffle chose this track rather than the listener. }
        queue_source:
          type: string
          description: |
            What it was played from — a playlist name, an album, a queue, radio.
            Free text: it is your vocabulary for your own containers and there
            is no shared one to normalise against.

    SubmitListen:
      type: object
      description: One listen in a ListenBrainz-shaped submission.
      required: [track_metadata]
      properties:
        listened_at:
          type: integer
          description: |
            Unix seconds, UTC. Required for `single`/`import`, and must be
            absent for `playing_now`.
        track_metadata:
          type: object
          required: [artist_name, track_name]
          properties:
            artist_name: { type: string }
            track_name: { type: string }
            release_name: { type: string }
            additional_info:
              type: object
              description: |
                LB's free-form bag. Tapedeck reads the standard MBID fields,
                `duration_ms`/`duration`, `tracknumber`, `submission_client`,
                and its own `tapedeck_*` extensions.
              additionalProperties: true
              properties:
                recording_mbid: { type: string }
                release_mbid: { type: string }
                release_group_mbid: { type: string }
                release_track_mbid: { type: string }
                work_mbid: { type: string }
                artist_mbids: { type: array, items: { type: string } }
                album_artist_mbids: { type: array, items: { type: string } }
                duration_ms: { type: integer }
                tracknumber:
                  type: [integer, string]
                  description: |
                    A number, or the string a tag reader hands over — `"7"` and
                    `"7/12"` both work. Anything that is neither (a vinyl `"A1"`,
                    a bool, an object) costs the track number only; the listen is
                    still stored.
                submission_client: { type: string }
                artist_names:
                  type: array
                  items: { type: string }
                  description: |
                    Everyone credited, where the client can separate them — the
                    only structured way to say "Bach *and* Hilary Hahn". All of
                    them are recorded and the artist pages and charts aggregate
                    over every one, so a soloist appears under their own name
                    rather than vanishing into the composer's.

                    Failing this, a **semicolon-separated** `artist_name` is
                    split on `;` and nothing else. `&` and `,` appear inside
                    real names — "Simon & Garfunkel", "Earth, Wind & Fire" — so
                    splitting on those would invent artists who do not exist.
                skipped:
                  type: boolean
                  description: |
                    The track was skipped rather than played through. Stored,
                    excluded from every count, and **never forwarded** — a
                    forwarded skip is a wrong scrobble on a permanent record.
                    Top level of `additional_info`; there is no
                    `tapedeck_skipped`.
                listened_ms:
                  type: [integer, string]
                  description: |
                    How much of the track was actually heard, in milliseconds,
                    with paused time excluded. This is what makes `skipped`
                    worth having: a bool cannot separate "skipped three seconds
                    in" from "skipped with thirty seconds left", and those are
                    opposite behaviours.
                tapedeck_playback:
                  $ref: '#/components/schemas/TapedeckPlayback'
                tapedeck_audio:
                  $ref: '#/components/schemas/TapedeckAudio'
                tapedeck_device:
                  $ref: '#/components/schemas/TapedeckDevice'
                tapedeck_chain:
                  $ref: '#/components/schemas/TapedeckChain'
                tapedeck_session:
                  $ref: '#/components/schemas/TapedeckSession'

    Chain:
      type: object
      description: |
        **There is no `is_default`.** This schema documented one until v0.115.1
        and the server has never served or accepted it — a client setting it on
        a create got a silent 201 and no effect. A chain is not default for
        anything by itself; *being the default* is a property of the thing
        pointing at it, and there are two: a **device**
        (`/api/v1/device-bindings`) and an **API token**, whose
        `default_chain_id` is rung 3 of the chain ladder and is reported by
        `GET /1/validate-token`. Read it there.

        Absent is not null here. `icon`, and a component's `equipment_id` and
        `since`, are **omitted entirely** when unset rather than sent as null —
        a strict deserialiser wants those optional, not nullable. `description`,
        `detail` and `status` really are present-and-null.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        icon:
          type: string
          description: |
            A name from the UI's `CHAIN_ICONS` set. **Omitted when unset**, not
            null. Unvalidated on purpose — an unknown value falls back to a
            generic mark rather than erroring, and rejecting a save because the
            front end learned a new icon first would be the worse failure.
        listening_context:
          type: string
          enum: [unknown, active, active-mobile, passive, background]
          description: |
            How you listen through this chain. **Attention, not company** — the
            two are orthogonal, and who you were with is `company` on the
            listen.
        is_active: { type: boolean }
        shared:
          type: boolean
          description: |
            *(since v0.76.1)* Whether this chain may be **named** to a deck
            patched into yours, and whether its listens reach the parts of Patch
            that have no patch behind them — the Instance tab, Discover, and
            Shared Spool captures. **Not the sharing unit** since v0.93.0: what
            a patched deck sees is `share_all_with_patched` on the profile.
        total_hours:
          type: number
          description: |
            Derived from the listens (`SUM(duration)` where `chain_id` matches
            and the listen is not a skip), never accumulated — so assigning a
            chain to an old listen moves the hours, and un-assigning takes them
            back. A source that reported no length contributes nothing, so this
            is a floor.
        created_at: { type: integer, description: Unix seconds. }
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Always written, so deleting the gear leaves the chain readable.
              type: { type: string, description: 'source, transport, dac, amp, transducer, network, …' }
              detail:
                type: [string, 'null']
                description: |
                  Free text about this step. Always present; null when there is
                  none. Guessed from the gear type when a step is first picked
                  and never re-applied, so an override sticks.
              equipment_id:
                type: integer
                description: |
                  The `equipment` row this step *is*, set when it was picked
                  from your gear. **Omitted** for free text — a chain can name
                  something you do not own.
              since:
                type: integer
                description: |
                  Unix seconds from which this box was in the path. **Omitted
                  means "for as long as the chain has existed"**, which is what
                  every step written before this field meant.

                  Chain and gear hours are derived from the listens, so without
                  it a box added to a chain that already has history is credited
                  with all of it. Stamped automatically on gear a chain did not
                  name before; send one to correct the date, or `null` to say it
                  was always there.

    Equipment:
      type: object
      description: |
        **The type field is `equipment_type` on the way out and `type` on the
        way in.** This schema said `type` in both directions until v0.115.1 and
        the response has never carried one. The asymmetry is real and is left
        as it is rather than broken: `POST`/`PATCH` take `type`, every read
        returns `equipment_type`.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        equipment_type: { type: string, description: 'dac, amp, transducer, cartridge, headshell, phono, turntable, tape-deck, transport, …' }
        brand: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        purchased_at:
          type: [integer, 'null']
          description: |
            When it was bought, unix seconds. Distinct from `first_used`, which
            is when Tapedeck first saw it — gear is usually owned for a while
            before anyone gets round to cataloguing it, and burn-in hours are
            counted from the purchase.
        first_used: { type: integer, description: 'When Tapedeck first saw it, unix seconds.' }
        last_used: { type: integer }
        status:
          type: [string, 'null']
          description: |
            Why this piece is not in a chain — `new`, `spare` or `lent`. Set
            from the Signal Chains page's "Not in a chain yet" table; null is
            the usual state and means nothing has been said. Free text: the UI
            owns the vocabulary.
        total_hours:
          type: number
          description: |
            Derived — summed from every chain referencing this gear, never
            accumulated. Free-text chain steps report zero, which is honest.
        sources:
          type: array
          description: |
            *(since v0.70.4)* What `total_hours` is made of, largest first.
            A total is a sum and a sum is not checkable on its own — and with a
            chain **variant** in play the listening genuinely arrives through a
            chain whose own components do not name this gear, which is when a
            bare figure stops being verifiable. These are the same per-`(chain,
            variant)` seconds the hours are derived from, kept rather than
            discarded, so the parts always add to the whole.

            Empty for gear nothing has logged time through.
          items:
            type: object
            properties:
              chain_id: { type: integer }
              chain_name: { type: string }
              variant_id:
                type: [integer, 'null']
                description: Set when the gear was fitted as a *variant* of that chain.
              variant_name: { type: [string, 'null'] }
              hours: { type: number }

    NowPlaying:
      type: object
      description: |
        Never persisted. Held in memory only, so a restart correctly shows an
        empty deck until a source reports again.
      properties:
        playing: { type: boolean }
        position:
          type: [integer, 'null']
          description: |
            Seconds into the track. Read `track.position_known` before
            presenting this as a readout — for a source with no playhead it is
            the server's own wall-clock arithmetic, not a measurement.
        track:
          oneOf:
            - $ref: '#/components/schemas/NowPlayingTrack'
            - type: 'null'

    PublishSwitch:
      type: object
      description: The caller's own view of their public now-playing setting.
      properties:
        enabled: { type: boolean }
        fields:
          type: array
          description: The extra disclosures currently granted, in canonical order.
          items: { type: string, enum: [artwork, position, fidelity, gear] }
        known_fields:
          type: array
          description: |
            Every field this build knows how to publish. A client should render
            the toggles from this rather than a hardcoded list, so the two
            cannot drift.
          items: { type: string }
        path:
          type: string
          description: 'The public address, e.g. `/public/np/ashwin`. Built server-side so a settings screen cannot assemble a different one.'

    PublicNowPlaying:
      type: object
      description: |
        The public payload. Only `playing`, `user` and `name` are always
        present; `title`/`artist`/`album` appear whenever something is playing,
        and everything below that appears only if its owner opted into it.

        An absent field means "not published" **or** "the source did not know" —
        the two are not distinguished, and a client must not infer either.
      properties:
        playing: { type: boolean }
        user: { type: string, description: The username as asked for. }
        name: { type: [string, 'null'], description: Display name, when set. }
        title: { type: string }
        artist: { type: string }
        album: { type: [string, 'null'] }
        artwork:
          type: string
          description: 'Opt-in (`artwork`). A cover URL, resolved at most once per track.'
        position:
          type: integer
          description: 'Opt-in (`position`). Seconds in. Read `position_known` before drawing this as a measurement.'
        duration: { type: [integer, 'null'], description: 'Opt-in (`position`).' }
        position_known:
          type: boolean
          description: 'Opt-in (`position`). False when the number is the server''s own wall-clock arithmetic rather than a reported playhead.'
        paused: { type: boolean, description: 'Opt-in (`position`). Only a pushing source can know this.' }
        quality:
          type: object
          description: 'Opt-in (`fidelity`). Every member may be null — most of a history has no format at all.'
          properties:
            format: { type: [string, 'null'] }
            codec: { type: [string, 'null'] }
            bit_depth: { type: [integer, 'null'] }
            sample_rate: { type: [integer, 'null'] }
            dsd_multiplier: { type: [integer, 'null'] }
            lossless: { type: [boolean, 'null'] }
        chain:
          type: string
          description: |
            Opt-in (`gear`). The signal chain, and **only where the source
            actually chose one** — an ingest submission or a side off the shelf.
            A polled listen falls through to the device default, the coarsest
            rung of the ladder, and omits this rather than dressing a fallback
            up as a decision.
        context:
          type: string
          description: 'Opt-in (`gear`). The listening context, or the medium for a shelf play.'

    Note:
      type: object
      description: |
        A liner note. Hangs off **exactly one** of an entity, a listen, or a
        report period — a CHECK constraint enforces it.

        The three answer different questions: what you think of a record, what
        one particular playing of it was like, and what a week or a month of
        listening was like.

        A period target is a `<unit>:<key>` string using the same key the
        Reports page names its own periods with (`month:2026-08`,
        `week:2026-W32`, `year:2026`). It is text rather than a foreign key
        because a period is not a row anywhere — reports are folded out of the
        history on every request. Report weeks deliberately ignore the user's
        week-start preference, which is what makes the key stable enough to
        write a note against.
      properties:
        id: { type: integer }
        entity_id: { type: [integer, 'null'] }
        scrobble_id: { type: [integer, 'null'] }
        period:
          type: [object, 'null']
          description: Echoed back split, since naming a period needs its unit.
          properties:
            unit: { type: string, enum: [week, month, year] }
            key: { type: string, description: '`2026`, `2026-08` or `2026-W32`.' }
        body: { type: string, description: Markdown, as stored. }
        body_html:
          type: string
          description: |
            Rendered and sanitised server-side, with shortcodes resolved. Safe
            to inject. An unresolved shortcode renders as dotted-underline text
            (`.td-unresolved`), never an error.
        visibility:
          type: string
          enum: [private, patched, public]
          description: |
            Stored, but **every read path is still self-only**. `public` becomes
            meaningful when the social phase lands, not now.
        created_at: { type: integer }
        updated_at: { type: integer }

    Entity:
      type: object
      description: |
        An artist, release or recording you have annotated or loved. MBIDs are
        an alias, never the key — most of a library is un-enriched and those are
        exactly the records worth annotating.
      properties:
        id: { type: integer }
        kind: { type: string, enum: [artist, release, recording] }
        name: { type: string }
        artist_name: { type: [string, 'null'] }
        mbid: { type: [string, 'null'] }

    NeighbourGenre:
      type: object
      description: |
        A genre bordering your listening. **`your_artists` and
        `exemplar_artists` are never both populated** — that separation is the
        vision rule made structural, so nothing can present an Every Noise
        exemplar as something the listener owns.
      properties:
        name: { type: string }
        x: { type: number }
        y: { type: number }
        color: { type: string }
        borders: { type: integer, description: How many of your top genres border it. }
        affinity:
          type: number
          description: '`plays / sqrt(rank + 1)`, summed. Weights by your play counts and discounts by Every Noise''s own neighbour rank.'
        your_plays: { type: integer }
        your_artists:
          type: array
          description: From **your own history**. Empty is what puts a genre in `unexplored`.
          items:
            type: object
            properties:
              artist: { type: string }
              plays: { type: integer }
        exemplar_artists:
          type: array
          description: |
            **Every Noise's exemplars — not your music.** Set only where
            `your_artists` is empty. Requires a tier-2 scrape; empty otherwise.
          items: { type: string }

    Love:
      type: object
      properties:
        entity_id: { type: integer }
        entity_key:
          type: string
          description: |
            `kind|artist|name`, trimmed and lowercased; an artist's `artist`
            half is empty. The client derives this to fill hearts without one
            request per row. Must stay in step with the server's `entity_key`.
        kind: { type: string, enum: [artist, release, recording] }
        name: { type: string }
        artist: { type: [string, 'null'] }
        loved_at: { type: integer, description: Unix seconds. }
        plays: { type: integer, description: 'Your plays of this thing. 0 when the entity exists only because it was annotated.' }
        last_played: { type: [integer, 'null'] }
        album: { type: [string, 'null'], description: 'For a recording, the record it sits on. Null for an artist.' }
        artwork_url: { type: [string, 'null'], description: 'From the most recent listen of it; an artist gets their portrait instead.' }
        caa_id: { type: [integer, 'null'] }
        caa_release_mbid: { type: [string, 'null'] }
        note_id: { type: [integer, 'null'], description: 'The liner note on this entity, if there is one.' }
        note_excerpt: { type: [string, 'null'], description: 'First ~90 characters of that note.' }

    McpConnection:
      type: object
      description: |
        A standing grant to an AI assistant. Deliberately not a row in `tokens`:
        `tokens.scopes` treats `all` as a wildcard (so an existing token would
        gain this reach from an upgrade), an OAuth credential expires and
        refreshes where a token does not, and revoking "the assistant I
        connected last month" should not mean reading past six players.
      properties:
        id: { type: integer }
        name: { type: string }
        scopes:
          type: string
          description: |
            Space-separated. **No wildcard** — a consent screen names what it is
            granting, and "everything, including whatever is added later" is not
            something a person can consent to.
        client_id: { type: [string, 'null'], description: 'Set when the grant came through OAuth.' }
        created_at: { type: integer }
        last_used_at: { type: [integer, 'null'] }
        expires_at:
          type: [integer, 'null']
          description: Null for a connection created by hand — those do not expire.
        calls: { type: integer, description: How many calls it has made, ever. }

    McpAuditCall:
      type: object
      properties:
        id: { type: integer }
        at: { type: integer }
        method: { type: string, description: 'The JSON-RPC method — `tools/call`, `resources/read`.' }
        tool: { type: [string, 'null'], description: 'The tool, resource URI or prompt name.' }
        args: { type: [string, 'null'], description: 'The arguments, truncated to 500 characters. A record of what was asked, not a copy of it.' }
        ok: { type: boolean }
        rows_returned:
          type: [integer, 'null']
          description: |
            How much data left the building. Null where the answer was not a
            list. The interesting column — a tool that answered with 12 rows and
            one that answered with 20,000 are different events however identical
            the call looks.
        ms: { type: [integer, 'null'] }
        connection_name: { type: [string, 'null'] }

    SavedPlaylist:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        origin:
          type: string
          description: '`user`, or the name of the MCP connection that wrote it.'
        created_at: { type: integer }
        updated_at: { type: integer }
        pushed_at: { type: [integer, 'null'] }
        pushed_to: { type: [string, 'null'] }
        connection_name: { type: [string, 'null'] }
        tracks: { type: integer }

    NewCrateEntry:
      type: object
      required: [kind, artist, because]
      properties:
        kind: { type: string, enum: [artist, album, track] }
        artist: { type: string }
        name: { type: [string, 'null'], description: 'Album or track title. Omitted for an artist, whose name is already in `artist`.' }
        mbid: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: Why you would like it, in the suggester's words. }
        because:
          type: string
          description: |
            **Required.** What in *your own* listening prompted the suggestion.
            A recommendation with no grounding in the history is free
            association, and is refused.
        from:
          type: string
          description: |
            Optional. The **username of a deck you are patched into** — the
            Reel's "into my crate" button. Resolved and checked server-side,
            and a deck you cannot read is a **403**: the Crate groups by origin
            and shows "suggested by X", so a client writing that string itself
            would be asserting a provenance rather than earning one. The patch
            must point *from* you *to* them; somebody who follows you has told
            you nothing. Omit it for something you found yourself, which files
            under the origin `user`.

    CrateEntry:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [artist, album, track] }
        artist: { type: string }
        name: { type: [string, 'null'] }
        mbid: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        because: { type: [string, 'null'] }
        origin: { type: string, description: '`user`, or the name of the connection that suggested it.' }
        status: { type: string, enum: [open, acquired, dismissed] }
        created_at: { type: integer }
        acted_at: { type: [integer, 'null'] }
        first_played_at:
          type: [integer, 'null']
          description: |
            When this first turned up in the listening history, if it ever did.
            **Derived from the listens, not stored** — the same rule chain and
            gear hours follow, because an accumulator nothing recomputes drifts
            from what it summarises.
        plays: { type: integer }

    SavedPlaylistTrack:
      type: object
      description: |
        Names, not ids. This is the shape `playlists::pick` resolves against a
        real library at push time, and the only shape that survives the user not
        owning the track on every server they have.
      required: [title, artist]
      properties:
        title: { type: string }
        artist: { type: string }
        album: { type: [string, 'null'], description: 'A tiebreaker at push time, never a requirement.' }
        note: { type: [string, 'null'], description: 'Why this track is here, in the words of whatever chose it. Never generated by Tapedeck.' }

paths:

  # ── Ops ────────────────────────────────────────────────────────────────────
  /api/openapi.yaml:
    get:
      tags: [Ops]
      summary: This document.
      description: |
        Unauthenticated by design — it describes the shape of the API, not any
        data, and a client needs to read it *before* it has a credential.

        Served from the binary because it is the one thing a separately hosted
        docs site cannot do: describe **this** instance at **this** version. For
        a self-hosted app that beats any version dropdown — ask your own server
        what it supports rather than guessing.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml: { schema: { type: string } }

  /health:
    get:
      tags: [Ops]
      summary: Liveness and database reachability.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  database: { type: string }
                  version: { type: string }
                  replica:
                    type: boolean
                    description: |
                      Whether this instance is a **replica** — a full copy that
                      forwards no listens, publishes no actor and makes no
                      MusicBrainz request. A staging instance restored from a
                      production snapshot is byte-identical on every other
                      screen, so this is the only thing that tells them apart.
                      Always present; its absence means a binary older than
                      0.109.0.
              example:
                { status: ok, service: tapedeck, database: ok, version: 0.109.0, replica: false }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics.
      description: |
        Never open — an **admin** session, or `Authorization: Bearer
        $TAPEDECK_METRICS_TOKEN`. The metrics that matter are the per-job import
        gauges and `process_resident_memory_bytes` (Linux only), which is what
        distinguishes a stall from a slowdown from an OOM on a small host.
      security:
        - sessionCookie: []
        - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /log-level:
    get:
      tags: [Ops]
      summary: Current tracing filter.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { level: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ops]
      summary: Change the tracing filter at runtime.
      description: Swaps the live `EnvFilter`. No restart, no config edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string, example: 'tapedeck=debug,info' }
      responses:
        '200': { description: Applied., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Auth ───────────────────────────────────────────────────────────────────
  /api/v1/auth/status:
    get:
      tags: [Auth]
      summary: Whether anyone is signed in, and whether this instance needs setup.
      description: The SPA's gate. The only unauthenticated read in the API.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  is_admin: { type: boolean }
                  needs_setup:
                    type: boolean
                    description: True until the first admin exists. There is no self-registration.

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      summary: Create the first admin account.
      description: |
        First run only — refused once any user exists. Returns a session cookie
        **and** an API token, the latter shown exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
      responses:
        '200':
          description: Created. Sets `td_session`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  token: { type: string, description: Shown once, never again. }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Already set up. }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in.
      description: |
        Sets the `td_session` cookie. Rate limited on repeated failure.

        **This is the mobile flow.** Post credentials once, then mint a named
        token and store that — the cookie expires hard at 7 days with no sliding
        renewal, and cannot be revoked per device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in. Sets `td_session`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  is_admin: { type: boolean }
        '401': { description: Bad credentials, or the account is disabled. }
        '429': { description: Too many attempts. }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out.
      description: |
        Clears the session. The clear cookie carries identical attributes to the
        one that was set — mismatched attributes make logout silently fail.
      responses:
        '200': { description: Signed out., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  username: { type: string }
                  display_name: { type: [string, 'null'] }
                  is_admin: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── ListenBrainz-compatible ────────────────────────────────────────────────
  /1/submit-listens:
    post:
      tags: [ListenBrainz]
      summary: Submit listens.
      description: |
        Accepts a session cookie or any valid token — this is the one endpoint a
        `submit`-scoped token reaches.

        **`listen_type` decides forwarding**, and getting it wrong rewrites
        someone's permanent public history. `single` and `playing_now` are live
        and will be forwarded.

        `import` is stored only and **not** forwarded *(since v0.26 — before
        that, an import was forwarded like a live listen)* — unless the token
        used to submit it is marked **`imports_are_live`**, which exists because
        some players label every scrobble `import` and nothing on the wire
        distinguishes that from a backfill. Even then two gates apply and both
        must pass:

        * the listen is **no more than 24h old**, so a genuine history import
          from the same client still stays local; and
        * its timestamp is **no more than 1h in the future**, so ordinary clock
          skew is tolerated but a broken clock cannot park a scrobble years
          ahead of everything else.

        The flag is per token and invisible from the client side, which is why
        `GET /1/validate-token` reports it — read it there rather than guessing
        from whether listens appear at the far end.

        Dedup is on `(user_id, source_id, source_name)` plus a fuzzy window, so
        re-sending the same listen is safe. Max 1000 listens per request.

        `additional_info` is free-form and **no field in it can fail a
        submission**: an unusable value costs that field and the listen is still
        stored. Unknown keys are ignored.
      security:
        - apiToken: []
        - sessionCookie: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: string }
          description: |
            Resolve everything, **store nothing and forward nothing**, and
            report what would have happened. `1`, `true`, `yes`, `on` and a bare
            `?dry_run` all count.

            This is the endpoint to point a client at while it is being set up:
            it names the winning rung of the chain ladder, the quality score
            your fields produced, whether the listen would be forwarded or
            stored only, and whether dedup would swallow it — none of which is
            visible from a successful submit. The preview and the real path
            share one implementation, so it cannot promise something the real
            path would not do.

            Note it is genuinely read-only: a dry run looks a device up rather
            than upserting it, because asking what would happen must not itself
            be a listen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listen_type, payload]
              properties:
                listen_type:
                  type: string
                  enum: [single, playing_now, import]
                payload:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/SubmitListen' }
      responses:
        '200':
          description: |
            Accepted, or — with `?dry_run` — resolved and discarded. Per-listen
            results are reported rather than the whole batch failing: one bad
            row must not lose the other 999.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SubmitListensResponse'
                  - $ref: '#/components/schemas/DryRunResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: |
            One or more listens could not be stored. **Retryable** — resend the
            batch; dedup makes that safe. Distinct from `rejected`, which is the
            do-not-retry list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /1/validate-token:
    get:
      tags: [ListenBrainz]
      summary: Check a token, and ask what it may do.
      description: |
        An invalid token is **`200 {valid:false}`, never 401** — LB clients read
        the field, and a 401 sends them into a refresh loop.

        The token may arrive in the `Authorization` header **or** as `?token=`.

        Everything past `user_name` is Tapedeck introspection, and it is
        additive: real ListenBrainz clients branch on `valid` alone, so the
        extra keys cannot break them, and putting them here rather than on a
        second endpoint costs no extra round trip. They let a settings screen
        say what this token can do instead of choosing between hiding features
        that might work and offering features that 403 at the moment of use.

        They appear **only when `valid` is true.** This endpoint answers whoever
        asks, so reporting the build beside `valid: false` would hand it to
        anyone guessing at tokens.

        Note this reports the grants themselves, never any of the user's data.
        It widens nothing: `submit` still reaches only this endpoint and
        `submit-listens`.
      security:
        - apiToken: []
      responses:
        '200':
          description: Always 200, valid or not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  valid: { type: boolean }
                  user_name: { type: [string, 'null'] }
                  scopes:
                    type: array
                    items: { type: string, enum: [submit, read, write] }
                    description: |
                      As granted, with `all` expanded. Valid only when `valid`.
                      Matching is exact and **none implies another** — `submit`
                      does not carry `read`, and `write` does not carry `read`.
                  default_chain_id:
                    type: [integer, 'null']
                    description: |
                      Rung 3 of the chain ladder. Show the user which chain
                      their listens will be attributed to rather than leaving
                      them to find out from their history.
                  imports_are_live:
                    type: boolean
                    description: |
                      Whether this token's `listen_type: "import"` submissions
                      are relayed onward — see `POST /1/submit-listens` for the
                      two gates that still apply. Invisible from the client side
                      and silent in its absence, which matters most for players
                      that label every scrobble `import`.
                  server_version:
                    type: string
                    description: |
                      So a client shipped against one version can tell which
                      extensions this instance understands without parsing this
                      document to find out.

  /1/user/{user}/listens:
    get:
      tags: [ListenBrainz]
      summary: A user's listens, LB-shaped.
      description: |
        **Scoped to the caller.** LB serves this publicly; a self-hosted
        instance must not, so asking for another user's listens is refused.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
        - { name: count, in: query, schema: { type: integer, default: 25 } }
        - { name: min_ts, in: query, schema: { type: integer } }
        - { name: max_ts, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      count: { type: integer }
                      user_id: { type: string }
                      listens: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/playing-now:
    get:
      tags: [ListenBrainz]
      summary: What is on the deck, LB-shaped.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK. `count` is 0 when nothing is playing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      count: { type: integer }
                      playing_now: { type: boolean }
                      listens: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/listen-count:
    get:
      tags: [ListenBrainz]
      summary: Total listens. Excludes skips.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload: { type: object, properties: { count: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/user/{user}/services:
    get:
      tags: [ListenBrainz]
      summary: Connected forwarding services.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  services: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /1/playing-now/delete:
    post:
      tags: [ListenBrainz]
      summary: Clear the caller's now-playing entry.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /1/latest-import:
    get:
      tags: [ListenBrainz]
      summary: Timestamp of the caller's most recent import.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      parameters:
        - { name: user_name, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  musicbrainz_id: { type: string }
                  latest_import: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ListenBrainz]
      summary: Record an import high-water mark.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ts]
              properties: { ts: { type: integer } }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Pairing ────────────────────────────────────────────────────────────────
  /1/pair/start:
    post:
      tags: [Pairing]
      summary: Begin device-code pairing.
      description: |
        Unauthenticated by design — the client has no credential yet. Returns a
        `device_code` to poll with and a short `user_code` for the human to type
        into Settings.

        Vocabulary echoes RFC 8628 because client authors have met that shape,
        but this is **not OAuth**: no client registration, no `client_id`, and
        the result is an ordinary Tapedeck token.

        The user code is eight characters and therefore guessable, so its safety
        is structural: a five-minute window, single use in both directions, rate
        limiting, and approval requiring a signed-in session.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name: { type: string, description: Shown to the user when approving. Name it per device. }
                scopes: { type: string, description: 'Space-separated, e.g. "submit read".' }
      responses:
        '200':
          description: Pairing started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  expires_in: { type: integer, description: Seconds. Five minutes. }
                  interval: { type: integer, description: Minimum seconds between polls. }
        '429': { description: Rate limited. }

  /1/pair/poll:
    post:
      tags: [Pairing]
      summary: Poll for approval.
      description: |
        Returns `authorization_pending` until approved, then the token **once** —
        it is deleted from the request the moment it is collected. Expired and
        unknown device codes are reported identically, so polling cannot be used
        to learn whether a code was ever real.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties: { device_code: { type: string } }
      responses:
        '200':
          description: Approved. The token is in this body and nowhere else.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user_name: { type: string }
        '400':
          description: '`authorization_pending`, `expired_token`, or an unknown code.'
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string, enum: [authorization_pending, expired_token] } }
        '429': { description: Polling too fast. }

  /api/v1/pair/{user_code}:
    get:
      tags: [Pairing]
      summary: Describe a pending pairing, for the approval screen.
      description: Requires a signed-in session — this is the browser half.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_name: { type: string }
                  scopes: { type: string }
                  can_read: { type: boolean }
                  approved: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pair/{user_code}/approve:
    post:
      tags: [Pairing]
      summary: Approve a pairing request.
      description: |
        Session-only, and single use — approving twice mints nothing the second
        time. **The token is never in this response**; it goes to the polling
        client. A live credential in a second place is how it ends up in a
        screenshot.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_chain_id: { type: [integer, 'null'] }
      responses:
        '200': { description: Approved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ── Listens ────────────────────────────────────────────────────────────────
  /api/v1/scrobbles:
    get:
      tags: [Listens]
      summary: The listen history.
      description: 'Scope: `read` *(since v0.39)*. Newest first. Filterable.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: artist, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: track, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer }, description: Only listens at or after this Unix timestamp. }
        - { name: before, in: query, schema: { type: integer }, description: Only listens at or before this Unix timestamp. }
        - name: social
          in: query
          schema: { type: boolean }
          description: |
            `true` for listens marked as heard in company, `false` for the
            rest. **Omit for everything** — and note the two halves are not
            "with people" and "alone": an unmarked listen means nobody
            recorded who was there, never that the listener was definitely
            alone. Most of any history predates the marking existing, so a
            share of solitary listening cannot be derived from this.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scrobbles: { type: array, items: { $ref: '#/components/schemas/Listen' } }
                  count: { type: integer, description: Total matching, not the page size. }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Listens]
      summary: Delete the caller's entire history.
      description: |
        **Session-only and irreversible.** Deliberately not reachable with a
        `write` token — this is the one listen operation where a lost phone
        would be unrecoverable. Clears listen-attached notes first, since
        foreign keys are enforced.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/scrobbles/{id}:
    patch:
      tags: [Listens]
      summary: Edit a listen.
      description: 'Scope: `write` *(since v0.39)*. Only the caller''s own rows.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Omitted fields are left alone.

                **This schema was wrong for several releases** and is corrected
                here: it documented `chain_id` and `timestamp`, neither of which
                this handler has ever accepted — the chain is `signal_chain_id`,
                and a listen's timestamp is not editable. Same class of drift as
                the one that made `bulk-chain` silently destructive, and the
                path-drift test does not catch it because it only compares
                paths.
              properties:
                title: { type: string }
                artist: { type: string }
                album: { type: string }
                mbid_recording: { type: string }
                mbid_release:
                  type: string
                  description: Also clears the resolved artwork, so the cover is re-fetched for the release you actually meant.
                signal_chain_id: { type: integer }
                chain_variant_id:
                  type: integer
                  description: |
                    Which setup of that chain was fitted. Only meaningful
                    alongside `signal_chain_id`, and the variant is **rewritten
                    whenever the chain is set** — a listen moved between chains
                    never keeps a setup belonging to the old one. Must belong to
                    `signal_chain_id`, or `400`.
                listening_context: { type: string }
                format_type: { type: string }
                codec: { type: string }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Listens]
      summary: Delete one listen.
      description: 'Scope: `write` *(since v0.39)*. Clears attached notes first.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scrobbles/{id}/annotations:
    get:
      tags: [Listens, Notes]
      summary: Notes and loves attached to one listen.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { oneOf: [{ $ref: '#/components/schemas/Note' }, { type: 'null' }] }
                  loves: { type: array, items: { $ref: '#/components/schemas/Love' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/scrobbles/bulk-time:
    post:
      tags: [Listens]
      summary: Move listens in time.
      description: |
        **An offset over a selection, not an absolute time**, and that is the
        design rather than a limitation. A timestamp is almost never wrong on
        its own: a clock was out by an hour, an evening was reconstructed from
        times laid out by arithmetic, or a capture arrived carrying somebody
        else's clock. Every one of those moves a *run* of listens by a
        *constant*, and a constant cannot scramble an ordering the way a set of
        hand-typed times can. Correcting a single listen is this operation over
        one id — subtract to get the offset.

        Where the listen has not been accepted yet,
        `PATCH /api/v1/patch/captures/{id}` is the cheaper place to do it:
        nothing is in a history there, so none of the consequences below apply.

        What it takes care of:

        * **`timestamp_original` is written once**, so a second correction does
          not overwrite the observation the first one replaced.
        * **Nothing is moved on top of another listen of the same track.** Dedup
          runs at ingest and never again, so a duplicate created here is one
          nothing will ever reconcile. Such a listen is skipped and is not
          counted in `moved`.
        * **Sessions are recomputed** — their aggregates, not their grouping.

        What it reports, because it cannot fix them:

        * `already_forwarded` — how many of the moved listens had already gone
          to Last.fm or ListenBrainz. **Neither has an edit API**, so their copy
          keeps the time it was sent with, permanently and silently. The edit is
          still right; a screen that did not say this would let somebody believe
          they had corrected a public record they had not.
        * `grouping_stale` — whether a moved listen now sits further from its
          session's neighbours than the gap those sessions were grouped by.
          Sessions are stored rather than computed, which is what lets a manual
          merge survive, and `sessions.uuid` is what a handed-over sitting
          points at — so re-grouping silently on a time edit would move an
          identity somebody else holds a reference to. Rebuild stays something
          the user asks for.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, offset_seconds]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                offset_seconds:
                  type: integer
                  description: |
                    Seconds to move by; negative moves earlier. Required — a
                    body that failed to say how far must not read as zero and
                    report success at having done nothing. Refused beyond a
                    year either way, which is almost always a
                    milliseconds-for-seconds slip.
      responses:
        '200':
          description: What moved, and what could not be reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: integer }
                  already_forwarded: { type: integer }
                  sessions_touched: { type: integer }
                  grouping_stale: { type: boolean }
        '400': { description: No ids, no offset, a zero offset, or one beyond a year. }
        '401': { description: Not signed in. }

  /api/v1/scrobbles/bulk-company:
    post:
      tags: [Listens]
      summary: Mark many listens as heard in company.
      description: |
        Session-only. Records **who you were listening with**, on the listens
        themselves.

        Marking is retroactive by design: nobody stops mid-record to note who
        is in the room. A Shared Spool fills the same column in automatically
        from its joined members; this is for the commoner case of somebody in
        the room who has no account on this instance, which is why it is free
        text rather than a list of users.

        **It is stored on the listen and not on the session**, which is not a
        preference — `POST /api/v1/sessions/rebuild` deletes every session row
        and re-inserts it, so anything held there is erased by a regroup with
        nothing to say so.

        `company` is required. Send an explicit `null` to unmark; an absent
        field is a `400`, for the reason `signal_chain_id` on
        `/api/v1/scrobbles/bulk-chain` is — this overwrites the field on every
        listen in `ids`, so a misspelled key must not deserialise into "clear
        it". An empty or whitespace-only string is treated as `null` rather
        than becoming a listen marked as heard with nobody.

        This never writes `joint_session_id`. That column says *this exact play
        happened on several decks at once*, which only a Shared Spool can know.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, company]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: The listens to mark. Scoped to the caller; ids belonging to anyone else match nothing.
                company:
                  type: [string, 'null']
                  maxLength: 200
                  description: Who they were heard with. Explicit `null` unmarks; omitting the field is an error, not an unmark.
      responses:
        '200':
          description: How many listens were changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        '400': { description: company was absent, or longer than 200 characters. }
        '401': { description: Not signed in. }

  /api/v1/scrobbles/bulk-chain:
    post:
      tags: [Listens, Chains]
      summary: Attribute many listens to one signal chain.
      description: |
        Session-only. Retro-attribution after adding gear — and since v0.46.0
        the chain's *hours* follow the listens, so doing this moves the usage
        numbers for listening you already have rather than only for future
        plays.

        **The field is `signal_chain_id`, and it is required.** This entry
        documented it as `chain_id` for several releases, alongside three
        parameters (`from`, `to`, `source_name`) the handler has never accepted
        — and the mismatch was silently destructive rather than an error: the
        body deserialised cleanly with the field missing, which meant "clear the
        chain", so a client following the spec wiped the attribution on every
        listen in `ids` and got `200 {"updated": N}` back. An absent field is a
        `400` now.

        Send an explicit `null` to clear. That case is real — it is how the
        History bulk edit removes a chain — which is why absent and null cannot
        be collapsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, signal_chain_id]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: The listens to reassign. Scoped to the caller; ids belonging to anyone else match nothing.
                signal_chain_id:
                  type: [integer, 'null']
                  description: The chain to attribute them to. Explicit `null` clears it; omitting the field is an error, not a clear.
                chain_variant_id:
                  type: [integer, 'null']
                  description: |
                    Which setup of that chain was fitted — two cartridges on one
                    turntable, the other IEMs on the same commute. Optional, and
                    **written either way**: a listen moved from one chain to
                    another never keeps a setup belonging to the old one, which
                    would pair it with components that were never fitted
                    together. Must belong to `signal_chain_id`, or `400`.
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/search:
    get:
      tags: [Listens]
      summary: Search your listens.
      description: |
        Session-only. Searches `scrobbles`, not `entities` — searching entities
        would only find records you had already been to.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: { type: array, items: { type: object, additionalProperties: true } }
                  albums: { type: array, items: { type: object, additionalProperties: true } }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tidal/settings:
    get:
      tags: [Connections]
      summary: The TIDAL app registration for this server.
      description: |
        **Admin only.** Never returns the credential itself, the same rule the
        Discogs pair and every source credential follow. `stored` and `from_env`
        are reported separately so the screen can say which is in effect rather
        than leaving an operator wondering why an exported variable is being
        ignored — a stored value wins.

        `redirect_uri` is the exact string TIDAL must have registered, derived
        from `PUBLIC_URL` so it is the same one the flow will actually send.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  stored: { type: boolean }
                  has_secret: { type: boolean }
                  from_env: { type: boolean }
                  redirect_uri: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }
    put:
      tags: [Connections]
      summary: Store the TIDAL app registration.
      description: |
        **Admin only.** Each field is written only when present, so saving one
        does not wipe the other; clearing is an explicit empty string. Stored
        encrypted at rest.

        **Changing the client id disconnects every account on the instance** —
        the stored tokens were issued by the old app and are meaningless to a
        new one, so keeping them would offer a connection that fails on the next
        push.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }

  /api/v1/tidal/status:
    get:
      tags: [Connections]
      summary: Whether TIDAL is configured and connected.
      description: |
        Session-only. `configured` is about the *instance* — whether the
        operator registered an app at developer.tidal.com and set
        `TAPEDECK_TIDAL_CLIENT_ID` — and `connected` is about this user. They are
        separate because an instance that cannot offer the button at all is a
        different thing from an account nobody has linked yet.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  connected: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tidal/connect:
    post:
      tags: [Connections]
      summary: Begin connecting a TIDAL account.
      description: |
        Session-only. Returns the URL to open. Authorization Code + PKCE with
        `S256`; the verifier is held in memory for ten minutes and the `state`
        token is single-use.

        Scopes asked for are the minimum a push needs — `playlists.write`,
        `playlists.read`, `search.read`, `user.read` — and no `collection.*` or
        `playback`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { description: TIDAL is not configured on this instance. }

  /api/v1/tidal/callback:
    get:
      tags: [Connections]
      summary: Where TIDAL sends the browser back.
      description: |
        **Takes no session.** The owner comes from the single-use `state` token
        minted at connect time, which is also the CSRF protection; requiring a
        cookie here would additionally depend on it surviving a cross-site
        navigation from `login.tidal.com`. Redirects to Settings either way —
        the user declining is a normal outcome, not an error.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '303': { description: Back to Settings. }
        '400': { description: The sign-in expired, was already used, or carried no code. }
        '502': { description: TIDAL refused the token exchange. }

  /api/v1/tidal/disconnect:
    delete:
      tags: [Connections]
      summary: Forget the connected TIDAL account.
      description: Session-only.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnected: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/skips:
    get:
      tags: [Listens]
      summary: Tracks you bailed out of.
      description: |
        Session-only. Skips are stored but excluded from every listening figure,
        so this is the only place they are readable.

        `listened_ms` is how far in the listener got, and is **null** when
        nothing measured a playhead — a polled server reports one, a submitting
        client often does not. `listened_fraction` is derived only when both the
        playhead and the running time are known, rather than estimated.

        `played_before` / `played_after` are the nearest real listens either
        side, which is the only context this application can honestly record for
        a skip. Both are null for a skip at the edge of a sitting. Nothing here
        says *why* a track was skipped and nothing should infer it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: Skips in the whole history. }
                  skips:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        artist: { type: string }
                        album: { type: string, nullable: true }
                        timestamp: { type: integer }
                        duration: { type: integer, nullable: true }
                        listened_ms: { type: integer, nullable: true }
                        listened_fraction: { type: number, nullable: true }
                        source: { type: string }
                        chain: { type: string, nullable: true }
                        played_before: { type: object, nullable: true, additionalProperties: true }
                        played_after: { type: object, nullable: true, additionalProperties: true }
                  most_skipped:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/now-playing:
    get:
      tags: [Listens]
      summary: What is on the deck.
      description: |
        Scope: `read`. In-memory only. Entries expire on read — past `duration`
        + 10s, or after 10 minutes when the source reported no duration.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NowPlaying' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/profile/public-now-playing:
    get:
      tags: [Listens]
      summary: The caller's publish switch for now-playing.
      description: |
        **Session-only.** A token gets 401 — the endpoint does not accept one at
        all, so scopes never enter into it. A scrobble client has no business
        deciding that its owner's listening is public.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishSwitch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Listens]
      summary: Turn public now-playing on or off.
      description: |
        **Session-only.** `enabled` is required — a body that merely misspelled
        the key must not be read as an answer either way, because getting this
        one wrong is published rather than merely wrong.

        `fields` names the *extra* disclosures beyond title/artist/album.
        Unknown names are dropped rather than rejected, so a newer client cannot
        make an older server fail; it can only fail to grant something.
        Omitting `fields` while enabling publishes the base payload alone.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                fields:
                  type: array
                  items: { type: string, enum: [artwork, position, fidelity, gear] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishSwitch' }
        '400': { description: '`enabled` was absent.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── The one public read path ────────────────────────────────────────────────
  /public/np/{username}:
    get:
      tags: [Listens]
      summary: What this person is listening to, if they publish it.
      description: |
        **Unauthenticated, and the only route on the instance that is.** It
        exists because a static site renders long before anyone visits it, so a
        live now-playing widget must be fetched from the reader's browser, where
        no credential of the owner's can safely go.

        Sends `Access-Control-Allow-Origin: *` and
        `Cache-Control: public, max-age=5`. A `GET` with no custom headers is a
        CORS simple request, so there is no preflight and no `OPTIONS`.

        **A username that does not exist and one that has not published return
        the same 404.** Anything that told them apart would make this a
        membership oracle for a private, invite-only instance.

        Everything past `title`/`artist`/`album` appears only if its owner
        ticked it — see the publish switch above. An absent field means "not
        published" or "not known"; the two are deliberately not distinguished.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: |
            The person publishes. `playing` is false when the deck is empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicNowPlaying' }
        '404':
          description: No such user, or they do not publish. Identical answers.


  # ── Patch (ActivityPub) ────────────────────────────────────────────────────
  /api/v1/profile/share-all:
    get:
      tags: [Patch]
      summary: Whether patched decks see all your listens.
      description: Session-only.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Patch]
      summary: Let patched decks see every listen, or only shared chains.
      description: |
        Session-only. **The third sharing switch, and it answers a third
        question.** `public_now_playing` decides whether a stranger may read
        the deck; `/profile/federation` decides whether this account can be
        *found*; this one decides how much a person you have already let in can
        see.


        **Off by default and off for every account that predates it.** A patch
        accepted under the old rule was accepted on the understanding that a
        listen through an unshared chain published nothing, and nobody consents
        to more by their operator upgrading a binary.


        On, a patched deck sees every listen — including those through chains
        you keep private and those with no chain at all — and the chain is
        named only where you share it, rendering as "Private signal chain"
        otherwise. It widens what a **patched** deck sees and nothing else: the
        Instance tab still counts shared-chain listens only, because a patch is
        consent to one person and there is no patch behind a figure the whole
        instance reads; and a Shared Spool still captures only through shared
        chains, because a capture enters somebody's history rather than merely
        being visible.


        `enabled` is required — a body that merely misspelled the key must not
        be read as an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }
        '400': { description: '`enabled` was absent.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/profile/federation:
    get:
      tags: [Patch]
      summary: Whether your deck answers to the fediverse.
      description: |
        Your own switch. Reports `enabled`, the `handle` other people would
        type, the `actor` URI once a keypair has been minted (`null` before
        that), the `would_be` URI it will get, and `frozen_at` — non-null once
        the username is load-bearing for another server.

        Reading this **does not mint a keypair**. Opening a settings page is not
        a decision to federate.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The switch and the identity it publishes.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. Tokens are not accepted here at all. }
    put:
      tags: [Patch]
      summary: Turn discoverability on or off.
      description: |
        **Session-only, permanently.** A token is held by a scrobble client, and
        no scrobble client has business deciding that its owner is findable on
        the fediverse — so a token gets 401 and scopes never enter into it, the
        same line `/api/v1/sources` and the password endpoints sit on.

        Switching on mints the RSA-2048 keypair then and there, so the screen
        can show the real actor URI rather than a promise.

        Switching off stops answering and **deletes nothing**. Destroying the
        keypair would destroy the identity: anyone already patched in holds a
        key that would never verify again, and switching back on would present
        them with a stranger wearing the same name.

        `enabled` is required. A body that merely misspelled the key is a 400,
        never a default — this is the one switch where guessing wrong publishes
        something.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The switch as it now stands.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: '`enabled` was absent.' }
        '401': { description: Not signed in. Tokens are not accepted here at all. }

  /users/{name}:
    get:
      tags: [Patch]
      summary: The actor document for a deck.
      description: |
        **Content-negotiated.** A caller whose `Accept` names
        `application/activity+json` or `application/ld+json` gets the actor
        document, served as `application/activity+json` — a server handed plain
        `application/json` is entitled to treat it as untyped JSON, with the
        result that the actor "does not exist" while this returns 200. Anything
        else that names `text/html` gets the SPA shell, because it is a person.
        A bare `*/*` gets the document.

        The document carries `publicKey`, `inbox`, `outbox`,
        `preferredUsername`, `name`, `type: Person` and
        `manuallyApprovesFollowers: true` — private by default, stated to the
        network rather than only enforced at home.

        **Three things are deliberately absent**, because advertising an
        endpoint that 404s is worse than not having it: `endpoints.sharedInbox`
        (there is no `POST /inbox`), and the `followers` / `following`
        collections (Step 2 serves those, when `patches` rows exist to fill
        them).

        The `id` is written once, when the keypair is minted, and never
        re-derived from today's `PUBLIC_URL` — recomputing it would silently
        rename an actor that remote servers have cached.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: |
            The actor document, or the SPA shell for a browser.
          content:
            application/activity+json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: |
            No such user, or they have not switched federation on. Identical
            answers — anything that told them apart would make this a membership
            oracle for a private, invite-only instance.

  /users/{name}/outbox:
    get:
      tags: [Patch]
      summary: An actor's public activities.
      description: |
        An `OrderedCollection`, **empty until outbound delivery exists** and
        served anyway: remote servers probe an outbox to decide whether an actor
        is real, and a 404 here reads as a broken actor rather than a quiet one.

        Only activities stored `visibility = 'public'` appear. That filter is in
        the query rather than in the handler because this collection is fetched
        with no credential at all — a private or patched-in activity reaching it
        is published to the internet, and nothing downstream would notice.

        No `first` / `next` paging yet. An empty collection has no page to point
        at, and inventing one would advertise a third endpoint that does not
        exist; paging arrives with delivery.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An OrderedCollection with `totalItems` and `orderedItems`.
          content:
            application/activity+json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: No such user, or not discoverable. Identical answers.

  /users/{name}/inbox:
    post:
      tags: [Patch]
      summary: Accept a signed delivery.
      description: |
        Verifies an HTTP signature and files the activity. **Nothing acts on
        what arrives yet** — Step 2 is what turns a pending `Follow` into a
        patch.

        Requires a draft-cavage `Signature:` header, `rsa-sha256`. The signature
        must cover `(request-target)`, `host` and `date`, plus `digest` whenever
        there is a body — checked *before* any cryptography, because a signature
        that verifies over the wrong set of headers is worse than none: it looks
        like it proved something. `Date` must be within five minutes.

        The signing key is fetched from the actor the `keyId` names and cached.
        A signature that fails against a cached key triggers exactly one
        refetch, which is what makes key rotation survivable.

        **The signature says who sent this; the activity's `actor` says who
        wrote it.** A delivery where they disagree is refused rather than filed
        under either — that disagreement is how an impersonated `Follow` or
        `Delete` gets in.

        An activity with no `id` is refused: it could not be deduplicated,
        referred to by a later `Undo`, or checked against a redelivery.

        `GET` and `DELETE` here are 405 — both belonged to older revisions of
        the protocol.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/activity+json:
            schema:
              type: object
              additionalProperties: true
              required: [id, type, actor]
      responses:
        '202':
          description: |
            Filed. Also the answer to a redelivery — senders retry, and
            reporting a duplicate as an error is what makes one retry harder.
        '400':
          description: Not JSON, or the activity names no `actor` or no `id`.
        '401':
          description: |
            Unsigned, stale, badly covered, the digest does not match the body,
            the signature does not verify, or the signing key does not belong to
            the actor the activity is attributed to. The message says which.
        '404':
          description: No such user, or not discoverable. Identical answers.

  /users/{name}/followers:
    get:
      tags: [Patch]
      summary: How many decks have patched into this one.
      description: |
        **The count, not the roster.** ActivityStreams allows a collection to
        state its size without enumerating it, and that is the right default
        here: who somebody has accepted is a fact about *other people*, and this
        endpoint answers to anyone at all. Remote software uses `totalItems`;
        the list is what would leak the shape of a household.

        Served — and therefore advertised in the actor document — as of Step 2.
        It was deliberately absent before that, because advertising an endpoint
        that 404s is worse than not having one.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An OrderedCollection carrying `totalItems` and no items.
          content:
            application/activity+json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: No such user, or not discoverable. Identical answers.

  /users/{name}/following:
    get:
      tags: [Patch]
      summary: How many decks this one has patched into.
      description: |
        The mirror of `/followers`, and the same rule: `totalItems` only.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An OrderedCollection carrying `totalItems` and no items.
          content:
            application/activity+json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: No such user, or not discoverable. Identical answers.

  /.well-known/webfinger:
    get:
      tags: [Patch]
      summary: Resolve a handle to an actor.
      description: |
        RFC 7033. The entry point for the whole protocol — it is what somebody
        typing a handle into another server's search box hits first. Served as
        `application/jrd+json`.

        `resource` is accepted as `acct:ash@host`, a bare `ash@host`,
        `@ash@host`, or the actor URI itself; clients send all of these, and
        refusing the unfashionable ones makes the instance undiscoverable from
        software that is otherwise fine.

        A missing or unreadable `resource` is a **400** — the caller asked
        wrong. A well-formed one naming a host that is not ours, or a person we
        do not publish, is a **404**. Only the second is a fact about our users,
        which is why the two statuses are drawn apart here and never within the
        404.
      security: []
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
          example: acct:ash@deck.example
      responses:
        '200':
          description: A JRD with a `self` link to the actor document.
          content:
            application/jrd+json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: No `resource`, or one that names no actor.
        '404':
          description: |
            Another host, or somebody we do not publish. Identical answers.

  # ── Patch: patches, the inbox and the Reel ─────────────────────────────────
  #
  # Local-only: both ends of every patch here are rows in `users`, so no
  # signature is involved and nothing is delivered outbound. Session-only, all
  # of it — a token is held by a scrobble client, and no scrobble client has
  # business approving who may read its owner's listening.
  /api/v1/patch/decks:
    get:
      tags: [Patch]
      summary: Everyone on the instance, and where you stand with them.
      description: |
        Returns `decks` (everyone but you, and not disabled), `following` (the
        patches you have made or asked for) and `followers` (the ones pointed at
        you, pending and settled).

        One call rather than three, because the screen shows one list of people
        with a different button each — patched, pending, or not asked. Splitting
        it would have the client stitch three lists back together and invent the
        states in between. A peer with a null `uuid` and `state` is one nobody
        has asked about.

        Each peer carries two fields describing what a patch into them would
        actually show, and they have to be read together.
        **`shares_everything`** is the gate: with it on, a patched deck sees
        every listen they play, whatever chain it ran through or whether it ran
        through one at all. **`shared_chains`** is how many chains they publish,
        which is what decides visibility when that switch is off — and, either
        way, whether the chain is *named* on a row. Zero chains **and** closed is
        the empty patch that needs saying on screen rather than looking broken;
        zero chains and open is a deck publishing everything it plays, unnamed.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The three lists.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. Tokens are not accepted here at all. }

  /api/v1/patch:
    post:
      tags: [Patch]
      summary: Ask to patch into a deck.
      description: |
        **A patch is a request, not a subscription.** It lands `pending` and
        appears in the target's inbox; nothing is shared until they say yes.

        Idempotent in the direction that matters: asking twice does not mint a
        second edge, and asking again does **not** disturb a patch that has
        already been accepted. Asking again after a rejection *does* reopen it —
        a rejection is not a block, and this design has no block yet.

        Not gated on the target having switched federation on: that switch is
        about the wider fediverse, and members of a private invite-only instance
        already know each other exist. What protects a deck here is that the
        patch needs approval and that a chain publishes nothing until its owner
        shares it.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '200':
          description: The patch's `uuid` and its `state` as it now stands.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: A deck cannot patch into itself. }
        '401': { description: Not signed in. }
        '404': { description: No such deck on this instance. }

  /api/v1/patch/requests/{uuid}/settle:
    post:
      tags: [Patch]
      summary: Say yes or no to a patch request.
      description: |
        Only the **target** of a patch may settle it, and that check lives in
        the query's `WHERE` rather than in the handler — this is the one
        operation that widens who may read somebody's listening, and an
        authorisation check that lives in a handler is one a second handler can
        forget.

        A patch that is not yours, one that does not exist, and one already
        settled are the same 404 on purpose: anything else would confirm that a
        given patch id is real to somebody it does not concern.

        Accepting **freezes the target's username** — from that point the
        identity is load-bearing for another party, and a rename would be a
        deletion and a stranger rather than a rename.

        `accept` is required. A body that merely misspelled the key must not be
        read as an answer, and here the two answers are "let them read my
        listening" and "no".
      security: [{ sessionCookie: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200':
          description: The new state, `accepted` or `rejected`.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: '`accept` was absent.' }
        '401': { description: Not signed in. }
        '404': { description: No patch request waiting on you with that id. }

  /api/v1/patch/deck/{username}:
    delete:
      tags: [Patch]
      summary: Stop patching into a deck.
      description: |
        The follower's own operation. Takes a username rather than the patch's
        uuid, because that is what the row on the screen knows.

        **No sweep of anything already delivered**, deliberately: those listens
        were shared at the time under a switch their owner set, and a
        retroactive sweep would promise an unpatching that the protocol cannot
        actually deliver.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Unpatched. }
        '401': { description: Not signed in. }
        '404': { description: No such deck, or you were not patched into it. }

  /api/v1/patch/chains/{id}/shared:
    put:
      tags: [Patch]
      summary: Publish a signal chain to the people patched into you, or stop.
      description: |
        **The sharing unit is the chain, and this is the only switch there is.**
        A listen reaches the Reel because the chain it ran through was switched
        on by its owner — there is no per-listen override and there should not
        be one. It makes "what am I publishing?" answerable by looking at a list
        of chains you already understand, and it makes the decision a standing
        one about *how you listen* rather than a choice to make per play.

        Off for every chain by default, including every chain that predates the
        column.

        The Signal Chains page calls this same endpoint, which is what makes
        "one state, two places" true rather than aspirational.

        `shared` is required; an absent field is a 400, never a default.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              properties:
                shared: { type: boolean }
      responses:
        '200': { description: The switch as it now stands. }
        '400': { description: '`shared` was absent.' }
        '401': { description: Not signed in. }
        '404': { description: No such chain of yours. }

  /api/v1/patch/artists:
    get:
      tags: [Patch]
      summary: Artists across the decks you've patched into.
      description: |
        Narrowed exactly like the Reel — accepted patch, shared chain, the
        listen has a chain, no skips — because `Database::SHARED_LISTENS` is one
        fragment every Patch reader shares. A filter omitted from one of them is
        the shape this codebase keeps finding.

        `mine` is your own plays of that artist: **the overlap is reported as
        which artists, never as a similarity score.** A score invites a ranking
        of people, which is not what this is for.

        `days` bounds the window the ranking is computed over; absent is all
        time. **Server-side on purpose**: the query cuts to the top N by plays,
        so narrowing in the client would rank a week among artists chosen on
        their all-time totals — a list that looks right and is not.

        `genre` is the artist's own first tag from the cache the genre map
        fills, and is null for anyone MusicBrainz has not tagged. `first_played`
        is when they first appeared in the shared history.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer }, description: Days back to rank over. Omit for all time. }
      responses:
        '200':
          description: Artists with plays, decks, who, genre, and your own overlap.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. Tokens are not accepted here at all. }

  /api/v1/patch/discover:
    get:
      tags: [Patch]
      summary: Everyone on the instance, and what you have in common.
      description: |
        `overlap` is artists you both play, unit-separated (`\x1f`), and it is
        computed against **their shared chains only** — so this cannot become a
        way to learn what somebody plays privately by watching the list change.

        `state` is your patch with them (`pending` / `accepted` / `rejected`) or
        null if you have never asked.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Decks, newest first.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }

  /api/v1/patch/instance:
    get:
      tags: [Patch]
      summary: What this instance has been playing.
      description: |
        Over **shared chains only**, across all decks — and deliberately *not*
        narrowed by your own patches: the Reel answers "what have the decks I
        follow played", this answers "what is this instance listening to", which
        is a fact about the people who chose to publish a chain and reads the
        same for everyone.

        A considered reversal of the Reports rule that there is no cross-user
        figure. That rule existed to stop the instance exposing how much other
        members play without their consent; a per-chain opt-in **is** that
        consent. It stays inside the instance.

        `daily` is raw `(timestamp, hours)` pairs rather than pre-bucketed days,
        because the day boundary belongs to the reader's timezone and the server
        does not know it here.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: Decks, listens, hours, top artists, chains and daily hours.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }

  /api/v1/patch/ops:
    get:
      tags: [Patch]
      summary: The federation Operations panel. Admin only.
      description: |
        Reports **only what is recorded**: identities minted, accounts
        published, usernames frozen, remote actors cached, inbox activities
        received, deliveries attempted.

        Signature refusals are logged through `tracing` and counted nowhere, so
        there is no tile for them — an invented number would be worse than an
        honest absence, and the screen says where to look instead.

        `vocabulary` is read-only. The design offers a picker with a Freeze
        control; three vocabularies would mean three things to maintain and a
        migration path between them for a decision made once, so the verb is
        compiled in and this only reports it.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Counters, the frozen vocabulary, and whether delivery is on.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
        '403': { description: Not an admin. }

  /api/v1/patch/dub:
    post:
      tags: [Patch]
      summary: Pass a record to someone.
      description: |
        **A dub is a crate entry that came from a person** — not a second table
        and not a second page. It lands on the Crate, which is the page they
        already visit for records they are still flipping through, and it is
        scored the same way: `first_played_at` is derived from their listens, so
        "you dubbed 12 and they played 5" falls out with nothing accumulated.

        Three guards, two of them the Crate's own:

        * **You must be patched with them**, in either direction. Dubbing at a
          stranger would be a way to put text on somebody's screen without their
          consent.
        * **`because` is required** — what in *their* listening prompted this. A
          suggestion with no grounding is free association.
        * **A record already in their history is refused**, with the play count.
          "You already have this" is Rediscovery under another name, and the
          count is the half that tells the sender something.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, kind, artist, because]
              properties:
                to: { type: string }
                kind: { type: string, enum: [artist, album, track] }
                artist: { type: string }
                name: { type: string, nullable: true }
                mbid: { type: string, nullable: true }
                reason: { type: string, nullable: true }
                because: { type: string }
      responses:
        '200': { description: Filed in their crate. }
        '400': { description: Missing `because`, a bad `kind`, or dubbing to yourself. }
        '401': { description: Not signed in. }
        '403': { description: You are not patched with that deck. }
        '404': { description: No such deck on this instance. }
        '409': { description: They already have it. The message carries the play count. }

  /api/v1/patch/dubs:
    get:
      tags: [Patch]
      summary: Records people handed you.
      description: |
        Crate entries whose origin is a person rather than a model —
        `from_user_id IS NOT NULL` is the whole filter, on a page that
        deliberately holds both kinds.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Dubs, open ones first.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }

  /api/v1/patch/artist:
    get:
      tags: [Patch]
      summary: Who else here plays an artist, and which of your chains you hear them on.
      description: |
        The Patch half of an artist page. **Not a separate artist screen**: the
        design draws one inside Patch, but its statistics are the ones
        `/api/v1/artists/{id}` already computes and a second copy would drift.
        This is only the part that is genuinely about *other decks*.

        `decks` is **instance-wide rather than narrowed by your patches** — the
        same deliberate reversal the Instance tab makes, on the same reasoning:
        the rule that stops a deck exposing somebody's listening without consent
        is the per-chain switch, and switching it on *is* that consent. Shared
        chains only, and it stays inside the instance. `plays` therefore counts
        a deck's listens through shared chains and nothing else.

        `patched` says whether an accepted patch already exists in either
        direction, so a screen can offer to open the deck or to ask — rather
        than a link that 404s, since reading a deck needs a patch.

        `chains` is **your own** listening of that artist, grouped by chain, and
        is deliberately *not* filtered on `shared`: what you heard them on is a
        fact about your setup rather than a publication.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The decks, and your own chains.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: name was missing. }
        '401': { description: Not signed in. }

  /api/v1/patch/live:
    get:
      tags: [Patch]
      summary: Decks you're patched into that are playing something right now.
      description: |
        **Gated by exactly the rule the Reel uses** — an accepted patch, and the
        listen running through a chain its owner switched to **shared**. A live
        entry that could not be checked never appears, which is why `chain_name`
        is always present on a row here.

        That gate is what `NowPlaying.chain_id` exists for. A name could not do
        it — a name is not a key, and a polled source sets no chain name at all,
        because its chain is the device's default rather than a choice.

        The alternative was relaxing the rule for live entries so an unshared
        chain would still show a track and a playhead. Rejected for the reason
        the Shared Spool's capture rule was: it would be a **second way a listen
        becomes visible** while the settings page explains one, and somebody
        could hand over a chain they had deliberately kept private just by
        pressing play.

        Read from the in-memory now-playing registry, so it costs no history
        query — one chain lookup per live deck. Nothing is persisted, so a
        restart correctly shows an empty strip until a source reports again.

        `position_known` is false when the position is wall-clock arithmetic
        rather than a reported playhead; draw it as an estimate, never as a
        measurement.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The decks currently playing, and what they are on.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }

  /api/v1/patch/inbox-count:
    get:
      tags: [Patch]
      summary: How many things are waiting on you in Patch.
      description: |
        One number, for the sidebar badge: patches awaiting a yes, unsettled
        Shared Spool captures, open dubs, and sittings passed to you but not
        opened.

        Its own endpoint rather than the sidebar assembling the four lists —
        that would be four requests on every page load, for a number, against a
        pool of five connections.

        **Answers `0` rather than an error** if the count cannot be read. A
        badge is decoration, and a page that fails to render its sidebar
        because a count failed is worse than one with no badge on it.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  waiting: { type: integer }
        '401': { description: Not signed in. }

  /api/v1/patch/sittings/sent:
    get:
      tags: [Patch]
      summary: Sittings you have passed on, and whether they have been read.
      description: >
        Session-only. The counterpart of `GET /api/v1/patch/sittings`, which
        lists only what was passed *to* you — without this a hand-over could be
        sent and never seen again, so there was nowhere to withdraw one from.


        **Only documents appear here.** A reconstruction (`kind: "spool"`)
        writes real captures into the other person's inbox and no
        `shared_sessions` row, so there is nothing to take back — those are
        plays they accept or decline for themselves.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sittings:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        uuid: { type: string }
                        session_uuid: { type: string }
                        note: { type: [string, 'null'] }
                        created_at: { type: integer }
                        seen_at: { type: [integer, 'null'], description: 'When they opened it. Null is still unread.' }
                        to_username: { type: string }
                        to_display_name: { type: [string, 'null'] }
                        title: { type: [string, 'null'], description: 'Null when the sitting has since been regrouped out of existence.' }
                        started_at: { type: [integer, 'null'] }
                        ended_at: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/patch/sittings:
    get:
      tags: [Patch]
      summary: Sittings other people have handed you.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Newest first. `seen_at` is null for ones you have not opened.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
    post:
      tags: [Patch]
      summary: Pass a past sitting to somebody you are patched with.
      description: |
        **Two different gestures, and `kind` chooses between them. There is no
        default** — they write different things to another person's permanent
        record, so an absent field is a `400` rather than a guess.

        `kind: "spool"` — **the Shared Spool neither of you started.** They were
        in the room; you just forgot to press the button. The sitting is
        reconstructed, its plays are offered as ordinary `spool_captures`, and
        they **enter the recipient's history** when accepted — arriving in the
        same inbox section and on the same accept a live sitting uses. Returns
        `offered` and `withheld`. Idempotent: doing it again offers nothing new,
        and naming a second person adds them to the same reconstructed sitting
        rather than minting a parallel one.

        `kind: "recommendation"` — **they were not there.** They get a
        *document* rendered from your listens, which enters no history, count or
        chart of theirs. `note` applies to this kind only; a set of captures has
        nowhere to carry a sentence. Handing the same sitting to the same person
        again updates the note rather than duplicating it.

        You must be patched with them in either direction, and the sitting must
        be yours.

        **Both kinds pass on only listens through shared chains** — a sitting
        made late captures exactly what one made on time would have, and this
        phase has one switch for publishing rather than two. What is withheld is
        counted either way (`withheld` here, `omitted` on the document), never
        silently dropped. Unlike a live sitting there is a recovery: share the
        chain and do it again.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, to, kind]
              properties:
                session: { type: string, description: "The sitting's uuid, from GET /api/v1/sessions." }
                to: { type: string, description: Username of the deck to pass it to. }
                kind:
                  type: string
                  enum: [spool, recommendation]
                  description: |
                    `spool` reconstructs the sitting and offers its plays as
                    captures, which reach their history on accept.
                    `recommendation` renders a document that reaches nothing.
                    Required — there is no safe default between the two.
                note:
                  type: string
                  maxLength: 500
                  description: Why you are passing it on. `recommendation` only; ignored for `spool`.
      responses:
        '200': { description: "For `spool`: the sitting's uuid plus `offered` and `withheld`. For `recommendation`: the document's uuid." }
        '400': { description: session, to or kind was missing, kind was not one of the two, or the note was too long. }
        '401': { description: Not signed in. }
        '403': { description: That deck is not patched with you. }
        '404': { description: No such deck, or no sitting of yours with that id. }

  /api/v1/patch/sittings/{uuid}:
    get:
      tags: [Patch]
      summary: A handed-over sitting, as a document.
      description: |
        Readable by the recipient **or** by whoever handed it over, so you can
        see what you actually passed on, holes included. Any other caller gets
        the same 404 a nonexistent id does — the alternative would confirm a
        uuid is real to somebody it does not concern.

        Rendered **live** rather than snapshotted: un-sharing a chain, or
        regrouping the sitting, really does change what the recipient sees.
        That is correct while both ends are on one instance, where the document
        is served from the owner's own database on every read. It has to become
        a snapshot when this federates, because bytes already on somebody
        else's server cannot be recalled.

        `omitted` is how many listens in the sitting are not being shown
        because they ran through chains the owner does not share. `gone` means
        the sitting has since been regrouped out of existence — an honest empty
        document rather than a broken link.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
        '404': { description: No sitting with that id, or not yours to read. }
    delete:
      tags: [Patch]
      summary: Withdraw a sitting you handed over.
      description: |
        A real withdrawal, unlike un-patching: nothing was ever copied, so
        removing the row removes the access. That stops being true once this
        federates.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Withdrawn. }
        '401': { description: Not signed in. }
        '404': { description: No sitting of yours with that id. }

  /api/v1/patch/sittings/{uuid}/seen:
    post:
      tags: [Patch]
      summary: Clear a handed-over sitting from your inbox.
      description: |
        **Not an accept.** A handed-over sitting writes nothing to a history,
        so there is nothing to consent to — only a notification to stop
        showing. Contrast `/api/v1/patch/captures`, where accepting really does
        put a play into your listening.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Whether it had not already been seen. }
        '401': { description: Not signed in. }

  /api/v1/patch/spool:
    get:
      tags: [Patch]
      summary: The sitting you are in, and what it has offered you.
      description: |
        `spool` is null when you are not in one. `captures` are plays from other
        people's decks waiting on you — **they are not listens**, and enter no
        history, count or chart until accepted.

        `spool` also carries an **invitation you have not answered yet, even
        when the sitting has ended** — `ended_at` is non-null in that case. An
        invitation is outstanding until it is answered, and the host closing
        the room is not an answer. A running sitting wins over a stale
        invitation.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The sitting and its captures.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
    post:
      tags: [Patch]
      summary: Open a Shared Spool.
      description: |
        A sitting several people are in at once. You are in it immediately;
        everyone named in `with` is **invited**, and an invitation is not
        attendance — nothing is captured onto their deck until they join.

        One running sitting per host, enforced by a partial unique index rather
        than by a check this handler could race, so a second start is a 409.

        **You may only invite a deck you are patched with**, in either
        direction — an invitation puts a banner on somebody's Patch page, so
        being able to aim one at a stranger would be a way to reach them
        without their consent. One stranger in `with` refuses the whole
        sitting rather than opening it without them.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, nullable: true }
                with:
                  type: array
                  items: { type: string }
                  description: Usernames to invite.
                guests:
                  type: array
                  items: { type: string }
                  description: |
                    Names of people in the room with no account here. They get
                    no captures and no inbox — there is nobody to offer
                    anything to — but they are named in the company of every
                    play the sitting fans out.
      responses:
        '200': { description: The sitting's uuid. }
        '401': { description: Not signed in. }
        '403': { description: One of the named decks is not patched with you. Nothing was started. }
        '404': { description: One of the named decks does not exist. }
        '409': { description: You already have a sitting running. }

  /api/v1/patch/spools:
    get:
      tags: [Patch]
      summary: Every sitting you were in, newest first.
      description: |
        **Membership is the gate, not the patch.** A sitting is an evening you
        were in the room for, and un-patching from the host afterwards has no
        standing to un-happen it — the same argument as "no delete sweep on
        un-patching". Your own accepted listens from that evening stay in your
        history whatever happens to the patch, and a history row whose sitting
        has vanished is a row with nothing to explain it.

        That widening does **not** widen what any of it shows: a sitting still
        only ever renders the plays the per-chain sharing switch allows, and
        `withheld` on the detail below says how many it did not.

        A sitting you declined does not appear. You were not there.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The sittings.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }

  /api/v1/patch/spools/{uuid}:
    get:
      tags: [Patch]
      summary: One sitting, in full.
      description: |
        The roster with each person's span, the joint timeline, and a count of
        what is not on it.

        **The timeline is one row per play, not one per listen.** A joint listen
        is N rows sharing a `joint_session_id`, one per person in the room, so
        the naive read shows an evening at twice its length as soon as somebody
        accepts their half. Each row's `standing` is the caller's own relation
        to that play — `mine`, `accepted`, `declined`, `pending`, or `theirs`
        for a play from a deck in the room that was never offered to you.
        Declined and never-answered are told apart deliberately: both mean "not
        in my history" and they are not the same decision.

        `withheld` counts plays that happened in this sitting and are not shown,
        because they ran through chains their owner does not share. Stated
        rather than dropped — a document with invisible holes misrepresents the
        evening and the reader could never tell.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The sitting.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
        '404': { description: No sitting of yours with that id. Same answer as one somebody else was in. }
    patch:
      tags: [Patch]
      summary: Name a sitting, write about it, or say who else was there.
      description: |
        **The host's, and editable after the fact on purpose.** `title` used to
        be settable once, at the start — which is the moment you know least
        about an evening.

        `title` and `notes` distinguish absent from null: an absent field is
        left alone and an explicit null clears it. A body naming none of the
        three is a 400 rather than a no-op reported as success.

        Changing `guests` does **not** rewrite the company on plays already
        fanned out. Those snapshots were accurate when they were taken.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                guests:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Saved. }
        '400': { description: No field named. }
        '401': { description: Not signed in. }
        '404': { description: No sitting of yours with that id. }

  /api/v1/patch/spools/{uuid}/image:
    get:
      tags: [Patch]
      summary: An evening as a card.
      description: |
        **The ending a sitting never had.** Ending one used to just stop it;
        this is the thing you look at afterwards and hand to the people who
        were in it.

        A fourth composition rather than a report card with a different label. A
        sitting has no period, so no rank, no per-day rate and no bucket chart —
        what it has instead is who was in the room, which is the subject, and
        which no report card has anywhere to put.

        It **computes nothing**: every figure comes from
        `GET /api/v1/patch/spools/{uuid}`, so a card and the page it was shared
        from cannot disagree. And it makes no network call, so it needs none of
        the deadline machinery every other outbound-from-a-handler path here has
        had to grow.

        `X-Tapedeck-Glyph-Coverage` is `full` or `partial`. Partial is **not** a
        failure and the image is still returned: the embedded faces are Latin,
        the host's own fonts sit behind them and may well cover the rest. It
        means this server cannot *promise* the image is free of tofu, which is a
        thing to say rather than let the reader discover from the picture.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
        - in: query
          name: size
          schema: { type: string, enum: [story, square, wide], default: story }
        - in: query
          name: theme
          description: |
            Asked at export time rather than inherited — a share lands on
            somebody else's screen, so the reader's own preference is not the
            question. An unrecognised value falls back to `dark` rather than
            being refused: this is presentation, and declining to draw over a
            misspelling is worse than drawing the default.
          schema: { type: string, enum: [dark, light], default: dark }
        - in: query
          name: format
          schema: { type: string, enum: [png, svg], default: png }
      responses:
        '200':
          description: The card.
          headers:
            X-Tapedeck-Glyph-Coverage:
              schema: { type: string, enum: [full, partial] }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        '400': { description: An unknown size or format. }
        '401': { description: Not signed in. }
        '404': { description: No sitting of yours with that id. }

  /api/v1/patch/spools/{uuid}/members:
    post:
      tags: [Patch]
      summary: Add people to a sitting that has already started, or ended.
      description: |
        The guest list used to be frozen at the moment the sitting opened, which
        is wrong about how an evening goes: somebody arrives, somebody's deck
        comes on, or the host simply forgot one of the people in front of them.

        `present_from` answers "from when", and it is stated rather than
        inferred from the clock:

        * **absent** — they were here all along, and are offered the whole
          evening. This is the common case by a distance.
        * **a timestamp** — they arrived then, and the backlog is bounded by it.

        **Host only.** The rule that you may only invite a deck *you* are
        patched with is what stops a guest bringing somebody the host has never
        patched with into a room where the host's plays are being published.
        One stranger in `with` refuses the whole call.

        Somebody already in the sitting is left exactly as they are — re-adding
        must not walk a `declined` back to `invited`.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [with]
              properties:
                with:
                  type: array
                  items: { type: string }
                present_from: { type: integer, nullable: true }
      responses:
        '200': { description: How many were added. }
        '400': { description: No decks named. }
        '401': { description: Not signed in. }
        '403': { description: One of the named decks is not patched with you. Nothing was added. }
        '404': { description: No sitting of yours with that id, or no deck by that name. }

  /api/v1/patch/spools/{uuid}/presence:
    put:
      tags: [Patch]
      summary: Correct when you were in the room.
      description: |
        Yours to set, because you are the one who knows. Everything it decides
        is about your own inbox — how much of the evening you are offered — so
        there is nothing here to overreach with.

        Both fields distinguish absent from null; clearing `present_from` back
        to null means "I was here the whole time".

        Widening your presence offers you the plays you have just said you
        heard. Narrowing it withdraws no offer already made: an offer is a
        question somebody asked you, and it stays yours to answer.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                present_from: { type: integer, nullable: true }
                present_until: { type: integer, nullable: true }
      responses:
        '200': { description: How many plays this has now put in your inbox. }
        '400': { description: No field named. }
        '401': { description: Not signed in. }
        '404': { description: No sitting of yours with that id. }

  /api/v1/patch/captures/{id}:
    patch:
      tags: [Patch]
      summary: Fix when a capture was played, before it becomes a listen.
      description: |
        **The cheapest correction in the application.** A capture is an offer
        and not a record, so nothing is in a history, nothing has been forwarded
        to anybody's Last.fm, no session has been grouped around it and no dedup
        window has been drawn against it. Every trap that makes editing a
        *listen's* timestamp delicate arrives only once it has been accepted.

        A capture carries the **host's** clock, which is the ordinary way one
        comes to be wrong.

        Pending only. A settled capture has either become a listen — where
        `POST /api/v1/scrobbles/bulk-time` is the thing to reach for — or been
        declined, and re-timing a refusal changes nothing.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [played_at]
              properties:
                played_at: { type: integer }
      responses:
        '200': { description: Saved. }
        '400': { description: No `played_at`. }
        '401': { description: Not signed in. }
        '404': { description: No offer of yours with that id still waiting. }

  /api/v1/profile/spool-chain:
    get:
      tags: [Profile]
      summary: The chain an accepted Shared Spool play is filed under.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: '`chain_id`, or null.' }
        '401': { description: Not signed in. }
    put:
      tags: [Profile]
      summary: Name the chain a room you sat in is filed under.
      description: |
        A capture used to land with no chain at all, so those listens earned no
        gear hours, carried no fidelity and could never reach the Reel. That was
        defensible — it was not your gear — and it was not the whole truth
        either: you were in the room hearing real speakers, and if you have
        built a chain that says so it should get the hours.

        Unset is the default and reproduces the old behaviour exactly.

        `chain_id` is required and an absent field is a **400**: this decides
        where every play you accept out of a room lands, so a misspelled key
        must not read as "clear it". Explicit null clears it.

        Session-only. A scrobble client has no business deciding this.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain_id]
              properties:
                chain_id: { type: integer, nullable: true }
      responses:
        '200': { description: Saved. }
        '400': { description: '`chain_id` absent.' }
        '401': { description: Not signed in. }
        '404': { description: No chain of yours with that id. }

  /api/v1/patch/spool/{uuid}/join:
    post:
      tags: [Patch]
      summary: Accept an invitation to a sitting, or leave one.
      description: |
        `accept: true` joins, `false` leaves. Required — an absent field is a
        400, never a default, because joining is what starts plays being
        captured onto your deck.

        **A sitting the host has already ended can still be joined**, and doing
        so offers the plays it already held — the response's `offered` says how
        many. Forgetting to press Join before the room closed is the ordinary
        case, not the odd one, and refusing it there would throw away an
        evening with no way to ask for it again. Nothing is weakened: joining
        still decides nothing on its own, since every play arrives as a capture
        you have to accept.

        Only plays through the player's **shared** chains are offered, exactly
        as for a live sitting, and nothing already offered to you in any
        sitting is offered twice.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200':
          description: Your membership as it now stands, and the backlog joining offered you.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [joined, left] }
                  offered:
                    type: integer
                    description: >-
                      Plays the sitting had already held that are now in your
                      inbox. Always 0 when leaving.
        '400': { description: '`accept` was absent.' }
        '401': { description: Not signed in. }
        '404': { description: No sitting you were invited to with that id. }

  /api/v1/patch/spool/{uuid}/end:
    post:
      tags: [Patch]
      summary: Close a sitting. The host's only.
      description: |
        Captures already made are untouched — they are offers nobody has
        answered yet, and ending the room does not withdraw what was played in
        it.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ended. }
        '401': { description: Not signed in. }
        '404': { description: No running sitting of yours with that id. }

  /api/v1/patch/captures:
    post:
      tags: [Patch]
      summary: Accept or decline plays a sitting captured for you.
      description: |
        **The only path by which another deck can write a listen into your
        history**, which is why it is explicit and per capture rather than a
        standing setting.

        Accepted plays land carrying the sitting's `joint_session_id` — the
        N-rows-one-per-listener shape decided on 2026-08-02.

        **Whether they are forwarded on to Last.fm and ListenBrainz is the
        user's own setting** — `GET|PUT /api/v1/connections/spool-forwarding`,
        off by default — bounded by a freshness window so an evening
        reconstructed out of years ago is stored and never relayed. `forwarded`
        in the response says how many of the settled plays the flush loop will
        actually pick up; it is not derivable from `settled`.

        Both `ids` and `accept` are required.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, accept]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                accept: { type: boolean }
      responses:
        '200':
          description: How many were settled, and how many of those will be relayed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled: { type: integer }
                  forwarded: { type: integer }
        '400': { description: '`ids` or `accept` was absent.' }
        '401': { description: Not signed in. }

  /api/v1/patch/reel:
    get:
      tags: [Patch]
      summary: What the decks you patched into have been playing.
      description: |
        **The one read in this application that returns another user's
        listens**, and every narrowing is in the query rather than the handler:
        the patch must be `accepted`, the listen's chain must be `shared`, the
        listen must have a chain at all, and skips are excluded.

        A listen with no chain is never shared — nobody switched anything on for
        it, so the default is exclusion.

        Paged by keyset on `before`, not by offset: the Reel grows from the top
        while it is being read, and an offset would repeat or skip rows as it
        shifted underneath. `next` is null when the page was short.

        Rows carry the chain — its name, icon and components — because that is
        what makes a Tapedeck listen a Tapedeck listen rather than a sentence.
        They deliberately do not carry the source id, the delivery state or the
        session, which are nobody else's business.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 40, maximum: 200, minimum: 1 }
        - name: before
          in: query
          description: Keyset cursor — listens strictly older than this timestamp, in unix seconds.
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string }
          description: |
            Narrows on track, artist, album, chain name or deck. **Server-side
            on purpose**: the Reel is keyset-paged, so filtering the loaded page
            would search only what had been scrolled to and say nothing about
            it, which reads exactly like a search that found nothing.

            A wildcard typed into the box is a **literal** — `%` and `_` are
            escaped, the rule the notes search already follows.

            It only ever narrows. The four clauses that decide what the Reel may
            publish are unaffected, so no query reaches a chain its owner does
            not share.
        - { name: deck, in: query, schema: { type: string }, description: One deck's username, for the filter chips. }
      responses:
        '200':
          description: '`listens` and a `next` cursor.'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. Tokens are not accepted here at all. }

  # ── Statistics ─────────────────────────────────────────────────────────────
  /api/v1/stats/dashboard:
    get:
      tags: [Statistics]
      summary: Dashboard counters.
      description: |
        Scope: `read` *(since v0.39)*. "Today" and "this week" are bucketed in
        the user's own timezone and honour their week-start preference.


        Deliberately **does not** carry distinct artist, album or track counts.
        It used to compute all three, each a `COUNT(DISTINCT)` building a temp
        B-tree over the whole history, on the most-loaded page in the
        application — and nothing rendered any of them. `GET /api/v1/stats`
        answers the same question against a range control, which is where it
        belongs.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: integer }
                  this_week: { type: integer }
                  total: { type: integer }
                  lossless_pct: { type: number, description: 'Share of listens **whose format is known**, not of `total`. Most of an imported history has no format at all, so dividing by every play measured the import ratio instead.' }
                  fidelity_known: { type: integer, description: 'The denominator of `lossless_pct`. Clients should report this coverage rather than presenting the share as a fact about the whole history.' }
                  top_artist: { type: [string, 'null'], description: 'Most played over the last 30 days, or "—".' }
                  top_artist_count: { type: integer, description: 'Their plays in that window. Rides along with `top_artist` from one query.' }
                  total_hours: { type: number, description: 'A **floor**: a listen whose source reported no length contributes nothing.' }
                  today_hours: { type: number }
                  week_hours: { type: number }
                  avg_quality: { type: number, description: 'Over listens that have a score at all — ingest, Plex and Jellyfin only. `0` where nothing is scored, which an imported history is.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/stats:
    get:
      tags: [Statistics]
      summary: Ranged statistics.
      description: |
        Scope: `read` *(since v0.39)*. Totals, top lists (50 rows each), fidelity
        mix, decades, a 7×24 listening heatmap, breadth, genres and languages.

        The genre breakdown is a share of **tag mentions, not listens** — one
        track carries several tags. Never present it as a percentage of plays.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - $ref: '#/components/parameters/StatsRange'
        - name: metric
          in: query
          description: |
            How the three top lists are **ranked**, not merely what number is
            shown. They are cut to 50 rows server-side, so re-sorting in the
            client would only reorder the top 50 *by plays* and would miss a
            long record played a handful of times — which is exactly the row
            switching to `hours` exists to surface. Listens whose source
            reported no duration count as zero and sort last.
          schema: { type: string, enum: [plays, hours], default: plays }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      plays: { type: integer }
                      artists: { type: integer }
                      albums: { type: integer }
                      tracks: { type: integer }
                      hours: { type: number }
                      avg_quality: { type: number }
                      lossless_pct: { type: number, description: 'Share of `fidelity_known`, not of `plays`.' }
                      dsd_pct: { type: number, description: 'Share of `fidelity_known`, not of `plays`.' }
                      fidelity_known: { type: integer, description: 'Listens in this window whose format is known — the denominator of the two shares above. The `fidelity` array below is a share of `plays` instead, because it carries an `Unknown` bucket of its own.' }
                      quality_known: { type: integer, description: 'Listens `avg_quality` is averaged over. Only a live source ever writes a quality score, so an imported history has none and the average is over the same narrow population the fidelity shares are. Present it with its coverage or not at all; at zero there is no score to show, not a score of zero.' }
                      duration_known: { type: integer, description: 'Listens `hours` is summed over. A listen whose source reported no length contributes nothing, so `hours` is a floor rather than a total.' }
                      skips: { type: integer, description: 'Skipped plays in this window. Every other count in this object excludes them; this one is about them. Not every source reports skips, so zero means "nothing told us", not "nothing skipped".' }
                      per_day: { type: number, description: 'Plays per **calendar** day of the window, including days with no listening. Dividing by active days instead reports a busy afternoon''s rate as the year''s.' }
                      first_listen: { type: ['integer', 'null'], description: 'Earliest non-skipped listen, unix seconds. A fact about the whole history and therefore **not** ranged — asking it of a one-week window would only restate the window.' }
                      loves: { type: integer, description: 'Loved entities: tracks, records and artists together. All time, not ranged.' }
                  top_artists: { type: array, items: { type: object, additionalProperties: true } }
                  top_albums: { type: array, items: { type: object, additionalProperties: true } }
                  top_tracks: { type: array, items: { type: object, additionalProperties: true } }
                  fidelity: { type: array, items: { type: object, additionalProperties: true } }
                  decades: { type: array, items: { type: object, additionalProperties: true } }
                  heatmap:
                    type: array
                    description: Seven rows of 24. Row 0 is Monday.
                    items: { type: array, items: { type: integer } }
                  genres: { type: array, items: { type: object, additionalProperties: true } }
                  languages: { type: array, items: { type: object, additionalProperties: true } }
                  breadth:
                    type: object
                    description: |
                      Absent until the genre map is fetched and genres backfilled —
                      "you play 0 genres" would be a lie about the listening
                      rather than a statement about the data.
                    properties:
                      genres_played: { type: integer }
                      genres_placed: { type: integer }
                      effective_genres:
                        type: number
                        description: '`exp(H)` — as varied as playing N genres equally.'
                      reach:
                        type: [number, 'null']
                        description: Your spread over the map's own spread, 0–1.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports:
    get:
      tags: [Statistics]
      summary: Period reports — a feed of week / month / year cards, newest first.
      description: |
        Scope: `read` *(since v0.41)*.

        Reads the history **once** and folds it in Rust. A card carries a dozen
        aggregates and every one is bucketed in the caller's own timezone, which
        SQL here cannot do — a year of monthly cards would otherwise be hundreds
        of round trips.

        Weeks are ISO (Monday-start), deliberately **not** the caller's
        week-start preference: that setting shapes the dashboard counter and the
        heatmap rows, whereas a report is a named object and its boundary has to
        stay put, or last month's report changes shape when the preference does.

        `avg_daily` divides by **calendar** days — a finished period by its full
        length, one still running by the days it has actually had. Dividing by
        days-with-listens would report the rate of your busiest fortnight as the
        month's average.

        Two things deliberately absent. There is **no percentile against other
        users** ("you out-listened 88% of listeners"): that needs other people's
        listening, and on a private instance it would leak how much the rest of
        the household plays. And `crush` is omitted for the oldest period, where
        every artist is new by construction and it would just be the top artist
        relabelled.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: unit, in: query, schema: { type: string, enum: [week, month, year], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: |
            Periods to skip, counting back from the newest. The stepper on the
            Reports page walks this one period at a time. Costs nothing extra —
            the whole history is folded on every call regardless.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { type: string, enum: [week, month, year] }
                  timezone: { type: string, description: The IANA zone the buckets were cut in. }
                  offset: { type: integer, description: Where this page sits, counting back from the newest. }
                  total_periods: { type: integer, description: 'How many periods exist at this bucket size — what tells a stepper where the ends are.' }
                  capped:
                    type: boolean
                    description: |
                      The scan hit the analytics row cap, so the oldest periods
                      are partial and must not be presented as final.
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: '2026-08' }
                        label: { type: string, example: August 2026 }
                        rank: { type: integer, description: 'Where this period sits among *the caller''s own* periods by plays, 1 being the busiest. This is what fills the slot the design gave to a cross-user percentile — see the description above for why there is no such thing here.' }
                        rank_of: { type: integer }
                        genre_bands:
                          type: object
                          description: |
                            The period's three biggest genres **by name**, fixed
                            across every sub-bucket, plus `other` as the
                            remainder. Drawn as stacked bands by the year
                            chapter. A sub-bucket with no tags at all is all
                            zeroes rather than 100% `other` — an empty month is
                            an absence, not a genre.

                            Shares of tag *mentions*, like `genres`.
                          properties:
                            names: { type: array, items: { type: string }, maxItems: 3 }
                            shares:
                              type: array
                              description: One row per sub-bucket; each row is the three named shares then `other`.
                              items: { type: array, items: { type: number } }
                        start: { type: integer }
                        end: { type: integer }
                        plays: { type: integer }
                        hours: { type: number }
                        avg_daily: { type: integer }
                        artists: { type: integer }
                        albums: { type: integer }
                        tracks: { type: integer }
                        new_artists: { type: integer, description: Artists with no earlier listen anywhere in the history. }
                        top_artist: { type: [object, 'null'], additionalProperties: true }
                        top_album: { type: [object, 'null'], additionalProperties: true }
                        top_track: { type: [object, 'null'], additionalProperties: true }
                        clock: { type: array, items: { type: integer }, description: 24 counts, local hours. }
                        sub:
                          type: array
                          items: { type: integer }
                          description: One level finer than the period — days across a week, weeks across a month, months across a year.
                        sub_labels: { type: array, items: { type: string } }
                        genres:
                          type: array
                          description: Shares of **tag mentions**, not of listens.
                          items: { type: object, additionalProperties: true }
                        colour: { type: [string, 'null'], description: Play-weighted blend of the period's genre colours, in linear light. Null until the genre map is fetched. }
                        on_repeat: { type: array, items: { type: object, additionalProperties: true } }
                        crush: { type: [object, 'null'], description: Most-played artist never played before. Absent for the oldest period. }
                        shelf: { type: object, additionalProperties: true }
                        top_chain: { type: [string, 'null'] }
                        gear:
                          type: object
                          additionalProperties: true
                          description: >
                            What the period was listened *through*. `unattributed` and
                            `no_duration` are stated rather than folded away: on most
                            histories the first is nearly everything, and the hours
                            are a floor without the second.
                          properties:
                            chains: { type: array, items: { type: object, additionalProperties: true } }
                            items: { type: array, items: { type: object, additionalProperties: true } }
                            unattributed: { type: integer, description: 'Listens with no chain at all.' }
                            no_duration: { type: integer, description: 'Chained listens whose source reported no length.' }
                        company:
                          type: object
                          additionalProperties: true
                          description: >
                            Listens **marked** as heard with somebody. `company` is
                            null on everything nobody has tagged, so `of_plays`
                            travels as the denominator — never present a bare share,
                            and never read the complement as "alone".
                          properties:
                            marked_plays: { type: integer }
                            marked_hours: { type: number }
                            of_plays: { type: integer }
                            people: { type: array, items: { type: object, additionalProperties: true } }
                        milestones: { type: array, items: { type: string } }
                        prev: { type: [object, 'null'], additionalProperties: true, description: The period before, for deltas. }
                        fingerprint:
                          type: object
                          description: |
                            Five ratios between 0 and 1, and the same five for
                            *you, usually* — every one answerable from any
                            history, and **none of them a comparison against
                            another person**. The baseline is the mean of your
                            own periods, not one shape over the whole history:
                            `variety` shrinks as plays grow and `discovery` is
                            pinned at 1.0 over a whole history, so a
                            whole-history baseline would report every period as
                            more varied and less exploratory than usual.
                          properties:
                            axes: { type: array, items: { type: string } }
                            you: { type: array, items: { type: number } }
                            usual: { type: array, items: { type: number } }
                            usual_periods:
                              type: integer
                              description: |
                                How many periods the baseline rests on. One is
                                not a habit — a radar comparing a month against
                                itself draws two identical shapes and means
                                nothing by it, so a client should decline to
                                draw the baseline below two.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/image:
    get:
      tags: [Statistics]
      summary: A report chapter as a shareable PNG, rendered on the server.
      description: |
        Scope: `read` *(since v0.96)*.

        **Rendered on the server on purpose.** A share image is a deliverable
        rather than a view: a native client asks for one instead of
        reimplementing a layout, a type scale and a palette that would then be
        free to drift from the web's. The fonts are embedded in the binary and
        no artwork is fetched, so the same period produces the same bytes on any
        host.

        It **computes nothing**. Every figure comes from `GET /api/v1/reports`
        with the same `unit` and `offset`, so a share cannot disagree with the
        chapter it was shared from — including the rule that the only
        comparison on the card is against the caller's *own* periods.

        The card is a **composition, not a screenshot of the chapter**, and
        each unit has its own — never one card relabelled, the same reason the
        app has three chapter components:

        * **week** — a headline, the **by-day bars**, the top artist and the
          track of the week, the counts, the crush. Deliberately **no genre
          split**: seven days make a thin one, which is the chapter's own
          judgement.
        * **month** — the top artist and record, the counts, the top genres,
          what was on repeat, the crush. No by-week bars: five columns say less
          than the ranked genre list beneath them.
        * **year** — the **by-month bars** and the **genre bands** (the three
          biggest genres tracked by name across the year, everything else folded
          into `other`), the artist and record of the year, what was discovered,
          the crush.

        A section that would not fit is **left out whole** rather than clipped —
        a PNG has no scrollbar, so a section drawn over the footer would look
        deliberate. A thin period therefore draws fewer sections rather than
        empty headings, and a full year gives up its discovery line before it
        gives up the crush.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - name: unit
          in: query
          schema: { type: string, enum: [week, month, year], default: month }
          description: |
            Each has its own composition — see the description above. Anything
            else is a 400 rather than a default, because the wrong card would
            carry that period's numbers under the wrong heading and the wrong
            crush line, which is an answer that is wrong while looking right.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Periods back from the newest, matching the Reports stepper.
        - name: size
          in: query
          schema: { type: string, enum: [story, square, wide], default: story }
          description: |
            `story` 1080×1920, `square` 1080×1080, `wide` 1600×900. Not one
            layout scaled — a square holds about half of what a story does.
        - name: theme
          in: query
          schema: { type: string, enum: [dark, light], default: dark }
          description: |
            **Asked at export time rather than inherited.** A share lands on
            somebody else's feed rather than inside the app, so the caller's own
            theme preference is not the question being answered. An unrecognised
            value is `dark`, not an error — this is presentation, and refusing to
            render over a misspelling is worse than rendering the default.
        - name: format
          in: query
          schema: { type: string, enum: [png, svg], default: png }
          description: |
            `svg` returns the same document the PNG is rasterised from — smaller,
            sharp at any size, and something a native client can draw itself. It
            is not a second renderer.
      responses:
        '200':
          description: |
            The image. `Cache-Control` is `private`: it is one person's
            listening, and a shared cache must not hold it.
          headers:
            X-Tapedeck-Glyph-Coverage:
              schema: { type: string, enum: [full, partial] }
              description: |
                `partial` means a string on the card contains a character the
                **embedded** faces cannot draw — Hangul, CJK, Cyrillic. Not a
                failure and not a reason to withhold the image: the host's own
                fonts sit behind ours and may cover it. It is here so a client
                can warn rather than let the user find out from the picture.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        '400':
          description: An unsupported unit, size or format.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: |
            No report for that period — an offset past the end of the history,
            or an instance with nothing in it yet. A real answer, not a failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/v1/personality:
    get:
      tags: [Statistics]
      summary: Musical personality — a verdict, traits and loyalty.
      description: Session-only.
      parameters: [{ $ref: '#/components/parameters/StatsRange' }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string }
                  traits:
                    type: array
                    items:
                      type: object
                      properties:
                        low: { type: string }
                        high: { type: string }
                        score: { type: number, description: 0–100. }
                        evidence: { type: string }
                  loyalty: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/charts:
    get:
      tags: [Statistics]
      summary: Top charts.
      description: |
        Session-only. Note this offers a **different range set** from
        `/api/v1/stats` — it has `today`. The two answering the same question
        over different windows is known, and is why the Insights redesign wants
        one shared range control.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [artists, albums, tracks], default: artists } }
        - { name: range, in: query, schema: { type: string, enum: [today, d7, month, year, all], default: all } }
        - name: metric
          in: query
          description: |
            Ranks the chart, not just the number shown — it is cut to `limit`
            rows, so the sort happens in SQL. Statistics' "See more" hands off
            here carrying its metric, and the two ranking differently would
            defeat the point of that handoff.
          schema: { type: string, enum: [plays, hours], default: plays }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        sub: { type: [string, 'null'], description: Artist, for an album or track row. }
                        album: { type: [string, 'null'], description: Present on track rows so a track opens the record it is on. }
                        plays: { type: integer }
                        seconds: { type: integer }
                        artwork_url: { type: [string, 'null'] }
                        caa_id: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Library ────────────────────────────────────────────────────────────────
  /api/v1/resolve:
    get:
      tags: [Library]
      summary: Resolve names to an entity id.
      description: |
        Session-only. **Creates the entity on first visit** — a write on a read
        path, on purpose. The browser knows names, not ids, so without this
        every link out of the history would be dead until you happened to
        annotate the thing it points at.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [artist, release, recording] } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/albums/{id}:
    get:
      tags: [Library]
      summary: An album page.
      description: |
        Session-only. Aggregated over `scrobbles` by name. Track rows carry the
        **raw quality columns**, not a formatted label — the client formats
        them, so a server-side copy of that logic cannot drift.

        An entity with **zero plays still renders** rather than 404ing:
        something annotated once and since deleted from the history is still a
        real record.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity: { $ref: '#/components/schemas/Entity' }
                  plays: { type: integer }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
                  bio: { type: [object, 'null'], additionalProperties: true, description: 'Provider description. Carries `attribution` — Last.fm text is CC BY-SA and the credit must travel with it. Render as text, never as HTML.' }
                  artwork_url: { type: [string, 'null'], description: 'The hand-set cover when there is one, otherwise the artwork the newest listen of this album carries.' }
                  cover_override: { type: boolean, description: 'True when the cover was set by hand. `caa_id` and `caa_release_mbid` are null in that case — the override replaces the derived artwork rather than sitting in front of it.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/albums/{id}/tracklist:
    get:
      tags: [Library]
      summary: The record's own tracklist, including tracks never played.
      description: |
        Session-only. Everything else on the album page is aggregated from
        listens, so a record played twice renders as a two-track record. This
        asks MusicBrainz what is actually on it.

        **Nothing is stored.** The caller matches these against the plays it
        already holds; writing a tracklist into `scrobbles` would invent listens
        that never happened. It is a separate call rather than part of
        `/api/v1/albums/{id}` because it costs a rate-limited request to an
        external service and the page must render without one.

        The release is chosen in order: the entity's own MBID, then the release
        MBID a **plurality** of the album's listens claim (a tagger works per
        track, so one listen in twelve routinely carries a compilation's), then
        a search, which is a guess.

        **404 is a normal answer** — a great deal of any real library is not in
        MusicBrainz, and those are exactly the records worth keeping.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, description: Which lookup answered. }
                  mbid_release: { type: [string, 'null'] }
                  title: { type: string }
                  artist: { type: string }
                  year: { type: [integer, 'null'] }
                  format: { type: [string, 'null'] }
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        side: { type: string, description: '"A", "B", … A disc comes back as one side.' }
                        position: { type: integer }
                        title: { type: string }
                        artist: { type: [string, 'null'], description: Set only where the release credits the track to somebody other than the record's artist. }
                        duration_secs: { type: [integer, 'null'] }
        '400': { description: That entity is not an album. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No matching release, or no such album. }
        '502': { description: MusicBrainz could not be reached. }

  /api/v1/albums/{id}/cover:
    put:
      tags: [Library]
      summary: Override an album cover.
      description: |
        Session-only. The counterpart of the artist portrait override: an album
        otherwise wears whatever artwork the newest listen of it happens to
        carry, which is unfixable when it is the wrong edition's.

        400s when the id is not a **release** entity — an artist's picture has
        its own endpoint, and two places to set one would leave no rule about
        which wins. Like every entity write, this is not scoped per user:
        `entities` is shared.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: |
                    An `http(s)://` URL, or a path on this server — `/api/v1/art/{scrobble_id}`
                    proxies the cover out of the user's own media library. Empty
                    clears the override and the derived artwork comes back.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artwork_url: { type: [string, 'null'] }
        '400': { description: Not a URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such album, or that entity is not a release. }

  /api/v1/artists/{id}:
    get:
      tags: [Library]
      summary: An artist page.
      description: Session-only. Same shape and same rules as the album page.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity: { $ref: '#/components/schemas/Entity' }
                  plays: { type: integer }
                  albums: { type: array, items: { type: object, additionalProperties: true } }
                  tracks: { type: array, items: { type: object, additionalProperties: true } }
                  bio: { type: [object, 'null'], additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/entities/{id}:
    get:
      tags: [Library]
      summary: One entity.
      description: 'Scope: `read` *(since v0.39)*. Needed to render a note''s target.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/art/{id}:
    get:
      tags: [Library]
      summary: Cover art for a listen, proxied.
      description: |
        Session-only. Proxies the user's own library server, which the browser
        usually cannot reach and must not hold credentials for. Redirects to a
        public URL where there is one.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Image bytes., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '302': { description: Redirect to a public artwork URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No artwork. The client falls back to a lettered tile. }

  /api/v1/artists/landscape/{id}:
    put:
      tags: [Library]
      summary: Set or clear an artist's wide image.
      description: |
        Session-only. Takes the **artist row id** (`artist_row_id` on the artist
        page), not the entity id — the `artists` row is keyed by name and shared
        across users, which is what the portrait proxy addresses too.

        A different photograph from the portrait rather than a crop of it: the
        Reports chapter tile is 16/11, where a square either pillarboxes or
        crops the head off. Nothing Tapedeck can reach supplies a landscape, so
        it is present only where the user chose one, and a chapter with none
        keeps the enormous faint initial — that is the design, not a placeholder.

        An empty string clears it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: An http(s) image URL, or empty to clear. }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { type: object, properties: { landscape_url: { type: string, nullable: true } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/artists/img/{id}:
    get:
      tags: [Library]
      summary: An artist portrait, proxied.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Image bytes., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '302': { description: Redirect to a public URL. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No portrait yet. Retried later — the answer changes when the artist is added to a library. }
    put:
      tags: [Library]
      summary: Override an artist portrait.
      description: |
        Session-only. A manual override beats every provider — this is a
        journal, and whoever keeps it gets the last word.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'An `http(s)://` URL or a path on this server. Empty clears the override.' }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/artists/img/{id}/upload:
    post:
      tags: [Library]
      summary: Upload an artist portrait.
      description: |
        Session-only. The counterpart of the `PUT` above, for a picture that is
        on your disk rather than already somewhere on the web.

        The extension is taken from the **declared content type**, never from
        the filename — the path is one this server writes. The stored name is
        random, so the served URL is `immutable`-cacheable and a replaced
        picture is a new URL rather than the same URL with new bytes.

        Replaces the override exactly as a pasted URL does, and the file it
        supersedes is deleted. `artists` carries no user column, so this is an
        **instance-wide** edit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Saved. The body carries the new URL, which is a path on this server.', content: { application/json: { schema: { type: object, properties: { image_url: { type: string } } } } } }
        # No image in the request.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Larger than 8 MB. }
        '415': { description: 'Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).' }

  /api/v1/artists/landscape/{id}/upload:
    post:
      tags: [Library]
      summary: Upload an artist's wide picture.
      description: |
        Session-only. Same rules as the portrait upload.

        This is the one image override nothing can fill automatically — no
        provider Tapedeck reaches supplies a landscape — so before this it was a
        URL or the big initial.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Saved. The body carries the new URL, which is a path on this server.', content: { application/json: { schema: { type: object, properties: { landscape_url: { type: string } } } } } }
        # No image in the request.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Larger than 8 MB. }
        '415': { description: 'Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).' }

  /api/v1/albums/{id}/cover/upload:
    post:
      tags: [Library]
      summary: Upload an album cover.
      description: |
        Session-only. Same rules as the artist uploads. Takes an **entity** id.

        Replaces the derived cover the way the `PUT` does, so the page still
        offers *Reset* (back to whatever the listens carry) rather than *Clear*.
        Entities are shared, so this is an **instance-wide** edit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Saved. The body carries the new URL, which is a path on this server.', content: { application/json: { schema: { type: object, properties: { artwork_url: { type: string } } } } } }
        # No image in the request.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Larger than 8 MB. }
        '415': { description: 'Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).' }

  /api/v1/art/upload/{name}:
    get:
      tags: [Library]
      summary: Serve an uploaded picture.
      description: |
        Session-only. Cached `private, immutable` — the name is random per
        upload, so the bytes behind a given URL never change.

        `name` is **validated, not trusted**: it must be exactly the 24 hex
        characters this server generates plus a known image extension. The
        override columns accept any `/`-prefixed string, so a route that read a
        path out of one would serve arbitrary files from the uploads directory.
      parameters: [{ name: name, in: path, required: true, schema: { type: string }, example: 0123456789abcdef01234567.jpg }]
      responses:
        '200': { description: Image bytes., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'No such picture, or the file is no longer on this server.' }

  /api/v1/art/library:
    get:
      tags: [Library]
      summary: Does this album already have a cover?
      description: |
        Scope: `write`.

        The precondition of an upload, so the common case costs one small `GET`
        rather than a megabyte of JPEG. A client reads the picture off disk only
        when this answers `false`.

        **`write`, not `read`** — this exists only to decide a write, and
        requiring `read` would force a scrobbling token that wants to offer a
        sleeve to carry read access to the whole listening history as well.

        `held` is true when any listen of this album carries artwork (a
        Cover Art Archive id counts, `-1` excluded), **or** when a cover has been
        set by hand on the album — one set that way is what the album page
        prefers over everything else, so answering `false` would invite a
        picture that would never be shown.

        Deliberately **not** `album_artwork`'s question, which excludes skips
        because its job is choosing a cover to display. An album whose only
        listens are skips would otherwise answer "nothing held" for ever and the
        same sleeve would be re-uploaded on every run.

        Creates nothing. `GET /api/v1/resolve` would mint the entity as a side
        effect of being asked, which is right for a browser about to annotate
        something and wrong for a player asking whether to bother.
      parameters:
        - { name: artist, in: query, required: true, schema: { type: string }, description: 'The **track** artist, matching `scrobbles.artist`.' }
        - { name: album, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Whether a cover is already held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  held: { type: boolean }
        '400': { description: A blank artist or album. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Library]
      summary: Offer a cover read from the client's own files.
      description: |
        Scope: `write`.

        Writes `scrobbles.artwork_url` on every listen of this album that has
        none, and nothing else. That column **is** the artwork backfill's queue
        and the album page reads it back, so a sleeve arriving with the listens
        is exactly what a Plex-sourced listen carries. A cover *override* would
        claim somebody set it by hand, and nobody did.

        Rows holding the `artwork_url = ''` tombstone are filled too, and that
        is the point rather than an oversight: the tombstone means "asked every
        provider, nobody had a picture", and the premise here is that the
        listener's own file does. Skipped listens are filled as well — artwork
        is not a count.

        The held check runs again before the bytes are written, so a cover that
        arrived between the `GET` and this costs no file on disk and is reported
        rather than treated as an error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artist, album, file]
              properties:
                artist: { type: string, description: 'The **track** artist, matching `scrobbles.artist`.' }
                album: { type: string }
                release_mbid:
                  type: string
                  description: |
                    **Accepted and not read.** Said out loud rather than left for
                    a client author to discover: the cover is keyed on names like
                    every other album query, and writing this to `mbid_release`
                    would be a different claim — the client's tagging, which has
                    its own path through `additional_info` on a submission.
                file: { type: string, format: binary, description: 'The image, original bytes, content type declared.' }
      responses:
        '200':
          description: Stored, or already held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artwork_url: { type: string, example: /api/v1/art/upload/0123456789abcdef01234567.jpg }
                  listens_covered: { type: integer, description: How many listens gained the cover. }
                  already_held: { type: boolean, description: Something filled it between the check and this. Not an error. }
        '400': { description: 'No image, or a blank artist or album.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Larger than 8 MB. }
        '415': { description: Not an image type this server stores. }

  # ── Loves ──────────────────────────────────────────────────────────────────
  /api/v1/loves:
    get:
      tags: [Loves]
      summary: Loved entities.
      description: |
        Scope: `read` *(since v0.39)*.

        Since v0.43 each row carries what the Loved page needs to render it —
        plays, last played, artwork and the liner note — rather than the bare
        entity. Four queries regardless of how many loves there are.
      
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [artist, release, recording] } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loves: { type: array, items: { $ref: '#/components/schemas/Love' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Loves]
      summary: Love or un-love.
      description: |
        Scope: `write` *(since v0.39)*.

        Loves attach to **entities, never to a listen** — loving one *playing*
        of a track is a category error and is rejected.

        A love of a **recording** is mirrored outward (Last.fm `track.love`,
        ListenBrainz `recording-feedback`); albums and artists stay local
        because neither service has the concept. ListenBrainz needs a recording
        MBID, so an un-enriched track is skipped rather than guessed at. The
        forward is spawned, not awaited — the love is already stored and the UI
        should not wait on Last.fm.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, loved]
              properties:
                kind: { type: string, enum: [artist, release, recording] }
                name: { type: string }
                artist: { type: string, description: Required for release and recording. }
                loved: { type: boolean }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { type: object, properties: { entity_id: { type: integer }, loved: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/loves/keys:
    get:
      tags: [Loves]
      summary: Every loved entity key, as a flat set.
      description: |
        Scope: `read` *(since v0.39)*. One request instead of one per history
        row.

        Since v0.69 a love is published in **up to three forms**, and a row is
        loved if *any* key it can derive is in the set. Two players rarely spell
        one song identically — Plex files a listen under the record's artist
        while a scrobble client reports what the player displayed — so an exact
        match alone left the heart empty on the same track from another source.

        * `kind|artist|name` — trimmed and lowercased, an artist's `artist` half
          empty. The exact key, as before.
        * `kind|artist|name` **folded** — accents, ligatures and all punctuation
          removed, and the primary taken from an explicit `feat.` credit. Note a
          trailing title qualifier is *not* removed: "Archangel" and "Archangel
          (Remastered)" stay apart.
        * `mbid:<kind>:<mbid>` — present when the entity has a MusicBrainz id.
          The strongest of the three; a listen row carries a recording id.

        **If your derivation drifts from the server's, hearts silently stop
        filling — nothing errors.** The folded form is pinned character for
        character by `the_folded_key_is_exactly_what_the_client_must_reproduce`.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: string }, example: ['recording|aphex twin|xtal', 'artist||burial'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/loves/pull:
    post:
      tags: [Loves]
      summary: Pull loves from Last.fm / ListenBrainz.
      description: |
        Session-only — it uses stored service credentials. Not one code path:
        ListenBrainz returns only a recording MBID so an un-enriched track
        cannot be matched, while Last.fm returns names and can fall back to a
        name match. A love whose track is not in your history is **skipped,
        never invented** — loves point at entities, and entities are things you
        actually played.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { service: { type: string, enum: [lastfm, listenbrainz] } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: integer }
                  skipped: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Notes ──────────────────────────────────────────────────────────────────
  /api/v1/notes:
    get:
      tags: [Notes]
      summary: Your liner notes.
      description: |
        Scope: `read` *(since v0.39)*. Self-only, whatever `visibility` says.

        `q` matches the note's **body and its subject both** — someone looking
        for what they wrote about Burial means either, and asking which is a
        worse answer than searching both. Case-insensitivity is SQLite's `LIKE`,
        which folds ASCII only: `BURIAL` finds `Burial`, `CŒUR` does not find
        `Cœur`.

        `total` is the count **before** filtering, so a search that finds nothing
        reads as a search rather than as an empty account.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free text over the body and the subject. }
        - name: kind
          in: query
          schema: { type: string, enum: [recording, release, artist, listen, period] }
          description: Anything unrecognised means no filter — a stale bookmark should show everything, not nothing.
        - { name: sort, in: query, schema: { type: string, enum: [updated, created, title], default: updated } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
                  total: { type: integer, description: Unfiltered count. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Notes]
      summary: Create or update a note.
      description: |
        Scope: `write` *(since v0.39)*.

        A note hangs off **exactly one** target: `entity_id`, `scrobble_id`, or
        the `period_unit` + `period_key` pair. Editing archives the previous
        body into revisions — but only when the body actually changed, so
        flipping visibility is not a rewrite.

        A **period** target names a week, a month or a year exactly as the
        Reports page does. The key is validated against the shapes
        `reports::period_of` produces and anything else is a 400 — the key is
        the note's identity, so one that page cannot reproduce files a note its
        author can never find again.

        The body is Markdown. `[[track:…]]`, `[[album:…]]`, `[[artist:…]]`,
        `[[track:3]]` and `[[gear:…]]` shortcodes resolve server-side; an
        unresolved one is never an error.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                entity_id: { type: integer }
                scrobble_id: { type: integer }
                period_unit: { type: string, enum: [week, month, year], description: With `period_key`. Both or neither. }
                period_key: { type: string, description: '`2026`, `2026-08` or `2026-W32` — exactly as Reports names it.' }
                body: { type: string }
                visibility: { type: string, enum: [private, patched, public], default: private }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '400': { description: No target named, or a period key Reports would not produce. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notes/{id}:
    get:
      tags: [Notes]
      summary: One note.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notes]
      summary: Delete a note.
      description: 'Scope: `write` *(since v0.39)*. Revisions go with it.'
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notes/{id}/revisions:
    get:
      tags: [Notes]
      summary: A note's history.
      description: |
        Scope: `read` *(since v0.39)*. Opt-in — the read path serves only the
        current body. Notes are meant to be kept, and a rewrite five years on
        should not erase what you thought at the time.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        body: { type: string }
                        archived_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notes/export:
    get:
      tags: [Notes]
      summary: Every note as Markdown, for Obsidian / Logseq / a folder of files.
      description: |
        **Session-only**, unlike the rest of `/notes`. This is the whole of the
        user's own writing in one request; `read` on a token is meant for an app
        showing a note, not for draining the lot.

        `format=zip` (default) gives one file per note with YAML frontmatter —
        `title`, `kind`, `name`, `artist`, `mbid`, `loved`, `visibility`,
        `created`, `updated`, `tags` — plus a `README.md`. `format=md` gives one
        document with a section per note.

        **Shortcodes become wikilinks, and only where they resolve.** `[[…]]` is
        Tapedeck's reference syntax *and* the wikilink syntax of every tool this
        is aimed at, so `[[track:Xtal]]` left as-is would point at a page called
        `track:Xtal` that will never exist. A resolved reference becomes
        `[[Xtal — Aphex Twin]]`, matching that note's own filename by
        construction. An **unresolved** one is left exactly as written: it is
        what the writer typed, and the same judgement the HTML renderer makes.

        Filenames are de-duplicated (`Untitled (2)`), so a wikilink can never
        land on whichever of two files the vault happened to see first.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [zip, md], default: zip } }
      responses:
        '200':
          description: The export.
          content:
            application/zip: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notes/for:
    get:
      tags: [Notes]
      summary: The note for a given target, if any.
      description: 'Scope: `read` *(since v0.39)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: entity_id, in: query, schema: { type: integer } }
        - { name: scrobble_id, in: query, schema: { type: integer } }
        - { name: period_unit, in: query, schema: { type: string, enum: [week, month, year] }, description: With `period_key`. }
        - { name: period_key, in: query, schema: { type: string }, description: '`2026`, `2026-08` or `2026-W32`.' }
      responses:
        '200':
          description: OK. `note` is null when nothing is written yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { oneOf: [{ $ref: '#/components/schemas/Note' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notes/preview:
    post:
      tags: [Notes]
      summary: Render Markdown and resolve shortcodes, without saving.
      description: |
        Scope: `write` *(since v0.39)*. A POST that does not save, but **not** a
        pure read: resolving a shortcode can create the entity it points at, the
        same write-on-read trade `/api/v1/resolve` makes.
      security: [{ sessionCookie: [] }, { apiToken: [write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                entity_id: { type: integer, description: 'Context for positional `[[track:3]]`.' }
      responses:
        '200':
          description: Rendered.
          content:
            application/json:
              schema: { type: object, properties: { body_html: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BadRequest' }

  # ── Sessions ───────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: Listening sessions.
      description: |
        Session-only. Contiguous listening with gaps under 30 minutes. A change
        of submitting token also breaks a session — one token per app is how
        people organise these, so "fooyin stopped, Pano started" is a different
        setup even a minute later.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        uuid: { type: string, description: Stable across merges and splits. }
                        started_at: { type: integer }
                        ended_at: { type: integer }
                        track_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: One session and its listens.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: object, additionalProperties: true }
                  scrobbles: { type: array, items: { $ref: '#/components/schemas/Listen' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sessions]
      summary: Rename or annotate a session.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'] }
                note: { type: [string, 'null'] }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{id}/split:
    post:
      tags: [Sessions]
      summary: Split a session at a listen.
      description: |
        Splitting at the *first* listen is a no-op, not an error — it would
        leave one empty half, which is the session you already had. Aggregates
        are recomputed from the listens rather than adjusted arithmetically.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scrobble_id]
              properties:
                scrobble_id: { type: integer, description: Becomes the first listen of the new session. }
      responses:
        '200': { description: Split., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/merge:
    post:
      tags: [Sessions]
      summary: Merge sessions.
      description: |
        Keeps the **earliest** session's identity — its id and uuid are what
        anything else already refers to. Ownership is checked for every id
        before anything moves, so a merge naming someone else's session changes
        nothing rather than half-completing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 2, items: { type: integer } }
      responses:
        '200': { description: Merged., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/rebuild:
    post:
      tags: [Sessions]
      summary: Start a regroup of every listen into sessions.
      description: |
        Session-only. **Destructive** — it rewrites the column that manual
        merges and splits live in, discarding them. Exists for histories that
        predate session linking, and for imports, which bypass the ingest path
        entirely.

        *(since v0.70.2)* Runs in the **background** and answers `202` with a
        `job_id`; poll `/api/v1/sessions/rebuild/{job_id}`. It used to do the
        work inline, and on a real history that ran past a reverse proxy's
        origin timeout — the browser got a 524 while the rebuild carried on
        unseen, which is worse than failing outright for something destructive.

        One rebuild per user at a time. A second request while one is running is
        a **409** carrying the running `job_id`, so a client can attach to it
        rather than starting a second pass that would clear the first's work
        halfway through.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gap_seconds:
                  type: integer
                  default: 1800
                  description: |
                    Gap that starts a new session. Clamped to 60…86400. The live
                    assigner uses 1800; this is the only place that guess can be
                    reconsidered.
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  state: { type: string, enum: [running] }
        '409':
          description: A rebuild is already running; the body carries its `job_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  error: { type: string }
                  job_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/rebuild/{job_id}:
    get:
      tags: [Sessions]
      summary: How a running regroup is going.
      description: |
        Session-only, and scoped to the caller — an unknown id and someone
        else's are the same 404, so polling cannot be used to learn that a job
        exists.

        The registry is in memory, so a job is lost if the process restarts.
        That is safe rather than merely tolerable: the rebuild is one
        transaction, so a process that dies mid-pass rolls back instead of
        leaving half a regrouping behind — only the progress report is lost.
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  state: { type: string, enum: [running, done, error] }
                  sessions:
                    type: integer
                    description: Sessions written. Only meaningful once `state` is `done`.
                  listens: { type: integer }
                  status: { type: string, description: Human-readable summary, or the error detail. }
                  started_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Chains, gear, devices, bindings ────────────────────────────────────────
  /api/v1/chains:
    get:
      tags: [Chains]
      summary: Signal chains.
      description: |
        Scope: `read` *(since v0.37)*. This is what lets a client offer a chain
        **picker** instead of taking unvalidatable free text for a field that
        has to match a name exactly.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chains: { type: array, items: { $ref: '#/components/schemas/Chain' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chains]
      summary: Create a chain.
      description: |
        Session-only.

        **There is no `is_default`**, and until v0.115.1 this said there was —
        sending it got a 201 and no effect, because unknown fields are ignored.
        A chain is made the default *by* a device binding or an API token; see
        the `Chain` schema.

        A new chain is never `shared`. Sharing is switched on deliberately, from
        the chain drawer or Patch → Decks, and never as a side effect of
        creating something.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, components]
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                icon: { type: string, description: 'A name from `CHAIN_ICONS`; unvalidated.' }
                listening_context:
                  type: string
                  enum: [unknown, active, active-mobile, passive, background]
                  default: unknown
                components:
                  type: array
                  description: |
                    Required — send `[]` for a chain with no steps yet. Each
                    item takes `type` and `name`, optionally `detail`,
                    `equipment_id` and `since`.
                  items:
                    type: object
                    required: [type, name]
                    properties:
                      type: { type: string }
                      name: { type: string }
                      detail: { type: [string, 'null'] }
                      equipment_id: { type: integer }
                      since: { type: integer }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [created] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A chain of that name already exists for this user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/chains/{id}:
    get:
      tags: [Chains]
      summary: One chain.
      description: 'Scope: `read` *(since v0.37)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Chain' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chains]
      summary: Update a chain.
      description: |
        Session-only, and a **whole-record replace** despite the verb — it takes
        the same body as the create. Every field the editor owns is written, so
        an omitted `icon`, `description` or `listening_context` is *cleared*.
        Send the full record back.

        Two fields it deliberately does **not** touch: `shared`, which is
        switched from the chain drawer or Patch → Decks — writing it here would
        un-publish a chain as a side effect of renaming it — and `total_hours`,
        which is derived from the listens.

        A component naming gear the chain did not name before is stamped with
        `since` at the moment of the save. That is what stops a box added to a
        chain with history being credited with all of it; send your own `since`
        to correct the date, which is usually a few days before anybody got
        round to recording it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, components]
              additionalProperties: true
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                icon: { type: string }
                listening_context: { type: string }
                components: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [updated] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chains]
      summary: Delete a chain.
      description: Session-only. Clears referencing rows first — foreign keys are on.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/equipment:
    get:
      tags: [Chains]
      summary: Your gear.
      description: 'Scope: `read` *(since v0.37)*. Hours are derived from the chains that use each piece.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chains]
      summary: Add gear.
      description: |
        Session-only. The type field is **`type`** here and comes back as
        `equipment_type` — see the `Equipment` schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string }
                brand: { type: [string, 'null'] }
                model: { type: [string, 'null'] }
                notes: { type: [string, 'null'] }
                purchased_at: { type: [integer, 'null'], description: Unix seconds. }
      responses:
        '201':
          description: |
            Created — **or matched**. Gear is keyed on `(user, name)`: posting a
            name you already own returns that row's id and stamps `last_used`,
            and every other field you sent is **ignored** rather than applied.
            Use `PATCH /api/v1/equipment/{id}` to change one. Always 201, even
            when nothing was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [created] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/equipment/{id}:
    patch:
      tags: [Chains]
      summary: Update gear.
      description: |
        Session-only. A **whole-record replace**, not a partial patch — every
        field is written, so an omitted `brand` clears the brand. Send the full
        record back.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string }
                brand: { type: [string, 'null'] }
                model: { type: [string, 'null'] }
                notes: { type: [string, 'null'] }
                purchased_at: { type: [integer, 'null'] }
                status:
                  type: [string, 'null']
                  description: '`new`, `spare` or `lent`. Not accepted on create.'
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chains]
      summary: Delete gear.
      description: |
        Session-only. Chains referencing it stay readable — every component
        keeps a name snapshot alongside its optional `equipment_id`.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/chains/variants:
    get:
      tags: [Chains]
      summary: Every chain variant the caller owns.
      description: |
        Session or a token carrying `read`. A variant is a chain with one step
        swapped — two cartridges on one turntable, or the same commute on
        different IEMs. They are one chain and a choice, not two chains.

        Flat rather than nested under each chain, because the page groups them
        itself and one list beats a request per chain.

        `total_hours` here is the listening that went through *this variant*.
        A chain's own `total_hours` includes every variant of it, since they all
        ran through that chain.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variants:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        chain_id: { type: integer }
                        name: { type: string }
                        total_hours: { type: number }
                        overrides:
                          type: array
                          items:
                            type: object
                            properties:
                              position:
                                type: integer
                                description: |
                                  Index into the parent chain's `components`. Past the
                                  end *adds* a step, so a chain that never named a
                                  cartridge can gain one without being rewritten.
                              equipment_id: { type: integer, nullable: true }
                              name: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chains]
      summary: Create a variant.
      description: |
        Session-only. Only the steps that *differ* are stored, which is what
        makes this an override rather than a copy: editing the shared part of a
        chain updates every variant of it.

        The chain and every piece of gear named must be the caller's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chain_id, name]
              properties:
                chain_id: { type: integer }
                name: { type: string, example: Microlinear }
                overrides:
                  type: array
                  items:
                    type: object
                    properties:
                      position: { type: integer }
                      equipment_id: { type: integer, nullable: true }
                      name: { type: string, nullable: true }
      responses:
        '200': { description: Created., content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chains/duplicates:
    get:
      tags: [Chains]
      summary: Chains that look like the same rig, and what folding one would do.
      description: |
        Session-only. The discovery half of the fold below, and the same
        preview-then-apply shape the metadata sanitiser uses: this reports, it
        never acts.

        A pair is reported when the two chains disagree on at most two steps.
        `distance` is how many — `0` is the same wiring under two names, `1` is
        the swapped-box case (the same commute on different IEMs) that variants
        exist for. Past two they are simply different rigs, and a variant
        overriding half a chain is a copy wearing an override's clothes.

        The chain with **more listening** is reported as the base, since it
        keeps its id and fewer rows move — but the fold takes an explicit
        direction, so this is a suggestion rather than the decision.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicates:
                    type: array
                    items:
                      type: object
                      properties:
                        base_chain_id: { type: integer }
                        base_name: { type: string }
                        base_hours: { type: number }
                        fold_chain_id: { type: integer }
                        fold_name: { type: string }
                        fold_hours: { type: number }
                        distance:
                          type: integer
                          description: How many steps disagree. 0 is identical wiring.
                        overrides:
                          type: array
                          description: |
                            What the folded chain becomes as a variant of the base —
                            derived from the two chains, so it credits the gear the
                            folded chain actually named.
                          items:
                            type: object
                            properties:
                              position: { type: integer }
                              equipment_id: { type: integer, nullable: true }
                              name: { type: string, nullable: true }
                        matching_variant:
                          type: array
                          nullable: true
                          description: |
                            `[id, name]` of a variant of the base that is *already*
                            wired the way the duplicate is — the state someone is in
                            when they built the variant and found the old chain still
                            sitting in the list beside it. Null when there is none.
                          items: {}
                        fold_blocked_by_variants:
                          type: boolean
                          description: |
                            This chain carries variants of its own, so it cannot be
                            the side that folds. Surfaced here rather than left for
                            the fold to refuse after it has been picked.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chains/{id}/fold:
    post:
      tags: [Chains]
      summary: Fold this chain into another as a variant of it.
      description: |
        Session-only. **Not reversible.**

        Every listen, side, session, binding, device default and token default
        of this chain is repointed at `into_chain_id` carrying the variant, and
        this chain is then deleted. Because gear hours resolve per
        `(chain, variant)` pair, the moved listening lands on the gear that was
        actually fitted — which is what makes two near-duplicate chains' hours
        add up instead of sitting in two rows that cannot be compared.

        Send **either** `variant_id` (a variant of the target chain you already
        built) **or** `variant_name` (derive a new one from the difference
        between the two chains). Sending both, or neither, is a 400: on an
        endpoint that cannot be undone, "use the one I built" and "make me
        another" must not be the same request with a typo between them.

        Refused with a 400 naming the reason when: the chain is folded into
        itself, the variant belongs to a different chain (it would resolve to
        components never fitted together), the name is already taken on the
        target, or **this chain carries variants of its own** — their positions
        index into components the fold replaces, and re-deriving them would be a
        guess about which box was fitted.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_chain_id]
              properties:
                into_chain_id:
                  type: integer
                  description: The chain to keep. This one becomes a variant of it.
                variant_id:
                  type: integer
                  description: A variant of the target chain that already exists.
                variant_name:
                  type: string
                  description: |
                    Name for a variant derived from the two chains' components.
                  example: Summer
      responses:
        '200':
          description: Folded. The counts are what actually moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant_id: { type: integer }
                  variant_name: { type: string }
                  variant_created:
                    type: boolean
                    description: False when it landed on a variant that already existed.
                  listens: { type: integer }
                  sides:
                    type: integer
                    description: Sides played off the shelf.
                  sessions: { type: integer }
                  releases:
                    type: integer
                    description: Records on the shelf that named this chain.
                  devices: { type: integer }
                  bindings: { type: integer }
                  tokens: { type: integer }
        # Refused, with the reason in the body — a foreign variant, a name
        # already taken, a chain folded into itself, or one carrying variants
        # of its own.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/chains/variants/{id}/promote:
    post:
      tags: [Chains]
      summary: Make this setup the chain, and the chain a setup.
      description: |
        For the common case where the variant is the one you actually use — the
        other cartridge is in the headshell most of the time, so it should be
        what the chain *is*.

        **A relabelling, not a change.** What was fitted for any given listen is
        identical afterwards, and so is every piece of gear's hours.

        That is harder than it looks, and it is the whole of this endpoint. An
        override is `{position, equipment_id}` **relative to the base**, so
        another variant that swaps position 2 means "the base, but with X at 2"
        — change the base and that sentence names different gear at position 1,
        silently, with hours landing on a box that was never fitted. So every
        variant is resolved to an absolute list of steps first and re-expressed
        against the new base afterwards. Listens follow: those on the chain move
        to the new setup that restores it, and those on the promoted setup move
        to the chain.

        `name` is what to call the setup the chain is demoted to — the old base
        has no name of its own, because it *was* the chain. Defaults to
        "Previous setup".

        **Refuses a setup that removes a step** (400): removal shifts every
        later position, so promoting one would change what every other setup's
        overrides point at. Nothing in the UI creates such a setup.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true }
      responses:
        '200':
          description: The promoted setup, and the id of the one the chain became.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: That setup removes a step, or has none. }
        '401': { description: Not signed in. }
        '404': { description: No such setup. }

  /api/v1/chains/variants/{id}:
    patch:
      tags: [Chains]
      summary: Rename a variant or change what it swaps.
      description: Session-only. An omitted field is left alone.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                overrides: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chains]
      summary: Delete a variant.
      description: |
        Session-only. The listens that went through it **keep their chain** and
        fall back to its base components, which is what a null variant means
        everywhere else — they are not deleted along with it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices:
    get:
      tags: [Chains]
      summary: Devices that have reported listens.
      description: 'Scope: `read` *(since v0.37)*.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/devices/{id}:
    patch:
      tags: [Chains]
      summary: Set a device's default chain.
      description: Session-only. Rung 4 of the chain ladder — the coarsest fallback.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { chain_id: { type: [integer, 'null'] } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/bindings:
    get:
      tags: [Chains]
      summary: Output-device bindings.
      description: 'Scope: `read` *(since v0.37)*. Rung 2 of the chain ladder.'
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Chains]
      summary: Bind an output device name to a chain.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_name, chain_id]
              properties:
                output_name: { type: string }
                chain_id: { type: integer }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/bindings/{id}:
    delete:
      tags: [Chains]
      summary: Remove a binding.
      description: Session-only.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Shelf (records, tapes, discs) ──────────────────────────────────────────
  /api/v1/physical:
    get:
      tags: [Shelf]
      summary: Your shelf.
      description: Session-only.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [vinyl, cassette, cd, sacd] }
          description: Narrows to one format. Anything else is ignored rather than rejected.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shelf]
      summary: Add a release to the shelf.
      description: Session-only. Seed from a barcode lookup, or supply the tracklist yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist, title, kind]
              properties:
                artist: { type: string }
                title: { type: string }
                kind:
                  type: string
                  enum: [vinyl, cassette, cd, sacd]
                  description: |
                    The medium. Enforced by a CHECK on the column, so an
                    unrecognised value is a 400 rather than a stored oddity.
                    A **disc has no sides**: its tracklist is one numbered unit
                    per disc, and the UI says "Disc 1" rather than "Side A".
                barcode: { type: string }
                catalog_number: { type: string }
                year: { type: integer }
                mbid_release: { type: string }
                discogs_id: { type: string }
                artwork_url: { type: string }
                notes: { type: string }
                purchased_at:
                  type: integer
                  description: |
                    When you bought it, unix seconds. Optional — most of a shelf
                    is catalogued long after the fact, and a guessed date is
                    worse than a blank one.
                fetch_images:
                  type: boolean
                  default: true
                  description: |
                    Pull the sleeve, labels and booklet from the Cover Art
                    Archive as part of adding it. One request, awaited rather
                    than spawned — the next thing the user does is open the
                    record, and a gallery that fills in thirty seconds later
                    reads as broken. A failure here does **not** fail the add: a
                    record you own is on the shelf whether or not an archive has
                    scans of it. Does nothing without `mbid_release`.
                tracks: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  images: { type: integer, description: How many scans came back from the archive. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/{id}:
    get:
      tags: [Shelf]
      summary: One shelf item, with its sides.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Shelf]
      summary: Edit the shelf-keeping fields.
      description: |
        Session-only. When it was bought, what it is normally played through,
        and the note beside it.

        Every field distinguishes **absent from null**: omitting one leaves the
        column alone, and an explicit `null` clears it. That is not decoration —
        a bare optional reads a *misspelled* key as an explicit null, so a typo
        would clear the chain it was trying to set and answer 200. Same shape and
        the same reason as `default_chain_id` on `PATCH /admin/tokens/{id}`.

        `chain_id` and `equipment_id` are checked against the caller's own rows
        before they are stored.

        `kind` is the exception to the absent/null rule — a format has no
        "cleared" state, so a plain optional is correct. Changing it **rewrites
        the tracklist's sides**, because what a side is depends on the medium: a
        record has a break `assign_sides` has to place by playing time, and a
        disc has none at all. The response reports `sides_rewritten` so a client
        knows the tracklist it is holding is stale.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchased_at: { type: integer, nullable: true }
                chain_id: { type: integer, nullable: true }
                equipment_id: { type: integer, nullable: true }
                notes: { type: string, nullable: true }
                kind: { type: string, enum: [vinyl, cassette, cd, sacd] }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  sides_rewritten: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Shelf]
      summary: Remove a shelf item.
      description: |
        Session-only. Its plays and its images go with it, and any scan files
        the user uploaded are removed from disk — nothing else knows those files
        exist, so leaving them would orphan them permanently.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/durations:
    get:
      tags: [Shelf]
      summary: What another pressing says this record's tracks run.
      description: |
        **Preview only — nothing is written.** Session-only.

        Exists because a record catalogued from Discogs often has no running
        times at all, which used to leave the deck showing three minutes a track
        as though it were a length. The lookup is a *search* (MusicBrainz id if
        the record has one, else barcode, else artist and title), so whatever
        comes back is a **different pressing** and may be ordered differently or
        carry bonus tracks — tracks are therefore matched by title, never by
        position.

        `complete: true` means every track already has a duration and there is
        nothing to do. An empty `durations` with a null `source` means nothing
        with running times was found, which is a normal answer.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete: { type: boolean }
                  unavailable:
                    type: boolean
                    description: |
                      The lookup could not be made — MusicBrainz was busy,
                      throttling, or did not answer inside this endpoint's own
                      20-second deadline. **Still a 200**, deliberately: an
                      upstream being slow is a normal outcome of asking rather
                      than a fault of this server, and a 5xx here is
                      indistinguishable from the reverse proxy's own once it
                      reaches a browser. Distinct from an empty `durations` with
                      no `unavailable`, which means the lookup succeeded and
                      there is nothing.
                  source:
                    type: [object, 'null']
                    description: The pressing the running times came from.
                    additionalProperties: true
                  durations:
                    type: array
                    items:
                      type: object
                      properties:
                        side: { type: string }
                        position: { type: integer }
                        title: { type: string }
                        current: { type: [integer, 'null'], description: What the shelf holds now. }
                        proposed: { type: [integer, 'null'], description: 'Null where nothing matched — never a guess.' }
        '400': { description: That record has no tracklist. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such record. }
    post:
      tags: [Shelf]
      summary: Write the running times that were previewed.
      description: |
        Session-only. Takes the proposals **back** rather than searching again,
        so what lands is what was on the screen — a preview that applies
        something else is worse than no preview.

        Only fills a duration the record does not already have: one that was
        typed in, or that an earlier lookup got right, is never overwritten by a
        later fetch.

        The listens already recorded from those sides are given the same figures,
        because every hours readout derives from `scrobbles.duration`. Their
        **timestamps are not touched** — `physical_plays` records when a side
        started and nothing about when it ended, so where the tracks fell is
        unrecoverable, and re-spacing them would assume the side ran
        uninterrupted.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durations]
              properties:
                durations:
                  type: array
                  items:
                    type: object
                    properties:
                      side: { type: string }
                      position: { type: integer }
                      title: { type: string }
                      current: { type: [integer, 'null'] }
                      proposed: { type: [integer, 'null'] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filled: { type: integer, description: Tracks that gained a duration. }
                  listens_updated: { type: integer, description: Listens already recorded that were corrected. }
                  plays_recomputed:
                    type: integer
                    description: |
                      Side plays whose recorded wear was brought back in line.
                      **Whole-side plays only** — a partial play records how
                      many tracks ran but never which, so its wear cannot be
                      reconstructed and is left alone rather than inflated.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such record. }

  /api/v1/physical/{id}/tracks:
    put:
      tags: [Shelf]
      summary: Replace the tracklist and side split.
      description: |
        Session-only. Sides are **not reliably available from any provider** —
        MusicBrainz records a vinyl track number as "A1" only when an editor
        entered one. When there is no explicit side letter the split is guessed
        by **playing time**, not track count, because a mastering engineer
        balances sides and a nine-minute closer would otherwise land on the
        wrong one. It is still a guess, which is why this endpoint exists.

        None of that applies to a **disc**. A CD or SACD plays start to finish,
        so its tracks are numbered one unit per disc with no guessing at all —
        splitting a CD by playing time would invent a break that is not there.
        The medium's own format string decides which rule applies, not what was
        searched for.


        **It is also how a running time is typed in**, which for a pressing no
        provider carries is the only way one is ever known. That is not
        cosmetic: `scrobbles.duration` is what every hours readout sums and
        `physical_plays.duration_secs` is what the stylus meter reads, so this
        corrects **both** alongside the tracklist rather than leaving three
        answers free to disagree. Whole-side plays only — a partial records how
        many tracks ran and never which, so its wear cannot be reconstructed.


        Unlike `POST /durations`, a value here **overwrites** a stored one. That
        is the whole difference between the two: there the source is another
        pressing and a hand-typed figure must survive it, here the source is the
        person, and refusing their correction would make the field pointless.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracks]
              properties:
                tracks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [side, position, title]
                    properties:
                      side: { type: string, example: A, description: Side letter, or the disc number for a CD/SACD. }
                      position: { type: integer, example: 1, description: Track number within the release. }
                      title: { type: string }
                      artist: { type: [string, 'null'] }
                      duration_secs:
                        type: [integer, 'null']
                        description: >
                          Seconds. Null means "still unknown", which is a real
                          answer and not a zero — a side with any unknown track
                          reports no running time rather than an invented sum.
                      disc: { type: [integer, 'null'], description: Which physical disc of a set, from 1. }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status: { type: string }
                  changed: { type: integer, description: Running times that differ from what was stored. }
                  listens_updated: { type: integer }
                  plays_recomputed: { type: integer }
        '400': { description: Empty tracklist, a duplicated side and position, or a running time of zero or less. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/play:
    post:
      tags: [Shelf]
      summary: Record a side as played.
      description: |
        Session-only. **Writes one listen per track, not one per side** — every
        counting query in Tapedeck is over listens, so a side-shaped row would
        be invisible to all of them.

        Timestamps are the one inferred thing here: you observed when the side
        *started*, so tracks are spaced by their running times. A track of
        unknown length gets three minutes — wrong but bounded, where stacking
        them on one instant would break session grouping and the hour-of-day
        heatmap outright.

        Per-track outcomes from the browser deck are taken as authoritative: a
        side laid out from a start time can only describe an uninterrupted play.
        A skipped track is stored, excluded from every count, and never
        forwarded — and does not accrue gear hours.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side: { type: string, example: A }
                started_at: { type: integer, description: Unix seconds. Defaults to now minus the side's running time. }
                chain_id: { type: [integer, 'null'] }
                equipment_id: { type: [integer, 'null'] }
                from_position:
                  type: integer
                  description: |
                    The first track that actually played, when the side did not
                    start at its beginning. **Load-bearing**: a listen is written
                    for every track on the side, so without this, starting at
                    track 4 silently records tracks 1–3 as played. They are not
                    written at all — and in particular not written as *skips*,
                    since a track you never reached is not one you skipped, and
                    `skipped` feeds skip-rate analytics. Wear is credited only
                    for the part that played.
                parked_secs:
                  type: integer
                  description: |
                    Where a tape ended up, in seconds into the side. **Cassettes
                    only** — the server refuses it for any other medium, because
                    a record has random access and no such state. Clamped to the
                    side's own length. Absent means the side ran through, and
                    the tape is wound back.
                tracks:
                  type: array
                  description: |
                    Per-track results from the deck, when it drove the play.
                    Authoritative where present — the browser ran the clock, so
                    it is the only thing that saw the pauses and the skips.
                  items:
                    type: object
                    properties:
                      position: { type: integer }
                      started_at: { type: integer }
                      skipped: { type: boolean }
      responses:
        '200':
          description: Logged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  listens_added: { type: integer }
                  skipped: { type: integer }
                  tracks: { type: integer }
                  duration_secs: { type: integer }
                  started_at: { type: integer }
                  next_side: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/lookup:
    get:
      tags: [Shelf]
      summary: Resolve a barcode to a pressing.
      description: |
        Session-only. Discogs first when configured — it catalogues *pressings*,
        so a barcode usually resolves to the exact edition, often with real side
        letters that MusicBrainz lacks. Falls back to MusicBrainz.

        Barcodes may be sent with or without the printed spacing; the unspaced
        form a scanner produces matches slightly **more** often.
      parameters:
        - { name: barcode, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, description: Free text, when there is no barcode. } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/{id}/sides:
    get:
      tags: [Shelf]
      summary: How often each side has been played, and for how long.
      description: |
        Session-only. A record has a side you reach for and a side you rarely
        turn over, and the release's own totals cannot say which is which.

        Everything here is derived from the sides played on read — never a
        counter — so it cannot drift from the plays it counts, and deleting a
        play takes its wear back with it. `secs` is the running time of the
        tracks that actually played, which is the same figure the stylus is
        charged for: a side started at track four counts four tracks' worth.
        It is nominal rather than wall clock.

        **Only sides with plays are returned.** A side that has never been
        played is not an entry with zeros — the caller holds the tracklist and
        fills those in. That also means a side may appear that is not on the
        tracklist at all: re-filing a release rewrites its sides (a vinyl A/B
        becomes a CD's 1) while its plays keep the label they were recorded
        with, and dropping those would leave the sides summing to less than the
        release total with nothing to say why.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sides:
                    type: array
                    items:
                      type: object
                      properties:
                        side: { type: string, description: As recorded — "A", "B", or a disc number. }
                        plays: { type: integer }
                        secs: { type: integer, description: Running time played, summed over every play. }
                        last_played: { type: integer, nullable: true, description: Unix seconds. }
        '404': { description: No such record. }

  /api/v1/physical/{id}/images:
    get:
      tags: [Shelf]
      summary: Every scan held for a pressing.
      description: |
        Session-only. Sleeves, labels, obi strips and booklet pages — the parts
        of a record you actually hold, which is why they are rows rather than
        one more `artwork_url` column. The Cover Art Archive carries 29 for a
        typical CD, 19 of them booklet pages.

        Each entry carries a single `src` and `thumb` whichever provenance it
        came from: a provider's image is its own URL, an uploaded scan is a
        Tapedeck URL that checks who is asking. The server's own file layout is
        never in the response.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind:
                          type: string
                          description: |
                            `front`, `back`, `booklet`, `medium`, `spine`, … Free
                            text rather than an enum: the archive's vocabulary
                            grows (`Panel` appears in none of its documentation
                            and is on real releases), and a scan of something it
                            has no word for is still a scan.
                        provider: { type: string, enum: [caa, discogs, upload] }
                        src: { type: string }
                        thumb: { type: string }
                        caption: { type: string, nullable: true }
                        position: { type: integer }
                        bytes: { type: integer, nullable: true }
                        mime: { type: string, nullable: true }
                        added_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shelf]
      summary: Upload scans of your own copy.
      description: |
        Session-only. `multipart/form-data`: any number of file fields, plus
        optional `kind` and `caption` text fields that apply to all of them —
        which is what makes uploading a booklet in one go work, since the files
        land in the order they are sent.

        The declared content type decides the stored extension; a filename from
        the client never reaches the path. Max 24 MB per image.

        Uploads are files on the server rather than blobs in the database, so
        `GET /api/v1/backup` does **not** carry them — `GET /api/v1/physical/export`
        is what does.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                kind: { type: string }
                caption: { type: string }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids: { type: array, items: { type: integer } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Larger than 24 MB. }
        '415': { description: Not an image type this server stores. }

  /api/v1/physical/{id}/images/fetch:
    post:
      tags: [Shelf]
      summary: Pull the sleeve from the Cover Art Archive.
      description: |
        Session-only. Runs when the user asks rather than on a clock: the
        archive is not going to change under a record that has been on a shelf
        for thirty years, and the one case that does — an editor uploading the
        booklet you were missing — is exactly the case where the user knows and
        Tapedeck cannot.

        **Idempotent** on the provider's own image id, so re-running this adds
        what is new and leaves the rest alone rather than stacking a second copy
        of all nineteen booklet pages on top of the first.

        Discogs runs second and only when a credential is configured; it says
        only "primary" or "secondary" about an image, so everything but the
        cover lands in `other` for the user to file. A pressing with no
        MusicBrainz id is **not** an error — it comes back with a note saying
        there is nothing to look it up by.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: integer }
                  total: { type: integer }
                  notes: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/images/{id}:
    patch:
      tags: [Shelf]
      summary: Re-file, caption or reorder a scan.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                caption: { type: string, nullable: true }
                position: { type: integer }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Shelf]
      summary: Remove a scan.
      description: |
        Session-only. An uploaded file is deleted from disk with the row and
        cannot be recovered; a provider's image is only unlinked and can be
        fetched again.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/images/{id}/file:
    get:
      tags: [Shelf]
      summary: An uploaded scan's bytes.
      description: |
        Session-only, and scoped to the caller by `(id, user_id)` — these are
        photographs of someone's own possessions and ids must not be walkable,
        the same rule the artwork proxy keeps.

        Cached hard, because a scan never changes once uploaded, but `private`:
        it is per-user, and a shared cache holding it would serve it to the next
        person through the proxy. A provider-hosted image 404s here — it has a
        URL of its own and this server is not in front of it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: The image., content: { 'image/*': { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/{id}/now-playing:
    post:
      tags: [Shelf, Now Playing]
      summary: A side is on the deck.
      description: |
        Session-only. The shelf is the one source where the **browser** is the
        player: the clock runs in front of the turntable, in localStorage, and
        nothing server-side can derive a playhead from a stack of rows. So the
        deck pushes here, where Plex, Jellyfin and Navidrome are polled.

        Call it on every track change, on pause and resume, and on a heartbeat
        of about ten seconds. The heartbeat is **not optional**: the registry
        expires an entry by running past the end of the track it knows about, so
        a paused record would drop off the dashboard one track length after it
        was paused.

        Now-playing is forwarded to the user's Last.fm and ListenBrainz only
        when the track actually **changed**, and never while paused — their
        now-playing is a one-shot that expires on its own, so re-sending it on
        every heartbeat is noise aimed at someone else's servers. The listens
        themselves are written by `/play` when the side comes off; this endpoint
        stores nothing.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, position]
              properties:
                side: { type: string, example: A }
                position: { type: integer, description: The track's position on that side. }
                elapsed: { type: integer, description: Seconds into that track. }
                paused: { type: boolean }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: boolean, description: Whether this was a different track from the last report. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/now-playing:
    delete:
      tags: [Shelf, Now Playing]
      summary: Nothing is on the deck.
      description: |
        Session-only. Its own route rather than a field on the push, because it
        is also what *cancelling* a side means and that has no track to name.
        Clears only entries this shelf reported — an idle turntable must not
        wipe a now-playing the user's phone is currently sending over ingest.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/import:
    post:
      tags: [Shelf]
      summary: Put a shelf back from an export.
      description: |
        Session-only, `multipart/form-data`, 256 MB maximum. The counterpart of
        `GET /api/v1/physical/export`, and deliberately **not** a database
        restore: it brings back the *objects* — pressings, tracklists, gear,
        the sides played, and your own scans.

        What it cannot bring back is the **listening**. A shelf export holds no
        `scrobbles`, so the listens a side generated are not in the file, and
        the chain hours derived from them do not return with the objects. The
        response says so rather than leaving it to be discovered.

        **Everything is matched before it is inserted**, so importing the same
        archive twice changes nothing the second time. A pressing is matched on
        its barcode or release MBID when it has one, and otherwise on artist,
        title and medium together; a side played is matched on its side and
        timestamp, so re-importing cannot double the wear on a stylus.

        Signal chains are **matched by name, never created** — the same rule
        `[[gear:…]]` follows. A chain is something you build step by step, and
        conjuring an empty one from a name in a file would silently attribute
        listens to a chain with no components. Gear *is* created, since a piece
        of equipment is fully described by the file.

        Nothing is written until `shelf.json` parses, so an unrelated or
        truncated zip fails before it has half-populated a shelf.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases: { type: integer, description: Pressings added. }
                  already_on_the_shelf: { type: integer, description: Matched an existing pressing and left alone. }
                  skipped: { type: integer, description: Entries that could not be read. }
                  gear: { type: integer }
                  images: { type: integer }
                  missing_scans: { type: integer, description: Listed in the manifest but absent from the archive. }
                  plays: { type: integer, description: Sides played, restored. }
                  note: { type: string, description: What a shelf export cannot carry. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Larger than 256 MB., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/physical/spin:
    get:
      tags: [Shelf]
      summary: The side currently on the deck.
      description: |
        Session-only. Returns `{ "spin": null }` when nothing is on.

        The shelf is the one source where the *browser* is the player, so the
        countdown runs in the page — but what is on and when it started live
        here. That is what lets a second device see the record, and what makes a
        side survive a browser crash.

        A spin whose release has since been deleted is cleared and reported as
        nothing on, rather than returned as a dangling id.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spin:
                    nullable: true
                    type: object
                    properties:
                      release_id: { type: integer }
                      kind: { type: string, enum: [vinyl, cassette, cd, sacd] }
                      artist: { type: string }
                      title: { type: string }
                      artwork_url: { type: string, nullable: true }
                      mbid_release: { type: string, nullable: true }
                      side: { type: string }
                      started_at: { type: integer }
                      paused_at: { type: integer, nullable: true, description: Null while running. }
                      paused_total: { type: integer, description: Seconds spent stopped. }
                      outcomes: { type: array, items: { type: object, additionalProperties: true } }
                      chain_id: { type: integer, nullable: true }
                      equipment_id: { type: integer, nullable: true }
                      start_secs:
                        type: integer
                        description: |
                          How far into the side this spin began. Non-zero when the
                          needle was dropped mid-side, or a tape resumed from where
                          it was parked.
                      updated_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Shelf]
      summary: Put a side on the deck, or update the one that is on.
      description: |
        Session-only. One deck per user — the table's primary key is the user,
        because nobody listens to two records at once, so starting a second side
        replaces the first rather than erroring.

        The whole state is sent every time rather than a patch per field: it is
        half a dozen small numbers, it changes only on real events (start,
        pause, skip, next track), and a partial update would let two devices
        interleave into a state neither of them meant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id, side, started_at]
              properties:
                release_id: { type: integer }
                side: { type: string }
                started_at: { type: integer }
                paused_at: { type: integer, nullable: true }
                paused_total: { type: integer, default: 0 }
                outcomes: { type: array, items: { type: object, additionalProperties: true } }
                chain_id: { type: integer, nullable: true }
                equipment_id: { type: integer, nullable: true }
                start_secs: { type: integer, default: 0, description: How far into the side it began. }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such record., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Shelf]
      summary: Take the side off the deck.
      description: |
        Session-only. Clears the now-playing entry as well, so the two cannot
        disagree. Recording a side (`POST /api/v1/physical/{id}/play`) clears it
        too — otherwise reopening the page would offer to resume a side that has
        already been logged, which is how one gets logged twice.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/export:
    get:
      tags: [Shelf, Export]
      summary: The whole shelf as a zip.
      description: |
        Session-only. `shelf.json` (pressings, purchase dates, tracklists and an
        image manifest), `plays.csv` (every side played, oldest first, gear
        named), `gear.json` (equipment and chains with purchase dates) and
        `scans/` — the images the **user uploaded**, one directory per pressing.

        Images that live at the Cover Art Archive or Discogs are listed with
        their URLs rather than copied in: they are not the user's to
        redistribute and they are still there to fetch. Their own scans exist
        nowhere else, which is why those are the ones in the file.

        This exists separately from `GET /api/v1/backup` for a concrete reason:
        a backup is a `VACUUM INTO` snapshot of the database, and uploaded scans
        are files beside it rather than rows inside it. A backup and this export
        together are the whole shelf.
      responses:
        '200': { description: A zip archive., content: { application/zip: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/discogs/{id}:
    get:
      tags: [Shelf]
      summary: A Discogs release, with its tracklist positions.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/physical/equipment/{id}/wear:
    get:
      tags: [Shelf]
      summary: Stylus hours or head wear for a piece of gear.
      description: Derived from `physical_plays`. A duplicate submission is not counted as wear.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/settings/discogs:
    get:
      tags: [Shelf, Settings]
      summary: Whether Discogs is configured.
      description: Session-only. Never returns the credential itself.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  shape: { type: [string, 'null'], enum: [token, key_secret, null] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Shelf, Settings]
      summary: Store a Discogs credential.
      description: |
        Session-only. Accepts **either** a personal access token **or** a
        consumer key/secret pair — either is enough, since Tapedeck only reads
        the public database. The three-legged OAuth flow is deliberately not
        implemented: it exists so an app can act *as a user*, and registering an
        app hands you a key and secret that work directly. Stored encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                key: { type: string }
                secret: { type: string }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/physical/settings/discogs/test:
    post:
      tags: [Shelf, Settings]
      summary: Verify the stored Discogs credential.
      description: |
        Session-only, and **necessary rather than a nicety**: Discogs does not
        reject a bad credential. With a bogus key and secret, `/releases/1` and
        `/database/search` both return a normal 200 with real data, and the
        rate-limit header reads the *authenticated* 60 — the limit is raised for
        the presence of an `Authorization` header without checking its contents.
        `/users/{username}` is the one endpoint that actually verifies, and is
        what this calls. Without it, a typo is indistinguishable from a working
        credential.
      responses:
        '200':
          description: Result of the check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── AudioMuse-AI (amai) ────────────────────────────────────────────────────
  /api/v1/amai/settings:
    get:
      tags: [Settings, AudioMuse-AI]
      summary: Whether the AudioMuse-AI sidecar is configured.
      description: |
        Admin, session-only. Returns the address — which is not a credential and
        is shown the way a source's URL is — and never the API token.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  url: { type: [string, 'null'] }
                  has_token: { type: boolean }
                  server: { type: [string, 'null'] }
                  stored: { type: boolean }
                  from_env: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }
    put:
      tags: [Settings, AudioMuse-AI]
      summary: Point this instance at an AudioMuse-AI instance.
      description: |
        Admin, session-only — a token gets 401 and scopes never enter into it,
        the line `/api/v1/sources` already sits on. Server-wide rather than
        per-user: amai is one box the operator runs over one library, and every
        user here reads the same catalogue. Stored encrypted, and a stored value
        beats `TAPEDECK_AMAI_URL` / `_TOKEN` / `_SERVER`.

        Each field is written only when present, so saving one does not wipe
        another; clearing is an explicit empty string. An address with no
        `http://` or `https://` scheme is a 400 rather than being guessed at —
        guessing `http` would silently downgrade an instance meant to be reached
        over TLS.

        `server` names which of amai's own media servers this instance's
        provider ids belong to (its display name or internal id). Absent means
        amai's default server, which is the whole answer on a single-server
        install.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                token: { type: string }
                server: { type: string }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { type: object, properties: { configured: { type: boolean } } } } } }
        '400': { description: The address is unusable. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }

  /api/v1/amai/test:
    post:
      tags: [Settings, AudioMuse-AI]
      summary: Is AudioMuse-AI there, and does the token work?
      description: |
        Admin, session-only. **Two questions, reported separately**, because
        they need completely different things doing about them and a screen
        that only says `ok: false` makes them the same colour. amai's own
        `before_request` barrier exempts `/api/health` and nothing else, so
        reachability is answerable without a credential and a bad token is a
        clean 401 — the inverse of the Discogs trap, where a bad credential is
        served as a normal 200.

        A rejection is a 200 with `ok: false`, not an HTTP error: the request to
        Tapedeck succeeded and the answer is "no".

        `servers` carries only `server_id`, `name`, `server_type` and
        `is_default`. amai's own response also holds a masked `creds` map;
        nothing here stores or logs it.
      responses:
        '200':
          description: Result of the check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reachable: { type: boolean }
                  authenticated: { type: boolean }
                  message: { type: string }
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        server_id: { type: string }
                        name: { type: string }
                        server_type: { type: string }
                        is_default: { type: boolean }
        '400': { description: Not configured on this server. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }

  /api/v1/amai/coverage:
    get:
      tags: [Settings, AudioMuse-AI]
      summary: How much of this history can AudioMuse-AI answer for?
      description: |
        Admin, session-only. The measurement that decides whether anything is
        worth building on the sidecar, and it narrows in three steps.

        **The structural ceiling.** A listen joins to amai on a media-server
        provider id, so one that never came off Plex, Jellyfin or Navidrome
        cannot join at all whatever amai has analysed. `joinable_*` is that,
        computed over the whole history because it is a plain string test.

        **What amai has**, measured on the most-played tracks. Weighted by
        plays rather than sampled evenly, because a track played fifty times is
        worth fifty times as much to anything built on these vectors.

        **What the sample is a sample of** — `sample_share_of_listening` — so
        the figure above is never read as a fact about the whole history. A
        share stated without its population is the fidelity-card failure.

        One request per track against amai, so the handler owns a deadline
        rather than trusting N × the client timeout. `deadline_hit` says when it
        stopped early, and a failed ask is never counted as a miss: `error`
        carries the first one.
      parameters:
        - name: sample
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The measurement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_plays: { type: integer }
                  distinct_tracks: { type: integer }
                  joinable_tracks: { type: integer }
                  joinable_plays: { type: integer }
                  joinable_share_of_listening: { type: [number, 'null'] }
                  asked: { type: integer }
                  analysed: { type: integer }
                  analysed_share_of_asked: { type: [number, 'null'] }
                  analysed_share_of_sampled_listening: { type: [number, 'null'] }
                  sample_share_of_listening: { type: [number, 'null'] }
                  sample_requested: { type: integer }
                  deadline_hit: { type: boolean }
                  error: { type: [string, 'null'] }
                  server_asked: { type: [string, 'null'] }
                  examples_not_analysed:
                    type: array
                    items:
                      type: object
                      properties:
                        artist: { type: string }
                        title: { type: string }
                        plays: { type: integer }
        '400': { description: Not configured, or there are no listens to measure. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }

  # ── Genre map ──────────────────────────────────────────────────────────────
  /api/v1/genre-map:
    get:
      tags: [Genre map]
      summary: The map, your genres on it, and your average colour.
      description: |
        Session-only. The canvas is 1500 × 22,648 — fifteen times taller than
        wide — so a client must compress the y axis **in the coordinates**, not
        with `preserveAspectRatio`, which would squash the circles into ellipses
        too.

        `colour` is blended in **linear light**, not sRGB; mixing gamma-encoded
        values drags every user toward the same brown-grey.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    type: object
                    properties:
                      width: { type: number }
                      height: { type: number }
                      points:
                        type: array
                        description: '`[name, x, y, colour]` per genre — positional to keep ~6,300 rows small.'
                        items: { type: array }
                  mine:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        x: { type: number }
                        y: { type: number }
                        color: { type: string }
                        plays: { type: integer }
                  colour: { type: [string, 'null'], example: '#a18430' }
                  placed_tags: { type: integer }
                  unplaced_plays: { type: integer, description: 'Plays on tags with no place on the map — instruments, nationalities, roles.' }
                  listens_total: { type: integer }
                  listens_with_genres: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: The map has not been fetched yet. Run the scrape in Settings. }

  /api/v1/genre-map/trajectory:
    get:
      tags: [Genre map]
      summary: Where your listening sat, period by period.
      description: |
        Session-only. The play-weighted centroid of each period.

        Three honesty constraints, all load-bearing. It is an **artist-mix**
        trajectory, not a track-level one — every track by an artist carries
        that artist's genres and sits at the same point. A period under 25
        placed plays is **omitted, not drawn**, because a centroid from four
        listens reads as a real movement inside a path. And each period reports
        its own enrichment coverage, to be drawn faintly below 90% — the genre
        backfill runs newest-first, so a time-sliced view is the one most
        distorted by a half-done pass.

        The server picks month or year by how much history there is and says
        which it used. Buckets are in the user's own timezone.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { type: string, enum: [year, month] }
                  min_plays: { type: integer }
                  years:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: string }
                        x: { type: number }
                        y: { type: number }
                        plays: { type: integer }
                        colour: { type: [string, 'null'] }
                        listens: { type: integer }
                        enriched: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/genre-map/neighbours:
    get:
      tags: [Genre map]
      summary: What sits next to your listening.
      description: |
        Session-only. Walks Every Noise's precomputed adjacency, seeded from
        your top 25 genres.

        **This does not recommend music**, and the response shape is what
        enforces that. Two artist fields that are never both populated on the
        same card:

        * `your_artists` — from **your own history**. Only ever set on
          `next_door`.
        * `exemplar_artists` — **Every Noise's own exemplars**, for a genre you
          own nothing in. These name music you do not have. Any client showing
          them owes the reader that provenance, in words and in styling.

        `exemplar_artists` is empty until a tier-2 scrape has run — a
        tier-1-only instance has adjacency but no exemplars. Say so rather than
        rendering bare cards that look like a bug.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded_from: { type: integer }
                  next_door:
                    type: array
                    description: Bordering genres you already own music in and underplay. This half leads.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
                  unexplored:
                    type: array
                    description: Bordering genres you own nothing in.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
                  opposite:
                    type: array
                    description: Furthest from your listening. Suggests nothing by construction.
                    items: { $ref: '#/components/schemas/NeighbourGenre' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: None of your genres are on the map yet. }

  # ── Rediscovery ────────────────────────────────────────────────────────────
  /api/v1/rediscovery:
    get:
      tags: [Rediscovery]
      summary: Five lists, all built from your own history.
      description: |
        Session-only. Nothing here points at music you do not own — that is the
        design, not an implementation detail.

        "Not lately" is a **parameter, not a constant**: six months is a long
        gap for a daily listener and no gap at all otherwise. The seasonal list
        excludes the current year, or it would just be "recently played".
      parameters:
        - { name: months, in: query, schema: { type: integer, default: 6 }, description: How long counts as "not lately". }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/rediscovery/gear/{id}:
    get:
      tags: [Rediscovery]
      summary: Favourites never heard on a piece of gear.
      description: |
        Session-only. Answered by joining `chain_id` to the chains whose
        components reference the gear — no per-listen equipment field needed.
        Restricted to tracks played more than once: the interesting question is
        how your *favourites* sound on it.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Playlists ──────────────────────────────────────────────────────────────
  /api/v1/playlist-lab:
    get:
      tags: [Playlists]
      summary: The vector space the Playlist Lab generates from.
      description: |
        Session-only. Returns the candidate pool with a position for each track,
        plus what every axis means.

        **Read `granularity` and `note` before using this.** The space is ten
        real dimensions, and they come from two different places:

        * **Six are about the music** (`group: sound`), from the Every Noise
          genre map — `x` (dense/atmospheric ↔ spiky/bouncy), `y` (organic ↔
          mechanical/electric), the colour's three channels, and how far apart a
          track's own genres sit.
        * **Four are about the listener** (`group: habit`) — era, familiarity,
          hour of day, recency — from their own history.

        These are **not** per-recording audio features. Genres attach to
        artists, so `granularity` is `artist` and every track by one artist
        shares its six `sound` coordinates exactly; the `habit` axes are the
        only thing separating them. Anything describing this as track-level
        audio similarity is wrong. A client mixing the two groups without
        weighting will find "similar" quietly means "played at the same hour".

        Values are normalised 0–1 against **the pool's own extremes**, so
        "newer" means newer than the rest of this collection. A track whose
        genres have no place on the map is **dropped, not centred** — placing it
        in the middle would invent a similarity it does not have — and the count
        comes back as `unplaced`.

        `tracks` is compact — `[title, artist, album, plays, [v0…v9]]` — because
        on a 3,000-track pool the repeated key names would be most of the
        payload. Answers `409` when the genre map has not been fetched, when
        there is no history, or when nothing has been placed yet.
      parameters:
        - { name: min_plays, in: query, schema: { type: integer, default: 2, minimum: 1, maximum: 50 }, description: 'Loved tracks bypass this entirely.' }
        - { name: cap, in: query, schema: { type: integer, default: 3000, minimum: 50, maximum: 10000 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dims:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        low: { type: string, description: What the low end of the axis means. }
                        high: { type: string }
                        group: { type: string, enum: [sound, habit] }
                  tracks:
                    type: array
                    description: '`[title, artist, album, plays, vector]` per track.'
                    items: { type: array }
                  loved: { type: array, items: { type: integer }, description: Indices into `tracks`. }
                  pool: { type: integer }
                  considered: { type: integer, description: Distinct tracks before the pool rules. }
                  unplaced: { type: integer, description: Dropped for having no placeable genre. }
                  min_plays: { type: integer }
                  granularity: { type: string, enum: [artist] }
                  note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: No genre map, no history, or nothing placed yet. }

  /api/v1/playlist-targets:
    get:
      tags: [Playlists]
      summary: Servers a generated list can be sent to.
      description: |
        Session-only, and permanently so: pushing spends the credential of a
        configured source, which puts it on the same side of the line as
        `/api/v1/sources` — the line API tokens do not cross.

        The targets are the caller's **enabled** sources, filtered to the kinds
        that can receive a playlist. `protocol` names the wire protocol rather
        than the product, so a Navidrome source reads as `Subsonic`: the calls
        are `search3` and `createPlaylist`, which any OpenSubsonic server
        answers. A kind missing from the list is a source that polls and cannot
        be written to, not a bug.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        source_id: { type: integer }
                        kind: { type: string, enum: [plex, jellyfin, navidrome] }
                        protocol: { type: string, enum: [Plex, Jellyfin, Subsonic] }
                        label: { type: string, description: Falls back to the protocol name when the source has none. }
                        account: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/playlists:
    post:
      tags: [Playlists]
      summary: Create a playlist on one of your servers from a list of tracks.
      description: |
        Session-only — see `/api/v1/playlist-targets`.

        Tapedeck stores **names, not the server's item ids**, for a generated
        list, so every track is resolved by searching the target and every one of
        those searches is fuzzy. A hit is checked on artist *and* title before it
        is used; an exact title beats a `(Remastered)` one, and a hit for a
        different artist is discarded rather than taken.

        **A partial push is a success, not an error.** A listening history is not
        the same set as any one library, so `matched` below `requested` is the
        normal case and `missing` names every track that did not land. The push
        only fails outright when nothing matched (`404`) or the server refused or
        could not be reached (`502`) — the two need completely different things
        from the user, so they are not collapsed.

        Order is preserved; misses drop out. At most 100 tracks, which is a
        wall-clock bound as much as a politeness one — the searches run in turn
        against what is often a Raspberry Pi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, name, tracks]
              properties:
                source_id: { type: integer, description: From `/api/v1/playlist-targets`. }
                name: { type: string, description: Trimmed, truncated to 120 characters. }
                tracks:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [title, artist]
                    properties:
                      title: { type: string }
                      artist: { type: string }
                      album: { type: string, nullable: true, description: A tiebreaker between pressings, never a requirement. }
      responses:
        '200':
          description: Created — possibly with fewer tracks than asked for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist_id: { type: string, description: 'The server''s own id. Empty when a Subsonic server answered `ok` without one.' }
                  name: { type: string }
                  protocol: { type: string }
                  target: { type: object, additionalProperties: true }
                  requested: { type: integer }
                  matched: { type: integer }
                  missing:
                    type: array
                    description: |
                      Every track that did not land, and **why**. A partial
                      match is the normal outcome — a listening history is not
                      the same set as any one library — and the reason is what
                      distinguishes a search problem from a matching one.
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        artist: { type: string }
                        album: { type: string, nullable: true }
                        reason:
                          type: string
                          enum: [search_failed, no_candidates, artist_mismatch, title_mismatch]
                          description: |
                            `no_candidates` — the server answered with nothing;
                            its search did not find the track for that query.
                            `artist_mismatch` — it offered tracks, none by this
                            artist. `title_mismatch` — the artist agreed and no
                            title did. `search_failed` — the request itself
                            failed.
                        offered:
                          type: array
                          description: |
                            What the server actually returned, de-duplicated on
                            the label and capped at five — artist names for
                            `artist_mismatch`, titles for `title_mismatch`. This
                            is the field that settles it at a glance: asked for
                            one spelling and offered another says exactly what is
                            wrong.

                            Each entry carries the far end's own `id`, so a
                            candidate can be **chosen** rather than only read:
                            POST it to `/api/v1/playlist-matches` and every later
                            push of that track uses it.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: |
                                  The far end's id for this track. Opaque — it
                                  only ever goes back to the server that made it.
                              label: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such source, or none of those tracks are on it. }
        '502': { description: The server refused the playlist or could not be reached. }

  /api/v1/playlist-matches:
    post:
      tags: [Playlists]
      summary: Pin a track to one of the candidates a push offered.
      description: |
        Session-only, like the push it serves.

        A push reports every miss with the candidates the far end offered.
        Until this existed that list was a dead end — plausible names you could
        read and not act on. Choosing one records a **manual** resolution, which
        never expires and is never overwritten by a later automatic guess: a
        person read the candidates and settled it, and a search that already got
        it wrong once does not get another vote.

        This is also what makes the resolution cache self-improving. Every
        successful match is remembered, so a re-push costs almost no searches at
        all — which matters because the far end meters them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, artist, title, remote_id]
              properties:
                source_id:
                  type: integer
                  description: The target this resolution is for. `-1` is TIDAL.
                artist: { type: string }
                title: { type: string }
                remote_id:
                  type: string
                  description: An `id` from a miss's `offered` list.
                remote_label:
                  type: string
                  nullable: true
                  description: What the far end calls it, kept so the mapping can be shown back.
      responses:
        '200': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Playlists]
      summary: Forget a resolution.
      description: |
        Session-only. The pick was wrong, or the far end has changed what it
        holds; the next push searches for the track again from scratch. Takes
        the same body without `remote_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, artist, title]
              properties:
                source_id: { type: integer }
                artist: { type: string }
                title: { type: string }
      responses:
        '200': { description: Forgotten. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Settings ───────────────────────────────────────────────────────────────
  /api/v1/preferences:
    get:
      tags: [Settings]
      summary: User preferences.
      description: Session-only.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  theme: { type: string, enum: [light, dark, system] }
                  timezone: { type: string, description: 'IANA region, e.g. `Europe/Berlin`.' }
                  week_start: { type: integer, description: '0 = Sunday.' }
                  show_artwork: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      summary: Update preferences.
      description: |
        Session-only. Omitted keys are left alone.

        `timezone` must be an **IANA region**, not a fixed abbreviation. The
        region carries the DST rules — `Europe/Berlin` *is* CET in winter and
        CEST in summer, switching on the right dates by itself, and a region
        with no summer time never shifts. Storing `CET` would freeze the offset
        and put half a European year an hour out, silently: listens would still
        store correctly and only "today", the hour-of-day heatmap and the
        trajectory buckets would be wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/scrobble-settings:
    get:
      tags: [Settings]
      summary: When a listen counts — follow the same rule the server does.
      description: |
        Half the track **or** four minutes, whichever comes first, is only the
        *default*: it is a per-user setting, because that convention fits a
        three-minute pop song far better than a forty-minute raga or a
        ninety-second hardcore track. A client that hardcodes it disagrees with
        the listener's own choice, silently, and nothing anywhere errors.

        Following it is not cosmetic agreement. The same threshold decides
        whether a track this client announced as now-playing and never
        scrobbled is written off as a **skip** — so submitting later than this
        rule banks the listen *and* leaves a skip behind it, and submitting
        earlier puts a listen on a permanent public record that the listener's
        own setting says had not been heard.

        Reported **as the server computes it, never as stored**: the values are
        clamped (fraction 0.05–1.0, seconds 10–3600), so a preferences object
        holding nonsense reads as the number every source here actually uses.
        `GET /api/v1/preferences` serves the raw blob and is session-only.

        Accepts a plain **`submit`** token, not `read`: this read exists only to
        decide a submission, and putting it behind `read` would make every
        scrobble client carry read access to the whole listening history to
        learn one number it is obliged to obey.

        It is its own endpoint rather than more keys on `/1/validate-token` —
        the opposite call from the introspection there, and deliberately. Those
        keys describe the *token*, are asked once at setup, and stay correct
        when cached. This is a setting, changed from a settings screen at any
        time; cached from a setup handshake it would go quietly stale, which is
        the failure this endpoint exists to prevent. Re-read it when a session
        starts.
      security: [{ apiToken: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fraction:
                    type: number
                    description: |
                      Share of the track that must have played, 0.05–1.0. This
                      is the number the server multiplies the duration by.
                  percent:
                    type: number
                    description: '`fraction` as a percentage, which is how the setting is worded.'
                  after_secs:
                    type: integer
                    description: Seconds after which it counts regardless of the fraction.
                  rule:
                    type: string
                    enum: [either]
                    description: |
                      **Whichever comes first.** Stated rather than implied: a
                      client reading the two as an AND scrobbles a long track
                      hours late and a short one never.
                  no_duration_after_secs:
                    type: integer
                    description: |
                      What applies when the track's length is unknown — the
                      fraction is unanswerable, so the flat number is the only
                      rule left. Equal to `after_secs`; named separately so a
                      client does not invent its own answer for that case.
                  source:
                    type: string
                    enum: [user, default]
                    description: |
                      Whether the listener chose these numbers or inherited
                      them, so a settings screen can say which.
                  default_percent:
                    type: number
                    description: The instance default, for showing what "standard" is.
                  default_after_secs:
                    type: integer
                    description: The instance default, for showing what "standard" is.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: |
            The settings could not be read. **Never answered as "they have not
            set one"** — the default is an answer, and giving it here would have
            a client follow a rule the server is not applying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Sources ────────────────────────────────────────────────────────────────
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: Your configured sources.
      description: |
        **Session-only, permanently** — these rows hold credentials. The stored
        token or password is never returned; `has_token` says whether one is
        set.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [plex, jellyfin, navidrome] }
                        url: { type: string }
                        enabled: { type: boolean }
                        has_token: { type: boolean }
                        poll_interval: { type: integer, description: Seconds. }
                        options: { type: object, additionalProperties: true, description: Per-kind knobs, so a new kind needs no migration. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Sources]
      summary: Add a source.
      description: |
        Session-only. Sources are per user, keyed `(user_id, kind)`. For Plex
        the token is resolved to a Plex account via plex.tv and the source is
        filtered to that account, so there is no name-matching — which means
        saving needs outbound internet even for a LAN Plex.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [plex, jellyfin, navidrome] }
                url: { type: string }
                token: { type: string }
                username: { type: string }
                password: { type: string }
                enabled: { type: boolean, default: true }
                options: { type: object, additionalProperties: true }
      responses:
        '200': { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sources/{id}:
    put:
      tags: [Sources]
      summary: Update a source.
      description: Session-only. **An omitted token keeps the stored one** — it is not cleared.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sources]
      summary: Delete a source.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sources/test:
    post:
      tags: [Sources]
      summary: Test a source's credentials without saving.
      description: Session-only.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  accounts: { type: array, items: { type: object, additionalProperties: true }, description: Account picker options, where the source has them. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Connections (forwarding) ───────────────────────────────────────────────
  /api/v1/connections:
    get:
      tags: [Connections]
      summary: Where your listens are forwarded.
      description: |
        **Session-only, permanently** — holds credentials.

        Forwarding is strictly per user. A user with no connections keeps their
        listens local; there is deliberately **no server-wide fallback**, which
        previously sent every unconnected user's listens to the operator's own
        account.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        service: { type: string, enum: [lastfm, librefm, listenbrainz] }
                        username: { type: [string, 'null'] }
                        connected: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/spool-forwarding:
    get:
      tags: [Connections]
      summary: Whether accepted Shared Spool plays are forwarded onward.
      description: |
        `enabled` is the switch; `window_days` is the freshness bound that
        applies even when it is on, reported rather than hardcoded in a client
        so the two cannot disagree about what will actually be relayed.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The switch and its window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  window_days: { type: integer }
        '401': { description: Not signed in. }
    put:
      tags: [Connections]
      summary: Set it.
      description: |
        **Off by default, and off for every account that predates it.** Turning
        it on means a play somebody else's deck made — which you were in the
        room for, and accepted one at a time — is relayed to your Last.fm and
        ListenBrainz like any listen of your own.

        A play older than `window_days` is stored and never relayed even with
        the switch on. `retro_spool_from_session` can offer an evening of any
        age and an unanswered invitation can be joined a month later, so
        without that bound a single Accept could rewrite a year of a public
        history.

        **Session-only; a token gets 401 and scopes never enter into it.** A
        scrobble client has no business deciding that another deck may write to
        its owner's public record.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: The switch as it now stands. }
        '400': { description: '`enabled` was absent.' }
        '401': { description: Not signed in. }

  /api/v1/connections/{service}:
    delete:
      tags: [Connections]
      summary: Disconnect a service.
      description: Session-only.
      parameters: [{ name: service, in: path, required: true, schema: { type: string, enum: [lastfm, librefm, listenbrainz] } }]
      responses:
        '200': { description: Disconnected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/lastfm/start:
    post:
      tags: [Connections]
      summary: Begin the Last.fm connect flow.
      description: Session-only. Returns a URL to send the browser to.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { auth_url: { type: string }, token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/lastfm/complete:
    post:
      tags: [Connections]
      summary: Finish the Last.fm connect flow.
      description: Session-only. Exchanges the approved request token for a session key, stored encrypted.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/librefm/start:
    post:
      tags: [Connections]
      summary: Begin the Libre.fm connect flow.
      description: Session-only. GNU FM implements the same AudioScrobbler auth, so this reuses the Last.fm app credentials.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { auth_url: { type: string }, token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/librefm/complete:
    post:
      tags: [Connections]
      summary: Finish the Libre.fm connect flow.
      description: Session-only.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/connections/listenbrainz:
    put:
      tags: [Connections]
      summary: Store a ListenBrainz token.
      description: |
        Session-only. Stored encrypted. The endpoint is configurable for
        self-hosted ListenBrainz instances — that is the one scrobble setting
        still in the config file rather than the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200': { description: Connected., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Import & export ────────────────────────────────────────────────────────
  /api/v1/export:
    get:
      tags: [Import & export]
      summary: Export your listens as CSV.
      description: Session-only.
      responses:
        '200': { description: CSV., content: { 'text/csv': { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup:
    get:
      tags: [Import & export]
      summary: Download a database snapshot.
      description: |
        **Session-only.** A `VACUUM INTO` snapshot of the whole database — every
        user's listens, and the encrypted credentials.

        The encryption key deliberately lives **outside** the database, so it
        does not ride along in this file. That is what the encryption protects
        against: a leaked backup, not host compromise. Do not describe it as
        more than that.
      responses:
        '200': { description: SQLite file., content: { 'application/octet-stream': { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/file:
    post:
      tags: [Import & export]
      summary: Import a file.
      description: |
        Session-only. Sniffs the **content**, not the filename — people rename
        downloads. Accepts a ListenBrainz export zip (JSONL, and its
        `feedback.jsonl` becomes loves), a Spotify Extended Streaming History
        zip, a CSV, or a Rockbox `.scrobbler.log`. The two zip formats are told
        apart by their entry names, since both are plain zips.

        A ListenBrainz export carries a full `mbid_mapping`, so those listens
        skip MusicBrainz enrichment *and* the artwork chain — for a 20k history
        that is the difference between free and a week of rate-limited lookups.
        A Spotify export carries no MusicBrainz identifiers at all, so the
        opposite is true and every distinct track needs a lookup afterwards.

        **A Spotify export's `ts` is when the track stopped**, not when it
        started, so it is corrected on the way in; each play is filed as a
        listen or a skip on the same half-the-track threshold the live sources
        use, rather than on Spotify's own `skipped` field, which records
        something else. Podcast episodes and audiobook chapters are dropped.
        Those listens keep `spotify_track_id` and land with `source_name`
        `spotify`.

        **Rockbox `#TZ/UNKNOWN` is refused, not guessed.** DAPs often have no
        time sync, so their timestamps are local wall-clock seconds; assuming
        the server's zone would shift a whole device's history by the offset,
        unrecoverably. Supply `timezone` in that case.

        Imports land as `imported` and are **never forwarded**.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                timezone: { type: string, description: IANA region. Required for a Rockbox log with an unknown zone. }
      responses:
        '200':
          description: Job started.
          content:
            application/json:
              schema: { type: object, properties: { job_id: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/listenbrainz:
    post:
      tags: [Import & export]
      summary: Import from a ListenBrainz account.
      description: |
        Session-only. Paced deliberately: a 30s timeout, exponential backoff on
        network errors and 5xx, `429` honoured via `X-RateLimit-Reset-In`, and
        400ms between pages. **Do not remove the inter-page sleep to speed this
        up** — hammering is what broke it at ~80k listens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                token: { type: string }
      responses:
        '200': { description: Job started., content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/lastfm:
    post:
      tags: [Import & export]
      summary: Import from a Last.fm account.
      description: Session-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties: { username: { type: string } }
      responses:
        '200': { description: Job started., content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/jobs:
    get:
      tags: [Import & export]
      summary: Jobs running right now.
      description: |
        Session-only. Live progress is an **in-memory** registry, so in-flight
        jobs are lost on restart (the import aborts with them). Finished jobs
        are persisted — see `/api/v1/import/history`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/import/jobs/{job_id}:
    get:
      tags: [Import & export]
      summary: One job's progress.
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  job_id: { type: string }
                  source: { type: string, enum: [listenbrainz, lastfm, file] }
                  state: { type: string, enum: [running, done, error, interrupted] }
                  fetched:
                    type: integer
                    description: Listens read from the source, before dedup.
                  imported:
                    type: integer
                    description: New rows actually inserted.
                  enriched:
                    type: integer
                    description: |
                      *(since v0.70)* Listens already held that the incoming copy
                      taught something to — an MBID, a duration, a cover-art id, a
                      track number. A duplicate is no longer dropped whole: fields
                      that are **blank** are filled from it, and fields that are
                      already populated are never touched. Counted apart from
                      `imported` because a re-import of a history you already hold
                      correctly inserts nothing, and `imported: 0` alone read as
                      though the job had done nothing at all.
                  total: { type: [integer, 'null'] }
                  status:
                    type: string
                    description: Human-readable summary; also carries the error detail when `state` is `error`.
                  date: { type: integer, description: Started, unix seconds. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/import/history:
    get:
      tags: [Import & export]
      summary: Finished import jobs.
      description: Session-only. Persisted, so this survives restarts.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Maintenance ────────────────────────────────────────────────────────────
  /api/v1/lyrics:
    get:
      tags: [Statistics]
      summary: The words to one track, as numbered lines.
      description: |
        Scope: `read`.

        **Numbered including blank lines.** A stanza break is a line, because a
        liner note refers to a line by its *index* — `[[line:12]]` or
        `[[line:A:3:12]]` — and skipping empties would renumber every line after
        one, silently re-pointing every quote already written.

        **Never triggers an LRCLIB fetch.** That service is free and asks callers
        to be considerate; the backfill is what paces it, and a screen that
        fetched on open would let a page refresh drive the rate.

        It *does* reach the user's own media server when nothing is stored yet.
        Their Plex or Jellyfin has no rate limit and no shared budget to spend,
        and they tag their own albums — so those words are usually right there
        while the LRCLIB trickle is still hours from this track. Only when the
        cache holds nothing: a stored lyric is never re-fetched on a page load.

        Three answers, all real: lines, `instrumental: true` (a track with no
        words, which is not a gap), and an empty list.

        Lyrics are the provider's text. They are cached outside the listening
        database, so `GET /api/v1/backup` does not carry them, and they are not
        served by the public now-playing endpoint or by Patch.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      parameters:
        - { name: artist, in: query, required: true, schema: { type: string } }
        - { name: title, in: query, required: true, schema: { type: string } }
        - name: album
          in: query
          schema: { type: string }
          description: >-
            Which record to draw `tracklist` from. Resolved from the history
            when absent; passed explicitly it wins, because a track on three
            compilations has three honest answers and only the caller knows
            which record is being read.
      responses:
        '200':
          description: OK — including for a track nothing is held for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artist: { type: string }
                  title: { type: string }
                  album: { type: string, nullable: true }
                  plays:
                    type: integer
                    description: How often this user has played the track. Skips excluded, as everywhere.
                  language: { type: string, nullable: true }
                  timed: { type: boolean }
                  instrumental: { type: boolean }
                  edited:
                    type: boolean
                    description: >-
                      These words were corrected here rather than fetched, and a
                      later lookup will not overwrite them.
                  plain: { type: string, nullable: true, description: The stored text, for correcting it by hand. }
                  synced: { type: string, nullable: true }
                  source:
                    type: [string, 'null']
                    description: >
                      Where these words came from — `Plex`, `Jellyfin`, `Emby`,
                      `LRCLIB`, or `You` for a correction typed here. **Null when
                      it was not recorded**, which is a row written before
                      provenance was kept: reported as unknown rather than
                      assumed to be LRCLIB, because "we did not record it" is the
                      true statement. Worth showing wherever the words are —
                      words off the user's own server are the pressing they
                      played, with their own tagging in them.
                    example: Plex
                  tracklist:
                    type: array
                    description: >-
                      The rest of the record, in the order it plays — track
                      number where a tagger supplied one, alphabetical where not.
                      Empty when the track belongs to no album here.
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        plays: { type: integer }
                        duration: { type: integer, nullable: true }
                        track_number: { type: integer, nullable: true }
                        lyrics:
                          type: string
                          enum: [words, instrumental]
                          description: >-
                            What is held for that track. **Absent** for one
                            nobody has asked about, which is a different thing
                            from one that has no words — the reader dims the
                            first and marks the second.
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        n: { type: integer, description: '1-based, and blank lines are numbered.' }
                        at: { type: number, nullable: true }
                        text: { type: string, description: Empty for a stanza break. }
                        quoted:
                          type: integer
                          description: >-
                            How many of this user's notes quote this line.
                            Counted from the note bodies on read, so it cannot
                            drift from what is written.
                        pin:
                          type: object
                          nullable: true
                          description: >-
                            The note pinned to this line, if there is one. A pin
                            is a note whose target *is* the line — see
                            `POST /api/v1/notes` with `line`.
                          properties:
                            note_id: { type: integer }
                            body_md: { type: string }
                            excerpt: { type: string }
                            visibility: { type: string }
                            updated_at: { type: integer }
    put:
      tags: [Statistics]
      summary: Correct the words by hand.
      description: |
        Scope: session only.

        **A value you supplied is never overwritten by a lookup** — the rule the
        shelf's running times already follow, and what settles the collision
        between this and "newest fetch wins": between two fetches the newer one
        wins, and between a fetch and something a person typed, the person does.
        The row is marked as corrected and the backfill will not write over it.

        Instance-wide rather than per user, like everything else in this cache:
        these are one track's words, not one person's opinion of them.

        The response reports the line count **before and after**, and
        `renumbered` when they differ. Every reference already written is an
        index, so a correction that adds or removes a line moves every quote
        after it onto different words — silently, because an index cannot be
        wrong, only pointed somewhere else. It is reported rather than refused:
        the correction is usually the point, and the alternative is a lyric that
        stays wrong for ever.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist, title]
              properties:
                artist: { type: string }
                title: { type: string }
                plain: { type: string, nullable: true }
                synced: { type: string, nullable: true, description: '`[mm:ss.xx] words` per line.' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: saved }
                  language: { type: string, nullable: true, description: Re-read from the new words. }
                  lines_before: { type: integer }
                  lines_after: { type: integer }
                  renumbered:
                    type: boolean
                    description: The count changed, so every quote past the change now points at different words.
        '400': { description: No artist, no title, or no words in it. }

  /api/v1/lyrics/library:
    post:
      tags: [Statistics]
      summary: Words a player found in its own files.
      description: |
        Scope: `write`.

        **Not a correction.** `PUT /api/v1/lyrics` calls `set_words`, which sets
        `edited` and stamps the source as *You* — a claim only a person typing
        gets to make, and the flag that outranks every later fetch. A client
        reporting what a file contains is not correcting anything, so this goes
        through the library path instead: it refuses to write over an edited row,
        re-reads the language from the new words, and upserts, so a repeat send
        is harmless.

        **Not `POST /api/v1/lyrics/fetch` either**, which spends a shared
        politeness budget at LRCLIB. This is offering words, not asking for them.

        Sends nothing to any third party, and the words never leave the instance
        — not in a backup, not in an export, not to a patched deck.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist, title, source]  # source enforced in the handler, so a missing one is a 400 with a reason rather than a deserialiser 422
              properties:
                artist: { type: string }
                title: { type: string }
                album: { type: string, description: 'Advisory. Not used to match — the key is artist and title.' }
                plain: { type: string, description: 'Either or both of `plain` and `synced`.' }
                synced: { type: string, example: '[00:12.30] the words' }
                source:
                  type: string
                  example: Tapeout
                  description: |
                    Whose words these are, and **required**. The reader prints
                    "Words via X", and that sentence is the whole reason this
                    route exists apart from the LRCLIB one — *from your own
                    files* and *from a lyrics service* are different statements
                    about whose text somebody is reading. A client that will not
                    say who it is does not get to write provenance.
      responses:
        '200':
          description: Stored, or left alone because the row holds a correction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [saved, kept] }
                  why: { type: [string, 'null'], description: Why it was kept rather than saved. }
                  language: { type: [string, 'null'], description: Re-read from the words just given. }
                  lines: { type: integer, description: 'Numbered including blank lines, as the reader numbers them.' }
        '400': { description: 'A blank artist, title or source, or no words.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/lyrics/live:
    get:
      tags: [Statistics]
      summary: The words for whatever is on the deck.
      description: |
        Scope: `read`.

        The reader's whole state in one request, so the lyric theatre stops
        being addressed by URL. `GET /api/v1/lyrics` names a track, which is
        right for a `[[line:...]]` chip and wrong for reading along: the words
        stayed on whichever song the address named, so the next track left them
        behind and the only way out was editing the query string.

        The body is a `LyricDoc` with the playhead beside it, so a cold open
        lands on the right line without waiting for a now-playing poll. Nothing
        playing is `{ "playing": false }` and a normal answer, not an error.

        **Ask it once per track, not once per poll.** The document carries the
        tracklist and every pin on the track; a client should watch
        `GET /api/v1/now-playing` (which it is already polling) and re-ask this
        only when the track changes.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: The deck's track and its words, or nothing playing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  playing: { type: boolean }
                  artist: { type: string }
                  title: { type: string }
                  album: { type: string, nullable: true }
                  lines: { type: array, items: { type: object, additionalProperties: true } }
                  position:
                    type: integer
                    description: Seconds in, as of the moment this was answered.
                  position_known:
                    type: boolean
                    description: >-
                      Whether `position` is a measurement rather than wall-clock
                      arithmetic. A guess must not drive a highlight that looks
                      measured.
                  paused: { type: boolean }
                  duration: { type: integer, nullable: true }

  /api/v1/lyrics/fetch:
    post:
      tags: [Statistics]
      summary: Look for one track's words now.
      description: |
        **Session only.** A token is refused with 401 and its scopes never enter
        into it: this spends a shared politeness budget at a free service and
        writes an instance-wide cache, which is not something a scrobble client
        holding `read` has any business doing.

        The backfill runs at a few tracks a minute, most-played first, which is
        the right pace for a queue nobody is watching and no use for the track
        somebody is looking at. This is the button behind that, and it resolves
        the track exactly as the backfill would: the user's own library first,
        then LRCLIB, with cues winning.

        **A deliberate press is not a page load**, which is why this may ask
        LRCLIB where `GET /api/v1/lyrics` may not. It bypasses the 30-day miss
        tombstone — LRCLIB fills its own gaps, so "nobody had this a fortnight
        ago" is exactly the answer worth re-asking — but it will not displace
        words already held: `already_held: true` says so, and
        `/api/v1/lyrics/matches` is the control for disagreeing with them.

        A rate limit or an unreachable LRCLIB is **200 with `unavailable`**, not
        a 5xx. Being asked to wait is not this server failing, and reporting it
        as "nothing found" would be a claim about the track rather than about
        the request.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist, title]
              properties:
                artist: { type: string }
                title: { type: string }
                album: { type: string }
                duration:
                  type: integer
                  description: >-
                    Track length in seconds. LRCLIB matches on it, and a
                    wrong-length record is the usual reason a well-known song
                    comes back with somebody else's words.
      responses:
        '200':
          description: >-
            The whole document as it now stands, so the caller can replace what
            it is showing — or `unavailable` with a `why`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  artist: { type: string }
                  title: { type: string }
                  lines: { type: array, items: { type: object, additionalProperties: true } }
                  already_held:
                    type: boolean
                    description: Words were already stored, so nothing was asked.
                  unavailable: { type: boolean }
                  why: { type: string }
        '400': { description: An artist or a title that is blank. }
        '422': { description: The body is missing `artist` or `title` outright. }

  /api/v1/lyrics/matches:
    get:
      tags: [Statistics]
      summary: The other records LRCLIB holds for a track.
      description: |
        Session or a `read` token.

        **Not a version history.** LRCLIB has none — `/api/get` returns one
        record and nothing behind it. These are *different records* for the same
        song, from `/api/search`: other uploads, other pressings, a live take
        filed under the same name. Picking a better one is how a wrong match is
        fixed without typing the words out.

        Records with no words are omitted. The whole gesture is "these are the
        wrong words, give me the other ones", which an instrumental cannot
        answer.

        **Adopt one with `PUT /api/v1/lyrics`**, sending the chosen `plain` and
        `synced_text`. That is the ordinary correction path, so the choice is
        marked edited and survives every later fetch — and it reports
        `renumbered`, which matters here more than anywhere: a `[[line:...]]`
        reference is an index, so a different record re-points every quote
        already written.

        This reaches the network, so it belongs on a press rather than a page
        load. A rate limit or an unreachable LRCLIB comes back **200** with
        `unavailable: true` and a reason rather than a 5xx: the upstream asking
        us to wait is not this server failing, and the distinction is what stops
        a client reporting "no other matches" when it never managed to ask.
      parameters:
        - { in: query, name: artist, required: true, schema: { type: string } }
        - { in: query, name: title, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, nullable: true }
                        title: { type: string, nullable: true }
                        artist: { type: string, nullable: true }
                        duration: { type: integer, nullable: true }
                        synced:
                          type: boolean
                          description: Timed. A timed lyric can follow the deck; a plain one cannot.
                        lines: { type: integer }
                        plain: { type: string, nullable: true }
                        synced_text: { type: string, nullable: true }
                  unavailable:
                    type: boolean
                    description: Present and true when LRCLIB could not be asked.
                  why: { type: string }
        '400': { description: Missing artist or title. }

  /api/v1/lyrics/keys:
    get:
      tags: [Statistics]
      summary: Every track this instance holds words for.
      description: |
        Scope: `read`.

        One request for the whole set, exactly the shape `GET /api/v1/loves/keys`
        has and for the same reason: a history page wants to know which of fifty
        rows has something to read, and fifty questions is not the way to ask.

        A key is `<artist>|<title>`, both trimmed and lowercased — the same fold
        `loveKey` uses for its artist half. **The browser's derivation and this
        one must stay in step**, or "Read the words" quietly stops appearing on
        rows that have lyrics and nothing errors.

        Only tracks with words. An instrumental is a real answer and a finished
        lookup, but there is nothing to open a reader on.

        Not scoped to the caller, and it cannot be: the cache is one copy of one
        track's words for the whole instance, keyed by the track rather than by
        who played it.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK. An instance with no lyrics cache answers an empty list rather than failing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: string } }

  /api/v1/lines:
    get:
      tags: [Notes]
      summary: Every lyric line this user has pinned.
      description: |
        Scope: `read`.

        A **pin** is a note whose target *is* the line, rather than prose that
        quotes one. It is the one form of lyric reference that can ever
        federate, because nothing of the provider's text is written into the
        note — a reader elsewhere sees your words and a stub.

        Across everything rather than per record on purpose: that is what makes
        it a way back into writing you had forgotten rather than a second copy
        of the margin you are already looking at.

        `line.text` carries the words when this instance still holds them and is
        simply absent when it does not. A pin outlives the lyric it points at,
        the same way a note outlives the entity that resolved it, and that is
        not an error.
      security: [{ sessionCookie: [] }, { apiToken: [read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        note_id: { type: integer }
                        excerpt: { type: string }
                        updated_at: { type: integer }
                        line:
                          type: object
                          properties:
                            artist: { type: string }
                            title: { type: string }
                            line: { type: integer }
                            text: { type: string, nullable: true }

  /api/v1/lyrics/status:
    get:
      tags: [Maintenance]
      summary: How far the lyric language pass has got.
      description: |
        Scope: session only.

        Tapedeck fetches lyrics from [LRCLIB](https://lrclib.net) for one
        reason: **the language a transliterated title cannot give.** Script
        detection settles any non-Latin title with certainty and gives up on
        Latin text, so a romanised title falls through to `English/Other`, which
        is a shrug rather than a measurement and is most of a real
        transliterated history. The lyric is where that title's own script went.

        Lyrics are stored in the MusicBrainz cache database rather than in the
        listening database, so `GET /api/v1/backup` does **not** carry them —
        they are third-party copyrighted text, not the user's listening.

        `instrumental` is counted separately because it is a real answer: a
        track with no words has no language, and folding it into "found" would
        report a finished lookup as an unfinished one.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: False when the cache could not be opened — a degraded state, not an error.
                  asked: { type: integer, description: Tracks LRCLIB has been asked about. }
                  with_lyrics: { type: integer }
                  instrumental: { type: integer, description: 'Tracks LRCLIB records as having no words. An answer, not a gap.' }
                  unresolved:
                    type: integer
                    description: |
                      Tracks whose language is still unknown or `English/Other`
                      — what the pass has left to try.

  /api/v1/mbids/status:
    get:
      tags: [Maintenance]
      summary: MusicBrainz recording coverage.
      description: |
        Session-only.

        A recording MBID is written by `flush_pending` alone, which only ever
        sees listens on their way to a sink — so an **imported** listen never got
        one, and nothing else writes the column. On a mostly-imported history
        that leaves most of the listening unidentified, and with it excluded from
        every backfill that keys off a recording: ISRC, work-language, release
        year.

        `unmatched_tracks` is the reason this reports three numbers instead of
        two. It counts distinct tracks MusicBrainz was **asked about and had
        nothing for** — real listening simply not in their database. Without it a
        bar that stops short reads as a stall rather than as an answer.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: Listens, skips excluded. }
                  resolved: { type: integer }
                  pending: { type: integer }
                  unmatched_tracks:
                    type: integer
                    description: |
                      Distinct tracks already looked up with no result. These are
                      counted in `pending` and will not resolve.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mbids/backfill:
    post:
      tags: [Maintenance]
      summary: Resolve missing recording MBIDs now.
      description: |
        Session-only, **admin only**. Runs in the background; poll
        `/api/v1/mbids/status` for progress.

        This is the pass that unblocks the others, so it is worth running before
        the ISRC or language backfills on a history that came from an import.

        A name search can be wrong, and a wrong MBID is worse than none — it
        would be written onto every play of the track and then poison the ISRC
        and language lookups downstream, with nothing erroring. So a result is
        only accepted when it **agrees with the question**: the artist matches,
        and the title matches once a trailing qualifier is stripped. Misses are
        negative-cached, so a track already asked about is not asked again while
        that answer is current.
      responses:
        '202': { description: Started. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin only. }

  /api/v1/artwork/status:
    get:
      tags: [Maintenance]
      summary: Artwork coverage.
      description: |
        Session-only. **Numerator and denominator share a population** — both
        exclude skips. They did not once, so the two were fractions of different
        wholes.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  with_artwork: { type: integer }
                  total: { type: integer }
                  pending: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/artwork/backfill:
    post:
      tags: [Maintenance]
      summary: Run the artwork backfill now.
      description: |
        Session-only. Providers return **URLs, never bytes** — Deezer's terms
        discourage persisting artwork. The queue keys on `artwork_url` **only**;
        `caa_id` is written by three other paths, so keying on it silently marks
        rows done that have no URL.
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/languages/status:
    get:
      tags: [Maintenance]
      summary: Language classification coverage.
      description: |
        Session-only. The denominator counts only rows the backfill will
        actually process — it did not once, so the bar could never reach 100%
        on any history containing a skip.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  classified: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/languages/backfill:
    post:
      tags: [Maintenance]
      summary: Run the language backfill now.
      description: Session-only.
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sanitize:
    get:
      tags: [Maintenance]
      summary: Preview metadata fixes.
      description: |
        Session-only. **Preview-then-apply, never automatic** — and the preview
        deliberately exposes how weak each guess is, because the operator has to
        judge it.

        Three passes. *Mixed releases*: one listen out of twelve routinely
        arrives carrying a compilation's release MBID. The whole ballot is
        returned, most-claimed first, so "15 releases, plurality of 4" is
        visible as the guess it is. *Featured credits*: `Artist feat. X` is a
        different artist to every query in the app; only the explicit
        `feat.`/`ft.`/`featuring`/`with` forms match, because "Simon &
        Garfunkel" is a name, not a credit. *Spelling variants*: grouped on the
        exact string, with `case_only` flagged — a two-stage filter whose second
        stage was coarser than the first once made every case-only variant
        invisible.
      responses:
        '200':
          description: The proposed changes, each individually selectable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  album_edits: { type: array, items: { type: object, additionalProperties: true } }
                  credit_edits: { type: array, items: { type: object, additionalProperties: true } }
                  variant_edits: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Maintenance]
      summary: Apply selected metadata fixes.
      description: |
        Session-only. Explicit lists select individual edits; the booleans mean
        "everything in this category". **A non-empty list wins over its
        boolean** — asking for three edits and getting four hundred would be the
        worst reading of an ambiguous request.

        The featured-credit target is **derived, never taken from the request**,
        or this would become "rename any artist to anything". A variant merge is
        refused unless both spellings normalise to the same key, so merging
        "Burial" into "Aphex Twin" cannot happen.

        **A spelling merge is not reversible.** The `feat.` fold keeps the
        original in `artist_credit`; a rename keeps nothing, because both
        strings name the same artist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                albums: { type: boolean }
                credits: { type: boolean }
                variants: { type: boolean }
                album_edits: { type: array, items: { type: object, additionalProperties: true } }
                credit_edits: { type: array, items: { type: object, additionalProperties: true } }
                variant_edits: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Admin ──────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: List users.
      description: Session-only, admin role. Never reachable with a token.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a user.
      description: |
        Session-only, admin role. There is **no self-registration** — this
        instance is invite-only by design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                role: { type: string, enum: [user, admin], default: user }
      responses:
        '200': { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/profile:
    get:
      tags: [Account]
      summary: The caller's own account.
      description: |
        Session-only. Takes no id — it is always the caller's own account, which
        is the point: an account created for someone else was previously only
        changeable by the admin who created it.

        `avatar` is a URL the browser can load. It is either the external URL the
        user set or `/api/v1/profile/avatar` when a file was uploaded; the path
        on disk is never returned.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  username: { type: string }
                  display_name: { type: string, nullable: true }
                  role: { type: string, enum: [admin, user] }
                  created_at: { type: integer, description: Unix seconds. }
                  bio: { type: string, nullable: true }
                  avatar: { type: string, nullable: true }
                  disabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      summary: Change your display name, bio or avatar URL.
      description: |
        Session-only. Each field distinguishes absent ("leave alone") from an
        explicit `null` ("clear"), so a misspelled key cannot silently blank a
        field it failed to name.

        `avatar_url` must be an `http(s)` URL. A relative value is refused with
        400 — only the upload endpoint may write a path this server serves.
        Role, disabled state, username and password are deliberately not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, nullable: true, maxLength: 80 }
                bio: { type: string, nullable: true, maxLength: 500 }
                avatar_url: { type: string, nullable: true }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/profile/password:
    post:
      tags: [Account]
      summary: Change your own password.
      description: |
        Session-only. `current_password` is required — the caller already holds
        a session, so without it an unlocked browser would be enough to lock the
        real owner out. This is what separates it from the admin reset on
        `PATCH /admin/users/{id}`.

        On success every existing session for the user is dropped and a new
        cookie is issued to the caller, so other browsers are logged out but the
        tab making the request is not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Updated; a fresh session cookie is set., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The current password is wrong., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/profile/avatar:
    get:
      tags: [Account]
      summary: The caller's uploaded profile picture.
      description: |
        Session-only and scoped to the caller, like the artwork proxy. Cached
        `private` — a shared cache holding one would serve it to the next person
        through the proxy. 404 when the avatar is an external URL rather than an
        uploaded file.
      responses:
        '200': { description: The image bytes., content: { image/*: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Account]
      summary: Upload a profile picture.
      description: |
        Session-only, `multipart/form-data`, 4 MB maximum. The extension comes
        from the declared content type, never from the client's filename. The
        picture it replaces is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { type: object, properties: { avatar: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Larger than 4 MB., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not an image type we store., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Account]
      summary: Remove your profile picture.
      description: Session-only. Falls back to the lettered tile.
      responses:
        '200': { description: Removed., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Update a user.
      description: Session-only, admin role.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Delete a user and everything they own.
      description: |
        Session-only, admin role. Foreign keys are enforced, so this clears note
        revisions, then notes, then listens, in that order.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tokens:
    get:
      tags: [Admin]
      summary: The caller's API tokens.
      description: Session-only. Token secrets are never returned after issue.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        scopes: { type: string }
                        created_at: { type: integer }
                        last_used_at: { type: [integer, 'null'] }
                        default_chain_id: { type: [integer, 'null'] }
                        default_chain_name: { type: [string, 'null'] }
                        imports_are_live: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin]
      summary: Mint a token.
      description: |
        Session-only. **The secret is in this response and nowhere else.**

        Name it per device — that is what makes revocation meaningful when a
        phone is lost. `default_chain_id` is rung 3 of the chain ladder: one
        token per app makes attribution zero-configuration on the client side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes:
                  type: string
                  default: submit
                  description: 'Space-separated. `submit`, `read`, `write`, or `all`. None implies another.'
                default_chain_id: { type: [integer, 'null'] }
                imports_are_live:
                  type: boolean
                  default: false
                  description: |
                    Whether this client's `listen_type: "import"` submissions are
                    live listens rather than a backfill. Some players (fooyin)
                    label every scrobble `import`; without this their listens are
                    stored but never forwarded to Last.fm / ListenBrainz. Even
                    when set, only listens from the last 24h are forwarded, so a
                    genuine history import from the same client stays local.
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  token: { type: string, description: Shown once. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/tokens/{id}:
    patch:
      tags: [Admin]
      summary: Repoint a token's default chain, without re-issuing it.
      description: |
        Session-only. Fixing the chain never means re-pasting a token into a
        client. `default_chain_id` is nullable-and-optional: present-and-null
        clears it, absent leaves it alone. Any chain id is checked against the
        owner's own chains.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                default_chain_id: { type: [integer, 'null'] }
                imports_are_live:
                  type: boolean
                  description: Absent leaves it alone. See POST for what it does.
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Revoke a token.
      description: Session-only. This is the mitigation for a lost device.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Revoked., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tokens/{id}/rotate:
    post:
      tags: [Admin]
      summary: Re-issue a token in place.
      description: Session-only. Same id, name, scopes and chain; new secret, returned once.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/ops:
    get:
      tags: [Admin, Operations]
      summary: Engine, sink and source health for this instance.
      description: >
        Session-only, admin role — instance-wide, and the source rows are not
        scoped to the caller. One request rather than several because the
        Operations screen polls it while open.


        `tick.behind` is the number that matters: a tick taking longer than its
        own `interval_secs` means source polling and the deck are that late.
        `sinks[].skipping_for` is set while a service's breaker is open and it
        is being skipped outright. Neither credentials nor source URLs are
        returned.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  version: { type: string }
                  uptime_secs: { type: integer }
                  logs_enabled: { type: boolean }
                  tick:
                    type: object
                    additionalProperties: true
                    properties:
                      interval_secs: { type: integer }
                      ticks: { type: integer }
                      last_started: { type: [integer, 'null'] }
                      last_duration_ms: { type: integer }
                      longest_ms: { type: integer }
                      overruns: { type: integer }
                      deferred_listens: { type: integer }
                      behind: { type: boolean }
                  sinks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name: { type: string }
                        failures: { type: integer }
                        total_failures: { type: integer }
                        total_successes: { type: integer }
                        last_ok: { type: [integer, 'null'] }
                        last_failure: { type: [integer, 'null'] }
                        last_error: { type: [string, 'null'] }
                        skipping_for: { type: [integer, 'null'] }
                  sources:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: integer }
                        user_id: { type: integer }
                        username: { type: string }
                        kind: { type: string }
                        label: { type: string }
                        enabled: { type: boolean }
                        poll_interval_secs: { type: [integer, 'null'] }
                        last_polled_at: { type: [integer, 'null'] }
                        last_error: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/logs:
    get:
      tags: [Admin, Operations]
      summary: The tail of a log file, filtered.
      description: >
        Session-only, admin role. A log carries usernames, source labels and
        request paths, so this is deliberately unreachable with an API token —
        the endpoint does not accept one, so scopes never enter into it.


        `level` means "this and worse", so `warn` includes errors. `matched` is
        what the filter found against `shown`, so a capped tail cannot be
        mistaken for the whole answer.
      parameters:
        - { name: lines, in: query, schema: { type: integer, default: 300, maximum: 2000 } }
        - { name: level, in: query, schema: { type: string, enum: [error, warn, info, debug] } }
        - { name: q, in: query, schema: { type: string }, description: Substring filter, applied after the level. }
        - { name: file, in: query, schema: { type: string }, description: One of the names from /admin/logs/files. Anything else is a 404. }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  file: { type: string }
                  files: { type: array, items: { type: string } }
                  matched: { type: integer }
                  shown: { type: integer }
                  truncated: { type: boolean }
                  lines: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: File logging is off, or no such file. }
  /admin/logs/files:
    get:
      tags: [Admin, Operations]
      summary: The log files this instance is holding, newest first.
      description: >
        Session-only, admin role. Seven daily files are kept. These names are
        the only values `file` accepts elsewhere — a request names one of
        these, never a path.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: File logging is off on this instance. }
  /admin/logs/download:
    get:
      tags: [Admin, Operations]
      summary: Download one log file whole.
      description: Session-only, admin role. Served `private, no-store`.
      parameters:
        - { name: file, in: query, schema: { type: string }, description: One of the names from /admin/logs/files. Defaults to today's. }
      responses:
        '200':
          description: The file.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: File logging is off, or no such file. }
  /admin/restart:
    post:
      tags: [Admin, Operations]
      summary: Drain and stop, so a supervisor restarts the process.
      description: >
        Session-only, admin role. In-flight requests drain and the engine
        finishes its current tick before the process exits, so this cannot cut
        a write in half — it is gentler than the kill an operator reaches for
        otherwise.


        The process exits **non-zero** (75, `EX_TEMPFAIL`) deliberately: the
        supplied systemd unit is `Restart=on-failure`, so a clean exit would
        stop the service instead of restarting it. On a host with nothing
        supervising the process, this is a stop.
      responses:
        '202':
          description: Accepted; the drain has started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status: { type: string }
                  note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/everynoise:
    get:
      tags: [Admin, Genre map]
      summary: Genre-map scrape status.
      description: Session-only, admin role.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  genres: { type: integer }
                  artists: { type: integer }
                  edges: { type: integer }
                  running: { type: boolean }
                  contact: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Admin, Genre map]
      summary: Drop the scraped genre map.
      description: |
        Session-only, admin role. The genre map lives in its **own database**
        (`EVERYNOISE_DB_PATH`), kept out of `VACUUM INTO` backups — those should
        hold the user's listening, not 6,300 rows of someone else's reference
        data.
      responses:
        '200': { description: Cleared., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/everynoise/contact:
    put:
      tags: [Admin, Genre map]
      summary: Set the admin contact email for the scraper's User-Agent.
      description: |
        Session-only, admin role. The scrape **refuses to start without one** —
        a made-up address is worse than none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties: { contact: { type: string, format: email } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: Not a plausible address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/everynoise/scrape:
    post:
      tags: [Admin, Genre map]
      summary: Start a scrape.
      description: |
        Session-only, admin role. Runs when an admin asks and **never on a
        schedule** — Every Noise has been frozen since December 2023, so there
        is nothing to sync.

        **Tier 1 is one HTTP request** and returns every genre with coordinates
        and colour; genre-level features cost that alone. **Tier 2 walks ~6,300
        genre pages at 1 req/s** — about two hours — for exemplar artists and
        the adjacency graph. Build on tier 1 first.

        A fetch that parses to **zero** genres is treated as a failure rather
        than written, or a changed page would silently empty the table. Resume
        is per page, written in the same transaction as the page's contents, so
        a crash can never mark a page done with nothing in it. A second
        concurrent start is refused.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { type: integer, enum: [1, 2], default: 1 }
      responses:
        '200': { description: Started., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: No admin contact set. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A scrape is already running. }

  /admin/everynoise/cancel:
    post:
      tags: [Admin, Genre map]
      summary: Cancel a running scrape.
      description: Session-only, admin role. Progress already written is kept — resume is per page.
      responses:
        '200': { description: Cancelled., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────────────────────────────────────────────────────
  # MCP — the Model Context Protocol surface
  # ───────────────────────────────────────────────────────────────────────────

  /mcp:
    post:
      tags: [MCP]
      summary: The MCP endpoint (JSON-RPC over Streamable HTTP).
      description: |
        One endpoint carrying the whole protocol. **Not a REST resource** — the
        body is a JSON-RPC 2.0 request and the method decides what happens, so
        this entry documents the transport rather than a payload.

        **Authentication is `Authorization: Bearer <credential>`**, where the
        credential comes from Settings → AI Connections or from the OAuth flow.
        A 401 carries `WWW-Authenticate` with a `resource_metadata` pointer, and
        that pointer is how a client discovers the authorization server.

        **Dual-era.** A request carrying
        `params._meta["io.modelcontextprotocol/protocolVersion"]` of
        `2026-07-28` is served statelessly and **must** mirror `Mcp-Method`,
        `Mcp-Name` and `MCP-Protocol-Version` into headers matching the body —
        a mismatch is `400` with JSON-RPC `-32020`. A request opening with
        `initialize` selects legacy semantics (`2025-11-25` and earlier) and is
        not subject to header validation. No session id is ever minted: this
        server is stateless on both eras.

        Methods: `initialize`, `server/discover`, `ping`, `tools/list`,
        `tools/call`, `resources/list`, `resources/templates/list`,
        `resources/read`, `prompts/list`, `prompts/get`, `logging/setLevel`,
        and any `notifications/*` (accepted, `202`, no body).

        Unknown method is `404` **and** JSON-RPC `-32601` together — the body is
        what distinguishes this from the `404` a legacy HTTP+SSE server returns
        for a path it does not host.

        Rate limited to 600 calls an hour per connection. Every call is written
        to the audit log.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id:
                  description: Absent for a notification, which is answered `202`.
                  oneOf: [{ type: string }, { type: integer }]
                method: { type: string, example: tools/call }
                params: { type: object, additionalProperties: true }
              additionalProperties: false
      responses:
        '200':
          description: A JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc: { type: string }
                  id: { }
                  result: { type: object, additionalProperties: true }
                  error: { type: object, additionalProperties: true }
        '202': { description: A notification was accepted. No body. }
        '400': { description: 'Malformed, header/body mismatch (-32020), or unsupported protocol version (-32022).' }
        '401': { description: Missing or invalid credential. Carries `WWW-Authenticate`. }
        '403': { description: 'Cross-origin request, or a tool the connection was not granted. Carries `WWW-Authenticate` with `error="insufficient_scope"`.' }
        '404': { description: 'Unknown method (-32601) or unknown tool.' }
        '429': { description: The connection's hourly call budget is spent. }
    get:
      tags: [MCP]
      summary: Not allowed.
      description: |
        The standalone SSE stream belonged to the 2025 revisions and is not part
        of this one. `405` is what the spec tells a modern transport to answer,
        and it is what a dual-era client reads as "use POST".
      responses:
        '405': { description: Method not allowed. }
    delete:
      tags: [MCP]
      summary: Not allowed.
      description: Session termination belonged to the 2025 revisions; there is no session to delete.
      responses:
        '405': { description: Method not allowed. }

  /api/v1/mcp/connections:
    get:
      tags: [MCP]
      summary: Your AI connections.
      description: |
        Session-only. Also returns this instance's MCP endpoint address, derived
        from the request the way the pairing verification URI is, and the full
        grant catalogue with the sentence shown for each on the consent screen.
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { type: string, format: uri }
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        scope: { type: string }
                        description: { type: string }
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/McpConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [MCP]
      summary: Mint a connection by hand, for a local client.
      description: |
        Session-only. **The credential is in this response and nowhere else,
        ever again** — only its hash is stored.

        A connection created here does not expire: it is something the user
        pasted into a client themselves, there is nothing for it to refresh
        against, and expiring it would break their setup for no gain they asked
        for. An OAuth grant is the one that expires.

        Unrecognised grants are dropped rather than stored, so a client cannot
        invent one by asking for it. There is no wildcard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Claude Desktop }
                scopes:
                  type: string
                  description: Space- or comma-separated.
                  example: listening:read library:read
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  scopes: { type: string }
                  token: { type: string, description: Shown once. }
        '400': { description: No recognised grant was requested. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mcp/connections/{id}:
    delete:
      tags: [MCP]
      summary: Revoke a connection.
      description: |
        Session-only. Revoked rather than deleted, so the audit rows keep
        pointing at something with a name — "which assistant read my history in
        March" outlives the connection.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection. }

  /api/v1/mcp/audit:
    get:
      tags: [MCP]
      summary: What the assistants have been doing.
      description: |
        Session-only. Every call: which connection, which tool, with what
        arguments (truncated), whether it worked, **how many rows came back**,
        and how long it took. The row count is the interesting one — a tool that
        answered with 12 rows and one that answered with 20,000 are different
        events however identical the call looks.
      responses:
        '200':
          description: The most recent 200 calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    items: { $ref: '#/components/schemas/McpAuditCall' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────────────────────────────────────────────────────
  # OAuth 2.1
  # ───────────────────────────────────────────────────────────────────────────

  /.well-known/oauth-protected-resource:
    get:
      tags: [OAuth]
      summary: RFC 9728 protected resource metadata.
      description: |
        Unauthenticated. The document a client is pointed at by
        `WWW-Authenticate` on a 401 from `/mcp`, and the first step of the whole
        flow. `scopes_supported` names the *minimal* set for basic
        functionality — a client asks for more through a step-up rather than
        being nudged into requesting everything at once.
      security: []
      responses:
        '200': { description: The metadata document., content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /.well-known/oauth-authorization-server:
    get:
      tags: [OAuth]
      summary: RFC 8414 authorization server metadata.
      description: |
        Unauthenticated. Advertises `S256` as the only PKCE method — `plain` is
        in RFC 7636 and provides no protection against the code interception
        PKCE exists for — and `authorization_response_iss_parameter_supported`,
        because this server emits `iss` (RFC 9207) and a strict client will not
        check it otherwise.
      security: []
      responses:
        '200': { description: The metadata document., content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /oauth/register:
    post:
      tags: [OAuth]
      summary: RFC 7591 dynamic client registration.
      description: |
        Unauthenticated by design: this hands out an identifier and nothing
        else. Every client is public, there is no secret, and possession of a
        `client_id` gets you as far as an authorization request that a logged-in
        human then has to approve by hand.

        `redirect_uris` must be https, a loopback http address, or a private-use
        scheme. Plain http anywhere else would put an authorization code on the
        network in the clear.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: { type: string }
                redirect_uris: { type: array, items: { type: string, format: uri } }
      responses:
        '201': { description: Registered., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: A redirect_uri was missing or not acceptable. }

  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: The authorization endpoint.
      description: |
        Unauthenticated at this step. Validates the request and **redirects to
        the SPA consent screen** at `/authorize` carrying the parameters; it
        does not render HTML, because this application serves one `index.html`
        and a server-rendered consent page would be the only thing that could
        drift from the app's own styling.

        Failures concerning the redirect target itself are reported directly
        rather than bounced off it — an unvalidated `redirect_uri` is an open
        redirect and must not be used to deliver its own error. `redirect_uri`
        is matched **exactly** against one the client registered; a prefix match
        here would hand somebody else an authorization code.

        PKCE is required and `code_challenge_method` must be `S256`.
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string }, description: 'RFC 8707. Validated as naming this instance, not merely recorded.' }
      responses:
        '303': { description: To the consent screen, or back to the client with an error. }
        '400': { description: Unknown client, or a redirect_uri that does not match its registration. }

  /oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange a code, or refresh.
      description: |
        Unauthenticated (public clients, `token_endpoint_auth_method: none`);
        form-encoded, as the RFC requires. Grants: `authorization_code` and
        `refresh_token`.

        The code is **single use**, taken with `DELETE … RETURNING` so two
        simultaneous redemptions cannot both succeed. It is bound to the client,
        the redirect, the PKCE challenge and the resource — every one of those
        is re-checked here.

        A refresh **rotates both secrets**, so a leaked access token stops
        working as soon as the legitimate client refreshes. Access credentials
        live 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string, description: 43–128 characters, per RFC 7636. }
                redirect_uri: { type: string }
                client_id: { type: string }
                refresh_token: { type: string }
                resource: { type: string }
      responses:
        '200':
          description: A credential. Never cached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400': { description: 'invalid_grant, invalid_request, invalid_target or unsupported_grant_type.' }

  /api/v1/oauth/authorize-info:
    get:
      tags: [OAuth]
      summary: What the consent screen puts in front of the user.
      description: |
        Session-only. Scope **descriptions** travel with it rather than raw
        scope strings — `listening:read` is not something a person can consent
        to. `verified` says whether the client identified itself with a
        fetchable URL or merely registered a name it chose for itself; the
        consent screen warns on the latter.
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
      responses:
        '200': { description: The request, in the user's terms., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown client. }

  /api/v1/oauth/approve:
    post:
      tags: [OAuth]
      summary: The user said yes.
      description: |
        **Session-only, and that is the load-bearing part of the whole flow**:
        minting a credential requires a logged-in human on this instance.
        Everything before this point is a request; this is the consent.

        `redirect_uri` is re-checked here rather than trusted from the browser —
        this handler is reachable directly. The `resource` must name this
        server, or RFC 8707's audience binding would record an audience and
        enforce nothing. The response carries `iss` (RFC 9207) in the redirect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                code_challenge: { type: string }
                scope: { type: string, nullable: true }
                state: { type: string, nullable: true }
                resource: { type: string, nullable: true }
      responses:
        '200':
          description: Where to send the browser next.
          content:
            application/json:
              schema:
                type: object
                properties: { redirect_to: { type: string, format: uri } }
        '400': { description: 'invalid_client, invalid_request or invalid_target.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────────────────────────────────────────────────────
  # Saved playlists
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/saved-playlists:
    get:
      tags: [Playlists]
      summary: Playlists kept in Tapedeck.
      description: |
        Session-only. `origin` is `user` for one you built, or the name of the
        MCP connection that wrote it — a list an assistant produced stays
        distinguishable from one you made, the same provenance rule notes
        follow.
      responses:
        '200':
          description: The playlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlists:
                    type: array
                    items: { $ref: '#/components/schemas/SavedPlaylist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Playlists]
      summary: Save a playlist.
      description: |
        Session-only. Tracks are **names, not file paths** — Tapedeck stores no
        server item ids for a generated list and resolves them against the real
        library at push time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tracks]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                tracks:
                  type: array
                  items: { $ref: '#/components/schemas/SavedPlaylistTrack' }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        '400': { description: No name, or no tracks. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/saved-playlists/{id}:
    get:
      tags: [Playlists]
      summary: One playlist and its tracks.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist: { $ref: '#/components/schemas/SavedPlaylist' }
                  tracks:
                    type: array
                    items: { $ref: '#/components/schemas/SavedPlaylistTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such playlist. }
    delete:
      tags: [Playlists]
      summary: Delete a playlist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such playlist. }

  /api/v1/saved-playlists/{id}/push:
    post:
      tags: [Playlists]
      summary: Send a stored playlist to a media server.
      description: |
        Session-only — pushing spends the credential of a configured source,
        which is the line `WriteAuth` deliberately does not cross.

        **This is the review step the MCP design turns on**: a list an assistant
        built is saved first and reaches a media server only when the person
        whose server it is says so.

        A partial match is the normal outcome — a listening history is not the
        same set as any one library — and every track that did not land is
        named. `404` means nothing matched; `502` means the server could not be
        reached. They need completely different things from the user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties: { source_id: { type: integer } }
      responses:
        '200':
          description: Sent, wholly or partly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist_id: { type: string }
                  protocol: { type: string }
                  requested: { type: integer }
                  matched: { type: integer }
                  missing: { type: array, items: { $ref: '#/components/schemas/SavedPlaylistTrack' } }
        '400': { description: The source is off, or cannot receive a playlist. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such playlist, or none of the tracks are on that server. }
        '502': { description: The server could not be reached, or refused the playlist. }

  # ───────────────────────────────────────────────────────────────────────────
  # The Crate
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/crate:
    get:
      tags: [Crate]
      summary: Things somebody suggested that you do not own.
      description: |
        Session-only. Each entry carries **`first_played_at`**, derived from the
        listens rather than stored — whether the suggestion actually landed.
        That is the thing only a scrobbler can answer, and it is what makes this
        more than a wantlist: a recommendation is a prediction, and Tapedeck is
        the only party that can score it.

        `landed` counts how many entries have since turned up in the history.
      responses:
        '200':
          description: The crate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  landed: { type: integer, description: How many suggestions were actually played. }
                  crate:
                    type: array
                    items: { $ref: '#/components/schemas/CrateEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Crate]
      summary: Add something to the crate.
      description: |
        Session-only for this endpoint; an assistant uses the MCP `add_to_crate`
        tool, which shares the same validation.

        Two refusals, both deliberate. **`because` is required** — what in your
        own listening prompted this — which is the vision doc's pipeline
        (analytics, candidate selection, explanation) enforced at the door
        rather than asked for in a prompt. And **anything already in the
        history is refused with its play count**: that is not a suggestion, it
        is rediscovery, and letting it through would turn the crate into a
        worse copy of a screen that already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewCrateEntry' }
      responses:
        '200':
          description: Filed. `created` is false when it was already there and the reason was updated.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer }, created: { type: boolean } }
        '400': { description: 'Missing grounding, malformed, or already in the history.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`from` named a deck you are not patched into.' }

  /api/v1/crate/{id}:
    patch:
      tags: [Crate]
      summary: Mark an entry acquired, dismissed, or open again.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, acquired, dismissed] }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: Unknown status. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such entry. }
    delete:
      tags: [Crate]
      summary: Remove an entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Removed., content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such entry. }
