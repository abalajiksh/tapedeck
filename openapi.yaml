        interface:
          type:
          - string
          - 'null'
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Null for one seen but not mapped yet — offered for one-tap assignment.
        last_seen:
          type: integer
          format: int64
          description: Unix seconds.
        hits:
          type: integer
          format: int64
          description: Listens that reported it.
    BindingList:
      type: object
      required:
      - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
    Bio:
      type: object
      description: |-
        A description of the album or artist, with the attribution it must be
        shown with. Every field is null when no provider had one.
      properties:
        text:
          type:
          - string
          - 'null'
        attribution:
          type:
          - string
          - 'null'
          description: |-
            Shown with the text, always — Last.fm's is CC BY-SA, and one without the
            other breaks the licence.
        provider:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          description: Where the full text lives.
    Breadth:
      type: object
      description: |-
        How widely you listen across the genre map. Every field but
        `genres_played` is absent when nothing was played.
      required:
      - genres_played
      properties:
        genres_played:
          type: integer
          minimum: 0
        genres_placed:
          type:
          - integer
          - 'null'
          description: Of those, the ones the map places.
          minimum: 0
        effective_genres:
          type:
          - number
          - 'null'
          format: double
          description: '`exp(H)` over play counts — as varied as playing N genres equally.'
        evenness:
          type:
          - number
          - 'null'
          format: double
          description: |-
            `effective_genres` over `genres_played`, 0–1. 1.0 would mean every
            genre played exactly equally.
        reach:
          type:
          - number
          - 'null'
          format: double
          description: |-
            Your play-weighted spread over the map's own spread, 0–1. Null when
            nothing played is on the map.
    BulkChain:
      type: object
      required:
      - ids
      - signal_chain_id
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: The listens to change. Anything not yours is skipped.
        signal_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which chain to put these listens on. **Required: present-and-null
            clears it; absent is a 400.** Not `chain_id` — a body with that
            spelling is refused rather than read as "clear".
            defaulting to `None` — so a request that merely *misspelled* the key
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which setup of that chain was fitted. Absent means none — and it is
            **written either way**, never left alone: a listen moved from chain A to
            chain B must not keep a variant belonging to A.
    BulkCompany:
      type: object
      description: The body of `POST /api/v1/scrobbles/bulk-company`.
      required:
      - ids
      - company
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: The listens to change. Anything not yours is skipped.
        company:
          type:
          - string
          - 'null'
          description: |-
            Who these listens were heard with, as names, or an explicit `null` to
            unmark them. **Required — absent is a 400.** Trimmed; an empty string
            means the same as `null`. At most 200 characters.
          maxLength: 200
    BulkTime:
      type: object
      description: The body of `POST /api/v1/scrobbles/bulk-time`.
      required:
      - ids
      - offset_seconds
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: |-
            The listens to move. Required and non-empty; anything not yours is
            skipped.
        offset_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |
            Seconds to move these listens by. Negative moves them earlier.
            **Required**, not zero, and at most a year either way.

            **An offset rather than an absolute time, and that is the design.** A
            timestamp is almost never wrong on its own: a clock was out by an hour,
            an evening was reconstructed from times laid out by arithmetic, or a
            capture arrived carrying somebody else's clock. Every one of those moves
            a run of listens by a constant, and a constant cannot scramble an
            ordering the way a set of hand-typed times can. Correcting a single
            listen is this operation over one id — the caller subtracts.
          maximum: 31622400
          minimum: -31622400
    BulkUpdated:
      type: object
      description: How many listens a bulk edit changed.
      required:
      - updated
      properties:
        updated:
          type: integer
          format: int64
          minimum: 0
    Bytes:
      type: string
      format: binary
    CaptureAnswer:
      type: object
      required:
      - ids
      - accept
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: The captures. Required.
        accept:
          type: boolean
          description: |-
            **Required.** Accepted plays land as imported and are never forwarded
            from here.
    CaptureTime:
      type: object
      required:
      - played_at
      properties:
        played_at:
          type: integer
          format: int64
          description: Unix seconds. Required.
    CapturesSettled:
      type: object
      required:
      - settled
      - forwarded
      properties:
        settled:
          type: integer
          format: int64
        forwarded:
          type: integer
          format: int64
          description: |-
            How many of those will be relayed to your connections — which turns
            on a setting *and* on each play being recent enough.
    Chain:
      type: object
      description: |-
        A signal chain: the gear a listen ran through, in order.

        **There is no `is_default`.** A chain is not default for anything by
        itself; *being the default* is a property of the thing pointing at it, and
        there are two: a **device** (`PATCH /api/v1/devices/{id}`) and an **API
        token**, whose `default_chain_id` is rung 3 of the chain ladder and is
        reported by `GET /1/validate-token`.

        Absent is not null here. `icon`, and a component's `equipment_id` and
        `since`, are **omitted entirely** when unset rather than sent as null — a
        strict deserialiser wants those optional, not nullable. `description`,
        `detail` and `status` really are present-and-null.
      required:
      - user_id
      - name
      - components
      - listening_context
      - is_active
      - total_hours
      - created_at
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        components:
          type: array
          items:
            $ref: '#/components/schemas/ChainComponent'
        listening_context:
          $ref: '#/components/schemas/ListeningContext'
        icon:
          type:
          - string
          - 'null'
          description: |-
            A name from the UI's `CHAIN_ICONS` set. **Omitted when unset**, not
            null. Unvalidated on purpose — an unknown value falls back to a generic
            mark rather than erroring, and rejecting a save because the front end
            learned a new icon first would be the worse failure.
        is_active:
          type: boolean
        shared:
          type: boolean
          description: |-
            *(since v0.76.1)* Whether this chain may be **named** to a deck patched
            into yours, and whether its listens reach the parts of Patch that have
            no patch behind them — the Instance tab, Discover, and Shared Spool
            captures. **Not the sharing unit** since v0.93.0: what a patched deck
            sees is `share_all_with_patched` on the profile.
        total_hours:
          type: number
          format: double
          description: |-
            Derived from the listens (`SUM(duration)` where `chain_id` matches and
            the listen is not a skip), never accumulated — so assigning a chain to
            an old listen moves the hours, and un-assigning takes them back. A
            source that reported no length contributes nothing, so this is a floor.
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
    ChainComponent:
      type: object
      description: One step of a chain.
      required:
      - type
      - name
      properties:
        type:
          $ref: '#/components/schemas/ComponentType'
        name:
          type: string
          description: Always written, so deleting the gear leaves the chain readable.
        detail:
          type:
          - string
          - 'null'
          description: |-
            Free text about this step. Always present; null when there is none.
            Guessed from the gear type when a step is first picked and never
            re-applied, so an override sticks.
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The `equipment` row this step *is*, set when it was picked from your
            gear. **Omitted** for free text — a chain can name something you do not
            own (a friend's amp, a rental).
        since:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Unix seconds from which this box was in the path. **Omitted means "for
            as long as the chain has existed"**, which is what every step written
            before this field meant.

            Chain and gear hours are derived from the listens, so without it a box
            added to a chain that already has history is credited with all of it.
            Stamped automatically on gear a chain did not name before; send one to
            correct the date, or `null` to say it was always there.
    ChainList:
      type: object
      required:
      - chains
      properties:
        chains:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
    ChainShareSwitch:
      type: object
      required:
      - shared
      properties:
        shared:
          type: boolean
          description: '**Required** — an absent key is a 400.'
    ChainShared:
      type: object
      required:
      - shared
      properties:
        shared:
          type: boolean
    ChainTally:
      type: object
      required:
      - name
      - plays
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: At least 8 characters.
          minLength: 8
    Chart:
      type: object
      description: |-
        Ranked chart over one window. The Statistics page shows the head of these
        three lists; this serves the whole thing for the dedicated charts screen.
        A ranked chart.
      required:
      - kind
      - range
      - rows
      properties:
        kind:
          type: string
          description: '`artists`, `albums` or `tracks`.'
        range:
          type: string
          description: The window, as asked.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ChartRow'
    ChartRow:
      type: object
      description: |-
        One row of a chart. `sub` is the secondary line — an album's or track's
        artist — and is null for an artist chart, where the name says it all.
      required:
      - name
      - plays
      - seconds
      properties:
        name:
          type: string
        sub:
          type:
          - string
          - 'null'
        album:
          type:
          - string
          - 'null'
          description: |-
            Only set on a tracks chart — the record the track is on, so the row can
            open the album like every other track listing in the app.
        plays:
          type: integer
          format: int64
        seconds:
          type: integer
          format: int64
        artwork_url:
          type:
          - string
          - 'null'
          description: A cover, from one of the listens counted.
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
    ClientRegistered:
      type: object
      description: |-
        RFC 7591 registration response. The `client_id` is not a credential; it
        gets a client as far as a request a signed-in person has to approve.
      required:
      - client_id
      - client_name
      - redirect_uris
      - token_endpoint_auth_method
      - grant_types
      - response_types
      properties:
        client_id:
          type: string
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
    ClientRegistration:
      type: object
      description: RFC 7591 registration. Open by design.
      properties:
        client_name:
          type:
          - string
          - 'null'
          description: Up to 80 characters. Shown on the consent screen as unverified.
        redirect_uris:
          type: array
          items:
            type: string
          description: |-
            At least one. `https`, loopback `http`, or a private-use scheme; no
            fragment.
          minItems: 1
    Collection:
      type: object
      description: 'One collection: rows, and the reason they are together.'
      required:
      - key
      - title
      - blurb
      - accent
      - stat
      - count
      - rows
      properties:
        key:
          type: string
          description: |-
            `forgotten`, `highrated`, `onelisten`, `seasonal`, `latenight`,
            `deepcuts` or `dusty`.
        title:
          type: string
        blurb:
          type: string
          description: Why these rows are together.
        accent:
          type: string
          description: A hex colour.
        stat:
          type: string
          description: The evidence, in words — "Last played 14 months ago".
        count:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RediscoveryRow'
    ComponentType:
      type: string
      description: What kind of box a step is.
      enum:
      - source
      - transport
      - dac
      - amp
      - transducer
      - network
      - bluetooth
    Connected:
      type: object
      required:
      - connected
      properties:
        connected:
          type: boolean
        username:
          type:
          - string
          - 'null'
    Connection:
      type: object
      required:
      - service
      - connected_at
      properties:
        service:
          type: string
          description: '`listenbrainz`, `lastfm` or `librefm`.'
        username:
          type:
          - string
          - 'null'
          description: The account on that service, where it said.
        connected_at:
          type: integer
          format: int64
    ConnectionList:
      type: object
      description: Your forwarding connections. Never carries a token or session key.
      required:
      - connections
      - lastfm_available
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        lastfm_available:
          type: boolean
    CoverSet:
      type: object
      description: |-
        An album cover, set or cleared. Null when cleared — the page then falls
        back to the cover from your listens.
      properties:
        artwork_url:
          type:
          - string
          - 'null'
    Coverage:
      type: object
      description: How far a backfill has got.
      required:
      - total
      - resolved
      - pending
      properties:
        total:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
          description: '`total - resolved`.'
    Crate:
      type: object
      description: Everything in the crate, and how much of it landed.
      required:
      - crate
      - open
      - landed
      properties:
        crate:
          type: array
          items:
            $ref: '#/components/schemas/CrateEntry'
        open:
          type: integer
          description: Entries still `open`.
          minimum: 0
        landed:
          type: integer
          description: How many suggestions were actually played.
          minimum: 0
    CrateAdd:
      allOf:
      - $ref: '#/components/schemas/NewCrateEntry'
      - type: object
        properties:
          from:
            type:
            - string
            - 'null'
            description: |-
              Optional. The **username of a deck you are patched into** — the Reel's
              "into my crate" button. Resolved and checked server-side, and a deck
              you cannot read is a **403**: the Crate groups by origin and shows
              "suggested by X", so a client writing that string itself would be
              asserting a provenance rather than earning one. The patch must point
              *from* you *to* them; somebody who follows you has told you nothing.
              Omit it for something you found yourself, which files under the
              origin `user`.
      description: What a hand-filed crate entry says, plus where it came from.
    CrateEntry:
      allOf:
      - $ref: '#/components/schemas/RecommendationRow'
      - type: object
        required:
        - plays
        properties:
          first_played_at:
            type:
            - integer
            - 'null'
            format: int64
            description: |-
              When this first turned up in the listening history, if it ever did.
              **Derived from the listens, not stored**, so it cannot drift from what
              it summarises.
          plays:
            type: integer
            format: int64
      description: |-
        A crate entry with the bit only Tapedeck can supply: whether the
        recommendation actually landed.

        A recommendation is a *prediction*, and a scrobbler is the only thing in the
        room that can score it. `first_played_at` is derived from the listens rather
        than stored, so it cannot drift from them.
    CrateFiled:
      type: object
      required:
      - id
      - created
      properties:
        id:
          type: integer
          format: int64
        created:
          type: boolean
          description: False when it was already there and its reason was updated.
    CrateRemoved:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    CrateStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`open`, `acquired` or `dismissed`.'
          example: acquired
    CrateStatusSet:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    CreateChainRequest:
      type: object
      required:
      - name
      - components
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        components:
          type: array
          items:
            $ref: '#/components/schemas/ChainComponent'
        listening_context:
          $ref: '#/components/schemas/ListeningContext'
        icon:
          type:
          - string
          - 'null'
          description: |-
            A glyph name from the UI's set. Not validated here — an unknown value
            falls back to a generic mark on render, which is a better failure than
            rejecting a save because the front end learned a new icon first.
    CreateEquipmentRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
        brand:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When it was bought, unix seconds. Distinct from `first_used`, which is
            when Tapedeck first saw it — gear is usually owned for a while before
            anyone gets round to cataloguing it, and burn-in hours are counted from
            the purchase.
    CreateTokenRequest:
      type: object
      required:
      - name
      properties:
        user_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Whose token. Defaults to the caller; anyone else's is admin-only, since
            minting a token for another account is taking it over.
        name:
          type: string
          description: |-
            Name it per device — that is what makes revocation meaningful when a
            phone is lost.
        scopes:
          type: string
          description: |-
            Space- or comma-separated: `submit`, `read`, `write`, or `all`. None
            implies another.
          default: submit
        default_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The chain every listen submitted with this token is attributed to,
            unless the listen carries better evidence — rung 3 of the chain ladder.
            One token per app makes attribution zero-configuration on the client
            side. Must be one of the owner's chains.
        imports_are_live:
          type: boolean
          description: |-
            Whether this client's `listen_type: "import"` submissions are live
            listens rather than a backfill. Some players (fooyin) label every
            scrobble `import`; without this their listens are stored but never
            forwarded to Last.fm / ListenBrainz. Even when set, only listens from
            the last 24h are forwarded, so a genuine history import from the same
            client stays local.
    CreateTokenResponse:
      type: object
      required:
      - token
      - name
      - user_id
      - message
      properties:
        token:
          type: string
          description: The secret. **In this response and nowhere else.**
        name:
          type: string
        user_id:
          type: integer
          format: int64
        message:
          type: string
    CreateUserRequest:
      type: object
      required:
      - username
      properties:
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
          description: |-
            Optional. Without one the account cannot sign in until an admin sets a
            password with `PATCH /admin/users/{id}`, but its token works at once.
    CreateUserResponse:
      type: object
      required:
      - user_id
      - username
      - token
      - message
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        token:
          type: string
          description: A `submit` token for the new account. Shown once, never again.
        message:
          type: string
    CreateVariantRequest:
      type: object
      required:
      - chain_id
      - name
      properties:
        chain_id:
          type: integer
          format: int64
        name:
          type: string
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/VariantOverride'
    CreditEdit:
      type: object
      required:
      - artist
      properties:
        artist:
          type: string
          description: The full credit as stored, e.g. `Cœur de pirate feat. Loud`.
    Crush:
      type: object
      required:
      - name
      - plays
      - since
      properties:
        name:
          type: string
          description: The first spelling it arrived under.
        plays:
          type: integer
          format: int64
        since:
          type: integer
          format: int64
          description: Unix seconds of the first listen.
    DailyHour:
      type: object
      description: |-
        One listen's contribution to a day's hours. Sent as raw timestamps rather
        than pre-bucketed, because the day boundary belongs to the *reader's*
        timezone and the server does not know it here.
      required:
      - at
      - hours
      properties:
        at:
          type: integer
          format: int64
        hours:
          type: number
          format: double
    DashboardStats:
      type: object
      description: |-
        The home screen's numbers. "Today" and "this week" are in your own
        timezone, and the week starts on the day your preferences say.
      required:
      - today
      - this_week
      - total
      - lossless_pct
      - fidelity_known
      - top_artist
      - top_artist_count
      - total_hours
      - today_hours
      - week_hours
      - avg_quality
      properties:
        today:
          type: integer
          format: int64
        this_week:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        lossless_pct:
          type: integer
          format: int64
          description: A whole percentage of `fidelity_known`, not of `total`.
        fidelity_known:
          type: integer
          format: int64
          description: |-
            Listens whose format is known — the population `lossless_pct` is a
            share of. When that is a small slice, show the coverage rather than the
            percentage: a 94% computed from 558 of 21,390 listens is a fact about
            the 558.
        top_artist:
          type: string
          description: The most-played artist of the last 30 days, or `—` with none.
        top_artist_count:
          type: integer
          format: int64
        total_hours:
          type: number
          format: double
        today_hours:
          type: number
          format: double
        week_hours:
          type: number
          format: double
        avg_quality:
          type: number
          format: double
          description: Over the listens that carry a score; 0 with none.
    DeckChain:
      type: object
      description: One chain a deck publishes.
      required:
      - name
      - components
      - hours
      properties:
        name:
          type: string
        icon:
          type:
          - string
          - 'null'
        components:
          type: string
        hours:
          type: number
          format: double
    DeckReported:
      type: object
      required:
      - status
      - changed
      properties:
        status:
          type: string
          description: '`ok`.'
        changed:
          type: boolean
          description: A different track from the last report.
    DeckState:
      type: object
      required:
      - side
      - position
      properties:
        side:
          type: string
          example: A
        position:
          type: integer
          format: int64
          description: The track's position on the side.
        elapsed:
          type: integer
          format: int64
          description: Seconds into that track.
          minimum: 0
        paused:
          type: boolean
          description: |-
            A paused record is not playing, but it is still on the deck. The entry
            stays and stops advancing, which is what the still platter shows.
    DeckView:
      type: object
      description: Somebody else's deck, as the person patched into it may see it.
      required:
      - user_id
      - username
      - created_at
      - listens
      - chains
      - both_play
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        listens:
          type: integer
          format: int64
          description: |-
            Listens a patch into this deck can see — everything they play when they
            have opened up, and otherwise only what ran through a chain they
            publish. Not, either way, their whole history: skips never appear.
        chains:
          type: array
          items:
            $ref: '#/components/schemas/DeckChain'
        both_play:
          type: array
          items:
            type: string
          description: Overlap only — no score.
        actor:
          type:
          - string
          - 'null'
          description: |-
            Their actor URI, when they have an identity at all. `None` is a normal
            state, because federation is opt-in, and the page says so rather than
            printing endpoints that would 404.
    Device:
      type: object
      description: A player that has submitted listens — rung 4 of the chain ladder.
      required:
      - id
      - user_id
      - machine_id
      - first_seen
      - last_seen
      - total_listens
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        machine_id:
          type: string
          description: '`tapedeck_device.machine_id` — the key.'
        name:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
        product:
          type:
          - string
          - 'null'
        device_type:
          type:
          - string
          - 'null'
        default_chain_id:
          type:
          - integer
          - 'null'
          format: int64
        first_seen:
          type: integer
          format: int64
        last_seen:
          type: integer
          format: int64
        total_listens:
          type: integer
          format: int64
    DeviceList:
      type: object
      required:
      - devices
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    DiscogsCheck:
      type: object
      description: |-
        A rejection is a 200 with `ok: false`: the request succeeded and the answer
        is no.
      required:
      - ok
      - message
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: Discogs' own words, which name the credential shape it rejected.
    DiscogsConfigured:
      type: object
      required:
      - configured
      properties:
        configured:
          type: boolean
    DiscogsPressing:
      type: object
      required:
      - candidate
      properties:
        candidate:
          $ref: '#/components/schemas/PressingCandidate'
    DiscogsSettings:
      type: object
      description: Whether Discogs is configured, and never the credential.
      required:
      - configured
      - from_env
      - stored
      - kind
      properties:
        configured:
          type: boolean
        from_env:
          type: boolean
        stored:
          type: boolean
        kind:
          type: string
          description: 'Which credential shape is in use: `token`, `key_secret` or `none`.'
    DiscogsUpdate:
      type: object
      description: Each field is written only when present; an empty string clears it.
      properties:
        token:
          type:
          - string
          - 'null'
          description: A personal access token. Empty clears it.
        key:
          type:
          - string
          - 'null'
          description: An application's consumer key and secret. Either empty clears the pair.
        secret:
          type:
          - string
          - 'null'
    DiscoverDeck:
      type: object
      description: A deck on the instance, with what the viewer has in common with it.
      required:
      - user_id
      - username
      - created_at
      - shared_chains
      - overlap
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        shared_chains:
          type: integer
          format: int64
        state:
          type:
          - string
          - 'null'
          description: '`pending` | `accepted` | `rejected`, or `None` if never asked.'
        overlap:
          type: string
          description: |-
            Artists you both play, unit-separated. **Computed against their shared
            chains only**, so this cannot become a way to learn what somebody plays
            privately by watching the list change.
    DiscoverDecks:
      type: object
      required:
      - decks
      properties:
        decks:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverDeck'
    DryRunListen:
      type: object
      description: One listen's resolved state, computed and thrown away.
      required:
      - index
      - artist
      - title
      - timestamp
      - chain_source
      - status_if_stored
      - skipped
      - duplicate
      properties:
        index:
          type: integer
          description: Index into the submitted `payload`.
          minimum: 0
        artist:
          type: string
        title:
          type: string
        album:
          type:
          - string
          - 'null'
        timestamp:
          type: integer
          format: int64
        quality_score:
          type:
          - number
          - 'null'
          format: double
          description: |-
            What your `tapedeck_audio` fields scored, 0–100 — the main thing worth
            getting right and otherwise invisible.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
        chain_name:
          type:
          - string
          - 'null'
        chain_source:
          type: string
          description: |-
            **Which rung of the ladder won:** `explicit`, `output_binding`,
            `token_default`, `device_default` or `none`. The single most useful
            field here: a chain arriving from the wrong rung looks identical to one
            arriving from the right one, so without this a misconfiguration is
            invisible until someone reads their history months later.
          pattern: ^(explicit|output_binding|token_default|device_default|none)$
        device_id:
          type:
          - integer
          - 'null'
          format: int64
        listening_context:
          type:
          - string
          - 'null'
        status_if_stored:
          type: string
          description: |-
            `pending` will be forwarded onward; `imported` is stored only. The
            distinction a backfill has to get right, answered before it is too late
            to change.
          pattern: ^(pending|imported)$
        skipped:
          type: boolean
        duplicate:
          type: boolean
          description: |-
            Whether dedup would have swallowed it, checked read-only against the
            real rules.
    DryRunResponse:
      type: object
      description: The reply to `?dry_run` — what *would* have happened.
      required:
      - status
      - dry_run
      - listens
      - rejected
      properties:
        status:
          type: string
          description: Always `ok`.
          example: ok
        dry_run:
          type: boolean
          description: Always `true`.
        listens:
          type: array
          items:
            $ref: '#/components/schemas/DryRunListen'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedListen'
    Dub:
      type: object
      description: A record somebody handed you.
      required:
      - id
      - kind
      - artist
      - status
      - created_at
      - from_username
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        artist:
          type: string
        name:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        because:
          type:
          - string
          - 'null'
        status:
          type: string
        created_at:
          type: integer
          format: int64
        from_username:
          type: string
        from_display_name:
          type:
          - string
          - 'null'
    DubFiled:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
    Dubs:
      type: object
      required:
      - dubs
      properties:
        dubs:
          type: array
          items:
            $ref: '#/components/schemas/Dub'
    Duplicates:
      type: object
      description: Pairs of chains that look like the same rig. Nothing has been changed.
      required:
      - duplicates
      properties:
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/FoldSuggestion'
    DurationPreview:
      type: object
      description: What another pressing says the tracks run. Nothing is written.
      required:
      - complete
      - durations
      properties:
        complete:
          type: boolean
          description: Every track already has a running time; there is nothing to ask.
        durations:
          type: array
          items:
            $ref: '#/components/schemas/DurationProposal'
        source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DurationSource'
            description: The pressing the running times came from.
        unavailable:
          type:
          - boolean
          - 'null'
          description: |-
            The lookup could not be made — MusicBrainz was busy, throttling, or
            did not answer inside this endpoint's own 20-second deadline. **Still a
            200**, deliberately: an upstream being slow is a normal outcome of
            asking, and a 5xx here is indistinguishable from a reverse proxy's own.
            An empty `durations` without this means the lookup succeeded and found
            nothing.
        note:
          type:
          - string
          - 'null'
    DurationProposal:
      type: object
      description: One track's proposed running time, as previewed and as applied.
      required:
      - side
      - position
      - title
      properties:
        side:
          type: string
        position:
          type: integer
          format: int64
        title:
          type: string
        current:
          type:
          - integer
          - 'null'
          format: int64
          description: What the shelf holds now.
        proposed:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            What the looked-up pressing says. Null where nothing matched — never a
            guess.
    DurationSource:
      type: object
      required:
      - title
      - artist
      properties:
        title:
          type: string
        artist:
          type: string
        year:
          type:
          - integer
          - 'null'
          format: int64
        format:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        mbid_release:
          type:
          - string
          - 'null'
    DurationsApplied:
      type: object
      required:
      - filled
      - listens_updated
      - plays_recomputed
      properties:
        filled:
          type: integer
          description: |-
            Tracks that gained a duration. One the shelf already had is never
            overwritten.
          minimum: 0
        listens_updated:
          type: integer
          format: int64
          description: Listens already recorded that were corrected.
          minimum: 0
        plays_recomputed:
          type: integer
          format: int64
          description: |-
            Side plays whose recorded wear was brought back in line. **Whole-side
            plays only** — a partial play records how many tracks ran but never
            which, so its wear cannot be reconstructed and is left alone.
          minimum: 0
    EditedListen:
      oneOf:
      - $ref: '#/components/schemas/Listen'
      - $ref: '#/components/schemas/ListenUpdated'
      description: |-
        An edited listen: the fresh row, or — when it could not be read back —
        just its id.
    Entity:
      type: object
      description: 'Something a note or a love can point at: a recording, a release, an artist.'
      required:
      - id
      - kind
      - name
      - artist_name
      - created_at
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: '`recording`, `release` or `artist`.'
        name:
          type: string
        artist_name:
          type: string
          description: Empty for `kind = 'artist'`, where the name *is* the artist.
        mbid:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
    EntityView:
      type: object
      description: One entity, and your note on it.
      required:
      - entity
      - loved
      properties:
        entity:
          $ref: '#/components/schemas/Entity'
        loved:
          type: boolean
        note:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Note'
    Equipment:
      type: object
      description: |-
        A piece of gear.

        **The type field is `equipment_type` on the way out and `type` on the way
        in.** `POST`/`PATCH` take `type`, every read returns `equipment_type`.
      required:
      - id
      - user_id
      - name
      - equipment_type
      - total_hours
      - sources
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        equipment_type:
          type: string
          description: |-
            `dac`, `amp`, `transducer`, `cartridge`, `headshell`, `phono`,
            `turntable`, `tape-deck`, `transport`, …
        brand:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        total_hours:
          type: number
          format: double
          description: |-
            Derived — summed from every chain referencing this gear, never
            accumulated. Free-text chain steps report zero, which is honest.
        first_used:
          type:
          - integer
          - 'null'
          format: int64
          description: When Tapedeck first saw it, unix seconds.
        last_used:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix seconds.
        notes:
          type:
          - string
          - 'null'
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When it was bought, unix seconds. Distinct from `first_used` — gear is
            usually owned for a while before anyone gets round to cataloguing it,
            and burn-in hours are counted from the purchase.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/GearHours'
          description: |-
            *(since v0.70.4)* What `total_hours` is made of, largest first — the
            same per-(chain, variant) seconds the hours are derived from, so the
            parts always add to the whole. Empty for gear nothing has logged time
            through.
        status:
          type:
          - string
          - 'null'
          description: |-
            Why this piece is not in a chain — `new`, `spare` or `lent`. Null is the
            usual state and means nothing has been said. Free text: the UI owns the
            vocabulary.
    EquipmentList:
      type: object
      required:
      - equipment
      properties:
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
    Error:
      type: object
      description: Every error body in the API has this shape.
      required:
      - code
      - error
      properties:
        code:
          type: integer
          format: int32
          description: Mirrors the HTTP status.
          minimum: 0
        error:
          type: string
          description: Human-readable. Not a stable identifier — do not branch on it.
    EveryNoiseContact:
      type: object
      required:
      - contact
      properties:
        contact:
          type: string
          description: |-
            An email address, sent in the scraper's `User-Agent` so the site's
            owner can reach whoever is fetching. Empty clears it.
    EveryNoiseDone:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`saved`, `stopping` or `cleared`.'
    EveryNoiseStatus:
      type: object
      description: What is held, and whether a walk is running.
      required:
      - summary
      - source
      properties:
        summary:
          $ref: '#/components/schemas/GenreMapHeld'
        progress:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ScrapeProgress'
            description: Null when nothing has run since the process started.
        contact:
          type:
          - string
          - 'null'
          description: |-
            The admin's address sent in the scraper's `User-Agent`. Echoed so the
            field can be pre-filled; it is not a credential.
        source:
          type: string
    FeaturedArtist:
      type: object
      description: |-
        An artist string carrying a featured credit, and the primary artist it would
        fold into.
      required:
      - artist
      - primary
      - plays
      properties:
        artist:
          type: string
        primary:
          type: string
        plays:
          type: integer
          format: int64
    FederationOps:
      type: object
      description: The admin Operations panel. Only what is actually recorded.
      required:
      - identities
      - published
      - frozen
      - remote_actors
      - inbox_activities
      - deliveries
      properties:
        identities:
          type: integer
          format: int64
        published:
          type: integer
          format: int64
        frozen:
          type: integer
          format: int64
        remote_actors:
          type: integer
          format: int64
        inbox_activities:
          type: integer
          format: int64
        deliveries:
          type: integer
          format: int64
    FederationSwitch:
      type: object
      description: Whether this account is discoverable, and the identity it publishes.
      required:
      - enabled
      - handle
      - would_be
      properties:
        enabled:
          type: boolean
        handle:
          type: string
          description: What somebody on another server would type, `@name@host`.
        actor:
          type:
          - string
          - 'null'
          description: |-
            The actor URI. Null until an identity has been minted — the first time
            federation is switched on.
        would_be:
          type: string
          description: The URI that would be minted, shown as a preview.
        frozen_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Once set, the username is load-bearing for other servers and cannot be
            renamed.
    FetchLyricsRequest:
      type: object
      required:
      - artist
      - title
      properties:
        artist:
          type: string
        title:
          type: string
        album:
          type:
          - string
          - 'null'
          description: Narrows the LRCLIB lookup when the caller knows it.
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Likewise — LRCLIB matches on length, and a wrong-length record is the
            usual reason a well-known song comes back with somebody else's words.
    FetchedLyrics:
      oneOf:
      - type: object
        description: |-
          LRCLIB could not be asked — rate limited or unreachable. **Not** "there
          are no words": nothing was learned about the track.
        required:
        - unavailable
        - why
        properties:
          unavailable:
            type: boolean
            description: Always `true`.
          why:
            type: string
      - allOf:
        - $ref: '#/components/schemas/LyricDocument'
        - type: object
          required:
          - already_held
          properties:
            already_held:
              type: boolean
              description: The words were already held, so nothing was fetched.
        description: The document, as the reader should now show it.
      description: 'A lookup''s outcome: the whole lyric document, or why nobody could be asked.'
    FileUpload:
      type: object
      description: |-
        A `multipart/form-data` upload of one file.

        The server takes the first file part whatever its field name; `file` is the
        name to use. Its declared `Content-Type` decides how the file is stored — a
        filename from the client never reaches a path on disk.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
    Fingerprint:
      type: object
      description: |-
        Five ratios between 0 and 1, and the same five for *you, usually* — every
        one answerable from any history, and **none of them a comparison against
        another person**. The baseline is the mean of your own periods, not one
        shape over the whole history: `variety` shrinks as plays grow and
        `discovery` is pinned at 1.0 over a whole history, so a whole-history
        baseline would report every period as more varied and less exploratory
        than usual.
      required:
      - axes
      - you
      - usual
      - usual_periods
      properties:
        axes:
          type: array
          items:
            type: string
          description: '`Variety`, `Repeat`, `Discovery`, `Spread`, `Runs`.'
        you:
          type: array
          items:
            type: number
            format: double
        usual:
          type: array
          items:
            type: number
            format: double
        usual_periods:
          type: integer
          description: |-
            How many periods the baseline rests on. One is not a habit — a radar
            comparing a month against itself draws two identical shapes and means
            nothing by it, so decline to draw the baseline below two.
          minimum: 0
    FixLyricsRequest:
      type: object
      required:
      - artist
      - title
      properties:
        artist:
          type: string
        title:
          type: string
        plain:
          type:
          - string
          - 'null'
          description: The words, plain. Absent clears them.
        synced:
          type:
          - string
          - 'null'
          description: The timed form, `[mm:ss.xx] words` per line.
    FoldOutcome:
      type: object
      description: |-
        What a fold moved, so the caller can say it rather than claim success.

        Reported per table because they are different kinds of thing: listens
        are the hours, a token or a device default is *future* attribution, and
        a record on the shelf is the turntable it lives with.
      required:
      - variant_id
      - variant_name
      - variant_created
      - listens
      - sides
      - sessions
      - releases
      - devices
      - bindings
      - tokens
      properties:
        variant_id:
          type: integer
          format: int64
        variant_name:
          type: string
        variant_created:
          type: boolean
        listens:
          type: integer
          format: int64
          minimum: 0
        sides:
          type: integer
          format: int64
          minimum: 0
        sessions:
          type: integer
          format: int64
          minimum: 0
        releases:
          type: integer
          format: int64
          minimum: 0
        devices:
          type: integer
          format: int64
          minimum: 0
        bindings:
          type: integer
          format: int64
          minimum: 0
        tokens:
          type: integer
          format: int64
          minimum: 0
    FoldRequest:
      type: object
      description: |-
        What a fold request has to say. Deliberately not one nullable field.

        `variant_id` (land on one that exists) and `variant_name` (derive a new one
        from the two chains) are different intents, and a single nullable field
        would make "use the variant I built" and "make me another one" the same
        request with a typo between them — on an endpoint that is not reversible.
      required:
      - into_chain_id
      properties:
        into_chain_id:
          type: integer
          format: int64
        variant_id:
          type:
          - integer
          - 'null'
          format: int64
        variant_name:
          type:
          - string
          - 'null'
    FoldSuggestion:
      type: object
      description: |-
        One pair of chains that look like the same rig, and what folding would do.

        Reported, never acted on — the same preview-then-apply discipline the
        metadata sanitiser follows, and for the same reason: a fold is not
        reversible, and a plurality of one step is a weak signal the operator should
        see before agreeing to it.
      required:
      - base_chain_id
      - base_name
      - base_hours
      - fold_chain_id
      - fold_name
      - fold_hours
      - distance
      - overrides
      - fold_blocked_by_variants
      properties:
        base_chain_id:
          type: integer
          format: int64
        base_name:
          type: string
        base_hours:
          type: number
          format: double
        fold_chain_id:
          type: integer
          format: int64
        fold_name:
          type: string
        fold_hours:
          type: number
          format: double
        distance:
          type: integer
          format: int64
          description: How many steps disagree. 0 is the same wiring under two names.
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/VariantOverride'
          description: What the folded chain becomes as a variant of the base.
        matching_variant:
          type:
          - array
          - 'null'
          items:
            type: object
          description: |-
            A variant of the base that is *already* wired this way, as
            `[id, name]` — the state someone is in when they built the variant and
            found the old chain still sitting in the list beside it.
        fold_blocked_by_variants:
          type: boolean
          description: |-
            This one carries variants of its own, so it cannot be the side that
            folds. Surfaced here rather than left for the fold to refuse.
    GearChain:
      type: object
      required:
      - name
      - plays
      - hours
      properties:
        name:
          type: string
        icon:
          type:
          - string
          - 'null'
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
    GearChoice:
      type: object
      required:
      - id
      - name
      - type
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
    GearHours:
      type: object
      description: Where one piece of gear's hours came from.
      required:
      - chain_id
      - chain_name
      - hours
      properties:
        chain_id:
          type: integer
          format: int64
        chain_name:
          type: string
        variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Set when the listening went through a *variant* of that chain — which is
            the case the breakdown exists for, since that is when one piece of gear
            accrues hours through a chain that does not name it.
        variant_name:
          type:
          - string
          - 'null'
        hours:
          type: number
          format: double
    GearItem:
      type: object
      required:
      - name
      - type
      - plays
      - hours
      properties:
        name:
          type: string
        type:
          type: string
          description: The component type, lowercased — `dac`, `amp`, `transducer`…
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
    GearRows:
      type: object
      description: Favourites a piece of gear has never played.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RediscoveryRow'
    GearWear:
      type: object
      required:
      - hours
      - sides_played
      properties:
        hours:
          type: number
          format: double
          description: To one decimal place.
        sides_played:
          type: integer
          format: int64
    GenreBands:
      type: object
      description: |-
        The period's three biggest genres **by name**, fixed across every
        sub-bucket, plus `other` as the remainder. Drawn as stacked bands by the
        year chapter. A sub-bucket with no tags at all is all zeroes rather than
        100% `other` — an empty month is an absence, not a genre.

        Shares of tag *mentions*, like `genres`.
      required:
      - names
      - shares
      properties:
        names:
          type: array
          items:
            type: string
          description: At most three.
        shares:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: One row per sub-bucket; each row is the named shares then `other`.
    GenreMap:
      type: object
      description: Everything on the map, and where your listening sits on it.
      required:
      - map
      - mine
      - placed_tags
      - unplaced_plays
      - listens_with_genres
      - listens_total
      properties:
        map:
          $ref: '#/components/schemas/MapBackdrop'
        mine:
          type: array
          items:
            $ref: '#/components/schemas/MyGenre'
          description: Your genres that have a place on the map.
        colour:
          type:
          - string
          - 'null'
          description: |-
            Play-weighted average colour of `mine`, blended in linear light — what
            your listening sounds like.
          example: '#a18430'
        placed_tags:
          type: integer
          minimum: 0
        unplaced_plays:
          type: integer
          format: int64
          description: |-
            Plays on tags with no place on the map — instruments, nationalities,
            roles.
        listens_with_genres:
          type: integer
          format: int64
          description: |-
            So a half-backfilled history says so rather than looking like a small
            life.
        listens_total:
          type: integer
          format: int64
    GenreMapHeld:
      type: object
      description: What the local copy currently holds.
      required:
      - genres
      - artists
      - edges
      - pages_scraped
      properties:
        genres:
          type: integer
          format: int64
        artists:
          type: integer
          format: int64
        edges:
          type: integer
          format: int64
        pages_scraped:
          type: integer
          format: int64
          description: |-
            Genre pages walked, out of `genres` — the tier 2 progress marker that
            survives a restart.
        last_scraped_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix seconds of the most recent write, or `None` when empty.
    GenreNeighbours:
      type: object
      description: |-
        Genres bordering your listening, split by whether you already own music
        there.
      required:
      - next_door
      - unexplored
      - opposite
      - seeded_from
      properties:
        next_door:
          type: array
          items:
            $ref: '#/components/schemas/NeighbourGenre'
          description: |-
            Bordering genres you already own music in and underplay. This half
            leads.
        unexplored:
          type: array
          items:
            $ref: '#/components/schemas/NeighbourGenre'
          description: Bordering genres you own nothing in — a region, never a suggestion.
        opposite:
          type: array
          items:
            $ref: '#/components/schemas/NeighbourGenre'
          description: Furthest from your listening. Suggests nothing by construction.
        seeded_from:
          type: integer
          description: How many of your top genres the walk started from.
          minimum: 0
    GenreShare:
      type: object
      required:
      - name
      - pct
      properties:
        name:
          type: string
        pct:
          type: integer
          format: int64
          description: A whole percentage of tag mentions.
    GenreTrajectory:
      type: object
      description: |-
        The play-weighted centre of each period's listening, on the map's
        coordinates.
      required:
      - years
      - unit
      properties:
        years:
          type: array
          items:
            $ref: '#/components/schemas/TrajectoryPoint'
        unit:
          type: string
          description: '`year` or `month`.'
        min_plays:
          type:
          - integer
          - 'null'
          format: int64
          description: Periods with fewer placed plays than this are left out.
        note:
          type:
          - string
          - 'null'
          description: Set when nothing could be drawn.
    Group:
      type: string
      description: |-
        Which half of the space an axis belongs to: `sound` is about the music
        (from the genre map), `habit` about the listener (from their history).
      enum:
      - sound
      - habit
    HandOver:
      type: object
      required:
      - session
      - to
      - kind
      properties:
        session:
          type: string
          description: The sitting's uuid, from `GET /api/v1/sessions`.
        to:
          type: string
          description: The username to hand it to.
        note:
          type:
          - string
          - 'null'
          description: At most 500 characters.
        kind:
          type: string
          description: |-
            **Which of the two gestures this is, and it is required.**

            `spool` — they were in the room and neither of you started a sitting.
            The plays are offered as ordinary captures and enter their history when
            they accept, exactly as a live Shared Spool would have.

            `recommendation` — they were not there. They get a document of what you
            played, and nothing enters their history.
    HandedListen:
      type: object
      description: |-
        One listen inside a handed-over sitting. **Not a listen of the reader's** —
        this enters no history, count or chart.
      required:
      - title
      - artist
      - timestamp
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        timestamp:
          type: integer
          format: int64
        duration:
          type:
          - integer
          - 'null'
          format: int64
        artwork_url:
          type:
          - string
          - 'null'
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
        chain_name:
          type:
          - string
          - 'null'
    HandedOver:
      type: object
      required:
      - kind
      - uuid
      properties:
        kind:
          type: string
          description: '`spool` or `recommendation`, as asked.'
        uuid:
          type: string
          description: The sitting's uuid for `spool`; the document's for `recommendation`.
        offered:
          type:
          - integer
          - 'null'
          format: int64
          description: '`spool` only: plays offered to them as captures…'
        withheld:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            …and plays held back because they ran through a chain you do not
            share.
    HandedSitting:
      type: object
      description: A sitting somebody handed you, as it appears in the inbox.
      required:
      - uuid
      - session_uuid
      - created_at
      - from_username
      properties:
        uuid:
          type: string
        session_uuid:
          type: string
        note:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        seen_at:
          type:
          - integer
          - 'null'
          format: int64
        from_username:
          type: string
        from_display_name:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
          description: |-
            The sitting's own name, and when it ran. Null when it has since been
            regrouped out of existence — a real state rather than an error.
        started_at:
          type:
          - integer
          - 'null'
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
    HandedSittingDetail:
      type: object
      description: The document a hand-over renders to.
      required:
      - uuid
      - from_username
      - started_at
      - listens
      - omitted
      - gone
      properties:
        uuid:
          type: string
        note:
          type:
          - string
          - 'null'
        from_username:
          type: string
        from_display_name:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        started_at:
          type: integer
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
        listens:
          type: array
          items:
            $ref: '#/components/schemas/HandedListen'
        omitted:
          type: integer
