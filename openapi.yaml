        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentRequest'
        required: true
      responses:
        '201':
          description: 'Created — **or matched**. Gear is keyed on `(user, name)`: posting a name you already own returns that row''s id and stamps `last_used`, and every other field you sent is **ignored** rather than applied. Use `PATCH /api/v1/equipment/{id}` to change one. Always 201, even when nothing was created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/equipment/{id}:
    delete:
      tags:
      - Chains
      summary: Delete gear.
      description: |-
        Session-only. Chains referencing it stay readable — every component
        keeps a name snapshot alongside its optional `equipment_id`.
      operationId: delete_equipment
      parameters:
