        authenticated:
          type: boolean
          description: Whether the request carried a valid session cookie.
        is_admin:
          type: boolean
    AuthorizationServerMetadata:
      type: object
      description: RFC 8414 authorization server metadata.
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - registration_endpoint
      - scopes_supported
      - response_types_supported
      - grant_types_supported
      - code_challenge_methods_supported
      - token_endpoint_auth_methods_supported
      - authorization_response_iss_parameter_supported
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        registration_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: '`S256` only.'
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: '`none` — every client is public.'
        authorization_response_iss_parameter_supported:
          type: boolean
          description: 'RFC 9207: `iss` is sent on authorization responses.'
    AuthorizeInfo:
      type: object
      description: An authorization request, in the terms of the person approving it.
      required:
      - client_name
      - client_id
      - verified
      - redirect_uri
      - scopes
      - requested
      properties:
        client_name:
          type: string
        client_id:
          type: string
        verified:
          type: boolean
          description: |-
            The client identified itself with a URL that could be fetched, rather
            than registering a name of its own choosing — which could be anything.
        redirect_uri:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeOffer'
          description: |-
            **Every** grant, with the requested ones marked. A client requests; the
            person whose listening it is decides.
        requested:
          type: string
          description: The requested grants, space-separated, unrecognised ones dropped.
    AvatarStored:
