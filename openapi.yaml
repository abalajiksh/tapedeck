openapi: 3.1.0
info:
  title: Tapedeck
  description: |-
    Self-hosted scrobbler and listening journal.

    Tapedeck ingests listens, enriches them with MusicBrainz metadata, stores
    them in SQLite and forwards them to Last.fm / ListenBrainz / Libre.fm. It
    also records *how* you listened — signal chains, gear, audio quality — which
    is the part no other scrobbler models.

    ## Three auth mechanisms, and they are not interchangeable

    | | How | Reaches |
    |---|---|---|
    | **Session cookie** | `td_session`, set by `POST /api/v1/auth/login` | everything |
    | **API token** | `Authorization: Token <t>` | `/1/*`, plus whatever its scopes allow |
    | **Metrics bearer** | `Authorization: Bearer <t>` | `GET /metrics` only |

    ### Token scopes

    `tokens.scopes` is a space- or comma-separated set. Three grants matter, and
    **none of them implies another**:

    * `submit` — post listens (`POST /1/submit-listens`). Every scrobble client
      has this; it must not carry the power to delete the history it appends to.
    * `read` *(since v0.37)* — read your own data on the endpoints whose security
      lists `apiToken: [read]`.
    * `write` *(since v0.39)* — change your own data on the endpoints whose
      security lists `apiToken: [write]`.

    `all` grants both `read` and `write`. Matching is exact — a scope of
    `rewrite` does not grant `write`.

    A valid token that lacks the required scope gets **403, not 401**. It
    authenticated fine and re-authenticating will not help; a 401 would send a
    client into a token-refresh loop it cannot win.

    ### What a token can never reach

    Everything under `/admin/`, plus your sources, your forwarding connections,
    Discogs credentials, data export/backup, the sanitiser and the enrichment
    jobs. Those are **session-only, permanently**. A leaked token is a bad
    afternoon; a leaked token that can mint more tokens, read another household
    member's data, or repoint where your listens are forwarded is a different
    category. Requests to them with a token get 401.

    ## Getting a token

    Two ways, and neither asks anyone to type a token by hand:

    * **Device-code pairing** — `POST /1/pair/start`, poll `/1/pair/poll` while
      the user approves the short code in Settings. For clients with no browser.
    * **Password → token** — post credentials to `POST /api/v1/auth/login`,
      then mint a named token. This is the phone's flow. A named token appears
      in Settings and can be revoked when the device is lost; a session cookie
      expires hard at 7 days with no sliding renewal and cannot be told apart
      from any other browser.

    ## Conventions

    * Timestamps are **Unix seconds, UTC**, and always the *start* of play.
    * Errors are `{ "code": <int>, "error": "<message>" }` with a matching HTTP
      status.
    * Every user-scoped query is filtered by the caller's own `user_id`. Scopes
      widen *who may ask*, never *whose data is returned*.
    * Counting endpoints exclude skipped listens (`skipped = FALSE`).
    * Extra keys may appear in any response body; ignore what you do not know.

    ## Instance-specific

    `GET /api/openapi.yaml` serves this document from the running binary, so a
    client can ask *its own server* what that version supports rather than
    guessing from a hosted copy.

    The document is generated from the handlers themselves: every schema in it is
    the type the server actually reads or writes, so a field documented here is a
    field that exists.
  contact:
    name: Tapedeck
    url: https://codeberg.org/abksh/tapedeck
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  version: 0.119.0
servers:
- url: /
  description: The Tapedeck instance serving this document.
paths:
  /api/openapi.yaml:
    get:
      tags:
      - Ops
      summary: This document.
      description: |-
        Unauthenticated by design — it describes the shape of the API, not any
        data, and a client needs to read it *before* it has a credential.

        Served from the binary because it is the one thing a separately hosted
        docs site cannot do: describe **this** instance at **this** version. For
        a self-hosted app that beats any version dropdown — ask your own server
        what it supports rather than guessing.
      operationId: spec
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
      security: []
  /health:
    get:
      tags:
      - Ops
      summary: Liveness and database reachability.
      operationId: health_check
      responses:
        '200':
          description: Up, and the database answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                database: ok
                replica: false
                service: tapedeck
                status: ok
                version: 0.109.0
        '503':
          description: 'Up, but the database does not answer. Same body, `status: degraded`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /metrics:
    get:
      tags:
      - Ops
      summary: Prometheus metrics.
      description: |-
        Never open — an **admin** session, or `Authorization: Bearer
        $TAPEDECK_METRICS_TOKEN`. The metrics that matter are the per-job import
        gauges and `process_resident_memory_bytes` (Linux only), which is what
        distinguishes a stall from a slowdown from an OOM on a small host.
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Neither the bearer token nor an **admin** session. A non-admin session is refused the same way — every gauge is instance-wide. The body is plain text saying how to get in, not the JSON error.
          content:
            text/plain:
              schema:
                type: string
      security:
      - metricsBearer: []
      - sessionCookie: []
  /log-level:
    get:
      tags:
      - Ops
      summary: Current tracing filter.
      description: Session-only, admin role.
      operationId: get_log_level
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Ops
      summary: Change the tracing filter at runtime.
      description: |-
        Swaps the live `EnvFilter`. No restart, no config edit. Session-only,
        admin role.
      operationId: set_log_level
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelRequest'
        required: true
      responses:
        '200':
          description: Applied. `current_level` echoes the request, upper-cased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/status:
    get:
      tags:
      - Auth
      summary: Whether anyone is signed in, and whether this instance needs setup.
      description: The SPA's gate. The only unauthenticated read in the API.
      operationId: auth_status
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
      security: []
  /api/v1/auth/setup:
    post:
      tags:
      - Auth
      summary: Create the first admin account.
      description: |-
        First run only — refused once any user exists. Returns a session cookie
        **and** an API token, the latter shown exactly once.
      operationId: setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      responses:
        '200':
          description: Created. Sets `td_session`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Already set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Sign in.
      description: |-
        Sets the `td_session` cookie. Rate limited on repeated failure.

        **This is the mobile flow.** Post credentials once, then mint a named
        token and store that — the cookie expires hard at 7 days with no sliding
        renewal, and cannot be revoked per device.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Signed in. Sets `td_session`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          description: Bad credentials, or the account is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts from this address. `Retry-After` says how long to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out.
      description: |-
        Clears the session. The clear cookie carries identical attributes to the
        one that was set — mismatched attributes make logout silently fail. Never
        fails: with no session it only clears the cookie.
      operationId: logout
      responses:
        '200':
          description: Signed out. `status` is `logged out`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: The signed-in user.
      operationId: me
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags:
      - Admin
      summary: List users.
      description: Session-only, admin role. Never reachable with a token.
      operationId: list_users
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      summary: Create a user.
      description: |-
        Session-only, admin role. There is **no self-registration** — this
        instance is invite-only by design. The account is created with the `user`
        role; promote it with `PATCH /admin/users/{id}`.
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That username is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}:
    delete:
      tags:
      - Admin
      summary: Delete a user and everything they own.
      description: |-
        Session-only, admin role. You cannot delete yourself, or the last active
        admin.
      operationId: delete_user
      parameters:
      - name: id
        in: path
        description: The user.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin
      summary: Change a user's role, reset their password, or disable them.
      description: |-
        Session-only, admin role. The last active admin can be neither demoted nor
        disabled. Everything is checked before anything is written, so a 400
        changes nothing.
      operationId: update_user
      parameters:
      - name: id
        in: path
        description: The user.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: Updated. `status` is `updated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/tokens:
    get:
      tags:
      - Admin
      summary: The caller's API tokens.
      description: Session-only. Token secrets are never returned after issue.
      operationId: list_tokens
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Admin
      summary: Mint a token.
      description: |-
        Session-only. **The secret is in this response and nowhere else.**

        Name it per device — that is what makes revocation meaningful when a
        phone is lost. `default_chain_id` is rung 3 of the chain ladder: one
        token per app makes attribution zero-configuration on the client side.
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          description: An empty name, or a chain that is not the owner's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A token for another user, and the caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/tokens/{id}:
    delete:
      tags:
      - Admin
      summary: Revoke a token.
      description: Session-only. This is the mitigation for a lost device.
      operationId: revoke_token
      parameters:
      - name: id
        in: path
        description: The token's id, not its secret.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Revoked. `status` is `revoked`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin
      summary: Rename a token or repoint its default chain, without re-issuing it.
      description: |-
        Session-only. Fixing the chain never means re-pasting a token into a
        client. `default_chain_id` is nullable-and-optional: present-and-null
        clears it, absent leaves it alone. Any chain id is checked against the
        owner's own chains.
      operationId: update_token
      parameters:
      - name: id
        in: path
        description: The token's id, not its secret.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTokenRequest'
        required: true
      responses:
        '200':
          description: Updated. `status` is `updated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/tokens/{id}/rotate:
    post:
      tags:
      - Admin
      summary: Re-issue a token in place.
      description: Session-only. Same id, name, scopes and chain; new secret, returned once.
      operationId: rotate_token
      parameters:
      - name: id
        in: path
        description: The token's id, not its secret.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/profile:
    get:
      tags:
      - Account
      summary: The caller's own account.
      description: |-
        Session-only. Takes no id — it is always the caller's own account, which
        is the point: an account created for someone else was previously only
        changeable by the admin who created it.
      operationId: get_profile
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Account
      summary: Change your display name, bio or avatar URL.
      description: |-
        Session-only. Role, disabled state, username and password are deliberately
        not here.
      operationId: patch_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: Updated. `status` is `updated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/profile/password:
    post:
      tags:
      - Account
      summary: Change your own password.
      description: |-
        Session-only. `current_password` is required — the caller already holds
        a session, so without it an unlocked browser would be enough to lock the
        real owner out. This is what separates it from the admin reset on
        `PATCH /admin/users/{id}`.

        On success every existing session for the user is dropped and a new
        cookie is issued to the caller, so other browsers are logged out but the
        tab making the request is not.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Updated; a fresh session cookie is set. `status` is `updated`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current password is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/profile/avatar:
    get:
      tags:
      - Account
      summary: The caller's uploaded profile picture.
      description: |-
        Session-only and scoped to the caller, like the artwork proxy. Cached
        `private` — a shared cache holding one would serve it to the next person
        through the proxy. 404 when the avatar is an external URL rather than an
        uploaded file.
      operationId: serve_avatar
      responses:
        '200':
          description: The image bytes.
          content:
            image/*:
              schema:
                $ref: '#/components/schemas/Bytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Account
      summary: Upload a profile picture.
      description: |-
        Session-only, `multipart/form-data`, 4 MB maximum. The extension comes
        from the declared content type, never from the client's filename. The
        picture it replaces is deleted.
      operationId: upload_avatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarStored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Larger than 4 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not an image type we store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Account
      summary: Remove your profile picture.
      description: Session-only. Falls back to the lettered tile.
      operationId: delete_avatar
      responses:
        '200':
          description: Removed. `status` is `removed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /1/submit-listens:
    post:
      tags:
      - ListenBrainz
      summary: Submit listens.
      description: |-
        Accepts a session cookie or any valid token — this is the one endpoint a
        `submit`-scoped token reaches.

        **`listen_type` decides forwarding**, and getting it wrong rewrites
        someone's permanent public history. `single` and `playing_now` are live
        and will be forwarded.

        `import` is stored only and **not** forwarded *(since v0.26 — before
        that, an import was forwarded like a live listen)* — unless the token
        used to submit it is marked **`imports_are_live`**, which exists because
        some players label every scrobble `import` and nothing on the wire
        distinguishes that from a backfill. Even then two gates apply and both
        must pass:

        * the listen is **no more than 24h old**, so a genuine history import
          from the same client still stays local; and
        * its timestamp is **no more than 1h in the future**, so ordinary clock
          skew is tolerated but a broken clock cannot park a scrobble years
          ahead of everything else.

        The flag is per token and invisible from the client side, which is why
        `GET /1/validate-token` reports it — read it there rather than guessing
        from whether listens appear at the far end.

        Dedup is on `(user_id, source_id, source_name)` plus a fuzzy window, so
        re-sending the same listen is safe. Max 1000 listens per request.

        `additional_info` is free-form and **no field in it can fail a
        submission**: an unusable value costs that field and the listen is still
        stored. Unknown keys are ignored.
      operationId: submit_listens
      parameters:
      - name: dry_run
        in: query
        description: |-
          Resolve everything, **store nothing and forward nothing**, and report
          what would have happened. `1`, `true`, `yes`, `on` and a bare
          `?dry_run` all count.

          This is the endpoint to point a client at while it is being set up: it
          names the winning rung of the chain ladder, the quality score your
          fields produced, whether the listen would be forwarded or stored only,
          and whether dedup would swallow it — none of which is visible from a
          successful submit. The preview and the real path share one
          implementation, so it cannot promise something the real path would not
          do.

          Note it is genuinely read-only: a dry run looks a device up rather than
          upserting it, because asking what would happen must not itself be a
          listen.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitListensRequest'
        required: true
      responses:
        '200':
          description: 'Accepted, or — with `?dry_run` — resolved and discarded. Per-listen results are reported rather than the whole batch failing: one bad row must not lose the other 999.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: One or more listens could not be stored. **Retryable** — resend the batch; dedup makes that safe. Distinct from `rejected`, which is the do-not-retry list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiToken: []
      - sessionCookie: []
  /1/validate-token:
    get:
      tags:
      - ListenBrainz
      summary: Check a token, and ask what it may do.
      description: |-
        An invalid token is **`200 {valid:false}`, never 401** — LB clients read
        the field, and a 401 sends them into a refresh loop.

        The token may arrive in the `Authorization` header **or** as `?token=`.

        Everything past `user_name` is Tapedeck introspection, and it is
        additive: real ListenBrainz clients branch on `valid` alone, so the
        extra keys cannot break them, and putting them here rather than on a
        second endpoint costs no extra round trip. They let a settings screen
        say what this token can do instead of choosing between hiding features
        that might work and offering features that 403 at the moment of use.

        They appear **only when `valid` is true.** This endpoint answers whoever
        asks, so reporting the build beside `valid: false` would hand it to
        anyone guessing at tokens.

        Note this reports the grants themselves, never any of the user's data.
        It widens nothing: `submit` still reaches only this endpoint and
        `submit-listens`.
      operationId: validate_token
      parameters:
      - name: token
        in: query
        description: |-
          The token, for a client that cannot set a header. The
          `Authorization: Token …` header wins when both are sent.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Valid or not — read `valid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidation'
        '400':
          description: No token at all, in the header or the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiToken: []
  /1/user/{user}/listens:
    get:
      tags:
      - ListenBrainz
      summary: A user's listens, LB-shaped.
      description: |-
        **Scoped to the caller.** LB serves this publicly; a self-hosted instance
        must not, so asking for another user's listens is refused unless the caller
        is an admin. Newest first.
      operationId: user_listens
      parameters:
      - name: user
        in: path
        description: Your own username.
        required: true
        schema:
          type: string
      - name: max_ts
        in: query
        description: Only listens strictly before this, unix seconds. Not with `min_ts`.
        required: false
        schema:
          type: integer
          format: int64
      - name: min_ts
        in: query
        description: Only listens strictly after this, unix seconds. Not with `max_ts`.
        required: false
        schema:
          type: integer
          format: int64
      - name: count
        in: query
