          $ref: '#/components/responses/NotFound'
  /api/v1/equipment:
    get:
      tags:
      - Chains
      summary: Your gear.
      description: 'Scope: `read` *(since v0.37)*. Hours are derived from the chains that use each piece.'
      operationId: list_equipment
      responses:
        '200':
          description: OK.
