          format: int64
    AmaiServer:
      type: object
      description: |-
        One of amai's configured media servers, as `/api/servers` reports it.

        **Only these three fields are read.** That response also carries a `creds`
        map — masked, but still theirs — and `music_libraries`. Nothing here stores
        or logs either: a credential belonging to another application has no
        business crossing into this one even in masked form.
      required:
      - server_id
      - name
      properties:
        server_id:
          type: string
        name:
          type: string
        server_type:
          type: string
        is_default:
          type: boolean
    AmaiSettings:
      type: object
      description: Where the AudioMuse-AI sidecar is, and never its token.
      required:
      - configured
      - has_token
      - stored
      - from_env
      properties:
        configured:
          type: boolean
        url:
          type:
          - string
          - 'null'
          description: The address. Not a credential, and shown the way a source's URL is.
        has_token:
          type: boolean
        server:
          type:
          - string
          - 'null'
          description: |-
            Which of amai's media servers this instance's provider ids belong to.
            Absent means amai's default server.
        stored:
          type: boolean
          description: |-
            Something is stored in this instance's settings — which beats the
            environment.
        from_env:
          type: boolean
          description: '`TAPEDECK_AMAI_URL` is set.'
    AmaiTest:
      type: object
      description: Both halves of the check, reported separately.
      required:
      - ok
      - reachable
      - authenticated
      - message
      properties:
        ok:
          type: boolean
        reachable:
          type: boolean
        authenticated:
          type: boolean
        message:
          type: string
        servers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AmaiServer'
          description: amai's media servers. Present only when the token was accepted.
    AmaiUpdate:
      type: object
      description: Each field is written only when present; an empty string clears it.
      properties:
        url:
          type:
          - string
          - 'null'
          description: |-
            `http://host:8000`. Empty clears it and switches the sidecar off. No
            scheme is a 400 rather than a guess.
        token:
          type:
          - string
          - 'null'
          description: Their `API_TOKEN`. Empty clears it.
        server:
          type:
          - string
          - 'null'
          description: |-
            Which of amai's media servers our provider ids belong to — its display
            name or its internal id. Empty means their default server, which is the
            whole answer on a single-server install.
