  /1/latest-import:
    get:
      tags:
      - ListenBrainz
      summary: Timestamp of the caller's most recent import.
      description: |-
        Importers use this as a bookmark: read the timestamp, fetch everything
        newer, write the new high-water mark back.
      operationId: get_latest_import
      parameters:
      - name: user_name
        in: query
        description: Whose bookmark. Defaults to the caller; anyone else's is admin-only.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LbLatestImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiToken: []
      - sessionCookie: []
    post:
      tags:
      - ListenBrainz
      summary: Record an import high-water mark.
      description: Always the caller's own.
      operationId: set_latest_import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatestImportBody'
        required: true
      responses:
        '200':
          description: Stored. `status` is `ok`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - apiToken: []
      - sessionCookie: []
  /1/pair/start:
    post:
      tags:
      - Pairing
      summary: Begin device-code pairing.
      description: |-
        Unauthenticated by design — the client has no credential yet. Returns a
        `device_code` to poll with and a short `user_code` for the human to type
        into Settings.

        Vocabulary echoes RFC 8628 because client authors have met that shape,
        but this is **not OAuth**: no client registration, no `client_id`, and
        the result is an ordinary Tapedeck token.

        The user code is eight characters and therefore guessable, so its safety
        is structural: a five-minute window, single use in both directions, rate
        limiting, and approval requiring a signed-in session.
      operationId: start
      requestBody:
        description: Optional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBody'
        required: true
      responses:
        '200':
          description: Pairing started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStarted'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /1/pair/poll:
    post:
      tags:
      - Pairing
      summary: Poll for approval.
      description: |-
        `400 authorization_pending` until approved, then the token **once** — it is
        deleted from the request the moment it is collected. Expired and unknown
        device codes are both `400 expired_token`, so polling cannot be used to
        learn whether a code was ever real.
      operationId: poll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollBody'
        required: true
      responses:
        '200':
          description: Approved. The token is in this body and nowhere else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingApproved'
        '400':
          description: '`authorization_pending` (keep polling) or `expired_token` (start again).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingPending'
        '429':
          description: Polling too fast. Back off and keep the pairing alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/pair/{user_code}:
    get:
      tags:
      - Pairing
      summary: Describe a pending pairing, for the approval screen.
      description: Requires a signed-in session — this is the browser half.
      operationId: describe
      parameters:
      - name: user_code
        in: path
        description: As shown on the device, `XXXX-XXXX`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/pair/{user_code}/approve:
    post:
      tags:
      - Pairing
      summary: Approve a pairing request.
      description: |-
        Session-only, and single use — approving twice mints nothing the second
        time. **The token is never in this response**; it goes to the polling
        client. A live credential in a second place is how it ends up in a
        screenshot.
      operationId: approve
      parameters:
      - name: user_code
        in: path
        description: As shown on the device, `XXXX-XXXX`.
        required: true
        schema:
          type: string
      requestBody:
        description: Optional.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBody'
        required: true
      responses:
        '200':
          description: Approved. `status` is `approved`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Not one of your chains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/scrobbles:
    get:
      tags:
      - Listens
      summary: The listen history.
      description: 'Scope: `read` *(since v0.39)*. Newest first. Filterable.'
      operationId: list_scrobbles
      parameters:
      - name: limit
        in: query
        description: Page size. 50 by default, at most 500.
        required: false
        schema:
          type: integer
          format: int64
          default: 50
          maximum: 500
          minimum: 1
      - name: offset
        in: query
        description: Rows to skip.
        required: false
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
      - name: artist
        in: query
        description: Exact artist, as stored.
        required: false
        schema:
          type: string
      - name: album
        in: query
        description: Exact album, as stored.
        required: false
        schema:
          type: string
      - name: track
        in: query
        description: Exact track title, as stored.
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: Unix seconds, inclusive.
        required: false
        schema:
          type: integer
          format: int64
      - name: before
        in: query
        description: Unix seconds, inclusive.
        required: false
        schema:
          type: integer
          format: int64
      - name: social
        in: query
        description: |-
          `true` for listening marked as heard in company, `false` for the rest.

          Absent means no filter, which is the only sensible default: a listen
          nobody marked is *unmarked*, not proven solitary, and quietly excluding
          unmarked listening from a history page would hide most of it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
      - apiToken:
        - read
    delete:
      tags:
      - Listens
      summary: Delete the caller's entire history.
      description: |-
        **Session-only and irreversible.** Deliberately not reachable with a
        `write` token — this is the one listen operation where a lost phone
        would be unrecoverable. Clears listen-attached notes first, since
        foreign keys are enforced.
      operationId: clear_scrobbles
      parameters:
      - name: confirm
        in: query
        description: Must be `true`. Anything else is a 400 and nothing is touched.
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: Cleared.
        '400':
          description: '`confirm=true` was not sent. Nothing was touched.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/scrobbles/{id}:
    delete:
      tags:
      - Listens
      summary: Delete one listen.
      description: 'Scope: `write` *(since v0.39)*. Clears attached notes first.'
      operationId: delete_scrobble
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiToken:
        - write
      - sessionCookie: []
    patch:
      tags:
      - Listens
      summary: Edit a listen.
      description: 'Scope: `write` *(since v0.39)*. Only the caller''s own rows.'
      operationId: update_scrobble
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScrobble'
        required: true
      responses:
        '200':
          description: Updated. The fresh row, so a client can re-render without a refetch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditedListen'
        '400':
          description: A variant without a chain, or one belonging to another chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiToken:
        - write
      - sessionCookie: []
  /api/v1/scrobbles/bulk-time:
    post:
      tags:
      - Listens
      summary: Move listens in time.
      description: |-
        **An offset over a selection, not an absolute time**, and that is the
        design rather than a limitation. A timestamp is almost never wrong on
        its own: a clock was out by an hour, an evening was reconstructed from
        times laid out by arithmetic, or a capture arrived carrying somebody
        else's clock. Every one of those moves a *run* of listens by a
        *constant*, and a constant cannot scramble an ordering the way a set of
        hand-typed times can. Correcting a single listen is this operation over
        one id — subtract to get the offset.

        Where the listen has not been accepted yet,
        `PATCH /api/v1/patch/captures/{id}` is the cheaper place to do it:
        nothing is in a history there, so none of the consequences below apply.

        What it takes care of:

        * **`timestamp_original` is written once**, so a second correction does
          not overwrite the observation the first one replaced.
        * **Nothing is moved on top of another listen of the same track.** Dedup
          runs at ingest and never again, so a duplicate created here is one
          nothing will ever reconcile. Such a listen is skipped and is not
          counted in `moved`.
        * **Sessions are recomputed** — their aggregates, not their grouping.

        What it reports, because it cannot fix them:

        * `already_forwarded` — how many of the moved listens had already gone
          to Last.fm or ListenBrainz. **Neither has an edit API**, so their copy
          keeps the time it was sent with, permanently and silently. The edit is
          still right; a screen that did not say this would let somebody believe
          they had corrected a public record they had not.
        * `grouping_stale` — whether a moved listen now sits further from its
          session's neighbours than the gap those sessions were grouped by.
          Sessions are stored rather than computed, which is what lets a manual
          merge survive, and `sessions.uuid` is what a handed-over sitting
          points at — so re-grouping silently on a time edit would move an
          identity somebody else holds a reference to. Rebuild stays something
          the user asks for.
      operationId: bulk_set_time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTime'
        required: true
      responses:
        '200':
          description: What moved, and what could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEdit'
        '400':
          description: No ids, no offset, a zero offset, or one of more than a year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - sessionCookie: []
  /api/v1/scrobbles/bulk-company:
    post:
      tags:
      - Listens
      summary: Mark many listens as heard in company.
      description: |-
        Session-only. Records **who you were listening with**, on the listens
        themselves.

        Marking is retroactive by design: nobody stops mid-record to note who
        is in the room. A Shared Spool fills the same column in automatically
        from its joined members; this is for the commoner case of somebody in
        the room who has no account on this instance, which is why it is free
        text rather than a list of users.

        **It is stored on the listen and not on the session**, which is not a
        preference — `POST /api/v1/sessions/rebuild` deletes every session row
        and re-inserts it, so anything held there is erased by a regroup with
        nothing to say so.

        `company` is required. Send an explicit `null` to unmark; an absent
        field is a `400`, for the reason `signal_chain_id` on
        `/api/v1/scrobbles/bulk-chain` is — this overwrites the field on every
        listen in `ids`, so a misspelled key must not deserialise into "clear
        it". An empty or whitespace-only string is treated as `null` rather
        than becoming a listen marked as heard with nobody.

        This never writes `joint_session_id`. That column says *this exact play
        happened on several decks at once*, which only a Shared Spool can know.
      operationId: bulk_set_company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCompany'
        required: true
      responses:
        '200':
          description: How many listens were changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdated'
        '400':
          description: '`company` was absent, or longer than 200 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/scrobbles/bulk-chain:
    post:
      tags:
      - Listens
      summary: Attribute many listens to one signal chain.
      description: |-
        Session-only. Retro-attribution after adding gear — and since v0.46.0
        the chain's *hours* follow the listens, so doing this moves the usage
        numbers for listening you already have rather than only for future
        plays.

        **The field is `signal_chain_id`, and it is required.** This entry
        documented it as `chain_id` for several releases, alongside three
        parameters (`from`, `to`, `source_name`) the handler has never accepted
        — and the mismatch was silently destructive rather than an error: the
        body deserialised cleanly with the field missing, which meant "clear the
        chain", so a client following the spec wiped the attribution on every
        listen in `ids` and got `200 {"updated": N}` back. An absent field is a
        `400` now.

        Send an explicit `null` to clear. That case is real — it is how the
        History bulk edit removes a chain — which is why absent and null cannot
        be collapsed.
      operationId: bulk_set_chain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkChain'
        required: true
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/search:
    get:
      tags:
      - Listens
      summary: Search your listens.
      description: |-
        Session-only. Searches `scrobbles`, not `entities` — searching entities
        would only find records you had already been to.
      operationId: search
      parameters:
      - name: q
        in: query
        description: |-
          Matched as a substring, case-insensitively, against artist, album and
          title.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Per group. 10 by default, at most 50.
        required: false
        schema:
          type: integer
          format: int64
          default: 10
          maximum: 50
          minimum: 1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/skips:
    get:
      tags:
      - Listens
      summary: Tracks you bailed out of.
      description: |-
        Session-only. Skips are stored but excluded from every listening figure,
        so this is the only place they are readable.

        `listened_ms` is how far in the listener got, and is **null** when
        nothing measured a playhead — a polled server reports one, a submitting
        client often does not. `listened_fraction` is derived only when both the
        playhead and the running time are known, rather than estimated.

        `played_before` / `played_after` are the nearest real listens either
        side, which is the only context this application can honestly record for
        a skip. Both are null for a skip at the edge of a sitting. Nothing here
        says *why* a track was skipped and nothing should infer it.
      operationId: list_skips
      parameters:
      - name: limit
        in: query
        description: Page size. 25 by default, at most 100.
        required: false
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skips'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/stats/dashboard:
    get:
      tags:
      - Statistics
      summary: Dashboard counters.
      description: |-
        Scope: `read` *(since v0.39)*. "Today" and "this week" are bucketed in
        the user's own timezone and honour their week-start preference.



        Deliberately **does not** carry distinct artist, album or track counts.
        It used to compute all three, each a `COUNT(DISTINCT)` building a temp
        B-tree over the whole history, on the most-loaded page in the
        application — and nothing rendered any of them. `GET /api/v1/stats`
        answers the same question against a range control, which is where it
        belongs.
      operationId: dashboard_stats
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /api/v1/stats:
    get:
      tags:
      - Statistics
      summary: Ranged statistics.
      description: |-
        Scope: `read` *(since v0.39)*. Totals, top lists (50 rows each), fidelity
        mix, decades, a 7×24 listening heatmap, breadth, genres and languages.

        The genre breakdown is a share of **tag mentions, not listens** — one
        track carries several tags. Never present it as a percentage of plays.
      operationId: ranged_stats
      parameters:
      - name: range
        in: query
        description: |-
          The window, rolling back from now: `today`, `d7` (or `week`), `month`
          (or `last30`), `year`, or `all`, the default. Anything else is all time.
        required: false
        schema:
          type: string
          default: all
          pattern: ^(today|d7|week|month|last30|year|all)$
      - name: metric
        in: query
        description: |-
          `plays` (default) or `hours`. How the three top lists are **ranked**,
          not merely what number is shown. They are cut to 50 rows server-side,
          so re-sorting in the client would only reorder the top 50 *by plays*
          and would miss a long record played a handful of times — which is
          exactly the row switching to `hours` exists to surface. Listens whose
          source reported no duration count as zero and sort last.
        required: false
        schema:
          type: string
          default: plays
          pattern: ^(plays|hours)$
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangedStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /api/v1/personality:
    get:
      tags:
      - Statistics
      summary: Musical personality — a verdict, traits and loyalty.
      description: Session-only.
      operationId: personality
      parameters:
      - name: range
        in: query
        description: |-
          The window, rolling back from now: `today`, `d7` (or `week`), `month`
          (or `last30`), `year`, or `all`, the default. Anything else is all time.
        required: false
        schema:
          type: string
          default: all
          pattern: ^(today|d7|week|month|last30|year|all)$
      - name: metric
        in: query
        description: |-
          `plays` (default) or `hours`. How the three top lists are **ranked**,
          not merely what number is shown. They are cut to 50 rows server-side,
          so re-sorting in the client would only reorder the top 50 *by plays*
          and would miss a long record played a handful of times — which is
          exactly the row switching to `hours` exists to surface. Listens whose
          source reported no duration count as zero and sort last.
        required: false
        schema:
          type: string
          default: plays
          pattern: ^(plays|hours)$
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personality'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/lyrics:
    get:
      tags:
      - Statistics
      summary: The words to one track, as numbered lines.
      description: |-
        Scope: `read`.

        **Numbered including blank lines.** A stanza break is a line, because a
        liner note refers to a line by its *index* — `[[line:12]]` or
        `[[line:A:3:12]]` — and skipping empties would renumber every line after
        one, silently re-pointing every quote already written.

        **Never triggers an LRCLIB fetch.** That service is free and asks callers
        to be considerate; the backfill is what paces it, and a screen that
        fetched on open would let a page refresh drive the rate.

        It *does* reach the user's own media server when nothing is stored yet.
        Their Plex or Jellyfin has no rate limit and no shared budget to spend,
        and they tag their own albums — so those words are usually right there
        while the LRCLIB trickle is still hours from this track. Only when the
        cache holds nothing: a stored lyric is never re-fetched on a page load.

        Three answers, all real: lines, `instrumental: true` (a track with no
        words, which is not a gap), and an empty list.

        Lyrics are the provider's text. They are cached outside the listening
        database, so `GET /api/v1/backup` does not carry them, and they are not
        served by the public now-playing endpoint or by Patch.
      operationId: lyrics_for_track
      parameters:
      - name: artist
        in: query
        required: true
        schema:
          type: string
      - name: title
        in: query
        required: true
        schema:
          type: string
      - name: album
        in: query
        description: |-
          Which record to draw the tracklist from.

          Optional and resolved from the history when it is absent, because the
          caller is usually a note or a history row that knows the track and not
          the record it was filed under. Passed explicitly it wins, since a track
          on three compilations has three honest answers and only the caller knows
          which one is being read.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK — including for a track nothing is held for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricDocument'
      security:
      - apiToken:
        - read
      - sessionCookie: []
    put:
      tags:
      - Statistics
      summary: Correct the words by hand.
      description: |-
        Scope: session only.

        **A value you supplied is never overwritten by a lookup** — the rule the
        shelf's running times already follow, and what settles the collision
        between this and "newest fetch wins": between two fetches the newer one
        wins, and between a fetch and something a person typed, the person does.
        The row is marked as corrected and the backfill will not write over it.

        Instance-wide rather than per user, like everything else in this cache:
        these are one track's words, not one person's opinion of them.

        The response reports the line count **before and after**, and
        `renumbered` when they differ. Every reference already written is an
        index, so a correction that adds or removes a line moves every quote
        after it onto different words — silently, because an index cannot be
        wrong, only pointed somewhere else. It is reported rather than refused:
        the correction is usually the point, and the alternative is a lyric that
        stays wrong for ever.
      operationId: fix_lyrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixLyricsRequest'
        required: true
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsCorrected'
        '400':
          description: No artist, no title, or no words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - sessionCookie: []
  /api/v1/lyrics/library:
    post:
      tags:
      - Statistics
      summary: Words a player found in its own files.
      description: |-
        Scope: `write`.

        **Not a correction.** `PUT /api/v1/lyrics` calls `set_words`, which sets
        `edited` and stamps the source as *You* — a claim only a person typing
        gets to make, and the flag that outranks every later fetch. A client
        reporting what a file contains is not correcting anything, so this goes
        through the library path instead: it refuses to write over an edited row,
        re-reads the language from the new words, and upserts, so a repeat send
        is harmless.

        **Not `POST /api/v1/lyrics/fetch` either**, which spends a shared
        politeness budget at LRCLIB. This is offering words, not asking for them.

        Sends nothing to any third party, and the words never leave the instance
        — not in a backup, not in an export, not to a patched deck.
      operationId: library_lyrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryLyricsRequest'
        required: true
      responses:
        '200':
          description: Stored, or left alone because the row holds a correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryLyricsStored'
        '400':
          description: A blank artist, title or source, or no words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - apiToken:
        - write
      - sessionCookie: []
  /api/v1/lyrics/live:
    get:
      tags:
      - Statistics
      summary: The words for whatever is on the deck.
      description: |-
        Scope: `read`.

        The reader's whole state in one request, so the lyric theatre stops
        being addressed by URL. `GET /api/v1/lyrics` names a track, which is
        right for a `[[line:...]]` chip and wrong for reading along: the words
        stayed on whichever song the address named, so the next track left them
        behind and the only way out was editing the query string.

        The body is a `LyricDoc` with the playhead beside it, so a cold open
        lands on the right line without waiting for a now-playing poll. Nothing
        playing is `{ "playing": false }` and a normal answer, not an error.

        **Ask it once per track, not once per poll.** The document carries the
        tracklist and every pin on the track; a client should watch
        `GET /api/v1/now-playing` (which it is already polling) and re-ask this
        only when the track changes.
      operationId: live_lyrics
      responses:
        '200':
          description: The deck's track and its words, or nothing playing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveLyrics'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /api/v1/lyrics/fetch:
    post:
      tags:
      - Statistics
      summary: Look for one track's words now.
      description: |-
        **Session only.** A token is refused with 401 and its scopes never enter
        into it: this spends a shared politeness budget at a free service and
        writes an instance-wide cache, which is not something a scrobble client
        holding `read` has any business doing.

        The backfill runs at a few tracks a minute, most-played first, which is
        the right pace for a queue nobody is watching and no use for the track
        somebody is looking at. This is the button behind that, and it resolves
        the track exactly as the backfill would: the user's own library first,
        then LRCLIB, with cues winning.

        **A deliberate press is not a page load**, which is why this may ask
        LRCLIB where `GET /api/v1/lyrics` may not. It bypasses the 30-day miss
        tombstone — LRCLIB fills its own gaps, so "nobody had this a fortnight
        ago" is exactly the answer worth re-asking — but it will not displace
        words already held: `already_held: true` says so, and
        `/api/v1/lyrics/matches` is the control for disagreeing with them.

        A rate limit or an unreachable LRCLIB is **200 with `unavailable`**, not
        a 5xx. Being asked to wait is not this server failing, and reporting it
        as "nothing found" would be a claim about the track rather than about
        the request.
      operationId: fetch_lyrics_now
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchLyricsRequest'
        required: true
      responses:
        '200':
          description: The whole document as it now stands, so the caller can replace what it is showing — or `unavailable` with a `why`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchedLyrics'
        '400':
          description: An artist or a title that is blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The body is missing `artist` or `title` outright.
      security:
      - sessionCookie: []
  /api/v1/lyrics/matches:
    get:
      tags:
      - Statistics
      summary: The other records LRCLIB holds for a track.
      description: |-
        Session or a `read` token.

        **Not a version history.** LRCLIB has none — `/api/get` returns one
        record and nothing behind it. These are *different records* for the same
        song, from `/api/search`: other uploads, other pressings, a live take
        filed under the same name. Picking a better one is how a wrong match is
        fixed without typing the words out.

        Records with no words are omitted. The whole gesture is "these are the
        wrong words, give me the other ones", which an instrumental cannot
        answer.

        **Adopt one with `PUT /api/v1/lyrics`**, sending the chosen `plain` and
        `synced_text`. That is the ordinary correction path, so the choice is
        marked edited and survives every later fetch — and it reports
        `renumbered`, which matters here more than anywhere: a `[[line:...]]`
        reference is an index, so a different record re-points every quote
        already written.

        This reaches the network, so it belongs on a press rather than a page
        load. A rate limit or an unreachable LRCLIB comes back **200** with
        `unavailable: true` and a reason rather than a 5xx: the upstream asking
        us to wait is not this server failing, and the distinction is what stops
        a client reporting "no other matches" when it never managed to ask.
      operationId: lyric_matches
      parameters:
      - name: artist
        in: query
        required: true
        schema:
          type: string
      - name: title
        in: query
        required: true
        schema:
          type: string
      - name: album
        in: query
        description: |-
          Which record to draw the tracklist from.

          Optional and resolved from the history when it is absent, because the
          caller is usually a note or a history row that knows the track and not
          the record it was filed under. Passed explicitly it wins, since a track
          on three compilations has three honest answers and only the caller knows
          which one is being read.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricMatches'
        '400':
          description: Missing artist or title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /api/v1/lyrics/keys:
    get:
      tags:
      - Statistics
      summary: Every track this instance holds words for.
      description: |-
        Scope: `read`.

        One request for the whole set, exactly the shape `GET /api/v1/loves/keys`
        has and for the same reason: a history page wants to know which of fifty
        rows has something to read, and fifty questions is not the way to ask.

        A key is `<artist>|<title>`, both trimmed and lowercased — the same fold
        `loveKey` uses for its artist half. **The browser's derivation and this
        one must stay in step**, or "Read the words" quietly stops appearing on
        rows that have lyrics and nothing errors.

        Only tracks with words. An instrumental is a real answer and a finished
        lookup, but there is nothing to open a reader on.

        Not scoped to the caller, and it cannot be: the cache is one copy of one
        track's words for the whole instance, keyed by the track rather than by
        who played it.
      operationId: lyrics_keys
      responses:
        '200':
          description: OK. An instance with no lyrics cache answers an empty list rather than failing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricKeys'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /api/v1/lyrics/status:
    get:
      tags:
      - Maintenance
      summary: How far the lyric language pass has got.
      description: |-
        Scope: session only.

        Tapedeck fetches lyrics from [LRCLIB](https://lrclib.net) for one
        reason: **the language a transliterated title cannot give.** Script
        detection settles any non-Latin title with certainty and gives up on
        Latin text, so a romanised title falls through to `English/Other`, which
        is a shrug rather than a measurement and is most of a real
        transliterated history. The lyric is where that title's own script went.

        Lyrics are stored in the MusicBrainz cache database rather than in the
        listening database, so `GET /api/v1/backup` does **not** carry them —
        they are third-party copyrighted text, not the user's listening.

        `instrumental` is counted separately because it is a real answer: a
        track with no words has no language, and folding it into "found" would
        report a finished lookup as an unfinished one.
      operationId: lyrics_status
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsCoverage'
      security:
      - sessionCookie: []
  /api/v1/mbids/status:
    get:
      tags:
      - Maintenance
      summary: MusicBrainz recording coverage.
      description: |-
        Session-only.

        A recording MBID is written by `flush_pending` alone, which only ever
        sees listens on their way to a sink — so an **imported** listen never got
        one, and nothing else writes the column. On a mostly-imported history
        that leaves most of the listening unidentified, and with it excluded from
        every backfill that keys off a recording: ISRC, work-language, release
        year.

        `unmatched_tracks` is the reason this reports three numbers instead of
        two. It counts distinct tracks MusicBrainz was **asked about and had
        nothing for** — real listening simply not in their database. Without it a
        bar that stops short reads as a stall rather than as an answer.
      operationId: mbid_status
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbidCoverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/mbids/backfill:
    post:
      tags:
      - Maintenance
      summary: Resolve missing recording MBIDs now.
      description: |-
        Session-only, **admin only**. Runs in the background; poll
        `/api/v1/mbids/status` for progress.

        This is the pass that unblocks the others, so it is worth running before
        the ISRC or language backfills on a history that came from an import.

        A name search can be wrong, and a wrong MBID is worse than none — it
        would be written onto every play of the track and then poison the ISRC
        and language lookups downstream, with nothing erroring. So a result is
        only accepted when it **agrees with the question**: the artist matches,
        and the title matches once a trailing qualifier is stripped. Misses are
        negative-cached, so a track already asked about is not asked again while
        that answer is current.
      operationId: backfill_mbids_now
      responses:
        '202':
          description: Started. `status` is `started`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/artwork/status:
    get:
      tags:
      - Maintenance
      summary: Artwork coverage.
      description: |-
        Session-only. **Numerator and denominator share a population** — both
        exclude skips. They did not once, so the two were fractions of different
        wholes.
      operationId: artwork_status
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/artwork/backfill:
    post:
      tags:
      - Maintenance
      summary: Run the artwork backfill now.
      description: |-
        Session-only. Providers return **URLs, never bytes** — Deezer's terms
        discourage persisting artwork. The queue keys on `artwork_url` **only**;
        `caa_id` is written by three other paths, so keying on it silently marks
        rows done that have no URL.
      operationId: backfill_artwork_now
      responses:
        '202':
          description: Started. `status` is `started`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/languages/status:
    get:
      tags:
      - Maintenance
      summary: Language classification coverage.
      description: |-
        Session-only. The denominator counts only rows the backfill will
        actually process — it did not once, so the bar could never reach 100%
        on any history containing a skip.
      operationId: language_status
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/languages/backfill:
    post:
      tags:
      - Maintenance
      summary: Run the language backfill now.
      description: Session-only.
      operationId: backfill_languages_now
      responses:
        '202':
          description: Started. `status` is `started`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sanitize:
    get:
      tags:
      - Maintenance
      summary: Preview metadata fixes.
      description: |-
        Session-only. **Preview-then-apply, never automatic** — and the preview
        deliberately exposes how weak each guess is, because the operator has to
        judge it.

        Three passes. *Mixed releases*: one listen out of twelve routinely
        arrives carrying a compilation's release MBID. The whole ballot is
        returned, most-claimed first, so "15 releases, plurality of 4" is
        visible as the guess it is. *Featured credits*: `Artist feat. X` is a
        different artist to every query in the app; only the explicit
        `feat.`/`ft.`/`featuring`/`with` forms match, because "Simon &
        Garfunkel" is a name, not a credit. *Spelling variants*: grouped on the
        exact string, with `case_only` flagged — a two-stage filter whose second
        stage was coarser than the first once made every case-only variant
        invisible.
      operationId: sanitize_preview
      responses:
        '200':
          description: The proposed changes, each individually selectable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitisePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Maintenance
      summary: Apply selected metadata fixes.
      description: |-
        Session-only. Explicit lists select individual edits; the booleans mean
        "everything in this category". **A non-empty list wins over its
        boolean** — asking for three edits and getting four hundred would be the
        worst reading of an ambiguous request.

        The featured-credit target is **derived, never taken from the request**,
        or this would become "rename any artist to anything". A variant merge is
        refused unless both spellings normalise to the same key, so merging
        "Burial" into "Aphex Twin" cannot happen.

        **A spelling merge is not reversible.** The `feat.` fold keeps the
        original in `artist_credit`; a rename keeps nothing, because both
        strings name the same artist.
      operationId: sanitize_apply
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanitizeRequest'
        required: true
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sanitised'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions:
    get:
      tags:
      - Sessions
      summary: Listening sessions.
      description: |-
        Session-only. Contiguous listening with gaps under 30 minutes. A change
        of submitting token also breaks a session — one token per app is how
        people organise these, so "fooyin stopped, Pano started" is a different
        setup even a minute later.
      operationId: list_sessions
      parameters:
      - name: limit
        in: query
        description: Page size. 50 by default, at most 200.
        required: false
        schema:
          type: integer
          format: int64
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions/{id}:
    get:
      tags:
      - Sessions
      summary: One session and its listens.
      operationId: get_session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Sessions
      summary: Retag, name or annotate a whole sitting.
      description: |-
        Session-only. Setting `chain_id` rewrites the chain on every listen in the
        sitting.
      operationId: update_session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSession'
        required: true
      responses:
        '200':
          description: Updated. The session as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneSession'
        '400':
          description: Not one of your chains, a variant of another chain, or a variant without a chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/merge:
    post:
      tags:
      - Sessions
      summary: Merge sessions.
      description: |-
        Keeps the **earliest** session's identity — its id and uuid are what
        anything else already refers to. Ownership is checked for every id
        before anything moves, so a merge naming someone else's session changes
        nothing rather than half-completing.
      operationId: merge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
        required: true
      responses:
        '200':
          description: Merged. The surviving session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions/{id}/split:
    post:
      tags:
      - Sessions
      summary: Split a session at a listen.
      description: |-
        Splitting at the *first* listen is a no-op, not an error — it would
        leave one empty half, which is the session you already had. Aggregates
        are recomputed from the listens rather than adjusted arithmetically.
      operationId: split
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequest'
        required: true
      responses:
        '200':
          description: Split.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitSessions'
        '400':
          description: That listen is not in this session, or is already its first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/rebuild:
    post:
      tags:
      - Sessions
      summary: Start a regroup of every listen into sessions.
      description: |-
        Session-only. **Destructive** — it rewrites the column that manual
        merges and splits live in, discarding them. Exists for histories that
        predate session linking, and for imports, which bypass the ingest path
        entirely.

        *(since v0.70.2)* Runs in the **background** and answers `202` with a
        `job_id`; poll `/api/v1/sessions/rebuild/{job_id}`. It used to do the
        work inline, and on a real history that ran past a reverse proxy's
        origin timeout — the browser got a 524 while the rebuild carried on
        unseen, which is worse than failing outright for something destructive.

        One rebuild per user at a time. A second request while one is running is
        a **409** carrying the running `job_id`, so a client can attach to it
        rather than starting a second pass that would clear the first's work
        halfway through.
      operationId: rebuild
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildRequest'
        required: true
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rebuild is already running; the body carries its `job_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildRunning'
  /api/v1/sessions/rebuild/{job_id}:
    get:
      tags:
      - Sessions
      summary: How a running regroup is going.
      description: |-
        Session-only, and scoped to the caller — an unknown id and someone
        else's are the same 404, so polling cannot be used to learn that a job
        exists.

        The registry is in memory, so a job is lost if the process restarts.
        That is safe rather than merely tolerable: the rebuild is one
        transaction, so a process that dies mid-pass rolls back instead of
        leaving half a regrouping behind — only the progress report is lost.
      operationId: rebuild_status
      parameters:
      - name: job_id
        in: path
        description: From the `202` that started it.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/now-playing:
    get:
      tags:
      - Listens
      summary: What is on the deck.
      description: |-
        Scope: `read`. In-memory only. Entries expire on read — past `duration`
        + 10s, or after 10 minutes when the source reported no duration.
      operationId: now_playing
      responses:
        '200':
          description: 'OK — `playing: false` when the deck is empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NowPlaying'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - apiToken:
        - read
      - sessionCookie: []
  /public/np/{username}:
    get:
      tags:
      - Listens
      summary: What this person is listening to, if they publish it.
      description: |-
        **Unauthenticated — the one route that publishes someone's listening
        without a credential.** It
        exists because a static site renders long before anyone visits it, so a
        live now-playing widget must be fetched from the reader's browser, where
        no credential of the owner's can safely go.

        Sends `Access-Control-Allow-Origin: *` and
        `Cache-Control: public, max-age=5`. A `GET` with no custom headers is a
        CORS simple request, so there is no preflight and no `OPTIONS`.

        **A username that does not exist and one that has not published return
        the same 404.** Anything that told them apart would make this a
        membership oracle for a private, invite-only instance.

        Everything past `title`/`artist`/`album` appears only if its owner
        ticked it — see the publish switch above. An absent field means "not
        published" or "not known"; the two are deliberately not distinguished.
      operationId: public_now_playing
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The person publishes. `playing` is false when the deck is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNowPlaying'
        '404':
          description: No such user, or they do not publish. Identical answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/profile/public-now-playing:
    get:
      tags:
      - Listens
      summary: The caller's publish switch for now-playing.
      description: |-
        **Session-only.** A token gets 401 — the endpoint does not accept one at
        all, so scopes never enter into it. A scrobble client has no business
        deciding that its owner's listening is public.
      operationId: get_publish
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSwitch'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - sessionCookie: []
    put:
      tags:
      - Listens
      summary: Turn public now-playing on or off.
      description: |-
        **Session-only.** `enabled` is required — a body that merely misspelled
        the key must not be read as an answer either way, because getting this
        one wrong is published rather than merely wrong.

        `fields` names the *extra* disclosures beyond title/artist/album.
        Unknown names are dropped rather than rejected, so a newer client cannot
        make an older server fail; it can only fail to grant something.
        Omitting `fields` while enabling publishes the base payload alone.
      operationId: put_publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
        required: true
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSwitch'
        '400':
          description: '`enabled` was absent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - sessionCookie: []
  /api/v1/preferences:
    get:
      tags:
      - Settings
      summary: User preferences.
      description: Session-only.
      operationId: get_preferences
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Settings
      summary: Update preferences.
      description: |-
        Session-only. A **shallow merge**: the keys sent replace the stored ones,
        omitted keys are left alone, and the merged object comes back.

        `timezone` must be an **IANA region**, not a fixed abbreviation. The
        region carries the DST rules — `Europe/Berlin` *is* CET in winter and
        CEST in summer, switching on the right dates by itself, and a region
        with no summer time never shifts. Storing `CET` would freeze the offset
        and put half a European year an hour out, silently: listens would still
        store correctly and only "today", the hour-of-day heatmap and the
        trajectory buckets would be wrong.
      operationId: put_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
        required: true
      responses:
        '200':
          description: Saved. The whole merged object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/scrobble-settings:
    get:
      tags:
      - Settings
      summary: When a listen counts — follow the same rule the server does.
      description: |-
        Half the track **or** four minutes, whichever comes first, is only the
        *default*: it is a per-user setting, because that convention fits a
        three-minute pop song far better than a forty-minute raga or a
        ninety-second hardcore track. A client that hardcodes it disagrees with
        the listener's own choice, silently, and nothing anywhere errors.

        Following it is not cosmetic agreement. The same threshold decides
        whether a track this client announced as now-playing and never
        scrobbled is written off as a **skip** — so submitting later than this
        rule banks the listen *and* leaves a skip behind it, and submitting
        earlier puts a listen on a permanent public record that the listener's
        own setting says had not been heard.

        Reported **as the server computes it, never as stored**: the values are
        clamped (fraction 0.05–1.0, seconds 10–3600), so a preferences object
        holding nonsense reads as the number every source here actually uses.
        `GET /api/v1/preferences` serves the raw blob and is session-only.

        Accepts a plain **`submit`** token, not `read`: this read exists only to
        decide a submission, and putting it behind `read` would make every
        scrobble client carry read access to the whole listening history to
        learn one number it is obliged to obey.

        It is its own endpoint rather than more keys on `/1/validate-token` —
        the opposite call from the introspection there, and deliberately. Those
        keys describe the *token*, are asked once at setup, and stay correct
        when cached. This is a setting, changed from a settings screen at any
        time; cached from a setup handshake it would go quietly stale, which is
        the failure this endpoint exists to prevent. Re-read it when a session
        starts.
      operationId: get_scrobble_settings
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The settings could not be read. **Never answered as "they have not set one"** — the default is an answer, and giving it here would have a client follow a rule the server is not applying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiToken: []
      - sessionCookie: []
  /api/v1/ratings:
    get:
      tags:
      - Loves
      summary: Star ratings held from your media servers, and the rule applied to them.
      description: |-
        Session-only. Reading is a fact about your library and pulling spends a
        source's credential, so a token gets 401 here and scopes never enter
        into it — the same line `/api/v1/sources` sits on.

        Every rating carries **the raw number the server gave and what that
        number was out of**, because a bare `7` means nothing: Plex counts to
        ten (half stars, so a 7 is three and a half), Subsonic to five, and
        Jellyfin/Emby's legacy `Rating` to ten. `shown` is the same rating on
        the display scale you chose, and is presentation only — every threshold
        comparison is made on the underlying fraction, so a rating that *reads*
        as four stars on a coarse scale does not thereby clear a four-star bar.

        `threshold` comes back in the units of `scale`, which is what you typed.
      operationId: get_ratings
      responses:
        '200':
          description: What is held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Loves
      summary: Forget the stored ratings.
      description: |-
        Session-only. **Does not un-love anything** — a love already made is a
        statement that was made. To take those back, raise the threshold and
        apply, which is a separate and visible act.
      operationId: clear_ratings
      responses:
        '200':
          description: Forgotten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingsCleared'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ratings/pull:
    post:
      tags:
      - Loves
      summary: Read the ratings your media servers hold.
      description: |-
        Session-only — it spends the credential of a configured source.

        Walks every enabled library source and replaces what that source said
        last time, so a rating raised, lowered or cleared on the server is
        raised, lowered or cleared here: the server is the authority on its own
        ratings and this is a copy of them. One source failing does not stop the
        others, and an error is reported separately from a count of zero — a
        server that could not be reached is not a library with no ratings in it.

        **Roon is reported as having nothing rather than returning an empty
        list.** Its extension API publishes no rating, favourite or thumb field
        at all, so a source that silently returned nothing would look broken.

        Ratings are stored; nothing becomes a love until
        `/api/v1/ratings/apply`.
      operationId: pull_ratings
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingsPulled'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ratings/apply:
    post:
      tags:
      - Loves
      summary: Love what clears the threshold, and withdraw what no longer does.
      description: |-
        Session-only.

        `dry_run` is **required and has no default**: the two things this can do
        are "tell me what would happen" and "write to my Loved page", and a body
        that merely misspelled the key must not be read as an answer either way.
        A preview and a real run go through the same code, so a preview cannot
        describe something the apply then does differently — and a preview
        writes nothing at all, including no entities.

        Two rules hold it safe. **A rating on something you have never listened
        to is kept and not loved** — loves point at entities and entities are
        things you actually played — and the count comes back as `unmatched` so
        it is visible rather than silently absent. And **only loves this
        instance derived are ever withdrawn**: one pressed by hand, or pulled
        from Last.fm or ListenBrainz, is outside the reach of a threshold
        however far it moves.

        Nothing here is forwarded to Last.fm or ListenBrainz. These are loves
        being imported, not loves being pressed, and a threshold you are
        expected to try at several settings would otherwise be a broadcast at
        every setting.
      operationId: apply_ratings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
        required: true
      responses:
        '200':
          description: What happened, or what would.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingsApplied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/loves/pull:
    post:
      tags:
      - Loves
      summary: Pull loves from Last.fm / ListenBrainz.
      description: |-
        Session-only — it uses stored service credentials. Not one code path:
        ListenBrainz returns only a recording MBID so an un-enriched track
        cannot be matched, while Last.fm returns names and can fall back to a
        name match. A love whose track is not in your history is **skipped,
        never invented** — loves point at entities, and entities are things you
        actually played. Libre.fm has no loved-tracks call and is not asked.
      operationId: pull_loves
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LovesPulled'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/export:
    get:
      tags:
      - Import & export
      summary: Export your listens.
      description: |-
        Session-only. Your whole history, newest first, streamed in pages so a
        large one cannot exhaust the server's memory. JSON by default — an array of
        `Listen`, the shape the importer reads back — or CSV with
        `title,artist,album,format,chain,mbid,time`.
      operationId: export
      parameters:
      - name: format
        in: query
        description: '`csv`, or anything else for JSON — the default.'
        required: false
        schema:
          type: string
          default: json
          pattern: ^(json|csv)$
      responses:
        '200':
          description: An attachment, `tapedeck-export.json` or `.csv`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listen'
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/backup:
    get:
      tags:
      - Import & export
      summary: Download a database snapshot.
      description: |-
        **Session-only, admin role.** A `VACUUM INTO` snapshot of the whole
        database — every user's listens, and the encrypted credentials.

        The encryption key deliberately lives **outside** the database, so it
        does not ride along in this file. That is what the encryption protects
        against: a leaked backup, not host compromise. Do not describe it as
        more than that.
      operationId: backup
      responses:
        '200':
          description: The SQLite file, as the attachment `tapedeck-backup.db`.
          content:
            application/x-sqlite3:
              schema:
                $ref: '#/components/schemas/Bytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports:
    get:
      tags:
      - Statistics
      summary: Period reports — a feed of week / month / year cards, newest first.
      description: |-
        Scope: `read` *(since v0.41)*.

        Reads the history **once** and folds it in Rust. A card carries a dozen
        aggregates and every one is bucketed in the caller's own timezone, which
        SQL here cannot do — a year of monthly cards would otherwise be hundreds
        of round trips.

        Weeks are ISO (Monday-start), deliberately **not** the caller's
        week-start preference: that setting shapes the dashboard counter and the
        heatmap rows, whereas a report is a named object and its boundary has to
        stay put, or last month's report changes shape when the preference does.

        `avg_daily` divides by **calendar** days — a finished period by its full
        length, one still running by the days it has actually had. Dividing by
        days-with-listens would report the rate of your busiest fortnight as the
        month's average.

        Two things deliberately absent. There is **no percentile against other
        users** ("you out-listened 88% of listeners"): that needs other people's
        listening, and on a private instance it would leak how much the rest of
        the household plays. And `crush` is omitted for the oldest period, where
        every artist is new by construction and it would just be the top artist
        relabelled.
      operationId: reports
      parameters:
      - name: unit
        in: query
        description: '`week`, `month` (default) or `year`.'
        required: false
        schema:
          type: string
          default: month
          pattern: ^(week|month|year)$
      - name: limit
        in: query
        description: How many periods to return, newest first. 12 by default, at most 60.
        required: false
        schema:
          type: integer
          default: 12
          maximum: 60
          minimum: 1
      - name: offset
        in: query
        description: |-
          Periods to skip, counting back from the newest. The stepper on the
          Reports page walks this one period at a time. Costs nothing extra — the
          whole history is folded on every call regardless.
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reports'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
      - apiToken:
        - read
  /api/v1/reports/image:
    get:
      tags:
      - Statistics
      summary: A report chapter as a shareable PNG, rendered on the server.
      description: |-
        Scope: `read` *(since v0.96)*.

        **Rendered on the server on purpose.** A share image is a deliverable
        rather than a view: a native client asks for one instead of
        reimplementing a layout, a type scale and a palette that would then be
        free to drift from the web's. The fonts are embedded in the binary and
        no artwork is fetched, so the same period produces the same bytes on any
        host.

        It **computes nothing**. Every figure comes from `GET /api/v1/reports`
        with the same `unit` and `offset`, so a share cannot disagree with the
        chapter it was shared from — including the rule that the only
        comparison on the card is against the caller's *own* periods.

        The card is a **composition, not a screenshot of the chapter**, and
        each unit has its own — never one card relabelled, the same reason the
        app has three chapter components:

        * **week** — a headline, the **by-day bars**, the top artist and the
          track of the week, the counts, the crush. Deliberately **no genre
          split**: seven days make a thin one, which is the chapter's own
          judgement.
        * **month** — the top artist and record, the counts, the top genres,
          what was on repeat, the crush. No by-week bars: five columns say less
          than the ranked genre list beneath them.
        * **year** — the **by-month bars** and the **genre bands** (the three
          biggest genres tracked by name across the year, everything else folded
          into `other`), the artist and record of the year, what was discovered,
          the crush.

        A section that would not fit is **left out whole** rather than clipped —
        a PNG has no scrollbar, so a section drawn over the footer would look
        deliberate. A thin period therefore draws fewer sections rather than
        empty headings, and a full year gives up its discovery line before it
        gives up the crush.
      operationId: report_image
      parameters:
      - name: unit
        in: query
        description: |-
          `week`, `month` (default) or `year`. Each has its own composition —
          there is no card that is another card at a different size.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: How many periods back from the newest, matching the Reports stepper.
        required: false
        schema:
          type: integer
          minimum: 0
      - name: size
        in: query
        description: '`story` (default), `square` or `wide`.'
        required: false
        schema:
          type: string
      - name: theme
        in: query
        description: |-
          `dark` (default) or `light`. **Asked at export time, not inherited** — a
          share lands on somebody else's feed rather than inside the app, so the
          reader's own theme preference is not the question being answered.
        required: false
        schema:
          type: string
      - name: format
        in: query
        description: |-
          `png` (default) or `svg`. The SVG is the same document the PNG is
          rasterised from: smaller, sharp at any size, and something a native
          client can draw itself. It is *not* a second renderer — if the two ever
          disagreed it would be because one of them was not this one.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'The image. `Cache-Control` is `private`: it is one person''s listening, and a shared cache must not hold it.'
          headers:
            x-tapedeck-glyph-coverage:
              schema:
                type: string
              description: '`full`, or `partial` when the embedded fonts could not draw every character on the card. Not an error — the host''s own fonts may cover it — but a client can say "this may not render your Korean titles" instead of the user finding out from the picture.'
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/Bytes'
            image/svg+xml:
              schema:
                type: string
        '400':
          description: An unsupported unit, size or format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No report for that period — an offset past the end of the history, or an instance with nothing in it yet. A real answer, not a failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - sessionCookie: []
      - apiToken:
        - read
  /api/v1/rediscovery:
    get:
      tags:
      - Rediscovery
      summary: The Rediscovery lists, all built from your own history.
      description: |-
        Session-only. Nothing here points at music you do not own — that is the
        design, not an implementation detail.

        "Not lately" is a **parameter, not a constant**: six months is a long
        gap for a daily listener and no gap at all otherwise. The seasonal list
        excludes the current year, or it would just be "recently played".
      operationId: rediscover
      parameters:
      - name: quiet_days
        in: query
        description: |-
          How long is "not lately", in days. Defaults to six months — long enough
          that a gap is meaningful rather than just a busy fortnight. Clamped to
          between a week and ten years.
        required: false
        schema:
          type: integer
          format: int64
          default: 180
          maximum: 3650
          minimum: 7
      - name: limit
        in: query
        description: Rows per list. 12 by default, at most 50.
        required: false
        schema:
          type: integer
          format: int64
          default: 12
          maximum: 50
          minimum: 1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rediscovery'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/rediscovery/gear/{id}:
    get:
      tags:
      - Rediscovery
      summary: Favourites never heard on a piece of gear.
      description: |-
        Session-only. Answered by joining `chain_id` to the chains whose
        components reference the gear — no per-listen equipment field needed.
        Restricted to tracks played more than once: the interesting question is
        how your *favourites* sound on it.
      operationId: never_on_gear
      parameters:
      - name: id
        in: path
        description: One of your pieces of gear.
        required: true
        schema:
          type: integer
          format: int64
      - name: quiet_days
        in: query
        description: |-
          How long is "not lately", in days. Defaults to six months — long enough
          that a gap is meaningful rather than just a busy fortnight. Clamped to
          between a week and ten years.
        required: false
        schema:
          type: integer
          format: int64
          default: 180
          maximum: 3650
          minimum: 7
      - name: limit
        in: query
        description: Rows per list. 12 by default, at most 50.
        required: false
        schema:
          type: integer
          format: int64
          default: 12
          maximum: 50
          minimum: 1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GearRows'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/playlist-lab:
    get:
      tags:
      - Playlists
      summary: The vector space the Playlist Lab generates from.
      description: |-
        Session-only. Returns the candidate pool with a position for each track,
        plus what every axis means.

        **Read `granularity` and `note` before using this.** The space is ten
        real dimensions, and they come from two different places:

        * **Six are about the music** (`group: sound`), from the Every Noise
          genre map — `x` (dense/atmospheric ↔ spiky/bouncy), `y` (organic ↔
          mechanical/electric), the colour's three channels, and how far apart a
          track's own genres sit.
        * **Four are about the listener** (`group: habit`) — era, familiarity,
          hour of day, recency — from their own history.

        These are **not** per-recording audio features. Genres attach to
        artists, so `granularity` is `artist` and every track by one artist
        shares its six `sound` coordinates exactly; the `habit` axes are the
        only thing separating them. Anything describing this as track-level
        audio similarity is wrong. A client mixing the two groups without
        weighting will find "similar" quietly means "played at the same hour".

        Values are normalised 0–1 against **the pool's own extremes**, so
        "newer" means newer than the rest of this collection. A track whose
        genres have no place on the map is **dropped, not centred** — placing it
        in the middle would invent a similarity it does not have — and the count
        comes back as `unplaced`.

        `tracks` is compact — `[title, artist, album, plays, [v0…v9]]` — because
        on a 3,000-track pool the repeated key names would be most of the
        payload. Answers `409` when the genre map has not been fetched, when
        there is no history, or when nothing has been placed yet.
      operationId: space
      parameters:
      - name: min_plays
        in: query
        description: |-
          Plays a track needs to be in the pool. Lower it to reach further into
          the tail of the history.
        required: false
        schema:
          type: integer
          format: int64
          default: 2
          maximum: 50
          minimum: 1
      - name: cap
        in: query
        description: The most tracks to return, most-played first.
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 50
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSpace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No genre map yet, no history, or nothing placed yet — the message says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/albums/{id}:
    get:
      tags:
      - Library
      summary: An album page.
      description: |-
        Session-only. Aggregated over `scrobbles` by name. Track rows carry the
        **raw quality columns**, not a formatted label — the client formats
        them, so a server-side copy of that logic cannot drift.

        An entity with **zero plays still renders** rather than 404ing:
        something annotated once and since deleted from the history is still a
        real record.
      operationId: album_detail
      parameters:
      - name: id
        in: path
        description: The album's entity id, from `GET /api/v1/resolve`.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumPage'
        '400':
          description: That entity is not an album.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/albums/{id}/tracklist:
    get:
      tags:
      - Library
      summary: The record's own tracklist, including tracks never played.
      description: |-
        Session-only. Everything else on the album page is aggregated from
        listens, so a record played twice renders as a two-track record. This
        asks MusicBrainz what is actually on it.

        **Nothing is stored.** The caller matches these against the plays it
        already holds; writing a tracklist into `scrobbles` would invent listens
        that never happened. It is a separate call rather than part of
        `/api/v1/albums/{id}` because it costs a rate-limited request to an
        external service and the page must render without one.

        The release is chosen in order: the entity's own MBID, then the release
        MBID a **plurality** of the album's listens claim (a tagger works per
        track, so one listen in twelve routinely carries a compilation's), then
        a search, which is a guess.

        **404 is a normal answer** — a great deal of any real library is not in
        MusicBrainz, and those are exactly the records worth keeping.
      operationId: album_tracklist
      parameters:
      - name: id
        in: path
        description: The album's entity id.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumTracklist'
        '400':
          description: That entity is not an album.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No matching release, or no such album.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: MusicBrainz could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/artists/{id}:
    get:
      tags:
      - Library
      summary: An artist page.
      description: Session-only. Same shape and same rules as the album page.
      operationId: artist_detail
      parameters:
      - name: id
        in: path
        description: The artist's entity id, from `GET /api/v1/resolve`.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistPage'
        '400':
          description: That entity is not an artist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/charts:
    get:
      tags:
      - Statistics
      summary: Top charts.
      description: |-
        Session-only. Note this offers a **different range set** from
        `/api/v1/stats` — it has `today`. The two answering the same question
        over different windows is known, and is why the Insights redesign wants
        one shared range control.
      operationId: charts
      parameters:
      - name: kind
        in: query
        description: '`artists` (default), `albums` or `tracks`.'
        required: false
        schema:
          type: string
          default: artists
          pattern: ^(artists|albums|tracks)$
      - name: range
        in: query
        description: |-
          The window, as on `GET /api/v1/stats`: `today`, `d7`, `month`, `year`
          or `all`, the default.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 100 by default, at most 500.
        required: false
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 500
          minimum: 1
      - name: metric
        in: query
        description: |-
          `plays` (default) or `hours` — the *ranking*, not just the number shown.
          Statistics hands off here carrying its own metric, and the two lists
          disagreeing would defeat the point of the handoff.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/resolve:
    get:
      tags:
      - Library
      summary: Resolve names to an entity id.
      description: |-
        Session-only. **Creates the entity on first visit** — a write on a read
        path, on purpose. The browser knows names, not ids, so without this
        every link out of the history would be dead until you happened to
        annotate the thing it points at.
      operationId: resolve
      parameters:
      - name: kind
        in: query
        description: '`album` / `release`, `artist`, or `track` / `recording`.'
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: true
        schema:
          type: string
      - name: artist
        in: query
        description: |-
          Required for an album or a track: the same title by two artists is two
          different records.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/art/{id}:
    get:
      tags:
      - Library
      summary: Cover art for a listen, proxied.
      description: |-
        Session-only. Proxies the user's own library server, which the browser
        usually cannot reach and must not hold credentials for.
      operationId: scrobble_art
      parameters:
      - name: id
        in: path
        description: The listen.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Image bytes, `Cache-Control: private` for a week.'
          content:
            image/*:
              schema:
                $ref: '#/components/schemas/Bytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No artwork. The client falls back to a lettered tile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/artists/img/{id}:
    get:
      tags:
      - Library
      summary: An artist portrait, proxied.
      description: Session-only.
      operationId: artist_image
      parameters:
      - name: id
        in: path
        description: The `artists` row — `artist_row_id` on an artist page.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'Image bytes, `Cache-Control: private` for a week.'
          content:
            image/*:
              schema:
                $ref: '#/components/schemas/Bytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No portrait yet. Retried later — the answer changes when the artist is added to a library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Library
      summary: Override an artist portrait.
      description: |-
        Session-only. A manual override beats every provider — this is a
        journal, and whoever keeps it gets the last word.
      operationId: set_artist_image
      parameters:
      - name: id
        in: path
        description: The `artists` row.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistImageUpdate'
        required: true
      responses:
        '200':
          description: Saved. Null when cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistImageSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/artists/landscape/{id}:
    put:
      tags:
      - Library
      summary: Set or clear an artist's wide image.
      description: |-
        Session-only. Takes the **artist row id** (`artist_row_id` on the artist
        page), not the entity id — the `artists` row is keyed by name and shared
        across users, which is what the portrait proxy addresses too.

        A different photograph from the portrait rather than a crop of it: the
        Reports chapter tile is 16/11, where a square either pillarboxes or
        crops the head off. Nothing Tapedeck can reach supplies a landscape, so
        it is present only where the user chose one, and a chapter with none
        keeps the enormous faint initial — that is the design, not a placeholder.

        An empty string clears it.
      operationId: set_artist_landscape
      parameters:
      - name: id
        in: path
        description: The `artists` row.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistImageUpdate'
        required: true
      responses:
        '200':
          description: Saved. Null when cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandscapeSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/albums/{id}/cover:
    put:
      tags:
      - Library
      summary: Override an album cover.
      description: |-
        Session-only. The counterpart of the artist portrait override: an album
        otherwise wears whatever artwork the newest listen of it happens to
        carry, which is unfixable when it is the wrong edition's.

        400s when the id is not a **release** entity — an artist's picture has
        its own endpoint, and two places to set one would leave no rule about
        which wins. Like every entity write, this is not scoped per user:
        `entities` is shared.
      operationId: set_album_cover
      parameters:
      - name: id
        in: path
        description: The album's entity id.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistImageUpdate'
        required: true
      responses:
        '200':
          description: Saved. Null when cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverSet'
        '400':
          description: Not a URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such album, or that entity is not a release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/art/upload/{name}:
    get:
      tags:
      - Library
      summary: Serve an uploaded picture.
      description: |-
        Session-only. Cached `private, immutable` — the name is random per
        upload, so the bytes behind a given URL never change.

        `name` is **validated, not trusted**: it must be exactly the 24 hex
        characters this server generates plus a known image extension. The
        override columns accept any `/`-prefixed string, so a route that read a
        path out of one would serve arbitrary files from the uploads directory.
      operationId: serve_upload
      parameters:
      - name: name
        in: path
        description: As it appears in the stored URL.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Image bytes, `Cache-Control: private, immutable`.'
          content:
            image/*:
              schema:
                $ref: '#/components/schemas/Bytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such picture, or the file is no longer on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/artists/img/{id}/upload:
    post:
      tags:
      - Library
      summary: Upload an artist portrait.
      description: |-
        Session-only. The counterpart of the `PUT` above, for a picture that is
        on your disk rather than already somewhere on the web.

        The extension is taken from the **declared content type**, never from
        the filename — the path is one this server writes. The stored name is
        random, so the served URL is `immutable`-cacheable and a replaced
        picture is a new URL rather than the same URL with new bytes.

        Replaces the override exactly as a pasted URL does, and the file it
        supersedes is deleted. `artists` carries no user column, so this is an
        **instance-wide** edit.
      operationId: upload_artist_image
      parameters:
      - name: id
        in: path
        description: The `artists` row.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        '200':
          description: Saved. The body carries the new URL, which is a path on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistImageSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Larger than 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/artists/landscape/{id}/upload:
    post:
      tags:
      - Library
      summary: Upload an artist's wide picture.
      description: |-
        Session-only. Same rules as the portrait upload.

        This is the one image override nothing can fill automatically — no
        provider Tapedeck reaches supplies a landscape — so before this it was a
        URL or the big initial.
      operationId: upload_artist_landscape
      parameters:
      - name: id
        in: path
        description: The `artists` row.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        '200':
          description: Saved. The body carries the new URL, which is a path on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandscapeSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Larger than 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/albums/{id}/cover/upload:
    post:
      tags:
      - Library
      summary: Upload an album cover.
      description: |-
        Session-only. Same rules as the artist uploads. Takes an **entity** id.

        Replaces the derived cover the way the `PUT` does, so the page still
        offers *Reset* (back to whatever the listens carry) rather than *Clear*.
        Entities are shared, so this is an **instance-wide** edit.
      operationId: upload_album_cover
      parameters:
      - name: id
        in: path
        description: The album's entity id.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        '200':
          description: Saved. The body carries the new URL, which is a path on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Larger than 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not an image type this server stores (JPEG, PNG, WebP, GIF, AVIF, TIFF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/art/library:
    get:
      tags:
      - Library
      summary: Does this album already have a cover?
      description: |-
        Scope: `write`.

        The precondition of an upload, so the common case costs one small `GET`
        rather than a megabyte of JPEG. A client reads the picture off disk only
        when this answers `false`.

        **`write`, not `read`** — this exists only to decide a write, and
        requiring `read` would force a scrobbling token that wants to offer a
        sleeve to carry read access to the whole listening history as well.

        `held` is true when any listen of this album carries artwork (a
        Cover Art Archive id counts, `-1` excluded), **or** when a cover has been
        set by hand on the album — one set that way is what the album page
        prefers over everything else, so answering `false` would invite a
        picture that would never be shown.

        Deliberately **not** `album_artwork`'s question, which excludes skips
        because its job is choosing a cover to display. An album whose only
        listens are skips would otherwise answer "nothing held" for ever and the
        same sleeve would be re-uploaded on every run.

        Creates nothing. `GET /api/v1/resolve` would mint the entity as a side
        effect of being asked, which is right for a browser about to annotate
        something and wrong for a player asking whether to bother.
      operationId: album_art_held
      parameters:
      - name: artist
        in: query
        description: As you would submit it.
        required: true
        schema:
          type: string
      - name: album
        in: query
        description: As you would submit it.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whether a cover is already held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtHeld'
        '400':
          description: A blank artist or album.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - apiToken:
        - write
      - sessionCookie: []
    post:
      tags:
      - Library
      summary: Offer a cover read from the client's own files.
      description: |-
        Scope: `write`.

        Writes `scrobbles.artwork_url` on every listen of this album that has
        none, and nothing else. That column **is** the artwork backfill's queue
        and the album page reads it back, so a sleeve arriving with the listens
        is exactly what a Plex-sourced listen carries. A cover *override* would
        claim somebody set it by hand, and nobody did.

        Rows holding the `artwork_url = ''` tombstone are filled too, and that
        is the point rather than an oversight: the tombstone means "asked every
        provider, nobody had a picture", and the premise here is that the
        listener's own file does. Skipped listens are filled as well — artwork
        is not a count.

        The held check runs again before the bytes are written, so a cover that
        arrived between the `GET` and this costs no file on disk and is reported
        rather than treated as an error.
      operationId: upload_album_art_from_library
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LibraryArtUpload'
        required: true
      responses:
        '200':
          description: Stored, or already held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryArtStored'
        '400':
          description: No image, or a blank artist or album.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Larger than 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not an image type this server stores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiToken:
        - write
      - sessionCookie: []
  /api/v1/chains:
    get:
      tags:
      - Chains
      summary: Signal chains.
      description: |-
        Scope: `read` *(since v0.37)*. This is what lets a client offer a chain
        **picker** instead of taking unvalidatable free text for a field that
        has to match a name exactly.
      operationId: list_chains
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
      - apiToken:
        - read
    post:
      tags:
      - Chains
      summary: Create a chain.
      description: |-
        Session-only.

        **There is no `is_default`**, and until v0.115.1 this said there was —
        sending it got a 201 and no effect, because unknown fields are ignored.
        A chain is made the default *by* a device binding or an API token; see
        the `Chain` schema.

        A new chain is never `shared`. Sharing is switched on deliberately, from
        the chain drawer or Patch → Decks, and never as a side effect of
        creating something.
      operationId: create_chain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChainRequest'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A chain of that name already exists for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/chains/{id}:
    get:
      tags:
      - Chains
      summary: One chain.
      description: 'Scope: `read` *(since v0.37)*.'
      operationId: get_chain
      parameters:
      - name: id
        in: path
        description: The chain.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - sessionCookie: []
      - apiToken:
        - read
    delete:
      tags:
      - Chains
      summary: Delete a chain.
      description: Session-only. Clears referencing rows first — foreign keys are on.
      operationId: delete_chain
      parameters:
      - name: id
        in: path
        description: The chain.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Chains
      summary: Update a chain.
      description: |-
        Session-only, and a **whole-record replace** despite the verb — it takes
        the same body as the create. Every field the editor owns is written, so
        an omitted `icon`, `description` or `listening_context` is *cleared*.
        Send the full record back.

        Two fields it deliberately does **not** touch: `shared`, which is
        switched from the chain drawer or Patch → Decks — writing it here would
        un-publish a chain as a side effect of renaming it — and `total_hours`,
        which is derived from the listens.

        A component naming gear the chain did not name before is stamped with
        `since` at the moment of the save. That is what stops a box added to a
        chain with history being credited with all of it; send your own `since`
        to correct the date, which is usually a few days before anybody got
        round to recording it.
      operationId: update_chain
      parameters:
      - name: id
        in: path
        description: The chain.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChainRequest'
        required: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowUpdated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/chains/variants:
    get:
      tags:
      - Chains
      summary: Every chain variant the caller owns.
      description: |-
        Session or a token carrying `read`. A variant is a chain with one step
        swapped — two cartridges on one turntable, or the same commute on
        different IEMs. They are one chain and a choice, not two chains.

        Flat rather than nested under each chain, because the page groups them
        itself and one list beats a request per chain.

        `total_hours` here is the listening that went through *this variant*.
        A chain's own `total_hours` includes every variant of it, since they all
        ran through that chain.
      operationId: list_variants
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - apiToken:
        - read
      - sessionCookie: []
    post:
      tags:
      - Chains
      summary: Create a variant.
      description: |-
        Session-only. Only the steps that *differ* are stored, which is what
        makes this an override rather than a copy: editing the shared part of a
        chain updates every variant of it.

        The chain and every piece of gear named must be the caller's.
      operationId: create_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantRequest'
        required: true
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/chains/variants/{id}:
    delete:
      tags:
      - Chains
      summary: Delete a variant.
      description: |-
        Session-only. The listens that went through it **keep their chain** and
        fall back to its base components, which is what a null variant means
        everywhere else — they are not deleted along with it.
      operationId: delete_variant
      parameters:
      - name: id
        in: path
        description: The variant.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Deleted. `status` is `deleted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Chains
      summary: Rename a variant or change what it swaps.
      description: Session-only. An omitted field is left alone.
      operationId: update_variant
      parameters:
      - name: id
        in: path
        description: The variant.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantRequest'
        required: true
      responses:
        '200':
          description: Saved. `status` is `ok`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/chains/variants/{id}/promote:
    post:
      tags:
      - Chains
      summary: Make this setup the chain, and the chain a setup.
      description: |-
        For the common case where the variant is the one you actually use — the
        other cartridge is in the headshell most of the time, so it should be
        what the chain *is*.

        **A relabelling, not a change.** What was fitted for any given listen is
        identical afterwards, and so is every piece of gear's hours.

        That is harder than it looks, and it is the whole of this endpoint. An
        override is `{position, equipment_id}` **relative to the base**, so
        another variant that swaps position 2 means "the base, but with X at 2"
        — change the base and that sentence names different gear at position 1,
        silently, with hours landing on a box that was never fitted. So every
        variant is resolved to an absolute list of steps first and re-expressed
        against the new base afterwards. Listens follow: those on the chain move
        to the new setup that restores it, and those on the promoted setup move
        to the chain.

        `name` is what to call the setup the chain is demoted to — the old base
        has no name of its own, because it *was* the chain. Defaults to
        "Previous setup".

        **Refuses a setup that removes a step** (400): removal shifts every
        later position, so promoting one would change what every other setup's
        overrides point at. Nothing in the UI creates such a setup.
      operationId: promote_variant
      parameters:
      - name: id
        in: path
        description: The variant to promote.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteVariant'
        required: true
      responses:
        '200':
          description: The promoted setup, and the id of the one the chain became.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promoted'
        '400':
          description: That setup removes a step, or has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such setup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - sessionCookie: []
  /api/v1/chains/duplicates:
    get:
      tags:
      - Chains
      summary: Chains that look like the same rig, and what folding one would do.
      description: |-
        Session-only. The discovery half of the fold below, and the same
        preview-then-apply shape the metadata sanitiser uses: this reports, it
        never acts.

        A pair is reported when the two chains disagree on at most two steps.
        `distance` is how many — `0` is the same wiring under two names, `1` is
        the swapped-box case (the same commute on different IEMs) that variants
        exist for. Past two they are simply different rigs, and a variant
        overriding half a chain is a copy wearing an override's clothes.

        The chain with **more listening** is reported as the base, since it
        keeps its id and fewer rows move — but the fold takes an explicit
        direction, so this is a suggestion rather than the decision.
      operationId: list_duplicates
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duplicates'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/chains/{id}/fold:
    post:
      tags:
      - Chains
      summary: Fold this chain into another as a variant of it.
      description: |-
        Session-only. **Not reversible.**

        Every listen, side, session, binding, device default and token default
        of this chain is repointed at `into_chain_id` carrying the variant, and
        this chain is then deleted. Because gear hours resolve per
        `(chain, variant)` pair, the moved listening lands on the gear that was
        actually fitted — which is what makes two near-duplicate chains' hours
        add up instead of sitting in two rows that cannot be compared.

        Send **either** `variant_id` (a variant of the target chain you already
        built) **or** `variant_name` (derive a new one from the difference
        between the two chains). Sending both, or neither, is a 400: on an
        endpoint that cannot be undone, "use the one I built" and "make me
        another" must not be the same request with a typo between them.

        Refused with a 400 naming the reason when: the chain is folded into
        itself, the variant belongs to a different chain (it would resolve to
        components never fitted together), the name is already taken on the
        target, or **this chain carries variants of its own** — their positions
        index into components the fold replaces, and re-deriving them would be a
        guess about which box was fitted.
      operationId: fold_chain
      parameters:
      - name: id
        in: path
        description: The chain to fold away.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoldRequest'
        required: true
      responses:
        '200':
          description: Folded. The counts are what actually moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices:
    get:
