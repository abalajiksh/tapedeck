    Health:
      type: object
      description: What `/health` answers.
      required:
      - status
      - service
      - database
      - version
      - replica
      properties:
        status:
          type: string
          description: '`ok`, or `degraded` when the database cannot be reached.'
        service:
          type: string
          description: Always `tapedeck`.
        database:
          type: string
          description: '`ok` or `unreachable`.'
        version:
          type: string
          description: The running binary's version.
        replica:
          type: boolean
          description: |-
            Whether this instance is a **replica** — a full copy that forwards no
            listens, publishes no actor and makes no MusicBrainz request. A staging
            instance restored from a production snapshot is byte-identical on every
            other screen, so this is the only thing that tells them apart. Always
            present; its absence means a binary older than 0.109.0.
