      description: What became of an offered cover.
    LibraryArtUpload:
      type: object
      description: A cover a player read off its own files, offered as `multipart/form-data`.
      required:
      - artist
      - album
      - file
      properties:
        artist:
          type: string
          description: The album's artist, as you would submit it.
        album:
          type: string
          description: The album, as you would submit it.
        file:
          type: string
          format: binary
          description: The image. Its declared `Content-Type` decides how it is stored.
        release_mbid:
          type:
          - string
          - 'null'
          description: |-
            Accepted and **not read** — the cover is keyed on names like every other
            album query. Send the MBID on a listen's `additional_info` instead.
    LibraryLyricsRequest:
      type: object
      description: |-
        Words a player found in its own files, offered by the player.

        **Deliberately not `PUT /api/v1/lyrics`**, which is the correction path: that
        one calls `set_words`, which sets `edited` and stamps the source as *You*.
        Typing a line in is a claim only a person gets to make, and a client
        reporting what a file contains is not correcting anything — so it must not
        be able to mint the flag that outranks every later fetch.

        Nor `additional_info` on a submission: a lyric is a few KB on every play of a
        track already held, and ingest stays about the listening.
      required:
      - artist
      - title
      properties:
        artist:
          type: string
        title:
          type: string
        album:
          type:
          - string
          - 'null'
          description: |-
            Advisory. Not used to match — `track_key` is artist and title — and kept
            out of the store for the same reason.
        plain:
          type:
          - string
          - 'null'
        synced:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
          description: |-
            Whose words these are, and **required**.

            The reader prints "Words via X", and that sentence is the entire reason
            this route exists apart from the LRCLIB one: *from your own files* and
            *from a lyrics service* are different statements about whose text
            somebody is reading. A client that will not say who it is should not get
            to write provenance, and inventing one here would be the placeholder
            User-Agent mistake in a new place.

            Typed `Option` and required **in the handler**, not by serde. A missing
            required field is rejected by axum's `Json` extractor with a 422 before
            any of this runs — so the client is handed a deserialiser's sentence
            about a field name instead of the reason, which is the trap
            `additional_info` already documents. The requirement is unchanged; only
            the answer is legible.
    LibraryLyricsStored:
      type: object
      description: What became of words a player offered.
      required:
      - status
      - lines
      properties:
        status:
          type: string
          description: |-
            `saved`, or `kept` when the words held were corrected by hand — a
            correction outranks a file's own tags, so those were left alone.
        why:
          type:
          - string
          - 'null'
          description: Why they were kept; null when saved.
        language:
          type:
          - string
          - 'null'
          description: The language of the words now held.
        lines:
          type: integer
          description: Lines in the words now held.
          minimum: 0
    LinePin:
      type: object
      description: A liner note pinned to a line.
      required:
      - note_id
      - body_md
      - excerpt
      - visibility
      - updated_at
      properties:
        note_id:
          type: integer
          format: int64
        body_md:
          type: string
        excerpt:
          type: string
          description: The first 200 characters, as text.
        visibility:
          type: string
        updated_at:
          type: integer
          format: int64
    LinePos:
      type: object
      description: One numbered line of a lyric.
      required:
      - artist
      - title
      - line
      properties:
        artist:
          type: string
        title:
          type: string
        line:
          type: integer
          description: 1-based, blank lines included.
          minimum: 0
        text:
          type:
          - string
          - 'null'
          description: |-
            The words, when this instance still holds the lyric. A pin outlives the
            lyric it points at, so null is not an error.
    Listen:
      type: object
      description: |-
        A stored listen. The quality columns are **flat**, not nested under a
        `quality` object — the frontend reads them raw so its own `qualityLabel()`
        produces the same tag everywhere, and a server-side copy of that logic
        would drift.

        The audio fields are null for most of any real history: they are only ever
        written by ingest and the session-shaped sources, so an imported listen
        carries none of them. Any share computed over them is a share of *that*
        population, not of the listening.
      required:
      - id
      - user_id
      - title
      - artist
      - timestamp
      - source_id
      - source_name
      - status
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
          description: |-
            The primary artist. Everyone credited lives in `scrobble_artists` and is
            what the artist pages and charts aggregate over, so a listen crediting a
            soloist appears under both names there while this field still names the
            one the record is filed under.
        album:
          type:
          - string
          - 'null'
        timestamp:
          type: integer
          format: int64
          description: Unix seconds, UTC, **start** of play.
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds.
        source_id:
          type: string
          description: Dedup key. Unique per user per play.
        source_name:
          type: string
          description: '`Plex`, `Jellyfin`, `Navidrome`, `ingest:<client>`, `Import`…'
        status:
          type: string
          description: |-
            `pending` is queued for forwarding, `synced` has been forwarded, and
            `imported` is stored only and will never be forwarded. Both an import
            and a skip land as `imported` — forwarding either would put a wrong
            scrobble on a permanent public record.

            There is no `sent` and no `failed`. A delivery that fails stays
            `pending` and is retried, and which sinks it has already reached is in
            `delivered_sinks` — that is what stops a partial failure
            double-scrobbling.
        mbid_recording:
          type:
          - string
          - 'null'
        mbid_release:
          type:
          - string
          - 'null'
        mbid_artist:
          type:
          - string
          - 'null'
          description: |-
            A **JSON-encoded array**, not an array — the column stores what was
            written to it. Parse it before use.
        mbid_release_group:
          type:
          - string
          - 'null'
          description: |-
            The release group, which is what relates a reissue, a remaster and a
            regional edition to one another. Filled from a submitting client's
            `additional_info`, a ListenBrainz export's `mbid_mapping`, or a
            Jellyfin/Emby session — never by a lookup.
        mbid_release_track:
          type:
          - string
          - 'null'
          description: |-
            The track *on a particular release*, as distinct from the recording:
            the same recording is a different release-track on an album, a single
            and a compilation. Only a tagging client ever knows it.
        mbid_work:
          type:
          - string
          - 'null'
          description: |-
            The composition rather than a performance of it — the identifier that
            relates every recording of one piece. Only a tagging client ever knows
            it.
        mbid_album_artist:
          type:
          - string
          - 'null'
          description: |-
            A **JSON-encoded array**, like `mbid_artist`. Whoever the *record* is
            credited to, which on a compilation or a soundtrack is not the
            performer of the track.
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Cover Art Archive id. **`-1` is a tombstone** meaning "asked, no artwork
            exists" — treat any non-positive value as no artwork.
        caa_release_mbid:
          type:
          - string
          - 'null'
        isrc:
          type:
          - string
          - 'null'
        format_type:
          type:
          - string
          - 'null'
          description: '`pcm`, `dsd`, `mqa`.'
        codec:
          type:
          - string
          - 'null'
        bitrate:
          type:
          - integer
          - 'null'
          format: int32
          description: kbps.
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Hz.
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        channels:
          type:
          - integer
          - 'null'
          format: int32
        container:
          type:
          - string
          - 'null'
        source_quality:
          type:
          - string
          - 'null'
        is_lossless:
          type:
          - boolean
          - 'null'
        dsd_rate:
          type:
          - integer
          - 'null'
          format: int64
          description: Hz.
        dsd_multiplier:
          type:
          - integer
          - 'null'
          format: int32
        dsd_to_pcm_converted:
          type:
          - boolean
          - 'null'
        delivery_codec:
          type:
          - string
          - 'null'
          description: Set only on a genuine transcode.
        delivery_bitrate:
          type:
          - integer
          - 'null'
          format: int32
          description: kbps.
        delivery_sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Hz.
        delivery_bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        is_transcoded:
          type:
          - boolean
          - 'null'
        transcode_reason:
          type:
          - string
          - 'null'
        quality_score:
          type:
          - number
          - 'null'
          format: double
          description: |-
            0–100, computed once at ingest and never recomputed. Null for anything
            imported, so an average over it has the same narrow population as the
            audio fields.
        device_id:
          type:
          - integer
          - 'null'
          format: int64
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The resolved signal chain.
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Which setup of that chain was fitted.
        session_id:
          type:
          - integer
          - 'null'
          format: int64
        listening_context:
          type:
          - string
          - 'null'
          description: From the resolved chain.
        submission_client:
          type:
          - string
          - 'null'
        track_number:
          type:
          - integer
          - 'null'
          format: int32
        artwork_url:
          type:
          - string
          - 'null'
          description: 'Empty string is a tombstone, same idea as `caa_id: -1`.'
        source_ref:
          type:
          - integer
          - 'null'
          format: int64
          description: The `user_sources` row this was polled from.
        listened_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Milliseconds actually heard, paused time excluded. Only a pushing
            client can report this, so it is null for everything polled and
            everything imported. What `skipped` cannot express — "cut short three
            seconds in" and "cut short with thirty seconds left" are opposite
            behaviours.
        is_shuffle:
          type:
          - boolean
          - 'null'
          description: Shuffle chose this, not the listener.
        queue_source:
          type:
          - string
          - 'null'
          description: What it played from, in the client's own words.
        company:
          type:
          - string
          - 'null'
          description: |-
            Who this was heard with, as names. Filled automatically for a listen
            that happened inside a Shared Spool, and by hand via
            `POST /api/v1/scrobbles/bulk-company` otherwise.

            **`null` means unmarked, not alone.** Nobody recorded who was there —
            which is true of every listen predating the field. Counting marked
            listens is exact; reporting a *share* of listening that was solitary is
            not, and would be a fact about how much has been marked.
        joint_session_id:
          type:
          - string
          - 'null'
          description: |-
            The Shared Spool this listen belonged to, as the spool's uuid. A joint
            listen is N rows across N decks sharing this — never one row with
            several owners. Only a sitting ever sets it.
        delivered_sinks:
          type:
          - string
          - 'null'
          description: |-
            JSON array of the sinks this has already reached, so a retry only hits
            the ones that have not. A string, not an array.
    ListenPage:
      type: object
      description: A page of the history, newest first.
      required:
      - scrobbles
      - count
      - limit
      - offset
      properties:
        scrobbles:
          type: array
          items:
            $ref: '#/components/schemas/Listen'
        count:
          type: integer
          description: Rows in this page, not in the history.
          minimum: 0
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
    ListenType:
      type: string
      description: |-
        **This decides forwarding.** `single` and `playing_now` are live;
        `import` is stored only unless the token is marked `imports_are_live` —
        see `POST /1/submit-listens`.
      enum:
      - single
      - playing_now
      - import
    ListenUpdated:
      type: object
      description: The fallback answer to an edit whose fresh row could not be read back.
      required:
      - id
      - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: Always `updated`.
    ListeningContext:
      type: string
      description: |-
        How you listen through a chain. **Attention, not company** — the two are
        orthogonal, and who you were with is `company` on the listen.
      enum:
      - active
      - active-mobile
      - passive
      - background
      - unknown
    LiveDeck:
      type: object
      description: |-
        A deck you are patched into that is playing now, through a chain you may
        see.
      required:
      - user_id
      - username
      - title
      - artist
      - position
      - position_known
      - paused
      - has_chain
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        position:
          type: integer
          format: int64
          description: Seconds into the track.
          minimum: 0
        position_known:
          type: boolean
          description: The position was measured rather than extrapolated.
        paused:
          type: boolean
        chain_name:
          type:
          - string
          - 'null'
          description: |-
            Null with `has_chain` true is a private chain; null with it false is a
            listen through nothing anybody recorded.
        has_chain:
          type: boolean
        artwork_url:
          type:
          - string
          - 'null'
        format_type:
          type:
          - string
          - 'null'
        codec:
          type:
          - string
          - 'null'
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
        is_lossless:
          type:
          - boolean
          - 'null'
    LiveDecks:
      type: object
      required:
      - live
      properties:
        live:
          type: array
          items:
            $ref: '#/components/schemas/LiveDeck'
    LiveLyrics:
      oneOf:
      - type: object
        description: Nothing is playing — a state, not a failure.
        required:
        - playing
        properties:
          playing:
            type: boolean
            description: Always `false`.
      - allOf:
        - $ref: '#/components/schemas/LyricDocument'
        - type: object
          required:
          - playing
          - position
          - position_known
          - paused
          properties:
            playing:
              type: boolean
              description: Always `true`.
            position:
              type: integer
              format: int64
              description: Seconds into the track.
              minimum: 0
            position_known:
              type: boolean
              description: |-
                Whether `position` is a measurement. Do not drive a highlight from a
                guess.
            paused:
              type: boolean
            duration:
              type:
              - integer
              - 'null'
              format: int64
              description: Seconds.
              minimum: 0
        description: The lyric document for what is playing, plus the playhead.
      description: The words for whatever is on the deck, or that nothing is.
    LogFile:
      type: object
      required:
      - name
      - bytes
      properties:
        name:
          type: string
          description: The only kind of value `file` accepts elsewhere.
        bytes:
          type: integer
          format: int64
          minimum: 0
    LogFiles:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/LogFile'
          description: Newest first.
    LogLevel:
      type: object
      description: The live tracing filter.
      required:
      - current_level
      properties:
        current_level:
          type: string
    LogLevelRequest:
      type: object
      required:
      - level
      properties:
        level:
          type: string
          description: An `EnvFilter` directive — a level, or per-target levels.
          example: tapedeck=debug,info
    LogTail:
      type: object
      description: The newest matching lines of one log file.
      required:
      - file
      - files
      - matched
      - shown
      - truncated
      - lines
      properties:
        file:
          type: string
        files:
          type: array
          items:
            type: string
          description: Every file there is, newest first.
        matched:
          type: integer
          description: How many lines the filter found…
          minimum: 0
        shown:
          type: integer
          description: …against how many are shown.
          minimum: 0
        truncated:
          type: boolean
        lines:
          type: array
          items:
            type: string
          description: Oldest first.
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    LoveKeys:
      type: object
      description: Every loved entity as its identity key.
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: string
          description: |-
            `kind|artist|name`, lowercased — `recording|aphex twin|xtal`. Derive a
            row's key the same way and match locally.
    LoveRequest:
      allOf:
      - $ref: '#/components/schemas/TargetSpec'
      - type: object
        properties:
          loved:
            type:
            - boolean
            - 'null'
            description: Omitted means "love it"; pass `false` to un-love.
      description: |-
        What to love, named the ways `TargetSpec` allows — a track, an album or an
        artist; not a listen, a period or a line.
    LoveSet:
      type: object
      description: A love, set or withdrawn.
      required:
      - loved
      properties:
        entity:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Entity'
        loved:
          type: boolean
    LovedEntityRef:
      type: object
      required:
      - id
      - kind
      - name
      - artist_name
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: '`recording`, `release` or `artist`.'
        name:
          type: string
        artist_name:
          type: string
        mbid:
          type:
          - string
          - 'null'
    LovedRow:
      type: object
      description: A loved entity, and what your history says about it.
      required:
      - entity
      - loved_at
      - plays
      properties:
        entity:
          $ref: '#/components/schemas/LovedEntityRef'
        loved_at:
          type: integer
          format: int64
          description: Unix seconds.
        plays:
          type: integer
          format: int64
        last_played:
          type:
          - integer
          - 'null'
          format: int64
        album:
          type:
          - string
          - 'null'
          description: Absent for an artist.
        artwork_url:
          type:
          - string
          - 'null'
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
        note_id:
          type:
          - integer
          - 'null'
          format: int64
        note_excerpt:
          type:
          - string
          - 'null'
    Loves:
      type: object
      description: The Loved page.
      required:
      - loves
      properties:
        loves:
          type: array
          items:
            $ref: '#/components/schemas/LovedRow'
    LovesPulled:
      type: object
      description: Loves fetched from every connected service.
      required:
      - loved
      - services
      properties:
        loved:
          type: integer
          description: Newly stored, across every service.
          minimum: 0
        services:
          type: array
          items:
            $ref: '#/components/schemas/PullReport'
          description: One entry per connected service; one failing does not stop the other.
    LoyalArtist:
      type: object
      required:
      - artist
      - plays
      - loyalty_score
      properties:
        artist:
          type: string
        plays:
          type: integer
          format: int64
        loyalty_score:
          type: number
          format: double
    LyricDocument:
      allOf:
      - $ref: '#/components/schemas/Words'
      - type: object
        required:
        - artist
        - title
        - plays
        - tracklist
        properties:
          artist:
            type: string
          title:
            type: string
          album:
            type:
            - string
            - 'null'
            description: |-
              The record the tracklist is drawn from — as asked for, or else the one
              the track is filed under in your history.
          plays:
            type: integer
            format: int64
            description: Your plays of this track.
          tracklist:
            type: array
            items:
              $ref: '#/components/schemas/TracklistEntry'
            description: The record's tracks, empty with no record.
      description: |-
        Everything the lyric reader draws for one track: the words, and the
        furniture round them.
    LyricKeys:
      type: object
      description: Every track this instance holds words for.
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: string
          description: |-
            `<artist key>|<title>` for each: the artist folded the way artist
            pages fold names (case, accents, spacing), the title trimmed and
            lowercased. Derive a row's key the same way.
    LyricMatch:
      type: object
      description: One LRCLIB record for the track.
      required:
      - synced
      - lines
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int64
          description: LRCLIB's id.
        title:
          type:
          - string
          - 'null'
        artist:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds.
        synced:
          type: boolean
          description: Timed — a timed lyric follows the deck, a plain one cannot.
        lines:
          type: integer
          description: Lines, blanks included.
          minimum: 0
        plain:
          type:
          - string
          - 'null'
        synced_text:
          type:
          - string
          - 'null'
    LyricMatches:
      type: object
      description: The records LRCLIB holds for a track.
      required:
      - matches
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/LyricMatch'
        unavailable:
          type:
          - boolean
          - 'null'
          description: |-
            Present, and `true`, when LRCLIB could not be asked. `matches` is then
            empty and says nothing about the track.
        why:
          type:
          - string
          - 'null'
          description: Why, when `unavailable`.
    LyricsCorrected:
      type: object
      description: A hand correction, stored.
      required:
      - status
      - lines_before
      - lines_after
      - renumbered
      properties:
        status:
          type: string
          description: Always `saved`.
        language:
          type:
          - string
          - 'null'
        lines_before:
          type: integer
          minimum: 0
        lines_after:
          type: integer
          minimum: 0
        renumbered:
          type: boolean
          description: |-
            The line count changed, so every `[[line:…]]` quote past the change now
            points at different words. Say so.
    LyricsCoverage:
      type: object
      description: |-
        How far the lyric language pass has got. The three cache counts are absent
        when the cache cannot be read — unknown, not zero.
      required:
      - available
      - unresolved
      properties:
        available:
          type: boolean
        why:
          type:
          - string
          - 'null'
          description: Why not, when not `available`.
        asked:
          type:
          - integer
          - 'null'
          format: int64
          description: Tracks LRCLIB has been asked about.
        with_lyrics:
          type:
          - integer
          - 'null'
          format: int64
        instrumental:
          type:
          - integer
          - 'null'
          format: int64
          description: A real answer — a track with no words has no language.
        unresolved:
          type: integer
          format: int64
          description: Tracks still filed under `English/Other` that the pass could try.
    MapBackdrop:
      type: object
      required:
      - width
      - height
      - points
      properties:
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        points:
          type: array
          items:
            type: array
            items:
              oneOf:
              - type: string
              - type: number
            maxItems: 4
            minItems: 4
          description: '`[name, x, y, colour]` per genre — positional to keep ~6,300 rows small.'
    MatchSet:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`matched` or `cleared`.'
    MbidCoverage:
      type: object
      description: Recording-level MusicBrainz coverage of your history.
      required:
      - total
      - resolved
      - pending
      - unmatched_tracks
      properties:
        total:
          type: integer
          format: int64
          description: Listens.
        resolved:
          type: integer
          format: int64
          description: Listens carrying a recording MBID.
        pending:
          type: integer
          format: int64
        unmatched_tracks:
          type: integer
          format: int64
          description: |-
            Distinct tracks MusicBrainz was asked about and had nothing for — real
            listening simply not in their database. Without it a progress bar that
            stops short reads as a stall rather than as an answer.
    MbidMapping:
      type: object
      description: |-
        ListenBrainz's read-side MBID block, accepted as a fallback for the
        fields in `additional_info`.
      properties:
        recording_mbid:
          type:
          - string
          - 'null'
        release_mbid:
          type:
          - string
          - 'null'
        artist_mbids:
          type:
          - array
          - 'null'
          items:
            type: string
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Cover Art Archive id.
        caa_release_mbid:
          type:
          - string
          - 'null'
    McpAudit:
      type: object
      required:
      - calls
      properties:
        calls:
          type: array
          items:
            $ref: '#/components/schemas/McpAuditCall'
          description: Newest first.
    McpAuditCall:
      type: object
      required:
      - id
      - at
      - method
      - ok
      properties:
        id:
          type: integer
          format: int64
        at:
          type: integer
          format: int64
        method:
          type: string
          description: The JSON-RPC method — `tools/call`, `resources/read`.
        tool:
          type:
          - string
          - 'null'
          description: The tool, resource URI or prompt name.
        args:
          type:
          - string
          - 'null'
          description: |-
            The arguments, truncated to 500 characters. A record of what was
            asked, not a copy of it.
        ok:
          type: boolean
        rows_returned:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            How much data left the building. Null where the answer was not a list.
            A tool that answered with 12 rows and one that answered with 20,000
            are different events however identical the call looks.
        ms:
          type:
          - integer
          - 'null'
          format: int64
        connection_name:
          type:
          - string
          - 'null'
    McpConnection:
      type: object
      description: |-
        A standing grant to an AI assistant — deliberately not an API token, so
        it can be granted, read and revoked on its own.
      required:
      - id
      - name
      - scopes
      - created_at
      - calls
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        scopes:
          type: string
          description: |-
            Space-separated. **No wildcard** — a consent screen names what it is
            granting, and "everything, including whatever is added later" is not
            something a person can consent to.
          example: listening:read library:read
        client_id:
          type:
          - string
          - 'null'
          description: Set when the grant came through OAuth.
        created_at:
          type: integer
          format: int64
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Null for a connection created by hand — those do not expire.
        calls:
          type: integer
          format: int64
          description: How many calls it has made, ever.
    McpConnectionCreated:
      type: object
      description: A new connection and its credential.
      required:
      - id
      - name
      - scopes
      - token
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        scopes:
          type: string
          description: What was actually granted, unrecognised grants dropped.
        token:
          type: string
          description: Shown once and never again — it is stored only as a hash.
    McpConnections:
      type: object
      description: Your assistant connections, and what one can be granted.
      required:
      - connections
      - endpoint
      - scopes
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/McpConnection'
        endpoint:
          type: string
          format: uri
          description: The address to paste into a client.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/McpScope'
    McpRevoked:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: boolean
    McpScope:
      type: object
      required:
      - scope
      - description
      properties:
        scope:
          type: string
        description:
          type: string
    MediaBrowserAccount:
      type: object
      description: |-
        An account on the server. Sessions are matched on `name`, which is what
        `SessionInfo.UserName` carries.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    MembersAdded:
      type: object
      required:
      - added
      properties:
        added:
          type: integer
          format: int64
    MergeRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: Two or more session ids. The earliest survives.
    Merged:
      oneOf:
      - $ref: '#/components/schemas/OneSession'
      - $ref: '#/components/schemas/MergedId'
      description: 'A merge''s outcome: the surviving session, or just its id.'
    MergedId:
      type: object
      description: |-
        The fallback answer to a merge whose surviving session could not be read
        back.
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          description: The surviving session.
    Miss:
      oneOf:
      - type: object
        description: The search itself failed — the server is unwell, not unhelpful.
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - search_failed
      - type: object
        description: The server answered, with nothing.
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - no_candidates
      - type: object
        description: It offered tracks, none by this artist.
        required:
        - offered
        - reason
        properties:
          offered:
            type: array
            items:
              $ref: '#/components/schemas/Offered'
          reason:
            type: string
            enum:
            - artist_mismatch
      - type: object
        description: The artist agreed and no title did.
        required:
        - offered
        - reason
        properties:
          offered:
            type: array
            items:
              $ref: '#/components/schemas/Offered'
          reason:
            type: string
            enum:
            - title_mismatch
      description: |-
        Why a track did not land — which distinguishes a search problem from a
        matching one. A mismatch carries what the server actually offered, at most
        five, which is the fact that settles it at a glance.
    MissingTrack:
      allOf:
      - $ref: '#/components/schemas/Miss'
      - type: object
        required:
        - title
        - artist
        properties:
          title:
            type: string
          artist:
            type: string
          album:
            type:
            - string
            - 'null'
    MixedAlbum:
      type: object
      description: An album whose listens disagree about which release they belong to.
      required:
      - artist
      - album
      - plays
      - variants
      - winner_plays
      - untagged
      - candidates
      properties:
        artist:
          type: string
        album:
          type: string
        plays:
          type: integer
          format: int64
        variants:
          type: integer
          format: int64
          description: How many distinct release MBIDs the listens carry. Always > 1 here.
        winner:
          type:
          - string
          - 'null'
          description: The MBID the most listens agree on — the *proposed* fix, not a verdict.
        winner_plays:
          type: integer
          format: int64
        untagged:
          type: integer
          format: int64
          description: |-
            Listens of this album carrying no release MBID at all. Unifying stamps
            these with the chosen release too, so they're reported separately.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseCandidate'
          description: |-
            Every release the listens claim, most-claimed first, so the operator can
            pick a different one than the plurality.
    MostSkipped:
      type: object
      required:
      - title
      - artist
      - skips
      properties:
        title:
          type: string
        artist:
          type: string
        skips:
          type: integer
          format: int64
    MyGenre:
      type: object
      required:
      - name
      - plays
      - x
      - y
      - color
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        color:
          type: string
    NeighbourGenre:
      type: object
      description: |-
        A genre bordering your listening. **`your_artists` and `exemplar_artists`
        are never both populated**, so nothing can present an Every Noise exemplar
        as something the listener owns.
      required:
      - name
      - x
      - y
      - color
      - borders
      - affinity
      - your_plays
      - your_artists
      - exemplar_artists
      properties:
        name:
          type: string
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        color:
          type: string
        borders:
          type: integer
          description: How many of your top genres border it.
          minimum: 0
        affinity:
          type: number
          format: double
          description: |-
            `plays / sqrt(rank + 1)`, summed: weighted by your play counts and
            discounted by Every Noise's own neighbour rank.
        your_plays:
          type: integer
          format: int64
        your_artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistPlays'
          description: From **your own history**. Empty is what puts a genre in `unexplored`.
        exemplar_artists:
          type: array
          items:
            type: string
          description: |-
            **Every Noise's exemplars — not your music.** Set only where
            `your_artists` is empty. Requires a tier-2 scrape; empty otherwise.
    NewCrateEntry:
      type: object
      description: Something to put in the crate.
      required:
      - kind
      - artist
      - because
      properties:
        kind:
          type: string
          description: '`artist`, `album` or `track`.'
          example: album
        artist:
          type: string
        name:
          type:
          - string
          - 'null'
          description: |-
            Album or track title. Omitted for an artist, whose name is already in
            `artist`.
        mbid:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
          description: Why you would like it, in the suggester's words.
        because:
          type: string
          description: |-
            **Required.** What in *your own* listening prompted the suggestion. A
            recommendation with no grounding in the history is free association,
            and is refused.
    NewDub:
      type: object
      description: A record passed to somebody you are patched with, filed in their crate.
      required:
      - to
      - kind
      - artist
      - because
      properties:
        to:
          type: string
          description: Their username.
        kind:
          type: string
          description: '`artist`, `album` or `track`.'
        artist:
          type: string
        name:
          type:
          - string
          - 'null'
          description: The album or track title.
        mbid:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        because:
          type: string
          description: '**Required** — what in *their* listening prompted this.'
    NewMcpConnection:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Up to 60 characters. Defaults to "AI assistant".
          example: Claude Desktop
        scopes:
          type:
          - string
          - 'null'
          description: |-
            Space- or comma-separated grants. Anything unrecognised is dropped
            rather than stored. Omitted means the default read grants.
          example: listening:read library:read
    NewShelfItem:
      type: object
      required:
      - kind
      - artist
      - title
      properties:
        kind:
          type: string
          description: |-
            `vinyl`, `cassette`, `cd` or `sacd`. A **disc has no sides**: its
            tracklist is one numbered unit per disc.
        artist:
          type: string
        title:
          type: string
        year:
          type:
          - integer
          - 'null'
          format: int64
        mbid_release:
          type:
          - string
          - 'null'
        discogs_id:
          type:
          - string
          - 'null'
        barcode:
          type:
          - string
          - 'null'
        catalog_number:
          type:
          - string
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalTrack'
        notes:
          type:
          - string
          - 'null'
        format:
          type:
          - string
          - 'null'
          description: |-
            The medium the *release* declares — `"CD"`, `"12\" Vinyl"`, `"Hybrid
            SACD"` — as the lookup returned it. When present it **overrides `kind`**,
            because `kind` is what was picked before anyone looked at the record and
            this is what the record says it is.
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When you bought it, unix seconds. Optional — most of a shelf is
            catalogued long after the fact and guessing would be worse than blank.
        acquired_as:
          type:
          - string
          - 'null'
          description: |-
            How it came to be yours — `new`, `used`, `gift` or `inherited`.
            Optional, and absent means nobody said: a shelf catalogued before this
            existed must not be retroactively claimed as bought new.
        acquired_from:
          type:
          - string
          - 'null'
          description: |-
            Where from — the shop, the record fair, the person who gave it to you.
            Free text, because that is the half that makes a thrift find a story
            rather than a flag.
        fetch_images:
          type: boolean
          description: |-
            Pull the sleeve, labels and booklet from the Cover Art Archive as part
            of adding it. On by default. A failure does **not** fail the add, and
            it does nothing without `mbid_release`.
          default: true
    NewSpool:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        with:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Usernames to invite.
        guests:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Names of people in the room with no account on this instance.
    Note:
      type: object
      description: |-
        A liner note, with everything a screen needs: what it hangs off, the
        rendered body, whether the subject is loved, and how many earlier versions
        exist. Exactly one of `entity`, `listen`, `period` and `line` is set.
      required:
      - id
      - body_md
      - excerpt
      - visibility
      - created_at
      - updated_at
      - lines_quoted
      - pins
      - loved
      - revisions
      properties:
        id:
          type: integer
          format: int64
        body_md:
          type: string
          description: Markdown, with `[[kind:name]]` shortcodes.
        excerpt:
          type: string
          description: The first 140 characters, as text.
        visibility:
          type: string
          description: '`private` or another of the allowed visibilities.'
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        entity:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Entity'
        listen:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NoteListen'
        period:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NotePeriod'
        line:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LinePos'
            description: 'Set on a pin: the line it hangs off.'
        lines_quoted:
          type: integer
          description: How many distinct lyric lines the body quotes.
          minimum: 0
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PinFootnote'
          description: |-
            The pins that roll up under this note as footnotes, in the order the
            record plays. Empty in a listing.
        loved:
          type: boolean
        revisions:
          type: integer
          description: Earlier versions kept.
          minimum: 0
        body_html:
          type:
          - string
          - 'null'
          description: |-
            The rendered, sanitised body with every shortcode resolved. Absent in a
            listing.
    NoteFor:
      type: object
      description: |-
        The note for a target, or `null` — "no note here" is the normal case, and
        the caller still needs the resolved target to open an editor on it.
      required:
      - target
      - loved
      properties:
        note:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Note'
        target:
          $ref: '#/components/schemas/TargetView'
        loved:
          type: boolean
    NoteList:
      type: object
      description: Your notes, and how many there are in all.
      required:
      - notes
      - total
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          description: Without `body_html` or `pins`.
        total:
          type: integer
          description: Every note you have, filtered or not — "12 of 240".
          minimum: 0
    NoteListen:
      type: object
      description: A listen a note hangs off.
      required:
      - id
      - title
      - artist
      - timestamp
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        timestamp:
          type: integer
          format: int64
    NotePeriod:
      type: object
      description: A period a note hangs off.
      required:
      - unit
      - key
      properties:
        unit:
          type: string
          description: '`week`, `month` or `year`.'
        key:
          type: string
          description: '`2026-W32`, `2026-08`, `2026`.'
    NowPlaying:
      type: object
      description: |-
        Never persisted. Held in memory only, so a restart correctly shows an empty
        deck until a source reports again.
      required:
      - playing
      properties:
        playing:
          type: boolean
        position:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Seconds into the track, extrapolated to now. Absent when nothing is
            playing. Read `track.position_known` before presenting this as a
            readout — for a source with no playhead it is the server's own
            wall-clock arithmetic, not a measurement.
          minimum: 0
        track:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NowPlayingTrack'
            description: Absent when nothing is playing.
    NowPlayingTrack:
      type: object
      description: |-
        What is on the deck. **Not a `Listen`** — nothing here is persisted, so
        there is no id, no timestamp, no status and no `source_id`. It carries the
        quality fields a source could report plus the playhead.
      required:
      - title
      - artist
      - progress
      - position_known
      - paused
      - updated_at
      - source
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Track length in seconds, when the source reports one.
          minimum: 0
        progress:
          type: integer
          format: int64
          description: |-
            Seconds in **as of `updated_at`**. Extrapolate from there rather than
            expecting a tick per second — but see `position_known` first, and stop
            extrapolating when `paused`.
          minimum: 0
        position_known:
          type: boolean
          description: |-
            **False when `progress` is the server's own wall-clock arithmetic rather
            than a reported playhead.** A ListenBrainz `playing_now` has no position
            field in the format and Subsonic answers `minutesAgo`, so for those there
            is nothing to report and the number is a guess. Draw it as one. Plex,
            Jellyfin, Emby, Roon and the shelf report a real playhead, and so does
            any client sending `tapedeck_playback`.
        paused:
          type: boolean
          description: |-
            Only a pushing client can know this — a poll that stops arriving is
            indistinguishable from a client that crashed — so it is false for every
            polled source. A paused entry holds its position rather than counting
            forward, and expires after ten minutes of silence.
        updated_at:
          type: integer
          format: int64
          description: Unix seconds when this was last reported.
        source:
          type: string
          description: '`Plex`, `Roon`, `ingest`, `physical`…'
        listening_context:
          type:
          - string
          - 'null'
        chain_name:
          type:
          - string
          - 'null'
          description: |-
            The signal chain, **only where it was a deliberate statement** — an
            ingest submission's resolved chain, or the turntable a pressing on the
            shelf remembers. A polled source falls back to its device's default and
            leaves this null rather than naming a chain nobody chose.
        format_type:
          type:
          - string
          - 'null'
        codec:
          type:
          - string
          - 'null'
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
        dsd_multiplier:
          type:
          - integer
          - 'null'
          format: int32
        dsd_to_pcm_converted:
          type:
          - boolean
          - 'null'
        delivery_codec:
          type:
          - string
          - 'null'
        is_lossless:
          type:
          - boolean
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
          description: |-
            A cover for what is on the deck, once something has asked for one — it
            is resolved lazily, at most once per track, by the public widget.
    OAuthApproval:
      type: object
      description: The authorization request being approved, and what the person ticked.
      required:
      - client_id
      - redirect_uri
      - code_challenge
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
        code_challenge:
          type: string
        scope:
          type:
          - string
          - 'null'
          description: |-
            What the person granted — which may be more or less than the client
            asked for.
        state:
          type:
          - string
          - 'null'
        resource:
          type:
          - string
          - 'null'
    OAuthError:
      type: object
      description: An OAuth error, as RFC 6749 shapes it.
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: |-
            `invalid_request`, `invalid_client`, `invalid_grant`, `invalid_target`,
            `invalid_redirect_uri`, `unsupported_grant_type`, `server_error`.
        error_description:
          type: string
    OAuthTokenRequest:
      type: object
      description: Form-encoded, as the RFC requires.
      required:
      - grant_type
      properties:
        grant_type:
          type: string
          description: '`authorization_code` or `refresh_token`.'
        code:
          type:
          - string
          - 'null'
        redirect_uri:
          type:
          - string
          - 'null'
        client_id:
          type:
          - string
          - 'null'
        code_verifier:
          type:
          - string
          - 'null'
          description: 43–128 characters, per RFC 7636.
        refresh_token:
          type:
          - string
          - 'null'
        resource:
          type:
          - string
          - 'null'
    Offered:
      type: object
      description: |-
        One track the far end offered. Carries its id, so a candidate can be
        **chosen** rather than only read: POST it to `/api/v1/playlist-matches`
        and every later push of that track uses it.
      required:
      - id
      - label
      properties:
        id:
          type: string
          description: |-
            The far end's own id, which is what `POST /api/v1/playlist-matches`
            takes. Opaque here; it only ever goes back to the server that made it.
        label:
          type: string
          description: |-
            What to show. The artist for an artist mismatch, the title for a title
            mismatch — whichever half is the thing that disagreed.
    Ok:
      type: object
      description: |-
        An acknowledgement with nothing else to report.

        `status` names what happened — `ok`, `updated`, `deleted`, `cleared`,
        `started` and so on; the operation says which it sends. A client needs only
        the HTTP status to know it worked.
      required:
      - status
      properties:
        status:
          type: string
    OneSession:
      type: object
      description: A session, as it stands after an edit.
      required:
      - session
      properties:
        session:
          $ref: '#/components/schemas/SessionRow'
    OpsHealth:
      type: object
      description: Engine, sink and source health. Times are Unix seconds.
      required:
      - version
      - uptime_secs
      - tick
      - sinks
      - sources
      - logs_enabled
      properties:
        version:
          type: string
        uptime_secs:
          type: integer
          format: int64
          minimum: 0
        tick:
          $ref: '#/components/schemas/TickView'
        sinks:
          type: array
          items:
            $ref: '#/components/schemas/SinkView'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceHealth'
          description: Every user's sources — instance-wide, with no credentials or URLs.
        logs_enabled:
          type: boolean
          description: File logging is on, so `/admin/logs` has something to show.
    PairingApproved:
      type: object
      description: The token, collected.
      required:
      - status
      - token
      properties:
        status:
          type: string
          description: Always `approved`.
        token:
          type: string
          description: |-
            The new API token. **In this body and nowhere else** — it is deleted
            from the request the moment it is collected.
        user_name:
          type:
          - string
          - 'null'
          description: Whose token it is — the account that approved the request.
    PairingPending:
      type: object
      description: |-
        Not collected, and why — RFC 8628's error vocabulary, in Tapedeck's error
        shape.
      required:
      - code
      - error
      - error_description
      properties:
        code:
          type: integer
          format: int32
          description: Always 400.
          minimum: 0
        error:
          type: string
          description: |-
            `authorization_pending` — nobody has approved it yet, keep polling —
            or `expired_token`, which is also what an unknown device code gets.
          pattern: ^(authorization_pending|expired_token)$
        error_description:
          type: string
          description: Human-readable.
        interval:
          type:
          - integer
          - 'null'
          format: int64
          description: Minimum seconds before the next poll. Only on `authorization_pending`.
    PairingRequest:
      type: object
      description: A pending pairing, for the approval screen.
      required:
      - client_name
      - scopes
      - can_read
      - can_write
      - approved
      properties:
        client_name:
          type: string
          description: What the client called itself.
        scopes:
          type: string
          description: What approving grants, space-separated.
        can_read:
          type: boolean
          description: Whether approving grants `read`.
        can_write:
          type: boolean
          description: Whether approving grants `write`.
        approved:
          type: boolean
    PairingStarted:
      type: object
      description: A pairing, begun.
      required:
      - device_code
      - user_code
      - verification_uri
      - expires_in
      - interval
      properties:
        device_code:
          type: string
          description: Poll `/1/pair/poll` with this. Keep it secret — it collects the token.
        user_code:
          type: string
          description: |-
            The short code for the human to type into Settings → API Tokens, as
            `XXXX-XXXX`.
        verification_uri:
          type: string
          description: |-
            Where the human goes to approve it, as far as the server can tell from
            the request. A bare path when it cannot.
        expires_in:
          type: integer
          format: int64
          description: Seconds until the request lapses. Five minutes.
        interval:
          type: integer
          format: int64
          description: Minimum seconds between polls.
    PastImport:
      type: object
      required:
      - source
      - date
      - count
      - status
      properties:
        source:
          type: string
          description: '`listenbrainz`, `lastfm` or `file`.'
        date:
          type: integer
          format: int64
          description: Started, Unix seconds.
        count:
          type: integer
          format: int64
          description: New rows actually inserted.
        status:
          type: string
          description: '`done`, `error`, or `interrupted` — a job the server restarted under.'
    PatchAnswer:
      type: object
      description: A yes or a no, said explicitly.
      required:
      - accept
      properties:
        accept:
          type: boolean
          description: '**Required** — an absent key is a 400, never a default.'
    PatchArtist:
      type: object
      description: An artist seen across the decks a user is patched into.
      required:
      - name
      - plays
      - decks
      - mine
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
        decks:
          type: integer
          format: int64
          description: How many decks play them.
        who:
          type:
          - string
          - 'null'
          description: Comma-joined usernames, for the little avatar stack on the card.
        last_played:
          type:
          - integer
          - 'null'
          format: int64
        first_played:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When this artist first appeared in the shared history — what "newest
            arrival" sorts on.
        mine:
          type: integer
          format: int64
          description: |-
            **The reader's own plays of this artist — the overlap.** Shown as
            *which artists* rather than as a similarity score: a score invites a
            ranking of people, which is not what this is for.
        genre:
          type:
          - string
          - 'null'
          description: |-
            The artist's own tags. Absent for anyone MusicBrainz has not tagged,
            which is a normal state.
    PatchArtists:
      type: object
      required:
      - artists
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/PatchArtist'
        days:
          type:
          - integer
          - 'null'
          format: int64
          description: The window asked for; null is all time.
    PatchDecks:
      type: object
      description: Everyone on the instance, and where you stand with them.
      required:
      - decks
      - following
      - followers
      properties:
        decks:
          type: array
          items:
            $ref: '#/components/schemas/PatchPeer'
          description: Every deck you could patch into.
        following:
          type: array
          items:
            $ref: '#/components/schemas/PatchPeer'
          description: Decks you patched into, or asked to.
        followers:
          type: array
          items:
            $ref: '#/components/schemas/PatchPeer'
          description: |-
            Everything pointed at you, pending and settled — the inbox filters to
            `pending` itself.
    PatchOps:
      type: object
      description: The federation counters, and the vocabulary this instance speaks.
      required:
      - ops
      - vocabulary
      - delivery
      properties:
        ops:
          $ref: '#/components/schemas/FederationOps'
        vocabulary:
          $ref: '#/components/schemas/Vocabulary'
        delivery:
          type: boolean
          description: Whether outbound delivery is on. Not yet.
    PatchPeer:
      type: object
      description: |-
        The other end of a patch — or a deck that could become one.

        One type for three lists (out, in, and everyone patchable) so the three
        cannot drift into describing a person differently. `uuid` and `state` are
        null for a deck nobody has asked about yet, which is what tells "not
        patched" apart from "asked and waiting".
      required:
      - user_id
      - username
      - shared_chains
      - shares_everything
      properties:
        uuid:
          type:
          - string
          - 'null'
          description: The patch's own id, `None` when no edge exists yet.
        state:
          type:
          - string
          - 'null'
          description: pending | accepted | rejected, or `None` for no edge.
        created_at:
          type:
          - integer
          - 'null'
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        shared_chains:
          type: integer
          format: int64
          description: |-
            How many chains this person publishes. **Zero is no longer the
            interesting case on its own** — read it with `shares_everything`, which
            is the gate. A deck sharing no chains and open to patched decks shows
            everything it plays; one sharing no chains and *closed* is the empty
            patch that needs saying on screen rather than looking broken.
        shares_everything:
          type: boolean
          description: |-
            Whether they let decks they have patched in see **everything** they
            play, not only listens through a chain they publish.

            Carried so the screen can say what a patch will actually show, which it
            could not do from `shared_chains` alone — and it leaks nothing: this
            only ever describes the far end of an *edge that exists*, and whoever
            can read it can already read the listens it is about.
    PatchRequest:
      type: object
      required:
      - username
      properties:
        username:
          type: string
          description: The deck to patch into, by username.
    PatchRequested:
      type: object
      required:
      - uuid
      - state
      properties:
        uuid:
          type: string
        state:
          type: string
          description: |-
            As it now stands: `pending`, or `accepted` for a patch that already
            was.
    PatchSaved:
      type: object
      required:
      - saved
      properties:
        saved:
          type: boolean
    PatchSettled:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          description: '`accepted` or `rejected`.'
    Period:
      type: object
      description: One week, month or year.
      required:
      - key
      - label
      - start
      - end
      - plays
      - hours
      - avg_daily
      - artists
      - albums
      - tracks
      - new_artists
      - clock
      - sub
      - sub_labels
      - genres
      - genre_bands
      - rank
      - rank_of
      - on_repeat
      - shelf
      - gear
      - company
      - fingerprint
      - milestones
      properties:
        key:
          type: string
          description: '`2026-W31`, `2026-08`, `2026`.'
          example: 2026-08
        label:
          type: string
          example: August 2026
        start:
          type: integer
          format: int64
          description: Unix seconds — the first listen in the period.
        end:
          type: integer
          format: int64
          description: Unix seconds — the last listen in the period.
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
        avg_daily:
          type: integer
          format: int64
          description: |-
            Plays per **calendar** day — a finished period by its full length, one
            still running by the days it has actually had.
        artists:
          type: integer
          minimum: 0
        albums:
          type: integer
          minimum: 0
        tracks:
          type: integer
          minimum: 0
        new_artists:
          type: integer
          description: Artists with no earlier listen anywhere in the history.
          minimum: 0
        top_artist:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PeriodArtist'
            description: Never "Various Artists", which is a filing convention, not an artist.
        top_album:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PeriodAlbum'
        top_track:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PeriodTrack'
        clock:
          type: array
          items:
            type: integer
            format: int64
          description: 24 counts, local hours.
        sub:
          type: array
          items:
            type: integer
            format: int64
          description: |-
            One level finer than the period — days across a week, weeks across a
            month, months across a year.
        sub_labels:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreShare'
          description: The six biggest genres. Shares of **tag mentions**, not of listens.
        genre_bands:
          $ref: '#/components/schemas/GenreBands'
        rank:
          type: integer
          description: |-
            Where this period sits among *your own* periods by plays, 1 being the
            busiest. This is what fills the slot the design gave to a cross-user
            percentile — there is no such thing here: it needs other people's
            listening, and on a private instance it would leak how much the rest of
            the household plays.
          minimum: 0
        rank_of:
          type: integer
          description: How many periods `rank` is out of.
          minimum: 0
        colour:
          type:
          - string
          - 'null'
          description: |-
            Play-weighted blend of the period's genre colours, in linear light.
            Null until the genre map is fetched.
        on_repeat:
          type: array
          items:
            $ref: '#/components/schemas/PeriodTrack'
          description: The heaviest single days of single tracks — three plays or more.
        crush:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Crush'
            description: |-
              Most-played artist never played before, with at least five plays.
              Null for the oldest period, where every artist is new by construction
              and it would just be the top artist relabelled.
        shelf:
          $ref: '#/components/schemas/ShelfSummary'
          description: Sides played off the shelf.
        top_chain:
          type:
          - string
          - 'null'
          description: The chain most listens went through.
        gear:
          $ref: '#/components/schemas/PeriodGear'
        company:
          $ref: '#/components/schemas/PeriodCompany'
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        milestones:
          type: array
          items:
            type: string
          description: Sentences worth a line of their own — "your 10,000th listen".
        prev:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PrevPeriod'
            description: The period before, for deltas. Null for the oldest.
    PeriodAlbum:
      type: object
      required:
      - name
      - artist
      - plays
      properties:
        name:
          type: string
        artist:
          type: string
        plays:
          type: integer
          format: int64
    PeriodArtist:
      type: object
      required:
      - name
      - plays
      - hours
      properties:
        name:
          type: string
          description: The latest spelling actually submitted.
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
        landscape_url:
          type:
          - string
          - 'null'
          description: |-
            A wide image, when you chose one for this artist. Absent otherwise —
            nothing Tapedeck can reach supplies one.
    PeriodCompany:
      type: object
      description: |-
        Listens **marked** as heard with somebody. `company` is null on
        everything nobody has tagged, so `of_plays` travels as the denominator —
        never present a bare share, and never read the complement as "alone".
      required:
      - marked_plays
      - marked_hours
      - of_plays
      - people
      properties:
        marked_plays:
          type: integer
          format: int64
        marked_hours:
          type: number
          format: double
        of_plays:
          type: integer
          format: int64
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
          description: The eight people heard with most.
    PeriodGear:
      type: object
      description: |-
        What the period was listened *through*. `unattributed` and `no_duration`
        are stated rather than folded away: on most histories the first is nearly
        everything, and the hours are a floor without the second.
      required:
      - chains
      - items
      - unattributed
      - no_duration
      properties:
        chains:
          type: array
          items:
            $ref: '#/components/schemas/GearChain'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GearItem'
          description: |-
            The eight pieces of gear with the most hours, each counted once per
            chain even when a chain names it twice.
        unattributed:
          type: integer
          format: int64
          description: Listens with no chain at all.
        no_duration:
          type: integer
          format: int64
          description: Chained listens whose source reported no length.
    PeriodTrack:
      type: object
      required:
      - title
      - artist
      - plays
      properties:
        title:
          type: string
        artist:
          type: string
        plays:
          type: integer
          format: int64
    Person:
      type: object
      required:
      - name
      - plays
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
    Personality:
      type: object
      required:
      - verdict
      - traits
      - loyalty
      - total_plays
      properties:
        verdict:
          type: string
        traits:
          type: array
          items:
            $ref: '#/components/schemas/Trait'
        loyalty:
          type: array
          items:
            $ref: '#/components/schemas/LoyalArtist'
        total_plays:
          type: integer
          minimum: 0
    PhysicalTrack:
      type: object
      description: One track on a physical side.
      required:
      - side
      - position
      - title
      properties:
        side:
          type: string
          description: '"A", "B", "C"… Cassettes have two, a double LP four.'
        position:
          type: integer
          format: int64
          description: Position within the side, from 1.
        title:
          type: string
        artist:
          type:
          - string
          - 'null'
        duration_secs:
          type:
          - integer
          - 'null'
          format: int64
        disc:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which physical disc of the set this track is on, from 1.

            Null means nobody recorded which disc, not disc 1.
    PinFootnote:
      type: object
      description: A pin, as it reads under the note it rolls up into.
      required:
      - note_id
      - line
      - body_md
      - excerpt
      - updated_at
      properties:
        note_id:
          type: integer
          format: int64
        line:
          $ref: '#/components/schemas/LinePos'
        body_md:
          type: string
        excerpt:
          type: string
          description: The first 200 characters, as text.
        updated_at:
          type: integer
          format: int64
    PinnedLine:
      type: object
      required:
      - note_id
      - line
      - excerpt
      - updated_at
      properties:
        note_id:
          type: integer
          format: int64
        line:
          $ref: '#/components/schemas/LinePos'
        excerpt:
          type: string
          description: The first 120 characters, as text.
        updated_at:
          type: integer
          format: int64
    PinnedLines:
      type: object
      description: Every pinned line.
      required:
      - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PinnedLine'
    PlaylistDeleted:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    PlaylistDestination:
      type: object
      required:
      - source_id
      properties:
        source_id:
          type: integer
          format: int64
          description: From `/api/v1/playlist-targets`.
    PlaylistMatch:
      type: object
      description: A track the search got wrong, and which of its candidates it really is.
      required:
      - source_id
      - artist
      - title
      properties:
        source_id:
          type: integer
          format: int64
          description: The target this resolution is for. `-1` is TIDAL.
        artist:
          type: string
        title:
          type: string
        remote_id:
          type:
          - string
          - 'null'
          description: |-
            An `id` from a miss's `offered` list. Required to record a match;
            ignored by the `DELETE`, which forgets the mapping instead.
        remote_label:
          type:
          - string
          - 'null'
          description: |-
            What the far end calls it, so the mapping can be shown back as something
            a person recognises rather than an opaque id.
    PlaylistPush:
      type: object
      required:
      - source_id
      - name
      - tracks
      properties:
        source_id:
          type: integer
          format: int64
          description: From `/api/v1/playlist-targets`.
        name:
          type: string
          description: Trimmed, and truncated to 120 characters.
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistTrack'
          description: In playlist order.
          maxItems: 100
    PlaylistPushed:
      type: object
      description: What was made, and **every track that did not land**, with why.
      required:
      - playlist_id
      - name
      - protocol
      - target
      - requested
      - matched
      - from_cache
      - missing
      - updated_existing
      properties:
        playlist_id:
          type: string
          description: |-
            The server's own id. Empty when a Subsonic server answered `ok`
            without one.
        name:
          type: string
        protocol:
          type: string
        target:
          $ref: '#/components/schemas/PushTarget'
        requested:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        from_cache:
          type: integer
          description: |-
            How many were answered from remembered matches without asking the far
            end. Nearly everything on a re-push.
          minimum: 0
        missing:
          type: array
          items:
            $ref: '#/components/schemas/MissingTrack'
          description: |-
            A partial match is the normal outcome — a listening history is not the
            same set as any one library.
        updated_existing:
          type: boolean
          description: |-
            A playlist of this name was pushed here before and was rewritten in
            place rather than made again.
    PlaylistSaved:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
    PlaylistToSave:
      type: object
      required:
      - name
      - tracks
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SavedPlaylistTrack'
          description: In playlist order. At least one.
    PlaylistTrack:
      type: object
      description: |-
        One track Tapedeck wants on the far end.

        Names only, because names are all the generating queries have. `album` is a
        tiebreaker rather than a requirement: a listen's album is whichever release
        the tagger claimed, which for a compilation track is not the album the
        server files it under.
      required:
      - title
      - artist
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
          description: A tiebreaker between pressings, never a requirement.
        isrc:
          type:
          - string
          - 'null'
          description: |-
            The recording's ISRC. Filled from the history when absent, and where a
            target can look one up no name matching is needed at all.
    PlexAccount:
      type: object
      description: |-
        An account on the Plex server — the server owner plus any managed or shared
        users. `id` is Plex's own account id; sessions are matched on `name`, which
        is what the `User` element on a session carries.
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PollBody:
      type: object
      required:
      - device_code
      properties:
        device_code:
          type: string
    Preferences:
      type: object
      description: Free-form. The keys below are the ones the server reads; any other key is the web UI's own and is stored verbatim.
      properties:
        timezone:
          type: string
          description: An IANA region, e.g. `Europe/Berlin` — never a fixed abbreviation like `CET`. Decides "today", the heatmap and every calendar bucket. UTC when unset.
        week_start:
          type: integer
          description: First day of the week, 0 = Sunday … 6 = Saturday. Monday (1) when unset.
        scrobble_threshold_percent:
          type: number
          description: 'When a listen counts: this share of the track, 5–100. Read the clamped value from `GET /api/v1/scrobble-settings`.'
        scrobble_threshold_secs:
          type: integer
          description: …or this many seconds, whichever comes first, 10–3600.
        rating_scale:
          type: string
          description: The scale `rating_love_threshold` is written on. Set by `POST /api/v1/ratings/apply`.
        rating_love_threshold:
          type: number
          description: The media-server rating at or above which a track counts as loved, on `rating_scale`.
        rating_love_starred:
          type: boolean
          description: Whether a starred (favourited) item counts as loved whatever its rating. True when unset.
        theme:
          type: string
          description: '`light`, `dark` or `system`. The web UI''s.'
      additionalProperties: true
    PresenceSet:
      type: object
      required:
      - offered
      properties:
        offered:
          type: integer
          format: int64
          description: How many plays this has now put in your inbox.
    PressingCandidate:
      type: object
      description: A candidate pressing.
      required:
      - source
      - artist
      - title
      - tracks
      properties:
        source:
          type: string
          description: '`musicbrainz` or `discogs`.'
        artist:
          type: string
        title:
          type: string
        year:
          type:
          - integer
          - 'null'
          format: int64
        country:
          type:
          - string
          - 'null'
        format:
          type:
          - string
          - 'null'
        mbid_release:
          type:
          - string
          - 'null'
        discogs_id:
          type:
          - string
          - 'null'
        barcode:
          type:
          - string
          - 'null'
        catalog_number:
          type:
          - string
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalTrack'
    PressingLookup:
      type: object
      description: Candidate pressings for what you are holding.
      required:
      - candidates
      - discogs_enabled
      - notes
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/PressingCandidate'
          description: |-
            Discogs first when a barcode and a credential are in hand, then
            MusicBrainz.
        discogs_enabled:
          type: boolean
        notes:
          type: array
          items:
            type: string
          description: A provider that failed, and why. The others still answered.
    PrevPeriod:
      type: object
      description: The period before, for deltas.
      required:
      - label
      - plays
      - hours
      - avg_daily
      - artists
      - albums
      - tracks
      - sub
      properties:
        label:
          type: string
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
        avg_daily:
          type: integer
          format: int64
        artists:
          type: integer
          minimum: 0
        albums:
          type: integer
          minimum: 0
        tracks:
          type: integer
          minimum: 0
        sub:
          type: array
          items:
            type: integer
            format: int64
    Preview:
      type: object
      description: A rendered body.
      required:
      - body_html
      properties:
        body_html:
          type: string
    PreviewRequest:
      allOf:
      - $ref: '#/components/schemas/TargetSpec'
      - type: object
        required:
        - body_md
        properties:
          body_md:
            type: string
    Profile:
      type: object
      description: Your own account, as the profile screen shows it.
      required:
      - id
      - username
      - role
      - created_at
      - disabled
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        role:
          type: string
          description: '`admin` or `user`.'
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        bio:
          type:
          - string
          - 'null'
        avatar:
          type:
          - string
          - 'null'
          description: |-
            A URL the browser can load: the external URL you set, or
            `/api/v1/profile/avatar` when a file was uploaded. The path on disk is
            never returned.
        disabled:
          type: boolean
    PromoteVariant:
      type: object
      description: |-
        GET /api/v1/chains/variants — every variant the caller owns.

        Flat rather than nested under each chain: the page needs them keyed by
      properties:
        name:
          type:
          - string
          - 'null'
          description: |-
            What to call the setup the chain is being demoted to. The old base has
            no name of its own — it *was* the chain — so one has to be supplied.
    Promoted:
      type: object
      description: A setup promoted to be the chain.
      required:
      - promoted
      - old_base_variant_id
      properties:
        promoted:
          type: integer
          format: int64
          description: The setup that is now the chain.
        old_base_variant_id:
          type: integer
          format: int64
          description: The variant the old chain became.
    ProtectedResourceMetadata:
      type: object
      description: RFC 9728 protected resource metadata.
      required:
      - resource
      - authorization_servers
      - scopes_supported
      - bearer_methods_supported
      - resource_name
      properties:
        resource:
          type: string
          description: This instance's `/mcp`.
        authorization_servers:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
          description: The minimal grant. More is asked for through a step-up.
        bearer_methods_supported:
          type: array
          items:
            type: string
        resource_name:
          type: string
    PublicNowPlaying:
      type: object
      description: |-
        The public payload. Only `playing`, `user` and `name` are always present;
        `title`/`artist`/`album` appear whenever something is playing, and
        everything below that appears only if its owner opted into it.

        An absent field means "not published" **or** "the source did not know" —
        the two are not distinguished, and a client must not infer either.
      required:
      - playing
      - user
      properties:
        playing:
          type: boolean
        user:
          type: string
          description: The username as asked for.
        name:
          type:
          - string
          - 'null'
          description: Display name, when set.
        title:
          type:
          - string
          - 'null'
        artist:
          type:
          - string
          - 'null'
        album:
          type:
          - string
          - 'null'
          description: Present whenever something is playing; null when the track has no album.
        position:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Opt-in (`position`). Seconds in. Read `position_known` before drawing
            this as a measurement.
          minimum: 0
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Opt-in (`position`). Seconds; null when the source reported no length.
          minimum: 0
        position_known:
          type:
          - boolean
          - 'null'
          description: |-
            Opt-in (`position`). False when the number is the server's own
            wall-clock arithmetic rather than a reported playhead.
        paused:
          type:
          - boolean
          - 'null'
          description: Opt-in (`position`). Only a pushing source can know this.
        quality:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PublicQuality'
            description: |-
              Opt-in (`fidelity`). Every member may be null — most of a history has no
              format at all.
        chain:
          type:
          - string
          - 'null'
          description: |-
            Opt-in (`gear`). The signal chain, and **only where the source actually
            chose one** — an ingest submission or a side off the shelf. A polled
            listen falls through to the device default, the coarsest rung of the
            ladder, and omits this rather than dressing a fallback up as a decision.
        context:
          type:
          - string
          - 'null'
          description: Opt-in (`gear`). The listening context, or the medium for a shelf play.
        artwork:
          type:
          - string
          - 'null'
          description: Opt-in (`artwork`). A cover URL, resolved at most once per track.
    PublicQuality:
      type: object
      properties:
        format:
          type:
          - string
          - 'null'
          description: '`pcm`, `dsd` or `mqa`.'
        codec:
          type:
          - string
          - 'null'
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
        dsd_multiplier:
          type:
          - integer
          - 'null'
          format: int32
        lossless:
          type:
          - boolean
          - 'null'
    PublishRequest:
      type: object
      description: |-
        What a caller may ask for. `enabled` is required: this endpoint decides
        whether a person's listening leaves the instance, and a body that merely
        misspelled the key must not be read as an answer either way. Same reasoning
        as `bulk-chain` and `default_chain_id`, in the one place where guessing
        wrong is published rather than merely wrong.
      required:
      - enabled
      properties:
        enabled:
          type:
          - boolean
          - 'null'
          description: |-
            **Required** — a body that does not say true or false explicitly is a
            400, never read as either.
        fields:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            The extra disclosures to grant: any of `artwork`, `position`,
            `fidelity`, `gear`. Unknown names are dropped rather than rejected, so a
            newer client cannot make an older server fail — it can only fail to
            grant something, which is the safe direction. Absent grants none.
    PublishSwitch:
      type: object
      description: Your own view of your public now-playing setting.
      required:
      - enabled
      - fields
      - known_fields
      - path
      properties:
        enabled:
          type: boolean
        fields:
          type: array
          items:
            type: string
          description: The extra disclosures currently granted, in canonical order.
        known_fields:
          type: array
          items:
            type: string
          description: |-
            Every field this build knows how to publish. Render the toggles from
            this rather than a hardcoded list, so the two cannot drift.
        path:
          type: string
          description: |-
            The public address, e.g. `/public/np/ashwin`. Built server-side so a
            settings screen cannot assemble a different one.
    PullReport:
      type: object
      description: |-
        What one service's pull did. Every field is a count of loves, not of
        requests, so the numbers mean the same thing across services.
      required:
      - service
      - found
      - loved
      - skipped
      properties:
        service:
          type: string
          description: '`listenbrainz` or `lastfm`.'
        found:
          type: integer
          description: Loves the service reported.
          minimum: 0
        loved:
          type: integer
          description: Newly stored — already-loved tracks are not counted twice.
          minimum: 0
        skipped:
          type: integer
          description: Reported by the service but not in this user's history.
          minimum: 0
        error:
          type:
          - string
          - 'null'
    PushTarget:
      type: object
      description: A server this user can push a playlist to.
      required:
      - source_id
      - kind
      - protocol
      - label
      properties:
        source_id:
          type: integer
          format: int64
          description: |-
            What `source_id` takes. `-1` is TIDAL, which is a connection rather
            than a source.
        kind:
          type: string
          description: '`plex`, `jellyfin`, `navidrome` or `tidal`.'
        protocol:
          type: string
          description: '`Plex`, `Jellyfin`, `Subsonic` or `TIDAL`.'
        label:
          type: string
          description: Falls back to the protocol name when the source has none.
        account:
          type:
          - string
          - 'null'
    PushTargets:
      type: object
      required:
      - targets
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/PushTarget'
          description: |-
            Enabled, writable sources, and TIDAL when it is connected. Empty is a
            normal answer.
    RangedStats:
      type: object
      description: |-
        Ranged statistics: totals, top lists (50 rows each), fidelity mix, decades,
        a 7×24 listening heatmap, breadth, genres and languages.
      required:
      - totals
      - top_artists
      - top_albums
      - top_tracks
      - fidelity
      - decades
      - genres
      - languages
      - regions
      - heatmap
      properties:
        totals:
          $ref: '#/components/schemas/RangedTotals'
        top_artists:
          type: array
          items:
            $ref: '#/components/schemas/TopArtist'
        top_albums:
          type: array
          items:
            $ref: '#/components/schemas/TopAlbum'
        top_tracks:
          type: array
          items:
            $ref: '#/components/schemas/TopTrack'
        fidelity:
          type: array
          items:
            $ref: '#/components/schemas/Share'
          description: |-
            `DSD`, `Lossless`, `Lossy` and `Unknown`, largest first. A share of
            `plays`, because it carries the `Unknown` bucket of its own.
        decades:
          type: array
          items:
            $ref: '#/components/schemas/Share'
          description: |-
            Release decades, `1970s` and so on, oldest first. Only listens whose
            release year has been resolved count, so `pct` is a share of those.
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Share'
          description: |-
            The twelve most-mentioned genres. **A share of tag mentions, not
            listens** — one track carries several tags. Never present it as a
            percentage of plays.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageShare'
          description: |-
            The twelve largest languages, over the listens that have been
            classified.
        regions:
          type: array
          items:
            type: object
          description: Always empty; reserved.
        heatmap:
          type: array
          items:
            type: array
            items:
              type: integer
              format: int64
          description: |-
            Seven rows of 24, counts of plays by hour, in your own timezone. Row 0
            is Monday.
        breadth:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Breadth'
            description: |-
              Absent until the genre map is fetched and genres backfilled — "you play
              0 genres" would be a lie about the listening rather than a statement
              about the data.
    RangedTotals:
      type: object
      required:
      - plays
      - hours
      - duration_known
      - artists
      - albums
      - tracks
      - avg_quality
      - quality_known
      - lossless_pct
      - dsd_pct
      - fidelity_known
      - skips
      - per_day
      - loves
      properties:
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
          description: Summed over the listens with a known length — see `duration_known`.
        duration_known:
          type: integer
          format: int64
          description: |-
            Listens `hours` is summed over. A listen whose source reported no
            length contributes nothing, so `hours` is a floor rather than a total.
        artists:
          type: integer
          format: int64
        albums:
          type: integer
          format: int64
        tracks:
          type: integer
          format: int64
        avg_quality:
          type: number
          format: double
          description: 0–100, averaged over `quality_known` listens only; 0 when there are none.
        quality_known:
          type: integer
          format: int64
          description: |-
            Listens `avg_quality` is averaged over. Only a live source ever writes a
            quality score, so an imported history has none and the average is over
            the same narrow population the fidelity shares are. Present it with its
            coverage or not at all; at zero there is no score to show, not a score
            of zero.
        lossless_pct:
          type: integer
          format: int64
          description: Share of `fidelity_known`, not of `plays`. A whole percentage.
        dsd_pct:
          type: integer
          format: int64
          description: Share of `fidelity_known`, not of `plays`. A whole percentage.
        fidelity_known:
          type: integer
          format: int64
          description: |-
            Listens in this window whose format is known — the denominator of the
            two shares above. The `fidelity` array is a share of `plays` instead,
            because it carries an `Unknown` bucket of its own.
        skips:
          type: integer
          format: int64
          description: |-
            Skipped plays in this window. Every other count in this object excludes
            them; this one is about them. Not every source reports skips, so zero
            means "nothing told us", not "nothing skipped".
        per_day:
          type: number
          format: double
          description: |-
            Plays per **calendar** day of the window, including days with no
            listening. Dividing by active days instead reports a busy afternoon's
            rate as the year's.
        first_listen:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Earliest non-skipped listen, unix seconds. A fact about the whole
            history and therefore **not** ranged — asking it of a one-week window
            would only restate the window.
        loves:
          type: integer
          format: int64
          description: |-
            Loved entities: tracks, records and artists together. All time, not
            ranged.
    RatingApply:
      type: object
      description: |-
        What applying a threshold did, or would do.

        `matched` and `unmatched` are stated separately for the reason every paired
        count in this codebase is: a rating on something never played is real data
        and is kept, but it does not become a love, and a screen reporting only the
        loves would silently understate what the library holds.
      required:
      - qualifying
      - matched
      - unmatched
      - loved
      - withdrawn
      - already
      - dry_run
      properties:
        qualifying:
          type: integer
          description: Ratings that clear the bar.
          minimum: 0
        matched:
          type: integer
          description: …of which this many are things this user has actually listened to.
          minimum: 0
        unmatched:
          type: integer
          description: …and this many are not, so they are not loved. See the note on the rule.
          minimum: 0
        loved:
          type: integer
          description: Loves newly made by this run.
          minimum: 0
        withdrawn:
          type: integer
          description: Loves withdrawn because their rating no longer clears the bar.
          minimum: 0
        already:
          type: integer
          description: Already loved, by hand or by an earlier run. Untouched.
          minimum: 0
        dry_run:
          type: boolean
          description: Whether anything was actually written.
    RatingSample:
      type: object
      required:
      - kind
      - artist
      - name
      - source_kind
      - starred
      - scale_max
      - shown
      - loved
      properties:
        kind:
          type: string
          description: '`track`, `album` or `artist`.'
        artist:
          type: string
        name:
          type: string
        album:
          type:
          - string
          - 'null'
        source_kind:
          type: string
        starred:
          type: boolean
        rating:
          type:
          - number
          - 'null'
          format: double
          description: |-
            The raw number, exactly as the server gave it — "7 out of 10, from
            Plex".
        scale_max:
          type: number
          format: double
          description: What `rating` was out of.
        shown:
          type: number
          format: float
          description: The same rating on your display scale.
        loved:
          type: boolean
          description: Whether the current rule loves it.
    RatingSourceSummary:
      type: object
      description: |-
        What is held, per source, so a screen can say where the numbers came from
        without listing them.
      required:
      - source_id
      - source_kind
      - label
      - rated
      - starred
      - scale_max
      properties:
        source_id:
          type: integer
          format: int64
        source_kind:
          type: string
        label:
          type: string
        rated:
          type: integer
          format: int64
        starred:
          type: integer
          format: int64
        scale_max:
          type: number
          format: double
        fetched_at:
          type:
          - integer
          - 'null'
          format: int64
    RatingsApplied:
      type: object
      description: |-
        DELETE /api/v1/ratings — forget the stored ratings.

        **Does not un-love anything**, and that is the point rather than an
        omission: a love already made is a statement that was made, and this is a
        request to forget the ratings. Un-loving is what moving the threshold to the
        top and applying does, which is a separate and visible act.
        What a rule did, or would do.
      required:
      - threshold
      - scale
      - include_starred
      - report
      properties:
        threshold:
          type: number
          format: float
          description: The rule applied, on `scale`.
        scale:
          type: string
        include_starred:
          type: boolean
        report:
          $ref: '#/components/schemas/RatingApply'
    RatingsCleared:
      type: object
      description: Ratings forgotten.
      required:
      - forgotten
      - note
      properties:
        forgotten:
          type: integer
          format: int64
          minimum: 0
        note:
          type: string
    RatingsOverview:
      type: object
      description: |-
        The ratings held, on the scale you read them on, and the rule that turns
        them into loves.
      required:
      - scale
      - scale_label
      - scale_choices
      - threshold
      - include_starred
      - sources
      - sample
      properties:
        scale:
          type: string
          description: The display scale's id.
        scale_label:
          type: string
        scale_choices:
          type: array
          items:
            type: number
            format: float
          description: Every threshold the scale offers.
        threshold:
          type: number
          format: float
          description: The love threshold, on this scale.
        include_starred:
          type: boolean
          description: Whether a starred item counts as loved whatever its rating.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RatingSourceSummary'
        sample:
          type: array
          items:
            $ref: '#/components/schemas/RatingSample'
          description: Up to 60 ratings, to show what the rule would do.
    RatingsPulled:
      type: object
      description: Ratings read from every enabled media server.
      required:
      - found
      - sources
      properties:
        found:
          type: integer
          description: Ratings stored, across every source.
          minimum: 0
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourcePull'
          description: |-
            One entry per enabled source. A source that failed says why and keeps
            what it held before.
    ReaderLine:
      type: object
      description: One numbered line.
      required:
      - n
      - text
      - quoted
      properties:
        n:
          type: integer
          description: 1-based, blanks included.
          minimum: 0
        at:
          type:
          - number
          - 'null'
          format: double
          description: Seconds into the track, when the lyric is timed.
        text:
          type: string
          description: Empty for a stanza break, which is a real line.
        pin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LinePin'
            description: The liner note pinned to this line, if any.
        quoted:
          type: integer
          description: How many notes quote this line. Zero is sent, never omitted.
          minimum: 0
    RebuildJob:
      type: object
      description: One rebuild, as it runs.
      required:
      - job_id
      - state
      - sessions
      - listens
      - status
      - started_at
      properties:
        job_id:
          type: string
        state:
          type: string
          description: '`running`, `done` or `error`.'
        sessions:
          type: integer
          format: int64
          description: Sessions written. Only meaningful once `state` is `done`.
          minimum: 0
        listens:
          type: integer
          format: int64
          description: Listens regrouped. Only meaningful once `state` is `done`.
          minimum: 0
        status:
          type: string
          description: A sentence saying how it went — the error, when `state` is `error`.
        started_at:
          type: integer
          format: int64
          description: Unix seconds.
    RebuildRequest:
      type: object
      properties:
        gap_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Gap in seconds that starts a new session: 1800 (the 30 minutes the live
            assigner uses) by default, clamped to between a minute and a day.
          default: 1800
          maximum: 86400
          minimum: 60
    RebuildRunning:
      type: object
      description: A rebuild is already running; attach to it.
      required:
      - code
      - error
      - job_id
      properties:
        code:
          type: integer
          format: int32
          description: Always 409.
          minimum: 0
        error:
          type: string
        job_id:
          type: string
          description: The running rebuild.
    RebuildStarted:
      type: object
      description: A rebuild, begun.
      required:
      - job_id
      - state
      properties:
        job_id:
          type: string
          description: Poll `/api/v1/sessions/rebuild/{job_id}` with this.
        state:
          type: string
          description: Always `running`.
    RecommendationRow:
      type: object
      required:
      - id
      - kind
      - artist
      - origin
      - status
      - created_at
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: '`artist`, `album` or `track`.'
        artist:
          type: string
        name:
          type:
          - string
          - 'null'
        mbid:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        because:
          type:
          - string
          - 'null'
        origin:
          type: string
          description: '`user`, or the name of the connection that suggested it.'
        status:
          type: string
          description: '`open`, `acquired` or `dismissed`.'
        created_at:
          type: integer
          format: int64
        acted_at:
          type:
          - integer
          - 'null'
          format: int64
    Rediscovery:
      type: object
      description: Five lists — seven, now — all built from your own history.
      required:
      - quiet_days
      - window
      - collections
      - gear
      properties:
        quiet_days:
          type: integer
          format: int64
        window:
          type: string
          description: '`quiet_days` in words — "six months".'
        featured:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Collection'
            description: |-
              The collection with the most rows, for the hero card. Null when every
              list is empty.
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
          description: Every collection, in the page's order, empty ones included.
        gear:
          type: array
          items:
            $ref: '#/components/schemas/GearChoice'
          description: Your gear, for the per-gear list at `/api/v1/rediscovery/gear/{id}`.
    RediscoveryRow:
      type: object
      description: |-
        One suggestion on the Rediscovery screen.

        Same shape whichever list produced it, so the page renders one row type and
        the reason lives on the list rather than the item.
      required:
      - name
      - artist
      - plays
      properties:
        name:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        plays:
          type: integer
          format: int64
        last_played:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix seconds; null when never played (a loved or shelved item).
        artwork_url:
          type:
          - string
          - 'null'
          description: |-
            A cover, from one of the listens counted. See `caa_id` on `Listen` for
            the tombstones.
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
    ReelListen:
      type: object
      description: A listen on somebody else's deck, reaching this user through a patch.
      required:
      - id
      - timestamp
      - title
      - artist
      - user_id
      - username
      - has_chain
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
        format_type:
          type:
          - string
          - 'null'
        codec:
          type:
          - string
          - 'null'
        bitrate:
          type:
          - integer
          - 'null'
          format: int64
        sample_rate:
          type:
          - integer
          - 'null'
          format: int64
        bit_depth:
          type:
          - integer
          - 'null'
          format: int64
        is_lossless:
          type:
          - boolean
          - 'null'
        submission_client:
          type:
          - string
          - 'null'
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        actor_uri:
          type:
          - string
          - 'null'
          description: |-
            This deck's actor URI, or null when they have not switched federation
            on.
        chain_name:
          type:
          - string
          - 'null'
          description: The chain, **when its owner shares it**.
        chain_icon:
          type:
          - string
          - 'null'
        chain_components:
          type:
          - string
          - 'null'
        has_chain:
          type: boolean
          description: Whether there was a chain, whatever its owner shares.
    ReelPage:
      type: object
      description: A page of the Reel, newest first.
      required:
      - listens
      properties:
        listens:
          type: array
          items:
            $ref: '#/components/schemas/ReelListen'
        next:
          type:
          - integer
          - 'null'
          format: int64
          description: Pass as `before` for the next page. Null when this page was the last.
    RejectedListen:
      type: object
      required:
      - index
      - reason
      properties:
        index:
          type: integer
          description: |-
            Index into the submitted `payload`, so the client can map it back to
            what it sent.
          minimum: 0
        reason:
          type: string
    ReleaseCandidate:
      type: object
      description: One release an album's listens claim to be, and how many say so.
      required:
      - mbid
      - plays
      properties:
        mbid:
          type: string
        plays:
          type: integer
          format: int64
    Reports:
      type: object
      description: A feed of period cards, newest first.
      required:
      - unit
      - timezone
      - periods
      - offset
      - total_periods
      properties:
        unit:
          type: string
          description: '`week`, `month` or `year`.'
        timezone:
          type: string
          description: The IANA zone the buckets were cut in.
        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
        offset:
          type: integer
          description: Where this page sits, counting back from the newest.
          minimum: 0
        total_periods:
          type: integer
          description: |-
            How many periods exist at this bucket size — what tells a stepper where
            the ends are.
          minimum: 0
        capped:
          type:
          - boolean
          - 'null'
          description: |-
            The scan hit the analytics row cap, so the oldest periods are partial
            and must not be presented as final. Absent with no listening at all.
    Resolved:
      type: object
      description: |-
        Name → entity id, creating the entity if this is the first time anyone has
        pointed at it. Lets a history row link to `/album/<id>` without the browser
        knowing any ids.
        An entity, found or created.
      required:
      - id
      - kind
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: 'The stored kind: `release`, `artist` or `recording`.'
    Restarting:
      type: object
      required:
      - status
      - note
      properties:
        status:
          type: string
          description: '`restarting`.'
        note:
          type: string
    Revision:
      type: object
      required:
      - id
      - body_md
      - excerpt
      - created_at
      properties:
        id:
          type: integer
          format: int64
        body_md:
          type: string
        excerpt:
          type: string
        created_at:
          type: integer
          format: int64
          description: When this version was replaced.
    Revisions:
      type: object
      description: Earlier versions of a note, newest first.
      required:
      - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
    RotatedToken:
      type: object
      description: A re-issued token.
      required:
      - token
      - message
      properties:
        token:
          type: string
          description: The new secret, returned once. The old one stops working now.
        message:
          type: string
    RowCreated:
      type: object
      description: A row that was just created.
      required:
      - id
      - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: '`created`.'
    RowUpdated:
      type: object
      description: A row that was just updated.
      required:
      - id
      - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          description: '`updated`.'
    SanitisePreview:
      type: object
      description: What the sanitiser would change. Nothing has been changed.
      required:
      - mixed_albums
      - featured_artists
      - artist_variants
      - split_attributions
      properties:
        mixed_albums:
          type: array
          items:
            $ref: '#/components/schemas/MixedAlbum'
          description: Albums whose listens disagree about which release they are.
        featured_artists:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedArtist'
          description: |-
            Artist strings carrying a featured credit, and the artist they fold
            into.
        artist_variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantArtist'
          description: Artists with other spellings of themselves in the same history.
        split_attributions:
          type: array
          items:
            $ref: '#/components/schemas/SplitAttribution'
          description: Tracks carrying two different artists on the same record.
    Sanitised:
      type: object
      description: |-
        What the sanitiser changed: how many of each fix, and how many listens
        each touched.
      required:
      - albums_fixed
      - album_listens_changed
      - artists_folded
      - artist_listens_changed
      - variants_merged
      - variant_listens_changed
      - splits_merged
      - split_listens_changed
      properties:
        albums_fixed:
          type: integer
          format: int64
          minimum: 0
        album_listens_changed:
          type: integer
          format: int64
          minimum: 0
        artists_folded:
          type: integer
          format: int64
          minimum: 0
        artist_listens_changed:
          type: integer
          format: int64
          minimum: 0
        variants_merged:
          type: integer
          format: int64
          minimum: 0
        variant_listens_changed:
          type: integer
          format: int64
          minimum: 0
        splits_merged:
          type: integer
          format: int64
          minimum: 0
        split_listens_changed:
          type: integer
          format: int64
          minimum: 0
    SanitizeRequest:
      type: object
      description: |-
        What to apply.

        Two ways to say it, because both are the common case at different times: the
        booleans mean "everything in this category", the lists name individual edits.
        A non-empty list wins over its boolean — asking for specific edits and
        getting all of them would be the worst possible reading.
      properties:
        albums:
          type: boolean
        artists:
          type: boolean
        variants:
          type: boolean
        album_edits:
          type: array
          items:
            $ref: '#/components/schemas/AlbumEdit'
        credit_edits:
          type: array
          items:
            $ref: '#/components/schemas/CreditEdit'
        variant_edits:
          type: array
          items:
            $ref: '#/components/schemas/VariantEdit'
        splits:
          type: boolean
        split_edits:
          type: array
          items:
            $ref: '#/components/schemas/SplitEdit'
    SaveNoteRequest:
      allOf:
      - $ref: '#/components/schemas/TargetSpec'
      - type: object
        required:
        - body_md
        properties:
          body_md:
            type: string
            description: |-
              Markdown. `[[track:…]]`, `[[album:…]]`, `[[artist:…]]`, `[[gear:…]]` and
              `[[line:12]]` shortcodes resolve against your own history.
          visibility:
            type:
            - string
            - 'null'
            description: '`private` by default.'
      description: A note's target, flattened alongside its body.
    SavedPlaylist:
      type: object
      required:
      - id
      - name
      - origin
      - created_at
      - updated_at
      - tracks
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        origin:
          type: string
          description: |-
            `user`, or `mcp` for one an assistant wrote — `connection_name` says
            which.
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        pushed_at:
          type:
          - integer
          - 'null'
          format: int64
        pushed_to:
          type:
          - string
          - 'null'
          description: |-
            The protocol it was last sent to — `Plex`, `Jellyfin`, `Subsonic`,
            `TIDAL`.
        connection_name:
          type:
          - string
          - 'null'
        tracks:
          type: integer
          format: int64
          description: How many tracks.
    SavedPlaylistDetail:
      type: object
      required:
      - playlist
      - tracks
      properties:
        playlist:
          $ref: '#/components/schemas/SavedPlaylist'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SavedPlaylistEntry'
          description: With the plays and artwork the history already holds.
    SavedPlaylistEntry:
      allOf:
      - $ref: '#/components/schemas/SavedPlaylistTrack'
      - type: object
        required:
        - plays
        properties:
          plays:
            type: integer
            format: int64
            description: |-
              Plays in this user's history. Zero for a track they have never played,
              which is a normal outcome rather than a problem.
          artwork_url:
            type:
            - string
            - 'null'
          caa_id:
            type:
            - integer
            - 'null'
            format: int64
          caa_release_mbid:
            type:
            - string
            - 'null'
      description: A playlist track with what the listening history already knows about it.
    SavedPlaylistTrack:
      type: object
      description: |-
        Names, not ids — the only shape that survives the user not owning the
        track on every server they have. Resolved against a real library at push
        time.
      required:
      - title
      - artist
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
          description: A tiebreaker at push time, never a requirement.
        note:
          type:
          - string
          - 'null'
          description: |-
            Why this track is here, in the words of whatever chose it. Never
            generated by Tapedeck.
    SavedPlaylists:
      type: object
      required:
      - playlists
      properties:
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/SavedPlaylist'
    ScanUpload:
      type: object
      description: A scan of your own copy. Several `file` fields may be sent at once.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, WebP, GIF, AVIF or TIFF, at most 24 MB.
        kind:
          type:
          - string
          - 'null'
          description: Defaults to `other`.
        caption:
          type:
          - string
          - 'null'
    ScansStored:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    ScopeOffer:
      type: object
      required:
      - scope
      - description
      - requested
      properties:
        scope:
          type: string
        description:
          type: string
        requested:
          type: boolean
    ScrapeProgress:
      type: object
      description: The running or most recent scrape.
      required:
      - tier
      - state
      - done
      - total
      - started_at
      properties:
        tier:
          $ref: '#/components/schemas/ScrapeTier'
        state:
          $ref: '#/components/schemas/ScrapeState'
        done:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        current:
          type:
          - string
          - 'null'
          description: |-
            The genre currently being fetched, for a UI that would otherwise show a
            bar creeping for two hours with nothing to read.
        message:
          type:
          - string
          - 'null'
        started_at:
          type: integer
          format: int64
    ScrapeRequest:
      type: object
      required:
      - tier
      properties:
        tier:
          type: string
          description: |-
            `map` (one request) or `pages` (~6,300, about two hours). `pages`
            needs the map first.
          example: map
    ScrapeStarted:
      type: object
      required:
      - status
      - tier
      properties:
        status:
          type: string
          description: '`started`.'
        tier:
          $ref: '#/components/schemas/ScrapeTier'
    ScrapeState:
      type: string
      enum:
      - running
      - done
      - failed
      - cancelled
    ScrapeTier:
      type: string
      description: |-
        `map` is the genre map, one request; `pages` is every genre's page,
        ~6,300 requests at one a second.
      enum:
      - map
      - pages
    ScrobbleSettings:
      type: object
      description: When a listen counts, as the server applies it.
      required:
      - fraction
      - percent
      - after_secs
      - rule
      - no_duration_after_secs
      - source
      - default_percent
      - default_after_secs
      properties:
        fraction:
          type: number
          format: double
          description: |-
            Share of the track that must have played, 0.05–1.0. This is the number
            the server multiplies the duration by.
        percent:
          type: number
          format: double
          description: '`fraction` as a percentage, which is how the setting is worded.'
        after_secs:
          type: integer
          format: int64
          description: Seconds after which it counts regardless of the fraction.
          minimum: 0
        rule:
          type: string
          description: |-
            Always `either` — **whichever comes first.** Stated rather than implied:
            a client reading the two as an AND scrobbles a long track hours late
            and a short one never.
          example: either
        no_duration_after_secs:
          type: integer
          format: int64
          description: |-
            What applies when the track's length is unknown — the fraction is
            unanswerable, so the flat number is the only rule left. Equal to
            `after_secs`; named separately so a client does not invent its own
            answer for that case.
          minimum: 0
        source:
          type: string
          description: |-
            `user` or `default`: whether the listener chose these numbers or
            inherited them, so a settings screen can say which.
        default_percent:
          type: number
          format: double
          description: The instance default, for showing what "standard" is.
        default_after_secs:
          type: integer
          format: int64
          description: The instance default, for showing what "standard" is.
          minimum: 0
    ScrobblerApproved:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: The token `…/start` returned, after you approved it.
    ScrobblerAuth:
      type: object
      description: Where to send the browser to approve Tapedeck.
      required:
      - token
      - auth_url
      properties:
        token:
          type: string
          description: The request token — send it back to `…/complete` once approved.
        auth_url:
          type: string
    SearchAlbum:
      type: object
      required:
      - name
      - artist
      - plays
      properties:
        name:
          type: string
        artist:
          type: string
        plays:
          type: integer
          format: int64
    SearchArtist:
      type: object
      required:
      - name
      - plays
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
    SearchResults:
      type: object
      description: Grouped matches from your own history, most-played first in each group.
      required:
      - artists
      - albums
      - tracks
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/SearchArtist'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/SearchAlbum'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SearchTrack'
    SearchTrack:
      type: object
      required:
      - title
      - artist
      - plays
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        plays:
          type: integer
          format: int64
    SentSitting:
      type: object
      description: One sitting **you** passed on, for the sender's own list.
      required:
      - uuid
      - session_uuid
      - created_at
      - to_username
      properties:
        uuid:
          type: string
        session_uuid:
          type: string
        note:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        seen_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When they opened it. `None` means it is still unread — which is the
            difference between withdrawing something nobody saw and taking back
            something already read, and the screen says which.
        to_username:
          type: string
        to_display_name:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        started_at:
          type:
          - integer
          - 'null'
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
    SentSittings:
      type: object
      required:
      - sittings
      properties:
        sittings:
          type: array
          items:
            $ref: '#/components/schemas/SentSitting'
    ServiceImport:
      type: object
      required:
      - username
      properties:
        username:
          type: string
          description: The account to import from.
        token:
          type:
          - string
          - 'null'
          description: 'ListenBrainz only: a user token, which lets a private history be read.'
    SessionDetail:
      type: object
      description: One session and its listens, in play order.
      required:
      - session
      - scrobbles
      properties:
        session:
          $ref: '#/components/schemas/SessionRow'
        scrobbles:
          type: array
          items:
            $ref: '#/components/schemas/Listen'
    SessionList:
      type: object
      description: A page of sessions, newest first.
      required:
      - sessions
      - count
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionRow'
        count:
          type: integer
          description: Rows in this page.
          minimum: 0
    SessionRow:
      type: object
      description: |-
        A listening session: contiguous listening through one setup.

        `chain_name` / `device_name` / `token_name` are joined so a list of sessions
        renders without a request per row. `title` is a user label; when it's null
        the UI derives one from the span.
      required:
      - id
      - started_at
      - track_count
      - total_duration
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type:
          - string
          - 'null'
          description: Stable across merges and splits, and the id a shared session will carry.
        title:
          type:
          - string
          - 'null'
          description: Your name for it; null means the screen derives one from the span.
        notes:
          type:
          - string
          - 'null'
          description: |-
            A note about the sitting itself. Distinct from a liner note, which is
            about a record and hangs off an entity or a single listen.
        started_at:
          type: integer
          format: int64
          description: Unix seconds.
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix seconds.
        track_count:
          type: integer
          format: int64
        total_duration:
          type: integer
          format: int64
          description: Seconds.
        avg_quality_score:
          type:
          - number
          - 'null'
          format: double
        listening_context:
          type:
          - string
          - 'null'
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
        chain_name:
          type:
          - string
          - 'null'
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which variant of that chain the sitting's listens carry. Read off the
            listens rather than stored on the session, so it cannot disagree with
            them — the same rule `recompute_session` follows for the aggregates.
        chain_variant_name:
          type:
          - string
          - 'null'
        device_id:
          type:
          - integer
          - 'null'
          format: int64
        device_name:
          type:
          - string
          - 'null'
        token_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The API token the listens were submitted with. A change of token
            starts a new session.
        token_name:
          type:
          - string
          - 'null'
    SetBindingRequest:
      type: object
      required:
      - identifier
      - chain_id
      properties:
        identifier:
          type: string
          description: |-
            The output device, as a client reports it in
            `tapedeck_device.output_device`.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The chain it maps to. **Required: `null` clears the mapping; absent is
            a 400.** Must be one of your chains.
    SetDeviceChainRequest:
      type: object
      required:
      - chain_id
      properties:
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The chain this device's listens default to — rung 4 of the ladder.
            **Required: `null` clears it; absent is a 400.** Must be one of your
            chains.
    SettingsUpdate:
      type: object
      description: |-
        Each field is written only when present, so saving one does not wipe the
        other. An explicit empty string clears.
      properties:
        client_id:
          type:
          - string
          - 'null'
        client_secret:
          type:
          - string
          - 'null'
    SetupRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          description: At least 8 characters.
          minLength: 8
        display_name:
          type:
          - string
          - 'null'
    SetupResponse:
      type: object
      description: The first admin, signed in, with a token.
      required:
      - user_id
      - username
      - token
      - message
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        token:
          type: string
          description: An API token with `submit` and `read`. Shown once, never again.
        message:
          type: string
    Share:
      type: object
      description: One slice of a breakdown.
      required:
      - name
      - plays
      - pct
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
        pct:
          type: integer
          format: int64
          description: |-
            A whole percentage of the breakdown's own total — which total, each
            breakdown says.
    ShareAll:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    SharingSwitch:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: '**Required** — an absent key is a 400, never a default.'
    Shelf:
      type: object
      required:
      - releases
      properties:
        releases:
          type: array
          items:
            $ref: '#/components/schemas/ShelfItem'
    ShelfDone:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`ok`, `deleted` or `cleared`.'
    ShelfEntry:
      type: object
      required:
      - release
      properties:
        release:
          $ref: '#/components/schemas/ShelfItem'
    ShelfImage:
      type: object
      description: One scan or photograph of a pressing.
      required:
      - id
      - release_id
      - kind
      - provider
      - src
      - thumb
      - position
      - added_at
      properties:
        id:
          type: integer
          format: int64
        release_id:
          type: integer
          format: int64
        kind:
          type: string
          description: |-
            `front`, `back`, `booklet`, `medium`, `spine`, … Free text rather than
            an enum: the archive's vocabulary grows, and a scan of something it has
            no word for is still a scan.
        provider:
          type: string
          description: '`caa`, `discogs` or `upload`.'
        src:
          type: string
          description: What to render, whichever provider it came from.
        thumb:
          type: string
        caption:
          type:
          - string
          - 'null'
        position:
          type: integer
          format: int64
        bytes:
          type:
          - integer
          - 'null'
          format: int64
        mime:
          type:
          - string
          - 'null'
        added_at:
          type: integer
          format: int64
    ShelfImageUpdate:
      type: object
      description: Absent fields are left alone; a `null` caption clears it.
      properties:
        kind:
          type:
          - string
          - 'null'
        caption:
          type:
          - string
          - 'null'
        position:
          type:
          - integer
          - 'null'
          format: int64
    ShelfImages:
      type: object
      required:
      - images
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ShelfImage'
    ShelfImported:
      type: object
      required:
      - releases
      - already_on_the_shelf
      - skipped
      - gear
      - images
      - missing_scans
      - plays
      - note
      properties:
        releases:
          type: integer
          description: Pressings added.
          minimum: 0
        already_on_the_shelf:
          type: integer
          description: Matched an existing pressing and left alone.
          minimum: 0
        skipped:
          type: integer
          description: Entries that could not be read.
          minimum: 0
        gear:
          type: integer
          minimum: 0
        images:
          type: integer
          minimum: 0
        missing_scans:
          type: integer
          description: Listed in the manifest but absent from the archive.
          minimum: 0
        plays:
          type: integer
          description: Sides played, restored.
          minimum: 0
        note:
          type: string
          description: What a shelf export cannot carry.
    ShelfItem:
      type: object
      description: |-
        A record, tape or disc you own — an *object* with a pressing, a barcode and
        a side order. Two pressings of the same album are two of these.
      required:
      - id
      - kind
      - artist
      - title
      - tracks
      - added_at
      - play_count
      - played_secs
      - image_count
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: '`vinyl`, `cassette`, `cd` or `sacd`.'
        artist:
          type: string
        title:
          type: string
        year:
          type:
          - integer
          - 'null'
          format: int64
        mbid_release:
          type:
          - string
          - 'null'
        discogs_id:
          type:
          - string
          - 'null'
        barcode:
          type:
          - string
          - 'null'
        catalog_number:
          type:
          - string
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
        tracks:
          type: string
          description: |-
            The tracklist, **as a JSON-encoded string** of an array of tracks
            (`side`, `position`, `title`, `artist`, `duration_secs`, `disc`).
        notes:
          type:
          - string
          - 'null'
        added_at:
          type: integer
          format: int64
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When you bought it — how long it has been on the shelf, which nothing
            else here can answer. Absent for everything shelved before the column.
        acquired_as:
          type:
          - string
          - 'null'
          description: |-
            How it came to be yours — `new`, `used`, `gift`, `inherited`. `None`
            means nobody said, never "new": an existing shelf must not be
            retroactively claimed as bought new.
        acquired_from:
          type:
          - string
          - 'null'
          description: |-
            Where from — the shop, the fair, the person. Free text, because that is
            what makes a thrift find a story rather than a flag.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            What this normally gets played on. The deck pre-fills from these and
            writes the answer back, so a record with one turntable is asked once.
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which variant of that chain this pressing is normally played on — the
            cartridge you keep fitted for it. Pre-fills the deck the same way
            `chain_id` does.
        parked_side:
          type:
          - string
          - 'null'
          description: |-
            Where the tape was left. Cassettes only — a record has random access and
            no state to remember, so these stay null for every other medium.
        parked_secs:
          type:
          - integer
          - 'null'
          format: int64
        play_count:
          type: integer
          format: int64
          description: |-
            How many sides have been played, and for how long. Derived in the
            query rather than kept as a counter, so they cannot drift from the
            plays they claim to count.
        played_secs:
          type: integer
          format: int64
        last_played:
          type:
          - integer
          - 'null'
          format: int64
        image_count:
          type: integer
          format: int64
          description: |-
            Sleeves, booklet pages and labels held for this pressing. Derived the
            same way, so a card can say "29 scans" without a second request.
        cover_thumb:
          type:
          - string
          - 'null'
          description: |-
            The front sleeve from this pressing's own scans, when it has one.
            `artwork_url` is only what the lookup returned, and is often empty.
    ShelfItemSaved:
      type: object
      required:
      - status
      - sides_rewritten
      properties:
        status:
          type: string
          description: '`ok`.'
        sides_rewritten:
          type: boolean
          description: |-
            The medium changed and the tracklist's sides were re-derived — a
            record's A/B break, or a disc's numbers.
    ShelfItemUpdate:
      type: object
      description: |-
        The shelf-keeping fields. **An absent field is left alone and an explicit
        `null` clears it** — a misspelled key is never read as a clear.
      properties:
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
          description: When you bought it, Unix seconds.
        acquired_as:
          type:
          - string
          - 'null'
          description: '`new`, `used`, `gift` or `inherited`.'
        acquired_from:
          type:
          - string
          - 'null'
          description: The shop, the fair, the person.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: What it is normally played on. Must be yours — a 400 otherwise.
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Must be yours — a 400 otherwise.
        notes:
          type:
          - string
          - 'null'
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The variant of `chain_id` this pressing is normally played on — the
            cartridge you keep fitted for it.
        kind:
          type:
          - string
          - 'null'
          description: |-
            Move it to another shelf: `vinyl`, `cassette`, `cd` or `sacd`. Not
            clearable. Changing it re-derives the tracklist's sides, because what a
            side *is* depends on the medium.
        mbid_release:
          type:
          - string
          - 'null'
          description: |-
            The MusicBrainz release this pressing is, typed in by hand — also the
            cheapest way to ask for running times.
    ShelfRow:
      type: object
      required:
      - title
      - artist
      - side
      - spins
      properties:
        title:
          type: string
        artist:
          type: string
        side:
          type: string
        spins:
          type: integer
          format: int64
    ShelfSummary:
      type: object
      required:
      - sides
      - rows
      properties:
        sides:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ShelfRow'
          description: The five most-played sides.
    Shelved:
      type: object
      required:
      - id
      - images
      - kind
      properties:
        id:
          type: integer
          format: int64
        images:
          type: integer
          description: How many scans came back from the archive.
          minimum: 0
        kind:
          type: string
          description: The shelf it went on.
        corrected_from:
          type:
          - string
          - 'null'
          description: |-
            Set when the release's own `format` overrode the `kind` asked for — a
            box of CDs looked up by barcode is filed as CDs whatever was picked.
    SideLogged:
      type: object
      required:
      - listens_added
      - skipped
      - tracks
      - duration_secs
      - started_at
      properties:
        listens_added:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        tracks:
          type: integer
          minimum: 0
        duration_secs:
          type: integer
          format: int64
          description: Running time credited as wear.
        started_at:
          type: integer
          format: int64
        next_side:
          type:
          - string
          - 'null'
          description: The side to reach for next — only when this one ran to its end.
    SidePlay:
      type: object
      required:
      - side
      properties:
        side:
          type: string
          example: A
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackOutcome'
          description: |-
            Per-track outcomes from the deck. Authoritative where present — the
            browser ran the clock, so it is the only thing that saw the pauses and
            the skips. Without it the running order is laid out from `started_at`.
        started_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When the side *started*, unix seconds. Defaults to now minus its running
            time, which is what you want when you press the button as it finishes.
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The turntable, cartridge or deck. Its playback hours are summed from
            these rows.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
        to_position:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The last track that played, when the side was not run to its end. With
            `from_position` this selects a range; the two equal is a single track.
            Tracks after it are not written at all — not as skips either. The play
            still counts as wear.
        from_position:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The first track that actually played, when the side did not start at
            its beginning. **Load-bearing**: without it, starting at track 4
            records tracks 1–3 as played. They are not written at all — and not as
            *skips*, since a track you never reached is not one you skipped. Wear
            is credited only for the part that played.
        parked_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Where a tape was left when it came off, in seconds into the side.
            **Cassettes only**, and clamped to the side's length. Absent means the
            side ran through and the tape is wound back.
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which variant of the chain was fitted — the cartridge in the headshell.
            The shelf is the one write path that legitimately knows this, because
            you told it when you dropped the needle.
    SidePlayed:
      type: object
      description: |-
        One side of a pressing, and what it has been through.

        Every field is derived from the plays on read.
      required:
      - side
      - plays
      - secs
      properties:
        side:
          type: string
          description: 'As it was recorded: "A", "B", or a disc number.'
        plays:
          type: integer
          format: int64
        secs:
          type: integer
          format: int64
          description: Running time of what actually played, summed over every play.
        last_played:
          type:
          - integer
          - 'null'
          format: int64
    Sides:
      type: object
      required:
      - sides
      properties:
        sides:
          type: array
          items:
            $ref: '#/components/schemas/SidePlayed'
          description: |-
            Only sides that have been played, including any recorded under a label
            the tracklist no longer uses.
    SignedIn:
      type: object
      description: Who is signed in.
      required:
      - user_id
      - username
      - is_admin
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        is_admin:
          type: boolean
    SinkView:
      type: object
      description: One forwarding service's circuit breaker.
      required:
      - name
      - failures
      - total_failures
      - total_successes
      properties:
        name:
          type: string
        failures:
          type: integer
          format: int32
          description: Consecutive failures since the last success.
          minimum: 0
        total_failures:
          type: integer
          format: int64
          description: Since the process started.
          minimum: 0
        total_successes:
          type: integer
          format: int64
          minimum: 0
        last_ok:
          type:
          - integer
          - 'null'
          format: int64
        last_failure:
          type:
          - integer
          - 'null'
          format: int64
        last_error:
          type:
          - string
          - 'null'
          description: The most recent error, verbatim.
        skipping_for:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Seconds left while the breaker is open and the service is being
            skipped outright.
          minimum: 0
    SittingSeen:
      type: object
      required:
      - seen
      properties:
        seen:
          type: boolean
          description: False when it had already been seen.
    SittingWithdrawn:
      type: object
      required:
      - withdrawn
      properties:
        withdrawn:
          type: boolean
    Skip:
      type: object
      description: One skip, with what was playing either side of it.
      required:
      - id
      - title
      - artist
      - timestamp
      - source
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        timestamp:
          type: integer
          format: int64
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds.
        listened_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            How far in, when something measured a playhead; null otherwise, never
            wall-clock arithmetic.
        listened_fraction:
          type:
          - number
          - 'null'
          format: double
          description: '`listened_ms` over `duration`, 0–1. Only when both are known.'
        source:
          type: string
        chain:
          type:
          - string
          - 'null'
          description: The signal chain's name.
        played_before:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrackRef'
            description: The listen before it.
        played_after:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TrackRef'
            description: The listen after it.
    Skips:
      type: object
      description: Your skips, newest first, and the tracks skipped most.
      required:
      - total
      - skips
      - most_skipped
      properties:
        total:
          type: integer
          format: int64
          description: Every skip on record, for paging.
        skips:
          type: array
          items:
            $ref: '#/components/schemas/Skip'
        most_skipped:
          type: array
          items:
            $ref: '#/components/schemas/MostSkipped'
          description: The ten tracks skipped most often, over the whole history.
    Source:
      type: object
      description: A configured source, without its credentials.
      required:
      - id
      - kind
      - label
      - enabled
      - url
      - has_token
      - libraries_allow
      - libraries_block
      - devices_allow
      - devices_block
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: '`plex`, `navidrome`, `jellyfin`, `emby` or `roon`.'
        label:
          type: string
          description: Your name for it, so two servers of the same kind are tellable apart.
        enabled:
          type: boolean
        url:
          type: string
        has_token:
          type: boolean
          description: A credential is stored. It is never returned.
        remote_account:
          type:
          - string
          - 'null'
          description: The account on the server whose plays are scrobbled, resolved on save.
        username:
          type:
          - string
          - 'null'
          description: Navidrome's login name.
        poll_interval_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Null means the engine's default.
        libraries_allow:
          type: array
          items:
            type: string
        libraries_block:
          type: array
          items:
            type: string
        devices_allow:
          type: array
          items:
            type: string
        devices_block:
          type: array
          items:
            type: string
        last_polled_at:
          type:
          - integer
          - 'null'
          format: int64
        last_error:
          type:
          - string
          - 'null'
        updated_at:
          type: integer
          format: int64
    SourceAccounts:
      oneOf:
      - type: array
        items:
          $ref: '#/components/schemas/PlexAccount'
      - type: array
        items:
          $ref: '#/components/schemas/MediaBrowserAccount'
      description: |-
        Every account on the server, for the "scrobble as" picker. Plex numbers
        its accounts; Jellyfin and Emby use string ids.
    SourceCheck:
      type: object
      description: 'Whether the credentials work. A failed check is a 200 with `ok: false`.'
      required:
      - ok
      properties:
        ok:
          type: boolean
        account:
          type:
          - string
          - 'null'
          description: The account the credential belongs to, where the server can say.
        account_error:
          type:
          - string
          - 'null'
          description: |-
            The server was reached but could not name the account — recoverable
            by picking one from `accounts`.
        accounts:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SourceAccounts'
            description: |-
              Empty or absent when the credential may not list them; the picker is
              then not offered. Jellyfin needs this more than Plex: a dashboard API
              key belongs to no user.
        libraries:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Plex's music libraries.
        error:
          type:
          - string
          - 'null'
          description: Why it failed.
    SourceCredentials:
      type: object
      description: |-
        Credentials to try. Anything omitted falls back to the stored source named
        by `id`.
      properties:
        kind:
          type:
          - string
          - 'null'
          description: Required unless `id` is given.
        id:
          type:
          - integer
          - 'null'
          format: int64
          description: Test an existing source, reusing its stored secret.
        url:
          type:
          - string
          - 'null'
        token:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
        api_key:
          type:
          - string
          - 'null'
    SourceHealth:
      type: object
      description: One source's liveness, with nothing secret in it.
      required:
      - id
      - user_id
      - username
      - kind
      - label
      - enabled
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
        kind:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        poll_interval_secs:
          type:
          - integer
          - 'null'
          format: int64
        last_polled_at:
          type:
          - integer
          - 'null'
          format: int64
        last_error:
          type:
          - string
          - 'null'
    SourceList:
      type: object
      required:
      - sources
      - kinds
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        kinds:
          type: array
          items:
            type: string
          description: The kinds a source can be created as.
    SourcePull:
      type: object
      description: |-
        What one source's pull did.

        `error` and a zero count are different answers and both are reported: a
        server that could not be reached is not a library with no ratings in it, and
        a screen that showed them the same way would send somebody looking for
        ratings that are sitting right there.
        What one source handed over.
      required:
      - source_id
      - kind
      - label
      - found
      properties:
        source_id:
          type: integer
          format: int64
        kind:
          type: string
        label:
          type: string
        found:
          type: integer
          minimum: 0
        error:
          type:
          - string
          - 'null'
    SourceSettings:
      type: object
      description: |-
        A source to save. On update every field is optional, and an omitted or
        empty credential **keeps the stored one** — it is never sent back, so a
        client could not echo it anyway.
      properties:
        kind:
          type:
          - string
          - 'null'
          description: |-
            `plex`, `navidrome`, `jellyfin`, `emby` or `roon`. Required on create
            and ignored afterwards; a source cannot change kind.
        label:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
          description: |-
            Enabling needs a complete set of credentials for the kind — a 400
            otherwise. Defaults to off on create.
        url:
          type:
          - string
          - 'null'
        token:
          type:
          - string
          - 'null'
          description: Plex.
        username:
          type:
          - string
          - 'null'
          description: Navidrome logs in as a user.
        password:
          type:
          - string
          - 'null'
        api_key:
          type:
          - string
          - 'null'
          description: Jellyfin and Emby.
        poll_interval_secs:
          type:
          - integer
          - 'null'
          format: int64
        libraries_allow:
          type:
          - array
          - 'null'
          items:
            type: string
        libraries_block:
          type:
          - array
          - 'null'
          items:
            type: string
        devices_allow:
          type:
          - array
          - 'null'
          items:
            type: string
        devices_block:
          type:
          - array
          - 'null'
          items:
            type: string
        plex_account:
          type:
          - string
          - 'null'
          description: |-
            Which Plex account's sessions this source should scrobble. Omitted
            means whoever the token belongs to. Validated against the server's
            accounts on save.
        jellyfin_account:
          type:
          - string
          - 'null'
          description: |-
            Which Jellyfin or Emby account's sessions to scrobble. Needed whenever
            the key is a dashboard API key, which belongs to no user.
    Spin:
      type: object
      properties:
        spin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpinView'
            description: Null when nothing is on the deck.
    SpinUpdate:
      type: object
      description: The whole state of the deck, every time.
      required:
      - release_id
      - side
      - started_at
      properties:
        release_id:
          type: integer
          format: int64
          description: Must be yours — a 404 otherwise.
        side:
          type: string
        started_at:
          type: integer
          format: int64
        paused_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Null while running.
        paused_total:
          type: integer
          format: int64
          description: Seconds spent stopped.
        outcomes:
          type: array
          items:
            type: object
          description: Per-track `{position, started_at, skipped}`, stored whole.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
        start_secs:
          type: integer
          format: int64
          description: |-
            How far into the side this spin began — the needle dropped mid-side, or
            a tape resumed from where it was parked.
    SpinView:
      type: object
      description: The side on the deck, with enough of the record to draw it.
      required:
      - release_id
      - kind
      - artist
      - title
      - side
      - started_at
      - paused_total
      - outcomes
      - start_secs
      - updated_at
      properties:
        release_id:
          type: integer
          format: int64
        kind:
          type: string
        artist:
          type: string
        title:
          type: string
        artwork_url:
          type:
          - string
          - 'null'
        mbid_release:
          type:
          - string
          - 'null'
        side:
          type: string
        started_at:
          type: integer
          format: int64
        paused_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Null while running.
        paused_total:
          type: integer
          format: int64
          description: Seconds spent stopped.
        outcomes:
          type: array
          items:
            type: object
          description: Per-track `{position, started_at, skipped}`, as the deck wrote them.
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
        start_secs:
          type: integer
          format: int64
          description: |-
            How far into the side this spin began — non-zero when the needle was
            dropped mid-side, or a tape resumed from where it was parked.
        updated_at:
          type: integer
          format: int64
    SplitAttribution:
      type: object
      description: One track carrying two different artists on the same record.
      required:
      - title
      - album
      - primary
      - primary_plays
      - primary_album_plays
      - primary_album_tracks
      - folding
      properties:
        title:
          type: string
          description: Lowercased grouping keys.
        album:
          type: string
        primary:
          type: string
          description: The record's own artist, and what everything else folds into.
        primary_plays:
          type: integer
          format: int64
          description: This artist's plays *on this track*.
        primary_album_plays:
          type: integer
          format: int64
          description: This artist's plays across the whole album.
        primary_album_tracks:
          type: integer
          format: int64
          description: |-
            How many distinct tracks of the album carry this artist. *This* is why
            they win, and it is shown so a weak case is visible as one: a director
            credited on twelve tracks is obvious, a winner with two is a guess.
        folding:
          type: array
          items:
            type: array
            items: false
            prefixItems:
            - type: string
            - type: integer
              format: int64
          description: '`(artist, plays)` for every other attribution on this track.'
    SplitEdit:
      type: object
      description: One track whose stray attribution goes back to the record's own artist.
      required:
      - title
      - album
      - from
      - to
      properties:
        title:
          type: string
        album:
          type: string
        from:
          type: string
          description: The attribution being folded — a singer, on a soundtrack.
        to:
          type: string
          description: |-
            The record's artist. Checked against the preview rather than trusted:
            taking this from the request would turn a narrow fix into "rename any
            track to any artist", the same reason `split_featured` derives its own
            target.
    SplitRequest:
      type: object
      required:
      - at_scrobble_id
      properties:
        at_scrobble_id:
          type: integer
          format: int64
          description: The listen that starts the new session.
    SplitSessions:
      type: object
      description: Both halves of a split, as they stand now.
      properties:
        session:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SessionRow'
            description: The original session, now ending before the split.
        new_session:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SessionRow'
            description: The new session, starting at the listen you split at.
    SpoolCapture:
      type: object
      description: A play from somebody else's deck, waiting to be accepted.
      required:
      - id
      - title
      - artist
      - played_at
      - state
      - from_username
      - spool_uuid
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
        played_at:
          type: integer
          format: int64
        state:
          type: string
        from_username:
          type: string
        from_display_name:
          type:
          - string
          - 'null'
        spool_uuid:
          type: string
        spool_title:
          type:
          - string
          - 'null'
    SpoolChain:
      type: object
      properties:
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Null files accepted plays under no chain.
    SpoolChainChoice:
      type: object
      required:
      - chain_id
      properties:
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            A chain of yours, or `null` to file accepted plays under nothing.
            **Required** — an absent key is a 400, never a clear.
    SpoolDetail:
      type: object
      description: A sitting, in full.
      required:
      - uuid
      - viewer_id
      - started_at
      - host_user_id
      - hosting
      - my_state
      - members
      - guests
      - plays
      - withheld
      - figures
      properties:
        uuid:
          type: string
        viewer_id:
          type: integer
          format: int64
        title:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        started_at:
          type: integer
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
        host_user_id:
          type: integer
          format: int64
        hosting:
          type: boolean
        my_state:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/SpoolMember'
        guests:
          type: array
          items:
            type: string
        plays:
          type: array
          items:
            $ref: '#/components/schemas/SpoolPlay'
        withheld:
          type: integer
          format: int64
          description: |-
            Plays that happened in this sitting and are not on the timeline, because
            they ran through chains their owner does not share.
        figures:
          $ref: '#/components/schemas/SpoolFigures'
          description: What the evening came to, folded out of `plays`.
    SpoolEdit:
      type: object
      description: |-
        Name a sitting, write about it, or change who else was there. An absent
        field is left alone; an explicit `null` clears it.
      properties:
        title:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        guests:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Names of people in the room with no account here. Replaces the list.
    SpoolEnded:
      type: object
      required:
      - ended
      properties:
        ended:
          type: boolean
    SpoolFigures:
      type: object
      description: |-
        What an evening came to.

        **A sitting is the one thing in this application that has an ending**, and
        until now ending one simply stopped it. These are the figures that make the
        stop a summary — and every one of them is folded out of the timeline that
        was already built, so the page costs no more to draw than it did.
      required:
      - plays
      - seconds
      - duration_known
      - artists
      - albums
      - decks
      properties:
        plays:
          type: integer
          format: int64
          description: |-
            Plays on the timeline. The same count the history list shows, so the two
            screens cannot disagree about how long an evening was.
        seconds:
          type: integer
          format: int64
          description: Running time of the plays that reported one, and **how many did**.
        duration_known:
          type: integer
          format: int64
        artists:
          type: integer
          format: int64
        albums:
          type: integer
          format: int64
        top_artist:
          type:
          - array
          - 'null'
          items: false
          prefixItems:
          - type: string
          - type: integer
            format: int64
          description: The artist the evening kept coming back to, and how often.
        top_album:
          type:
          - array
          - 'null'
          items: false
          prefixItems:
          - type: string
          - type: string
          - type: integer
            format: int64
          description: The record it kept coming back to, with its artist.
        decks:
          type: array
          items:
            type: array
            items: false
            prefixItems:
            - type: string
            - type: integer
              format: int64
          description: |-
            Whose deck played what, biggest first. A sitting is several people's
            listening in one sequence, and this is the only figure that says so.
    SpoolForwarding:
      type: object
      description: Whether plays accepted out of a Shared Spool are forwarded.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        window_days:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Only plays this recent are relayed, whatever the switch says. Absent
            from the answer to a change.
    SpoolForwardingRequest:
      type: object
      description: |-
        The switch deciding whether plays accepted out of a Shared Spool are relayed
        on to this user's connections, or stored here only.

        It lives beside the connections rather than with the rest of Patch because
        this is the question "what do my connected services receive", and the answer
        is only meaningful next to the list of them.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Required, and said explicitly — an absent key is a 400, not a default.
    SpoolHistory:
      type: object
      required:
      - sittings
      properties:
        sittings:
          type: array
          items:
            $ref: '#/components/schemas/SpoolSummary'
          description: Newest first.
    SpoolMember:
      type: object
      required:
      - user_id
      - username
      - state
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        state:
          type: string
          description: invited | joined | left.
        present_from:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When they were in the room from, or `None` for the whole sitting.

            Not `joined_at`, which is when they pressed the button — somebody added
            an hour in was usually there all along, and the host says which.
        present_until:
          type:
          - integer
          - 'null'
          format: int64
          description: When they left, or `None` for stayed to the end.
    SpoolMembers:
      type: object
      properties:
        with:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Usernames to add. Required.
        present_from:
          type:
          - integer
          - 'null'
          format: int64
          description: When they arrived, or absent for "they were here all along".
    SpoolMembership:
      type: object
      required:
      - state
      - offered
      properties:
        state:
          type: string
          description: '`joined`, `declined` or `left` — the row knows which.'
        offered:
          type: integer
          format: int64
          description: |-
            Plays joining has just put in your inbox. For a sitting that ended
            before you answered, that is the whole of it.
    SpoolNow:
      type: object
      description: The sitting you are in, and what sittings have offered you.
      required:
      - captures
      properties:
        spool:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpoolView'
        captures:
          type: array
          items:
            $ref: '#/components/schemas/SpoolCapture'
          description: Plays waiting for you to accept or decline.
    SpoolPlay:
      type: object
      description: |-
        One play on a sitting's timeline, whoever's deck it came off.

        **This is the first row type in the application that mixes several people's
        listening into one sequence.** Everything else — the Reel included — keeps
        one deck per row.
      required:
      - title
      - artist
      - played_at
      - from_username
      - standing
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
        played_at:
          type: integer
          format: int64
        from_username:
          type: string
        from_display_name:
          type:
          - string
          - 'null'
        standing:
          type: string
          description: |-
            `mine` | `accepted` | `declined` | `pending` | `theirs`.

            Four of those are facts about the caller and the fifth is the absence of
            one. Declined and never-answered are told apart deliberately: both mean
            "not in my history" and they are not the same decision.
        capture_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The capture this row came from, where there is one to act on.
        artwork_url:
          type:
          - string
          - 'null'
        caa_id:
          type:
          - integer
          - 'null'
          format: int64
        caa_release_mbid:
          type:
          - string
          - 'null'
    SpoolPresence:
      type: object
      description: |-
        When you were in the room. An absent field is left alone; `null` clears
        it.
      properties:
        present_from:
          type:
          - integer
          - 'null'
          format: int64
        present_until:
          type:
          - integer
          - 'null'
          format: int64
    SpoolStarted:
      type: object
      required:
      - uuid
      properties:
        uuid:
          type: string
    SpoolSummary:
      type: object
      description: One sitting on the history list.
      required:
      - uuid
      - started_at
      - hosting
      - host_username
      - present
      - guests
      - plays
      - pending
      properties:
        uuid:
          type: string
        title:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        started_at:
          type: integer
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
        hosting:
          type: boolean
        host_username:
          type: string
        host_display_name:
          type:
          - string
          - 'null'
        present:
          type: array
          items:
            type: string
          description: Who else was actually in the room — the caller is left out here.
        guests:
          type: array
          items:
            type: string
          description: Names with no account on this instance.
        plays:
          type: integer
          format: int64
          description: Plays that reached this sitting's timeline, from every deck in it.
        pending:
          type: integer
          format: int64
          description: Offers still sitting in the caller's inbox from this evening.
    SpoolView:
      type: object
      description: A sitting several people are in at once.
      required:
      - uuid
      - viewer_id
      - started_at
      - host_user_id
      - hosting
      - my_state
      - members
      - guests
      - captured
      properties:
        uuid:
          type: string
        viewer_id:
          type: integer
          format: int64
          description: |-
            Who is asking. The members list includes the caller, and a screen saying
            "with Noor and Tobias" has to leave the reader out of it — `hosting`
            cannot do that, since it only identifies one of the two cases.
        title:
          type:
          - string
          - 'null'
        started_at:
          type: integer
          format: int64
        ended_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Null while it is running. An **ended** sitting still reaches this view
            when the caller was invited and never answered — an invitation you can
            no longer see is one you can no longer honour, and forgetting to press
            Join before the host closed the room is the ordinary case rather than
            the odd one.
        host_user_id:
          type: integer
          format: int64
        hosting:
          type: boolean
        my_state:
          type: string
          description: 'The *caller''s* membership: `invited` until they join.'
        members:
          type: array
          items:
            $ref: '#/components/schemas/SpoolMember'
        guests:
          type: array
          items:
            type: string
          description: |-
            Names with no account here, so the banner can say who else is in the
            room rather than only who else has a deck.
        captured:
          type: integer
          format: int64
          description: How many offers this sitting has put in the caller's inbox.
    StartBody:
      type: object
      description: Both fields are optional, and so is the body.
      properties:
        client_name:
          type:
          - string
          - 'null'
          description: |-
            What to call the token once it exists — "Pano on Android", "fooyin".
            Shown to the user when approving, so name it per device. At most 60
            characters; `name` is accepted too.
        scopes:
          type:
          - string
          - 'null'
          description: |-
            Requested grants, space- or comma-separated: `submit`, `read`,
            `write`. `submit` is always granted; anything else unknown is ignored.
            The approval screen shows the user what they are granting.
          example: submit read write
    StatCard:
      type: object
      description: |-
        One stat card, phrased by the server so every surface says "412 plays" the
        same way.
      required:
      - k
      - v
      - sub
      - tone
      properties:
        k:
          type: string
          description: The label — `Your Plays`, `Hours`, `First Heard`, `Share`.
        v:
          type: string
          description: The figure, formatted.
        sub:
          type: string
          description: The line under it.
        tone:
          type: string
          description: '`plain` or `dark`.'
    SubmitListen:
      type: object
      description: One listen in a ListenBrainz-shaped submission.
      required:
      - track_metadata
      properties:
        listened_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Unix seconds, UTC, **start** of play. Required for `single` and
            `import`, and ignored for `playing_now`, which is always now.
        track_metadata:
          $ref: '#/components/schemas/TrackMetadata'
    SubmitListensRequest:
      type: object
      description: A ListenBrainz-shaped submission.
      required:
      - listen_type
      - payload
      properties:
        listen_type:
          $ref: '#/components/schemas/ListenType'
        payload:
          type: array
          items:
            $ref: '#/components/schemas/SubmitListen'
          description: At least one listen and at most 1000; exactly one for `playing_now`.
          maxItems: 1000
          minItems: 1
    SubmitListensResponse:
      type: object
      description: |-
        Everything past `status` is a Tapedeck extension and purely additive —
        ListenBrainz clients branch on `status` alone, so the extra keys cannot
        break them. They exist because a batch submit was otherwise all-or-nothing
        from the client's side: "ok" said nothing about which listens were stored,
        which were already held, and which were malformed.
      required:
      - status
      - accepted
      - duplicate
      - rejected
      properties:
        status:
          type: string
          description: Always `ok`.
          example: ok
        accepted:
          type: integer
          format: int32
          description: Newly stored.
          minimum: 0
        duplicate:
          type: integer
          format: int32
          description: |-
            **Singular.** Recognised as already held, by `source_id` or by the
            fuzzy window. Not an error — a client resending after a dropped
            connection is the normal way this happens. But a client whose every
            listen comes back here has a bug, which is why it is counted apart from
            `accepted` rather than folded in.
          minimum: 0
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedListen'
          description: |-
            Could not be stored and **must not be retried** — malformed client
            data, so resending changes nothing. Always present, empty when nothing
            was rejected; an absent key would be ambiguous.
    SubmitOutcome:
      oneOf:
      - $ref: '#/components/schemas/SubmitListensResponse'
      - $ref: '#/components/schemas/DryRunResponse'
      description: |-
        A submit answers one of these: the outcome, or — with `?dry_run` — the
        preview.
    TapedeckAudio:
      type: object
      description: |-
        How the audio actually sounded, as a **submitting client** reports it in
        `additional_info.tapedeck_audio`. Every field is optional; a plugin that
        can see its decoder reports most, a bare scrobble client none.

        This is the write-side shape. A stored listen carries the same information
        **flat** on the `Listen` object rather than nested.
      properties:
        format_type:
          type:
          - string
          - 'null'
          description: '`pcm`, `dsd`, or `mqa`. Not the codec.'
        codec:
          type:
          - string
          - 'null'
          description: |-
            The codec as your decoder names it — `flac`, `mp3`, `dsd_lsbf_planar`.
            Tapedeck matches DSD and PCM by **prefix**, so ffmpeg's per-ordering and
            per-sample-format spellings all classify correctly.
        bitrate:
          type:
          - integer
          - 'null'
          format: int32
          description: kbps.
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Hz.
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        channels:
          type:
          - integer
          - 'null'
          format: int32
        container:
          type:
          - string
          - 'null'
          description: The file container, e.g. `ogg`, `m4a`.
        is_lossless:
          type:
          - boolean
          - 'null'
        source_quality:
          type:
          - string
          - 'null'
          description: What the source claims to be, where that differs from what was measured.
        dsd_rate:
          type:
          - integer
          - 'null'
          format: int64
          description: Hz.
        dsd_multiplier:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            64, 128, 256… Derived from `dsd_rate` when absent, and left unset rather
            than guessed when the rate is not a real DSD multiple.
        delivery_codec:
          type:
          - string
          - 'null'
          description: |-
            Set **only** when the audio was genuinely transcoded. Remuxing a
            container without touching the audio is not a transcode, nor is a video
            transcode that left the audio alone. Scoring docks points whenever this
            is set, so filling it on a direct play quietly penalises the best
            listens on the system.
        delivery_bitrate:
          type:
          - integer
          - 'null'
          format: int32
          description: kbps.
        delivery_sample_rate:
          type:
          - integer
          - 'null'
          format: int32
          description: Hz.
        delivery_bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        dsd_to_pcm_converted:
          type:
          - boolean
          - 'null'
          description: |-
            Usually derived from the signal chain rather than reported. SACD's DSD
            layer cannot leave a player over coax or optical, so nothing downstream
            will ever tell you this directly.
        is_transcoded:
          type:
          - boolean
          - 'null'
        transcode_reason:
          type:
          - string
          - 'null'
    TapedeckChain:
      type: object
      description: |-
        Signal chain, rung 1 of the four-rung ladder: explicit name →
        output-device binding → the submitting token's `default_chain_id` → the
        source device's default. An unknown name resolves to no chain rather than
        erroring.

        Note this is an **object**. It was documented as a bare string until
        v0.66.0 and never was one.
      properties:
        chain_id:
          type:
          - string
          - 'null'
          description: |-
            The chain's **name**, despite the field being called `chain_id` — a
            client knows what the user called it, not its row id. Use `?dry_run=1`
            to check it resolves.
        components:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Accepted and not yet stored.
    TapedeckDevice:
      type: object
      description: |-
        What was playing it. Resolves to a `devices` row, which is rung 4 of the
        chain ladder — without it a listen from a client with no token default and
        no output binding gets no signal chain at all.
      properties:
        player_name:
          type:
          - string
          - 'null'
        player_version:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
        machine_id:
          type:
          - string
          - 'null'
          description: |-
            **The key.** Stable per installation and never the display name, which
            the user edits — keying on a name re-registers the device as a new one
            the moment it is renamed. Nothing is recorded without this.
        output_device:
          type:
          - string
          - 'null'
          description: |-
            What the audio came out of. Recorded whether or not it is mapped, so the
            UI can offer unmapped ones for one-tap assignment, and it drives rung 2
            of the chain ladder.
        output_type:
          type:
          - string
          - 'null'
        interface:
          type:
          - string
          - 'null'
          description: USB, Bluetooth, analog… Preferred over `output_type`.
    TapedeckPlayback:
      type: object
      description: |-
        Where the playhead is, from a client that can actually see it.

        The ListenBrainz submission format carries no position, so a `playing_now`
        without this is wall-clock arithmetic from the moment you spoke — right
        until the listener pauses or seeks, wrong from then on, and reported as an
        estimate (`position_known: false`) rather than dressed up as a measurement.
        Send this and the deck shows a real position.

        A playhead sent here is believed **outright**, including a step backwards:
        a polled source's report may lag its player by a few seconds and is smoothed
        for it, but a client measuring at the instant it sends has no such lag, so
        a backward step is the listener seeking and you are the authority on that.
      properties:
        position_ms:
          type:
          - integer
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
          description: |-
            `playing` or `paused`. Anything other than `paused` is read as playing,
            which is the safe way to fall: a wrongly-paused deck freezes and reads
            as broken.

            **Send `paused` when the listener pauses.** Without it the position
            counts forward through the pause while `position_known` asserts it is a
            measurement — a confident and completely wrong readout. A paused entry
            holds still and expires after ten minutes of silence, so a heartbeat
            keeps it alive and stopping altogether clears it.
    TapedeckSession:
      type: object
      description: |-
        What the client was doing when the track came up — specifically, whether
        the listener chose it.
      properties:
        is_shuffle:
          type:
          - boolean
          - 'null'
          description: Whether shuffle chose this track rather than the listener.
        queue_source:
          type:
          - string
          - 'null'
          description: |-
            What it was played from — a playlist name, an album, a queue, radio.
            Free text: it is your vocabulary for your own containers and there is
            no shared one to normalise against.
    TargetSpec:
      type: object
      description: |-
        What a note (or a love) is about. Name it one way:

        * `entity_id` — a track, album or artist already known;
        * `scrobble_id` — one listen;
        * `from_scrobble` + `kind` — the track, album or artist *of* that listen,
          created if new;
        * `kind` + `name` (+ `artist` for a track or album) — spelled out, created
          if new;
        * `period_unit` + `period_key` — a week, a month or a year of listening;
        * `line` + `artist` + `name` — one numbered line of a lyric, a **pin**. A
          pin is never an entity and cannot be loved.
      properties:
        entity_id:
          type:
          - integer
          - 'null'
          format: int64
        scrobble_id:
          type:
          - integer
          - 'null'
          format: int64
        period_unit:
          type:
          - string
          - 'null'
          description: '`week`, `month` or `year`, alongside `period_key`. Both or neither.'
        period_key:
          type:
          - string
          - 'null'
          description: As Reports names it — `2026`, `2026-08`, `2026-W32`.
        line:
          type:
          - integer
          - 'null'
          description: |-
            A **pin**: the line's number, alongside `artist` and `name` (the
            track's title). Blank lines are numbered.
          minimum: 0
        from_scrobble:
          type:
          - integer
          - 'null'
          format: int64
          description: 'With `kind: track`, prefer the album this listen was filed under.'
        kind:
          type:
          - string
          - 'null'
          description: '`track`/`recording`, `album`/`release` or `artist`.'
        name:
          type:
          - string
          - 'null'
        artist:
          type:
          - string
          - 'null'
        mbid:
          type:
          - string
          - 'null'
    TargetView:
      oneOf:
      - type: object
        properties:
          entity:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Entity'
      - type: object
        properties:
          listen:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NoteListen'
      - type: object
        required:
        - period
        properties:
          period:
            $ref: '#/components/schemas/NotePeriod'
      - type: object
        required:
        - line
        properties:
          line:
            $ref: '#/components/schemas/LinePos'
      description: What a target resolved to. One key, named for its kind.
    TickView:
      type: object
      description: The engine's tick.
      required:
      - interval_secs
      - ticks
      - last_duration_ms
      - longest_ms
      - overruns
      - deferred_listens
      - behind
      properties:
        interval_secs:
          type: integer
          format: int64
          description: The configured interval — the denominator for everything else here.
          minimum: 0
        ticks:
          type: integer
          format: int64
          minimum: 0
        last_started:
          type:
          - integer
          - 'null'
          format: int64
        last_duration_ms:
          type: integer
          format: int64
          minimum: 0
        longest_ms:
          type: integer
          format: int64
          description: Worst tick since the process started.
          minimum: 0
        overruns:
          type: integer
          format: int64
          description: Ticks that ran longer than the configured interval.
          minimum: 0
        deferred_listens:
          type: integer
          format: int64
          description: |-
            Listens the flush left for the next tick because it ran out of budget.
            Nonzero means forwarding is behind.
          minimum: 0
        behind:
          type: boolean
          description: |-
            The last tick took longer than its own interval: source polling and
            the deck are that late. The number that matters.
    TidalConfigured:
      type: object
      description: Whether TIDAL is configured now.
      required:
      - configured
      properties:
        configured:
          type: boolean
    TidalConnect:
      type: object
      description: Where to send the browser.
      required:
      - authorize_url
      properties:
        authorize_url:
          type: string
          description: |-
            TIDAL's authorize URL, carrying a PKCE `S256` challenge and a
            single-use `state` that expires in ten minutes. Open it in a new tab.
    TidalDisconnected:
      type: object
      required:
      - disconnected
      properties:
        disconnected:
          type: boolean
          description: Whether there was a connection to forget.
    TidalSettings:
      type: object
      description: The app registration, without its credentials.
      required:
      - configured
      - stored
      - has_secret
      - from_env
      - redirect_uri
      properties:
        configured:
          type: boolean
          description: Stored or from the environment.
        stored:
          type: boolean
          description: A client id is stored in the database — which wins over the environment.
        has_secret:
          type: boolean
          description: A stored client id has a stored secret beside it.
        from_env:
          type: boolean
          description: '`TAPEDECK_TIDAL_CLIENT_ID` and its secret are set.'
        redirect_uri:
          type: string
          description: |-
            The exact redirect URI TIDAL must have registered — the one the flow
            will send.
    TidalStatus:
      type: object
      description: Whether TIDAL can be used here, and whether you have.
      required:
      - configured
      - connected
      properties:
        configured:
          type: boolean
          description: |-
            The operator has registered an app. Without it there is no button to
            offer — a different thing from an account nobody has linked.
        connected:
          type: boolean
    TimeEdit:
      type: object
      description: |-
        What moving a listen in time actually did, and what it could not do.

        Three of these four fields exist because a timestamp edit has consequences
        this application cannot reach, and saying so is the whole difference
        between a correction and a quiet inconsistency.
      required:
      - moved
      - already_forwarded
      - sessions_touched
      - grouping_stale
      properties:
        moved:
          type: integer
          format: int64
          description: Listens whose timestamp moved.
        already_forwarded:
          type: integer
          format: int64
          description: |-
            Of those, how many had already been forwarded to somebody's Last.fm or
            ListenBrainz.

            **Neither service has an edit API**, so their copy keeps the time it was
            sent with, permanently and silently. The edit is still the right thing
            to do — the local record is the one that has to be true — but a screen
            that did not say this would be letting somebody believe they had
            corrected a public record they had not.
        sessions_touched:
          type: integer
          format: int64
          description: Sessions whose aggregates were recomputed to match.
        grouping_stale:
          type: boolean
          description: |-
            Whether a moved listen now sits far enough from its session's
            neighbours that the *grouping* is stale.

            The aggregates are fixed here; the grouping is not, and deliberately.
            Sessions are stored rather than computed (which is what lets a manual
            merge survive), `sessions.uuid` is what a handed-over sitting points at,
            and re-grouping silently on a metadata edit would move an identity
            somebody else is holding a reference to. So this reports, and Rebuild
            remains a thing the user asks for.
    TokenIssued:
      type: object
      description: An access credential. Served `no-store`.
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: '`Bearer`.'
        expires_in:
          type: integer
          format: int64
          description: Seconds. A day.
        refresh_token:
          type:
          - string
          - 'null'
          description: Rotates on every refresh; the old pair stops working.
        scope:
          type:
          - string
          - 'null'
          description: |-
            What was actually granted, which can differ from what was asked for.
            Absent on a refresh.
    TokenList:
      type: object
      description: The caller's tokens. Secrets are never returned after issue.
      required:
      - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenRecord'
    TokenRecord:
      type: object
      description: An API token, without its secret.
      required:
      - id
      - name
      - scopes
      - created_at
      - imports_are_live
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        scopes:
          type: string
          description: 'As stored: `submit`, `read`, `write`, `all`, space- or comma-separated.'
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix seconds; null for a token never used.
        default_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Rung 3 of the chain ladder.
        imports_are_live:
          type: boolean
          description: Whether this client's `import` submissions are forwarded as live listens.
        default_chain_name:
          type:
          - string
          - 'null'
          description: The default chain's name.
    TokenValidation:
      type: object
      description: ListenBrainz's answer, plus what this token may do when it is valid.
      required:
      - code
      - message
      - valid
      properties:
        code:
          type: integer
          format: int32
          description: Always 200.
          minimum: 0
        message:
          type: string
        valid:
          type: boolean
        user_name:
          type:
          - string
          - 'null'
          description: Present only when `valid`.
        scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            As granted, with `all` expanded: some of `submit`, `read`, `write`.
            Present only when `valid`. Matching is exact and **none implies
            another** — `submit` does not carry `read`, and `write` does not carry
            `read`.
        default_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Rung 3 of the chain ladder. Show the user which chain their listens
            will be attributed to rather than leaving them to find out from their
            history. Present only when `valid`, and then null when the token has
            no default.
        imports_are_live:
          type:
          - boolean
          - 'null'
          description: |-
            Whether this token's `listen_type: "import"` submissions are relayed
            onward — see `POST /1/submit-listens` for the two gates that still
            apply. Invisible from the client side and silent in its absence, which
            matters most for players that label every scrobble `import`. Present
            only when `valid`.
        server_version:
          type:
          - string
          - 'null'
          description: |-
            So a client shipped against one version can tell which extensions this
            instance understands without parsing this document to find out. Present
            only when `valid`.
    TopAlbum:
      type: object
      required:
      - name
      - artist
      - plays
      - hours
      properties:
        name:
          type: string
        artist:
          type: string
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
          description: One decimal place.
    TopArtist:
      type: object
      description: A top artist. Counted over everyone credited, the way the charts count.
      required:
      - name
      - plays
      - hours
      properties:
        name:
          type: string
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
          description: One decimal place.
        image_url:
          type:
          - string
          - 'null'
    TopTrack:
      type: object
      required:
      - title
      - artist
      - plays
      - hours
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        plays:
          type: integer
          format: int64
        hours:
          type: number
          format: double
          description: One decimal place.
    TrackAggregate:
      type: object
      description: |-
        One distinct track. The quality columns are carried raw so the frontend's
        existing `qualityLabel()` produces the same tag it does on a history row —
        duplicating that logic server-side would let the two drift.
      required:
      - title
      - plays
      properties:
        title:
          type: string
        plays:
          type: integer
          format: int64
        duration:
          type:
          - integer
          - 'null'
          format: int64
        track_number:
          type:
          - integer
          - 'null'
          format: int32
        album:
          type:
          - string
          - 'null'
          description: Set on artist top-tracks (where the album varies), null on an album page.
        format_type:
          type:
          - string
          - 'null'
        codec:
          type:
          - string
          - 'null'
        bit_depth:
          type:
          - integer
          - 'null'
          format: int32
        sample_rate:
          type:
          - integer
          - 'null'
          format: int32
        dsd_multiplier:
          type:
          - integer
          - 'null'
          format: int32
        delivery_codec:
          type:
          - string
          - 'null'
        is_lossless:
          type:
          - boolean
          - 'null'
    TrackMetadata:
      type: object
      required:
      - artist_name
      - track_name
      properties:
        artist_name:
          type: string
          description: |-
            The artist credit as one string. A **semicolon-separated** value
            (`Bach; Hilary Hahn`) is read as several credited artists when
            `additional_info.artist_names` is absent — see there.
        track_name:
          type: string
        release_name:
          type:
          - string
          - 'null'
        additional_info:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AdditionalInfo'
        mbid_mapping:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MbidMapping'
            description: |-
              The shape ListenBrainz **returns** its MBIDs in. Read as a fallback;
              a submitting client should put them in `additional_info`.
    TrackOutcome:
      type: object
      description: What actually happened to one track on the side, as the deck saw it.
      required:
      - position
      - started_at
      properties:
        position:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
          description: When this track actually started, unix seconds.
        skipped:
          type: boolean
          description: |-
            Skipped rather than heard. Stored, but excluded from every count and
            never forwarded.
    TrackRef:
      type: object
      required:
      - title
      - artist
      properties:
        title:
          type: string
        artist:
          type: string
    Tracklist:
      type: object
      required:
      - tracks
      properties:
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalTrack'
          description: |-
            The whole tracklist. Not empty, no side and position twice, and no
            running time of zero or less.
          minItems: 1
    TracklistEntry:
      type: object
      required:
      - title
      - plays
      properties:
        title:
          type: string
        plays:
          type: integer
          format: int64
        duration:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds.
        track_number:
          type:
          - integer
          - 'null'
          format: int64
        lyrics:
          type:
          - string
          - 'null'
          description: |-
            `words` or `instrumental`; null for a track nobody has asked about,
            which is a different thing from one that has no words.
    TracklistSaved:
      type: object
      required:
      - status
      - changed
      - listens_updated
      - plays_recomputed
      properties:
        status:
          type: string
          description: '`ok`.'
        changed:
          type: integer
          description: Running times that differ from what was stored.
          minimum: 0
        listens_updated:
          type: integer
          format: int64
          description: Listens already recorded from these sides that were corrected.
          minimum: 0
        plays_recomputed:
          type: integer
          format: int64
          description: Whole-side plays whose recorded wear was brought back in line.
          minimum: 0
    Trait:
      type: object
      required:
      - label
      - low
      - high
      - score
      - evidence
      properties:
        label:
          type: string
        low:
          type: string
        high:
          type: string
        score:
          type: number
          format: double
        evidence:
          type: string
    TrajectoryPoint:
      type: object
      required:
      - year
      - x
      - y
      - plays
      - listens
      - enriched
      properties:
        year:
          type: string
          description: '`2024`, or `2024-03` by month.'
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        plays:
          type: integer
          format: int64
        colour:
          type:
          - string
          - 'null'
        listens:
          type: integer
          format: int64
          description: Listens in the period…
        enriched:
          type: integer
          format: int64
          description: |-
            …and how many of them have genres resolved. A thin period is labelled
            rather than drawn as if it were complete.
    TrendPoint:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: integer
          format: int64
    Unpatched:
      type: object
      required:
      - unpatched
      properties:
        unpatched:
          type: boolean
    UpdateEquipmentRequest:
      type: object
      description: |-
        The update body is deliberately its own type rather than a reuse of
        `CreateEquipmentRequest`: `status` is settable here and not at creation
        (gear is tagged from the "Not in a chain yet" table, once it exists), and a
        shared struct would mean POST accepting a field it silently threw away.

        Every field is written unconditionally — this endpoint is a whole-record
        replace, not a partial patch, which is why an omitted `brand` has always
        cleared the brand. Clients must send the full record back.
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
        brand:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        purchased_at:
          type:
          - integer
          - 'null'
          format: int64
        status:
          type:
          - string
          - 'null'
          description: 'Why it is not in a chain: `new`, `spare`, `lent`. Absent clears it.'
    UpdateProfileRequest:
      type: object
      description: |-
        Each field distinguishes absent ("leave alone") from an explicit `null`
        ("clear"), so a misspelled key cannot silently blank a field it failed to
        name. A value that is only whitespace clears too.
      properties:
        display_name:
          type:
          - string
          - 'null'
          description: At most 80 characters.
          maxLength: 80
        bio:
          type:
          - string
          - 'null'
          description: At most 500 characters.
          maxLength: 500
        avatar_url:
          type:
          - string
          - 'null'
          description: |-
            Must be an `http(s)` URL. A relative value is refused with 400 — only
            the upload endpoint may write a path this server serves.
    UpdateScrobble:
      type: object
      description: Every field optional; only the fields sent change.
      properties:
        title:
          type:
          - string
          - 'null'
        artist:
          type:
          - string
          - 'null'
        album:
          type:
          - string
          - 'null'
        mbid_recording:
          type:
          - string
          - 'null'
        mbid_release:
          type:
          - string
          - 'null'
          description: |-
            Fixing this also clears the resolved artwork, so the cover is re-fetched
            for the release you actually meant.
        signal_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: '**Not `chain_id`.** The chain to attribute this listen to.'
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which setup of that chain was fitted. Only accepted alongside
            `signal_chain_id`, and must belong to that chain.
        listening_context:
          type:
          - string
          - 'null'
        format_type:
          type:
          - string
          - 'null'
        codec:
          type:
          - string
          - 'null'
    UpdateSession:
      type: object
      description: |-
        Every field is optional and distinguishes absent ("leave alone") from an
        explicit `null` ("clear").
      properties:
        chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Retag every listen in the sitting with this chain. Present-and-null
            clears the chain; absent leaves it alone. Must be one of your chains.
        title:
          type:
          - string
          - 'null'
          description: Name the sitting.
        chain_variant_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Which variant of the chain — "with the microlinear", "on the Hexas".
            Only read alongside `chain_id`, and rewritten whenever it is, since a
            variant belongs to one chain.
        notes:
          type:
          - string
          - 'null'
          description: |-
            A note about the sitting. Not a liner note about a record — that is
            `/api/v1/notes`, which hangs off an entity or a single listen.
    UpdateTokenRequest:
      type: object
      description: Absent fields are left alone.
      properties:
        name:
          type:
          - string
          - 'null'
        default_chain_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Present-and-null clears the chain; absent leaves it alone. Checked
            against the owner's own chains.
        imports_are_live:
          type:
          - boolean
          - 'null'
          description: See `POST /admin/tokens` for what it does.
    UpdateUserRequest:
      type: object
      description: Absent fields are left alone.
      properties:
        role:
          type:
          - string
          - 'null'
          description: '`admin` or `user`. The last active admin cannot be demoted.'
          pattern: ^(admin|user)$
        password:
          type:
          - string
          - 'null'
          description: |-
            Reset the password to this, no current password needed. At least 8
            characters.
          minLength: 8
        disabled:
          type:
          - boolean
          - 'null'
          description: |-
            Block or allow sign-in without deleting anything. You cannot disable
            yourself, or the last active admin.
    UpdateVariantRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        overrides:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VariantOverride'
    UserList:
      type: object
      description: Every account on the instance.
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserRecord'
    UserRecord:
      type: object
      description: An account, as an admin sees it in the user list.
      required:
      - id
      - username
      - role
      - created_at
      - disabled
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        role:
          type: string
          description: '`admin` or `user`.'
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        disabled:
          type: boolean
          description: Blocked from signing in; nothing is deleted.
    Variant:
      type: object
      description: |-
        A chain with one step swapped — two cartridges on one turntable, or the
        same commute with different IEMs, are one chain and a choice.
      required:
      - id
      - user_id
      - chain_id
      - name
      - overrides
      - created_at
      - total_hours
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        chain_id:
          type: integer
          format: int64
          description: The chain this is a variant of.
        name:
          type: string
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/VariantOverride'
          description: Only the steps that differ from the chain.
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        total_hours:
          type: number
          format: double
          description: |-
            The listening that went through *this variant*, which is a different
            question from a chain's total — a chain's hours include every variant
            of it, since they all ran through the same chain.
    VariantArtist:
      type: object
      description: An artist name with other spellings of itself in the same history.
      required:
      - primary
      - primary_plays
      - variants
      - case_only
      properties:
        primary:
          type: string
          description: The most-played spelling — the one the others fold into.
        primary_plays:
          type: integer
          format: int64
        variants:
          type: array
          items:
            type: array
            items: false
            prefixItems:
            - type: string
            - type: integer
              format: int64
          description: '`(spelling, plays)` for every other form of the same name.'
        case_only:
          type: boolean
          description: |-
            These differ only in capitalisation or spacing.

            Worth separating because the consequences differ. A case-only variant
            costs nothing but display consistency — every read path that counts
            already lowercases. Anything else ("Cœur de pirate" against "Coeur de
            pirate") is genuinely two artists to every query, and splits the plays.
    VariantEdit:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          description: The spelling being retired.
        to:
          type: string
          description: The spelling it becomes.
    VariantId:
      type: object
      description: A new variant's id.
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
    VariantList:
      type: object
      required:
      - variants
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    VariantOverride:
      type: object
      description: |-
        One step of a chain, replaced.

        `position` indexes into the parent chain's `components`. Only the steps that
        differ are stored, which is what makes a variant an override rather than a
        copy: editing the shared part of a chain updates every variant of it, and
        two cartridges on one turntable stay one chain.

        A `position` past the end of the base components *adds* a step, so a chain
        that never named a cartridge can gain one without being rewritten.
      required:
      - position
      properties:
        position:
          type: integer
          format: int64
          description: Index into the chain's `components`. One past the end *adds* a step.
        equipment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The gear fitted at this step. Null removes the step for this variant —
            a chain run without its amp, say.
        name:
          type:
          - string
          - 'null'
          description: |-
            Snapshot of the name, so a deleted gear row leaves the variant readable
            instead of blank.
    Vocabulary:
      type: object
      description: Compiled in and read-only.
      required:
      - verb
      - object
      - namespace
      - frozen
      properties:
        verb:
          type: string
        object:
          type: string
        namespace:
          type: string
        frozen:
          type: boolean
    Words:
      oneOf:
      - type: object
        description: The words, as numbered lines.
        required:
        - timed
        - lines
        - edited
        properties:
          language:
            type:
            - string
            - 'null'
            description: As detected from the text.
          timed:
            type: boolean
            description: Whether any line carries a time, so the reader can follow the deck.
          lines:
            type: array
            items:
              $ref: '#/components/schemas/ReaderLine'
            description: |-
              **Numbered including blanks.** A stanza break is a line, because a
              note refers to a line by its index and skipping empties would
              renumber every line after one.
          plain:
            type:
            - string
            - 'null'
            description: The stored text, for correcting it by hand.
          synced:
            type:
            - string
            - 'null'
            description: The stored timed text, `[mm:ss.xx] words` per line.
          edited:
            type: boolean
            description: Corrected by hand, and therefore never overwritten by a lookup.
          source:
            type:
            - string
            - 'null'
            description: |-
              Where the words came from — your library, LRCLIB, or you. Shown
              wherever the words are, because they are not Tapedeck's.
      - type: object
        description: A track with no words — an answer, not a gap.
        required:
        - instrumental
        - lines
        properties:
          instrumental:
            type: boolean
            description: Always `true`.
          lines:
            type: array
            items:
              $ref: '#/components/schemas/ReaderLine'
            description: Always empty.
      - type: object
        description: Nothing held for this track.
        required:
        - lines
        properties:
          lines:
            type: array
            items:
              $ref: '#/components/schemas/ReaderLine'
            description: Always empty.
      description: The words, or why there are none. Three answers, all of them real.
  responses:
    BadRequest:
      description: Malformed or rejected input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |-
        Authenticated, but not permitted. Either the token lacks the required
        scope, or the endpoint needs the admin role. Deliberately not a 401 —
        re-authenticating will not help.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            error: This token does not have the 'write' scope
    NotFound:
      description: No such resource, or it belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |-
        No valid session cookie or token. Also returned when a *token* is
        presented to a session-only endpoint — the endpoint does not accept
        tokens at all, so the scope is irrelevant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            error: Authentication required. Log in to access this endpoint.
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: Authorization
      description: |-
        `Authorization: Token <token>`. What the token reaches depends on its
        scopes — see the description at the top of this document. Lowercase
        `token ` is also accepted.
    mcpBearer:
      type: http
      scheme: bearer
      description: |-
        An MCP connection credential, from Settings → AI Connections or from the
        OAuth flow. Checked against `mcp_connections` — **not** against
        `tokens`, which is a separate credential store for scrobble clients.

        Used by `POST /mcp` and nothing else. A 401 from that endpoint carries
        `WWW-Authenticate` with a `resource_metadata` pointer, which is how a
        client discovers the authorization server.
    metricsBearer:
      type: http
      scheme: bearer
      description: |-
        `Authorization: Bearer $TAPEDECK_METRICS_TOKEN`, for `GET /metrics`
        only. An admin session also works. Never open.
    sessionCookie:
      type: apiKey
      in: cookie
      name: td_session
      description: |-
        Set by `POST /api/v1/auth/login`. `HttpOnly`, `SameSite=Lax`, and
        `Secure` when the instance can tell the browser used HTTPS (derived
        from `X-Forwarded-Proto`, and only trusted when `trust_proxy` is set —
        behind a tunnel the origin sees plain HTTP while the client is on TLS).
        Expires hard at 7 days with no sliding renewal.
security:
- sessionCookie: []
tags:
- name: Auth
  description: Login, first-run setup, session state.
- name: ListenBrainz
  description: |-
    ListenBrainz-compatible surface under `/1/`. Shapes follow the LB Core
    API because clients branch on those exact fields. Two deliberate
    divergences: these require auth and are scoped to the caller (LB serves
    them publicly; a self-hosted instance must not), and an invalid token on
    `validate-token` is `200 {valid:false}`, never 401, because clients read
    the field.
- name: Pairing
  description: Device-code pairing for clients with no browser.
- name: Patch
  description: |-
    Patch — following people, on this instance and others. The ActivityPub
    surface (`/users/…`, `/.well-known/webfinger`) is unauthenticated and lets
    another server find out who somebody here is and say something to them; the
    rest is the session-only local half: the Reel, decks, Dubs and Shared Spools.

    Every federated endpoint is off until a user switches federation on, and an
    account that has not is indistinguishable from one that does not exist —
    the same rule the public now-playing widget and device pairing follow.
- name: Account
  description: |-
    Your own account — password, display name, bio, profile picture. Scoped to
    the caller and never takes an id, unlike the admin routes under
    `/admin/users`. Session-only: a scrobble client has no business changing
    the credential it authenticates with.
- name: Listens
  description: The scrobble history — read, edit, delete, search.
- name: Statistics
  description: Aggregations, charts, personality.
- name: Library
  description: Album, artist and entity pages.
- name: Loves
  description: Loved recordings, releases and artists.
- name: Notes
  description: Liner notes — your own writing about records.
- name: Sessions
  description: Contiguous listening, grouped.
- name: Chains
  description: Signal chains, gear, devices and bindings.
- name: Shelf
  description: Records, tapes and discs — a shelf you catalogue and sides you play.
- name: Genre map
  description: Every Noise at Once — coverage, colour, trajectory, neighbours.
- name: Rediscovery
  description: Five lists, all built from your own history.
- name: Sources
  description: Where listens are polled from. Session-only — holds credentials.
- name: Connections
  description: Where listens are forwarded. Session-only — holds credentials.
- name: Import & export
  description: Bulk in and out. Session-only.
- name: Maintenance
  description: Enrichment backfills and the metadata sanitiser. Session-only.
- name: Settings
  description: Preferences and artwork.
- name: Admin
  description: Users, tokens, genre-map scrape. Session-only, admin role.
- name: MCP
  description: |-
    The Model Context Protocol surface — one endpoint that lets an AI
    assistant read this user's listening and hand playlists back. Runs for
    every user, reaches nobody's data until they authorise a connection.

    **Dual-era.** Revision `2026-07-28` is stateless with per-request `_meta`
    and mirrored headers; `2025-11-25` and earlier open with an `initialize`
    handshake. Both are served on the same endpoint.

    Credentials live in `mcp_connections`, **not** in `tokens` — an MCP grant
    is a standing permission given to somebody else's service, `tokens.scopes`
    treats `all` as a wildcard, and an OAuth credential expires and refreshes.
- name: OAuth
  description: |-
    An OAuth 2.1 authorization server, scoped to one job: letting a hosted
    assistant obtain an MCP credential. PKCE `S256` only, public clients only,
    exact `redirect_uri` matching, single-use codes.
- name: Playlists
  description: |-
    Playlists that live in Tapedeck, reviewed before they reach a media
    server, plus the direct push that has always existed.
- name: Crate
  description: |-
    Records and artists somebody suggested that you do not own — the one place
    in Tapedeck that names music outside the collection.

    **Tapedeck does not recommend; it records recommendations made to you.**
    The vision rule governs what Tapedeck *generates* (Rediscovery is built
    entirely from your own history and stays that way); this stores what an
    assistant said, the way notes store what you wrote. It is its own table,
    its own endpoints and its own page, and never appears in a history or
    statistics readout.
- name: Ops
  description: Health, metrics, log level.
