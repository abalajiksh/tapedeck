    ImportJob:
      type: object
      description: One import's progress.
      required:
      - job_id
      - source
      - state
      - fetched
      - imported
      - enriched
      - status
      - date
      properties:
        job_id:
          type: string
        source:
          type: string
          description: '`listenbrainz`, `lastfm` or `file`.'
        state:
          type: string
          description: '`running`, `done` or `error`.'
        fetched:
          type: integer
          description: Listens read from the source, before dedup.
          minimum: 0
        imported:
          type: integer
          description: New rows actually inserted.
          minimum: 0
        enriched:
          type: integer
          description: |-
            Listens already held that the incoming copy taught something to — an
            MBID, a duration, a cover-art id, a track number. Fields that are
            **blank** are filled from a duplicate; fields already populated are
            never touched. Counted apart from `imported` because a re-import of a
            history you already hold correctly inserts nothing, and `imported: 0`
            alone reads as though the job did nothing at all.
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          description: A known upper bound, when the source reports one.
          minimum: 0
        status:
          type: string
          description: Human-readable progress; the error detail when `state` is `error`.
        date:
