          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
        required: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowUpdated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/bindings:
    get:
      tags:
      - Chains
      summary: Output-device bindings.
      description: 'Scope: `read` *(since v0.37)*. Rung 2 of the chain ladder.'
